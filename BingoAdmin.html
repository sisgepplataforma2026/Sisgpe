<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:'Plus Jakarta Sans',Arial,sans-serif;background:#f4f7fb;color:#172033}.top{background:linear-gradient(135deg,#001f4d,#1565c0);color:#fff;padding:20px}.top h1{font-size:21px;margin:0}.top p{margin:5px 0 0;font-size:12px;opacity:.78}.wrap{padding:16px;max-width:1200px;margin:auto}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.card{background:#fff;border:1px solid #e1e8f0;border-radius:14px;padding:16px;box-shadow:0 3px 14px rgba(0,30,80,.05)}.card h2{font-size:14px;color:#001f4d;margin:0 0 12px}.row{display:flex;gap:9px;flex-wrap:wrap}.field{flex:1;min-width:150px}.field label{display:block;font-size:10px;font-weight:800;text-transform:uppercase;color:#64748b;margin:0 0 4px}.field input,.field select{width:100%;height:38px;border:1.5px solid #d9e2ec;border-radius:9px;padding:0 10px;font:inherit;font-size:13px}.btn{height:38px;border:1px solid #cad5e1;border-radius:9px;background:#fff;color:#334155;font:inherit;font-size:12px;font-weight:800;padding:0 13px;cursor:pointer}.btn.primary{background:#001f4d;color:#fff;border-color:#001f4d}.btn.green{background:#137333;color:#fff;border-color:#137333}.btn.warn{background:#fff7ed;color:#9a3412;border-color:#fed7aa}.btn:disabled{opacity:.55;cursor:not-allowed}.status{padding:9px 12px;border-radius:10px;background:#eef4ff;color:#1e40af;font-size:12px;font-weight:700;margin-bottom:12px}.num{font-size:58px;font-weight:900;text-align:center;color:#001f4d;line-height:1}.letra{font-size:23px;color:#1565c0}.ultimos{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}.bola{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#eef3f8;font-weight:800;font-size:12px}.det{border-left:4px solid #dc2626;background:#fff5f5;border-radius:9px;padding:10px;margin-top:8px;font-size:12px}.list{max-height:330px;overflow:auto}.item{padding:9px 0;border-top:1px solid #eef2f6;font-size:12px}.muted{color:#64748b}.full{grid-column:1/-1}.pill{display:inline-block;padding:3px 8px;border-radius:999px;font-size:10px;font-weight:800}.ok{background:#dcfce7;color:#166534}.wait{background:#fef3c7;color:#92400e}.part{display:grid;grid-template-columns:1.5fr .9fr .7fr auto;gap:8px;align-items:center;padding:9px 0;border-top:1px solid #eef2f6;font-size:12px}.part small{color:#64748b}.links{max-height:220px;overflow:auto;margin-top:10px}.linkrow{padding:8px 0;border-top:1px solid #eef2f6;font-size:11px}.linkrow input{width:100%;margin-top:4px;height:32px;border:1px solid #d9e2ec;border-radius:7px;padding:0 8px}@media(max-width:800px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.part{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div class="top"><h1>🎯 Bingo Online — SindEducação</h1><p>Painel operacional integrado ao módulo Eventos</p></div>
<div class="wrap">
  <div id="msg" class="status">Carregando...</div>
  <div class="grid">
    <div class="card">
      <h2>Configuração</h2>
      <div class="row"><div class="field"><label>Evento ID</label><input id="eventoId" readonly></div><div class="field"><label>Live YouTube</label><input id="youtube" placeholder="URL da transmissão"></div></div>
      <div class="row" style="margin-top:9px"><div class="field"><label>Prazo manifestação</label><input id="prazo" type="number" value="180"></div><div class="field"><label>Aviso falta 1</label><select id="faltaUm"><option value="false">Não</option><option value="true">Sim</option></select></div></div>
      <button class="btn primary" style="margin-top:10px" onclick="salvarConfig()">Salvar configuração</button>
    </div>

    <div class="card">
      <h2>Nova rodada</h2>
      <div class="row"><div class="field"><label>Nome</label><input id="rodNome" placeholder="Ex.: Rodada 1"></div><div class="field"><label>Modalidade</label><select id="rodModal"><option value="LINHA_HORIZONTAL">Uma linha</option><option value="QUATRO_CANTOS">Quatro cantos</option><option value="CARTELA_CHEIA">Cartela cheia</option><option value="COLUNA">Coluna</option><option value="DIAGONAL">Diagonal</option><option value="X">X</option></select></div></div>
      <div class="field" style="margin-top:9px"><label>Prêmio</label><input id="rodPremio" placeholder="Ex.: TV 50 polegadas"></div>
      <button class="btn primary" style="margin-top:10px" onclick="criarRodada()">Criar rodada</button>
    </div>

    <div class="card full"><h2>Rodadas</h2><div id="rodadas" class="list"></div></div>

    <div class="card">
      <h2>Sorteio ao vivo</h2>
      <div class="status" id="rodAtual">Selecione uma rodada.</div>
      <div class="num"><span class="letra" id="ultLetra">—</span> <span id="ultNumero">—</span></div>
      <div class="row" style="margin-top:16px;justify-content:center"><input id="numero" type="number" min="1" max="75" style="height:48px;width:110px;font-size:22px;text-align:center;border:2px solid #cad5e1;border-radius:12px"><button class="btn green" style="height:48px" onclick="registrarNumero()">CONFIRMAR NÚMERO</button></div>
      <div class="row" style="margin-top:10px;justify-content:center"><button class="btn primary" onclick="iniciar()">Iniciar rodada</button><button class="btn warn" onclick="pausar()">Pausar</button><button class="btn" onclick="retomar()">Retomar</button></div>
      <div id="ultimos" class="ultimos"></div>
    </div>

    <div class="card"><h2>🚨 Bingos detectados</h2><div id="deteccoes" class="list"><div class="muted">Nenhum Bingo detectado.</div></div></div>

    <div class="card full">
      <div class="row" style="justify-content:space-between;align-items:center"><h2 style="margin:0">Participantes do Evento</h2><div><button class="btn" onclick="carregarParticipantes()">Atualizar lista</button> <button id="btnGerarTodos" class="btn green" onclick="gerarTodasCartelas()">Gerar cartelas para todos</button></div></div>
      <div class="muted" id="partResumo" style="margin:9px 0">Selecione uma rodada para carregar os participantes.</div>
      <div id="participantes" class="list"></div>
      <div id="linksGerados" class="links"></div>
    </div>
  </div>
</div>
<script>
var TOKEN='', EVENTO='', RODADA='';
function qs(k){return new URLSearchParams(location.search).get(k)||''}
function esc(s){return String(s||'').replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])})}
function msg(t){document.getElementById('msg').textContent=t}
function init(){TOKEN=qs('sessao');EVENTO=qs('evento');document.getElementById('eventoId').value=EVENTO;if(!TOKEN||!EVENTO){msg('Abra este painel pelo SISGEP Eventos.');return}carregar();}
function carregar(){google.script.run.withSuccessHandler(function(c){document.getElementById('youtube').value=c.youtubeUrl||'';document.getElementById('prazo').value=c.prazoManifestacaoSegundos||180;document.getElementById('faltaUm').value=String(!!c.avisoFaltaUmNumero);listarRodadas();}).withFailureHandler(falha).bingo_obterConfig(EVENTO,TOKEN)}
function listarRodadas(){google.script.run.withSuccessHandler(function(l){var box=document.getElementById('rodadas');box.innerHTML=(l||[]).length?(l||[]).map(function(r){return '<div class="item"><b>'+esc(r.nome)+'</b> · '+esc(r.modalidade)+' · '+esc(r.status)+' · '+esc(r.premioDescricao||'Sem prêmio')+' <button class="btn" onclick="selecionarRodada(\''+r.rodadaId+'\')">Operar</button></div>'}).join(''):'<div class="muted">Nenhuma rodada criada.</div>';msg('Bingo carregado em homologação.');}).withFailureHandler(falha).bingo_listarRodadas(EVENTO,TOKEN)}
function salvarConfig(){google.script.run.withSuccessHandler(function(r){msg(r.ok?'Configuração salva.':r.mensagem)}).withFailureHandler(falha).bingo_salvarConfig({eventoId:EVENTO,youtubeUrl:document.getElementById('youtube').value,prazoManifestacaoSegundos:+document.getElementById('prazo').value,avisoFaltaUmNumero:document.getElementById('faltaUm').value==='true'},TOKEN)}
function criarRodada(){google.script.run.withSuccessHandler(function(r){if(r.ok){msg('Rodada criada.');listarRodadas()}else msg(r.mensagem)}).withFailureHandler(falha).bingo_criarRodada({eventoId:EVENTO,nome:document.getElementById('rodNome').value||'Rodada',modalidade:document.getElementById('rodModal').value,premioDescricao:document.getElementById('rodPremio').value,prazoManifestacaoSegundos:+document.getElementById('prazo').value},TOKEN)}
function selecionarRodada(id){RODADA=id;atualizarEstado();carregarParticipantes();}
function atualizarEstado(){if(!RODADA)return;google.script.run.withSuccessHandler(function(s){var r=s.rodada||{};document.getElementById('rodAtual').textContent=(r.nome||'Rodada')+' — '+(r.status||'');document.getElementById('ultNumero').textContent=r.ultimoNumero||'—';document.getElementById('ultLetra').textContent=r.ultimaLetra||'—';document.getElementById('ultimos').innerHTML=(s.sorteios||[]).slice(-15).reverse().map(function(x){return '<span class="bola">'+esc(x.letra)+x.numero+'</span>'}).join('');renderDet(s.deteccoes||[]);}).withFailureHandler(falha).bingo_estadoAdmin(EVENTO,RODADA,TOKEN)}
function renderDet(ds){var b=document.getElementById('deteccoes');b.innerHTML=ds.length?ds.map(function(d){return '<div class="det"><b>BINGO — cartela '+esc(d.cartelaId)+'</b><br>Número: '+d.numeroVencedor+' · '+esc(d.status)+'<br><button class="btn green" onclick="confirmarManifestacao(\''+d.deteccaoId+'\')">Confirmar manifestação</button></div>'}).join(''):'<div class="muted">Nenhum Bingo detectado.</div>'}
function iniciar(){if(!RODADA)return msg('Selecione uma rodada.');google.script.run.withSuccessHandler(function(r){msg(r.ok?'Rodada iniciada.':r.mensagem);atualizarEstado();carregarParticipantes()}).withFailureHandler(falha).bingo_iniciarRodada(RODADA,TOKEN)}
function pausar(){if(!RODADA)return;google.script.run.withSuccessHandler(function(r){msg(r.ok?'Rodada pausada.':r.mensagem);atualizarEstado()}).withFailureHandler(falha).bingo_pausarRodada(RODADA,'PAUSA_OPERACIONAL',TOKEN)}
function retomar(){if(!RODADA)return;google.script.run.withSuccessHandler(function(r){msg(r.ok?'Rodada retomada.':r.mensagem);atualizarEstado()}).withFailureHandler(falha).bingo_retomarRodada(RODADA,TOKEN)}
function registrarNumero(){if(!RODADA)return msg('Selecione uma rodada.');var n=+document.getElementById('numero').value;if(n<1||n>75)return msg('Informe número de 1 a 75.');var letra=n<=15?'B':n<=30?'I':n<=45?'N':n<=60?'G':'O';if(!confirm('Confirmar '+letra+'-'+n+'?'))return;google.script.run.withSuccessHandler(function(r){msg(r.ok?(r.bingosDetectados&&r.bingosDetectados.length?'🚨 BINGO DETECTADO — sorteio pausado.':'Número registrado.'):r.mensagem);document.getElementById('numero').value='';atualizarEstado()}).withFailureHandler(falha).bingo_registrarNumero({rodadaId:RODADA,numero:n,requestId:'WEB-'+Date.now()},TOKEN)}
function carregarParticipantes(){if(!RODADA){document.getElementById('partResumo').textContent='Selecione uma rodada.';return}google.script.run.withSuccessHandler(function(l){l=l||[];var geradas=l.filter(function(p){return p.cartelaGerada}).length;document.getElementById('partResumo').textContent=l.length+' participante(s) no Evento · '+geradas+' com cartela nesta rodada.';document.getElementById('participantes').innerHTML=l.length?l.map(function(p){var st=p.cartelaGerada?'<span class="pill ok">Cartela gerada</span>':'<span class="pill wait">Sem cartela</span>';var ac=p.cartelaId?'<button class="btn" onclick="gerarLink(\''+p.cartelaId+'\',\''+esc(p.nome).replace(/'/g,'&#39;')+'\')">Gerar/renovar link</button>':'';return '<div class="part"><div><b>'+esc(p.nome)+'</b><br><small>'+esc(p.escola||p.categoria||p.origem)+'</small></div><div>'+st+'</div><div>'+esc(p.associadoId||'—')+'</div><div>'+ac+'</div></div>'}).join(''):'<div class="muted">Nenhum participante encontrado neste Evento.</div>';}).withFailureHandler(falha).bingo_statusParticipantesEvento(EVENTO,RODADA,TOKEN)}
function gerarTodasCartelas(){if(!RODADA)return msg('Selecione uma rodada.');if(!confirm('Gerar uma cartela única para todos os participantes habilitados deste Evento?'))return;var b=document.getElementById('btnGerarTodos');b.disabled=true;b.textContent='Gerando...';google.script.run.withSuccessHandler(function(r){b.disabled=false;b.textContent='Gerar cartelas para todos';if(!r.ok){msg(r.mensagem);return}msg('Cartelas: '+r.geradas+' novas, '+r.existentes+' já existentes.');renderLinks(r.links||[]);carregarParticipantes();}).withFailureHandler(function(e){b.disabled=false;b.textContent='Gerar cartelas para todos';falha(e)}).bingo_gerarCartelasDoEvento(RODADA,TOKEN)}
function renderLinks(ls){var b=document.getElementById('linksGerados');if(!ls.length){b.innerHTML='';return}b.innerHTML='<b>Links gerados nesta operação</b>'+ls.map(function(x){return '<div class="linkrow">'+esc(x.nome)+'<input readonly value="'+esc(x.url)+'"><button class="btn" onclick="navigator.clipboard.writeText(\''+esc(x.url).replace(/'/g,'&#39;')+'\')">Copiar</button> <a class="btn" style="display:inline-flex;align-items:center;text-decoration:none" target="_blank" href="'+esc(x.url)+'">Abrir</a></div>'}).join('')}
function gerarLink(cartelaId,nome){google.script.run.withSuccessHandler(function(r){if(!r.ok)return msg(r.mensagem);document.getElementById('linksGerados').innerHTML='<div class="linkrow"><b>'+esc(nome)+'</b><input readonly value="'+esc(r.url)+'"><button class="btn" onclick="navigator.clipboard.writeText(\''+esc(r.url).replace(/'/g,'&#39;')+'\')">Copiar</button> <a class="btn" style="display:inline-flex;align-items:center;text-decoration:none" target="_blank" href="'+esc(r.url)+'">Abrir</a></div>';msg('Novo link individual gerado.');carregarParticipantes()}).withFailureHandler(falha).bingo_gerarLinkCartela(cartelaId,TOKEN)}
function confirmarManifestacao(id){if(!confirm('Confirmar que o participante se manifestou no chat da live?'))return;google.script.run.withSuccessHandler(function(r){msg(r.ok?'🏆 Vencedor confirmado.':r.mensagem);atualizarEstado()}).withFailureHandler(falha).bingo_confirmarManifestacao(id,TOKEN)}
function falha(e){msg('Erro: '+((e&&e.message)||e||'falha desconhecida'))}
init();setInterval(function(){if(RODADA)atualizarEstado()},5000);
</script>
</body>
</html>
