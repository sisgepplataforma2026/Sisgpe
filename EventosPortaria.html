<!DOCTYPE html><html><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:Arial,sans-serif;background:#071a2f;color:#fff;margin:0}.top{padding:16px;background:#052f63}.wrap{padding:14px}.card{background:#fff;color:#152033;border-radius:14px;padding:14px;margin-bottom:12px}.btn{width:100%;padding:13px;border:0;border-radius:10px;font-weight:800;font-size:16px;cursor:pointer}.primary{background:#0b63ce;color:#fff}.secondary{background:#e8eef6;color:#17365f}.ok{background:#16794a;color:#fff}.danger{background:#b42318;color:#fff}.result{padding:18px;border-radius:14px;text-align:center;font-weight:800;display:none;margin-bottom:12px}.r-ok{background:#d9f8e8;color:#11613c}.r-err{background:#fde2df;color:#8f1d16}video{width:100%;border-radius:12px;background:#000;max-height:360px}.small{font-size:12px;color:#64748b}.row{display:flex;gap:8px}input{width:100%;padding:11px;border:1px solid #ccd5e0;border-radius:9px;font-size:16px;box-sizing:border-box}.list button{margin-top:8px;text-align:left}.hidden{display:none}</style></head><body><div class="top"><b>Compasso 2026 — Portaria</b><div id="device" style="font-size:11px;opacity:.8"></div></div><div class="wrap"><div id="res" class="result"></div><div class="card"><video id="video" playsinline muted></video><button id="start" class="btn primary" onclick="iniciar()">Ler QR Code</button><div class="small" id="scannerMsg" style="margin-top:8px">Use a câmera traseira. A leitura reinicia após cada validação.</div></div><div class="card"><b>Busca manual</b><div class="small">Para celular descarregado, QR danificado ou contingência.</div><div class="row" style="margin-top:8px"><input id="q" placeholder="Nome, CPF ou nº do ingresso"><button class="btn secondary" style="width:auto" onclick="buscar()">Buscar</button></div><div id="lista" class="list"></div></div></div><script>var COMPASSO_TOKEN=(function(){try{var m=String(location.search||'').match(/[?&]sessao=([^&]*)/);return m?decodeURIComponent(m[1]):''}catch(e){return ''}})();var stream=null,rodando=false,detector=null,deviceId='PORT-'+Math.random().toString(36).slice(2,8).toUpperCase();device.textContent='Dispositivo: '+deviceId;function api(fn,args,cb){var r=google.script.run.withSuccessHandler(cb).withFailureHandler(function(e){mostrar(false,e.message||String(e))});r[fn].apply(r,(args||[]).concat([COMPASSO_TOKEN]))}function mostrar(ok,msg,obj){res.className='result '+(ok?'r-ok':'r-err');res.style.display='block';res.innerHTML=(ok?'✅ ':'❌ ')+esc(msg)+(obj&&obj.nome?'<div style="font-size:22px;margin-top:6px">'+esc(obj.nome)+'</div><div style="font-size:13px">'+esc(obj.numero||'')+' · '+esc(obj.categoria||'')+'</div>':'');if(navigator.vibrate)navigator.vibrate(ok?80:[120,80,120]);setTimeout(function(){res.style.display='none'},2500)}function esc(s){return String(s||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}async function iniciar(){if(!('BarcodeDetector'in window)){scannerMsg.textContent='Este navegador não oferece leitura nativa. Use a busca manual ou um aparelho compatível.';return}detector=new BarcodeDetector({formats:['qr_code']});try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});video.srcObject=stream;await video.play();rodando=true;loop()}catch(e){mostrar(false,'Não foi possível abrir a câmera.');}}async function loop(){if(!rodando)return;try{var codes=await detector.detect(video);if(codes&&codes.length){rodando=false;var token=codes[0].rawValue||'';api('compasso_checkinValidarToken',[token,deviceId],function(r){mostrar(!!r.ok,r.mensagem||'',r);setTimeout(function(){rodando=true;loop()},900)});return}}catch(e){}requestAnimationFrame(loop)}function buscar(){var t=q.value.trim();if(t.length<2)return;api('compasso_checkinBuscarManual',[t],function(r){lista.innerHTML=(r||[]).map(function(x){return '<button class="btn secondary" onclick="manual(\''+x.ingressoId+'\')"><b>'+esc(x.nome)+'</b><br><span class="small">'+esc(x.numero)+' · '+esc(x.status)+' · '+esc(x.escola)+'</span></button>'}).join('')||'<div class="small" style="margin-top:8px">Nenhum ingresso encontrado.</div>'})}function manual(id){var motivo=prompt('Motivo do check-in manual:');if(!motivo)return;api('compasso_checkinManual',[id,deviceId,motivo],function(r){mostrar(!!r.ok,r.mensagem||'',r);buscar()})}window.addEventListener('beforeunload',function(){rodando=false;if(stream)stream.getTracks().forEach(function(t){t.stop()})});</script></body></html>
