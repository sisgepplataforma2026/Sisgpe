<style>
/* ========================================================================== */
/* SISGEP · Taxa Negocial · Interface modular                                 */
/* ========================================================================== */
#blocoTaxaNegocial{display:none;padding-top:2px;}
.tn-wrap{display:flex;flex-direction:column;gap:14px;}
.tn-campanha{border:1px solid var(--g200,#e2e8f0);border-left:4px solid var(--navy,#173f7a);background:#fff;border-radius:12px;padding:16px 18px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;}
.tn-campanha-kicker{font-size:10px;font-weight:900;letter-spacing:.09em;text-transform:uppercase;color:var(--g500,#64748b);}
.tn-campanha-titulo{font-size:17px;font-weight:900;color:var(--navy,#173f7a);margin-top:3px;}
.tn-campanha-meta{display:flex;flex-wrap:wrap;gap:7px 12px;margin-top:7px;font-size:12px;color:var(--g600,#475569);}
.tn-status{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:7px 11px;font-size:11px;font-weight:900;background:#ecfdf3;color:#067647;border:1px solid #abefc6;white-space:nowrap;}
.tn-status.off{background:#f8fafc;color:#475569;border-color:#e2e8f0;}
.tn-subnav{display:flex;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--g200,#e2e8f0);padding-bottom:10px;}
.tn-subtab{border:1px solid var(--g200,#d8dee8);background:#fff;color:var(--g600,#475569);border-radius:9px;padding:9px 12px;font-size:12px;font-weight:800;cursor:pointer;}
.tn-subtab:hover{border-color:var(--navy,#173f7a);color:var(--navy,#173f7a);}
.tn-subtab.active{background:var(--navy,#173f7a);border-color:var(--navy,#173f7a);color:#fff;}
.tn-subtab[disabled]{opacity:.52;cursor:not-allowed;}
.tn-panel{display:none;}
.tn-panel.active{display:block;}
.tn-card{background:#fff;border:1px solid var(--g200,#e2e8f0);border-radius:12px;overflow:hidden;}
.tn-card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--g200,#e2e8f0);background:#fbfcfe;}
.tn-card-title{font-size:14px;font-weight:900;color:var(--navy,#173f7a);}
.tn-card-sub{font-size:11.5px;color:var(--g500,#64748b);margin-top:2px;}
.tn-card-body{padding:16px;}
.tn-steps{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:16px;}
.tn-step{display:flex;align-items:center;gap:7px;padding:8px 9px;border-radius:9px;background:#f8fafc;color:#64748b;font-size:11px;font-weight:800;border:1px solid #eef2f6;}
.tn-step b{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:#e2e8f0;color:#475569;font-size:10px;}
.tn-step.active{background:#eff6ff;color:#173f7a;border-color:#bfdbfe;}
.tn-step.active b{background:#173f7a;color:#fff;}
.tn-step.done{background:#ecfdf3;color:#067647;border-color:#abefc6;}
.tn-step.done b{background:#067647;color:#fff;}
.tn-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;}
.tn-grid-3{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:12px;}
.tn-field{display:flex;flex-direction:column;gap:6px;}
.tn-field label{font-size:10.5px;font-weight:900;letter-spacing:.05em;color:#475569;text-transform:uppercase;}
.tn-field input,.tn-field select,.tn-field textarea{width:100%;border:1px solid #cfd8e3;border-radius:9px;background:#fff;color:#172033;padding:10px 11px;font-size:13px;outline:none;min-height:40px;}
.tn-field textarea{min-height:125px;resize:vertical;line-height:1.55;}
.tn-field input:focus,.tn-field select:focus,.tn-field textarea:focus{border-color:#5b7fba;box-shadow:0 0 0 3px rgba(23,63,122,.08);}
.tn-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:14px;}
.tn-btn{border:1px solid #cfd8e3;border-radius:9px;padding:9px 13px;font-size:12px;font-weight:900;cursor:pointer;background:#fff;color:#173f7a;min-height:38px;}
.tn-btn:hover{border-color:#173f7a;}
.tn-btn.primary{background:#173f7a;color:#fff;border-color:#173f7a;}
.tn-btn.success{background:#067647;color:#fff;border-color:#067647;}
.tn-btn[disabled]{opacity:.55;cursor:not-allowed;}
.tn-alert{display:none;border-radius:9px;padding:10px 12px;font-size:12px;line-height:1.5;margin-top:12px;border:1px solid transparent;}
.tn-alert.show{display:block;}
.tn-alert.info{background:#eff6ff;border-color:#bfdbfe;color:#1e3a5f;}
.tn-alert.ok{background:#ecfdf3;border-color:#abefc6;color:#05603a;}
.tn-alert.warn{background:#fffaeb;border-color:#fedf89;color:#854a0e;}
.tn-alert.err{background:#fef3f2;border-color:#fecdca;color:#912018;}
.tn-resumo{display:none;margin-top:14px;border:1px solid #dbe3ec;border-radius:10px;background:#fbfcfe;padding:13px;}
.tn-resumo.show{display:block;}
.tn-resumo-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px 14px;}
.tn-resumo-item small{display:block;text-transform:uppercase;font-size:9.5px;font-weight:900;letter-spacing:.05em;color:#667085;margin-bottom:2px;}
.tn-resumo-item strong{font-size:12.5px;color:#172033;word-break:break-word;}
.tn-manifestacao{white-space:pre-wrap;line-height:1.65;border:1px solid #d7dee8;background:#fbfcfe;border-radius:10px;padding:14px;color:#344054;font-size:12.5px;max-height:260px;overflow:auto;}
.tn-check{display:flex;gap:9px;align-items:flex-start;margin-top:12px;font-size:12px;line-height:1.45;color:#344054;}
.tn-check input{margin-top:2px;}
.tn-otp{display:none;margin-top:14px;padding:14px;border:1px solid #bfdbfe;background:#f7fbff;border-radius:10px;}
.tn-otp.show{display:block;}
.tn-otp input{letter-spacing:.22em;font-size:20px;font-weight:900;text-align:center;max-width:200px;}
.tn-sucesso{display:none;text-align:center;padding:22px 16px;}
.tn-sucesso.show{display:block;}
.tn-sucesso-ico{width:54px;height:54px;margin:0 auto 10px;border-radius:50%;display:grid;place-items:center;background:#ecfdf3;color:#067647;font-size:27px;font-weight:900;}
.tn-protocolo{font-size:23px;font-weight:950;color:#173f7a;letter-spacing:.02em;margin:8px 0 4px;}
.tn-comprovante{margin:14px auto 0;max-width:680px;text-align:left;border:1px solid #dbe3ec;border-radius:10px;padding:12px;background:#fbfcfe;font-size:12px;color:#475467;line-height:1.55;}
.tn-history-search{display:flex;gap:8px;align-items:end;flex-wrap:wrap;}
.tn-history-search .tn-field{flex:1;min-width:220px;}
.tn-history{margin-top:14px;display:flex;flex-direction:column;gap:9px;}
.tn-history-item{border:1px solid #e1e7ef;border-radius:10px;padding:12px 13px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;background:#fff;}
.tn-history-item strong{color:#172033;font-size:12.5px;}
.tn-history-item small{display:block;color:#667085;font-size:11px;margin-top:3px;}
.tn-pill{display:inline-flex;border-radius:999px;padding:5px 8px;font-size:10px;font-weight:900;background:#f2f4f7;color:#475467;white-space:nowrap;height:max-content;}
.tn-empty{text-align:center;padding:28px;color:#667085;font-size:12px;}
.tn-loading{opacity:.65;pointer-events:none;}
@media(max-width:760px){.tn-campanha{grid-template-columns:1fr}.tn-grid,.tn-grid-3,.tn-resumo-grid{grid-template-columns:1fr}.tn-steps{grid-template-columns:repeat(2,1fr)}.tn-history-item{grid-template-columns:1fr}.tn-status{width:max-content}}
</style>
