<script>
/* ═══════════════════════════════════════════════════════════
   SISGEP · Oficios.html — v7.2 CORRIGIDO (Busca/Escola Restaurada)
   ✅ renderDropdown populando HTML, exibindo lista e bind de clique
   ✅ preview, gerar, reset, auto-save, toast, blindarBotao mantidos
   🔒 Compatível 1:1 com backend e CSS existente
═══════════════════════════════════════════════════════════ */
(function(){
  "use strict";

  /* ─────────────────────────────────────────────
     UTILITÁRIOS
  ────────────────────────────────────────────── */
  function txt(v) { return String(v || "").trim(); }
  function normalizarBusca(v) { return txt(v).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, ""); }
  function ehOpcaoPlaceholder(v) {
    var t = normalizarBusca(v).replace(/[^\w\s]/g, "").replace(/\s+/g, " ").trim();
    return !t || t === "selecione" || t === "selecionar" || t === "escolha" || t === "escolha uma escola";
  }
  function escapeHtml(s) { return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
  function debounce(fn, ms) { var t; return function(){ clearTimeout(t); t=setTimeout(fn, ms||300); }; }
  function $(id) { return document.getElementById(id); }

  function toast(msg, tipo, duracao) {
    tipo = tipo || "info"; duracao = duracao || 4000;
    var box = $("sisgepToastBox");
    if (!box) { box = document.createElement("div"); box.id = "sisgepToastBox"; box.style.cssText = "position:fixed;top:20px;right:20px;z-index:99999;display:flex;flex-direction:column;gap:8px;pointer-events:none;"; document.body.appendChild(box); }
    var el = document.createElement("div");
    var cores = {info:"#3b82f6",ok:"#059669",warn:"#d97706",err:"#dc2626"};
    el.style.cssText = "pointer-events:auto;background:#fff;border-left:4px solid "+(cores[tipo]||cores.info)+";padding:12px 16px;border-radius:10px;box-shadow:0 6px 20px rgba(0,20,60,.18);font-size:13px;font-weight:600;color:#0f172a;max-width:380px;animation:slideIn .2s ease;";
    el.textContent = msg; box.appendChild(el);
    setTimeout(function(){ el.style.opacity="0"; el.style.transform="translateX(20px)"; setTimeout(function(){ el.remove(); },200); }, duracao);
  }

  /* ─────────────────────────────────────────────
     STATE & AUTO-SAVE
  ────────────────────────────────────────────── */
  var DRAFT_KEY = "sisgep_oficio_draft_v7";
  var autoSave = debounce(function(){
    try {
      var draft = {
        tipo: $("tipo")&&$("tipo").value, escolaId: escolaSmartSelecionada&&escolaSmartSelecionada.id, email: emailSmartSelecionado,
        corpo: $("corpo")&&$("corpo").value, taxaAssunto: $("taxaAssistencialAssunto")&&$("taxaAssistencialAssunto").value, taxaCorpo: $("taxaAssistencialCorpo")&&$("taxaAssistencialCorpo").value, ts: Date.now()
      };
      localStorage.setItem(DRAFT_KEY, JSON.stringify(draft));
      var badge = $("badgeRascunho"); if(badge) badge.style.display="inline-flex";
    } catch(e){}
  }, 500);

  function restoreDraft() {
    try {
      var raw = localStorage.getItem(DRAFT_KEY); if(!raw) return;
      var d = JSON.parse(raw);
      if(d.tipo && $("tipo")) $("tipo").value=d.tipo;
      if(d.corpo && $("corpo")) $("corpo").value=d.corpo;
      if(d.taxaAssunto && $("taxaAssistencialAssunto")) $("taxaAssistencialAssunto").value=d.taxaAssunto;
      if(d.taxaCorpo && $("taxaAssistencialCorpo")) $("taxaAssistencialCorpo").value=d.taxaCorpo;
      if(d.escolaId && escolasSmartOficio.length) {
        var esc = escolasSmartOficio.find(function(e){ return e.id === d.escolaId; });
        if(esc) selecionarEscola(esc);
      }
      toast("Rascunho restaurado.","ok",2500);
    } catch(e){}
  }

  /* ─────────────────────────────────────────────
     ESCOLAS (BUSCA & SELEÇÃO CORRIGIDAS)
  ────────────────────────────────────────────── */
  var escolasSmartOficio = [], escolaSmartSelecionada = null, emailSmartSelecionado = "";
  var buscaServidorTimer = null;
  var buscaServidorSeq = 0;
function renderizarListaAZ() {
  var lista = document.getElementById("listaEscolasRecentesOficio");
  if (!lista) return;
  if (!escolasSmartOficio || !escolasSmartOficio.length) {
    lista.innerHTML = '<div class="escola-recentes-empty">Nenhuma escola carregada.</div>';
    return;
  }
  var html = escolasSmartOficio
    .slice()
    .sort(function(a, b) {
      return String(a.escola || "").localeCompare(String(b.escola || ""), "pt-BR", { sensitivity: "base" });
    })
    .slice(0, 200)
    .map(function(e) {
      return '<button type="button" class="escola-recente-btn" data-id="' + escapeHtml(e.id || e.cnpj || e.escola || "") + '">'
        + '<strong>' + escapeHtml(e.escola || "Sem nome") + '</strong>'
        + '<span>' + escapeHtml([e.cnpj || "", [e.cidade || "", e.uf || ""].filter(Boolean).join("/")].filter(Boolean).join(" • ")) + '</span>'
        + '</button>';
    })
    .join("");
  lista.innerHTML = html;
  Array.from(lista.querySelectorAll(".escola-recente-btn")).forEach(function(btn) {
    btn.addEventListener("click", function() {
      var id = btn.dataset.id;
      var escola = escolasSmartOficio.find(function(e) { return String(e.id || e.cnpj || e.escola || "") === String(id || ""); });
      if (escola) selecionarEscola(escola);
    });
  });
}

function escolaDeOption(opt) {
  var emails = [opt.dataset.email, opt.dataset.emailFinanceiro, opt.dataset.emailDp, opt.dataset.emailSecretaria]
    .filter(Boolean).filter(function(v, i, arr) { return arr.indexOf(v) === i; });
  return {
    id: txt(opt.dataset.id || opt.value),
    nome: txt(opt.textContent),
    razao: opt.dataset.razao || "",
    cnpj: opt.dataset.cnpj || "",
    cidade: opt.dataset.cidade || "",
    uf: opt.dataset.uf || "",
    endereco: opt.dataset.endereco || "",
    logradouro: opt.dataset.logradouro || "",
    numero: opt.dataset.numero || "",
    complemento: opt.dataset.complemento || "",
    bairro: opt.dataset.bairro || "",
    cep: opt.dataset.cep || "",
    status: opt.dataset.status || "Ativa",
    emails: emails,
    emailPrincipal: opt.dataset.email || "",
    oficios: Number(opt.dataset.oficios || 0),
    confirmados: Number(opt.dataset.confirmados || 0),
    ultimo: opt.dataset.ultimo || "—"
  };
}

  function normalizarEscola(raw) {
    raw = raw || {};
    var emailsTodos = raw.emailsTodos || raw.EmailsTodos || raw.emailTodos || "";
    var emails = [].concat(raw.emails||[], raw.email?[raw.email]:[], raw.Email?[raw.Email]:[], raw.emailPrincipal?[raw.emailPrincipal]:[], emailsTodos ? String(emailsTodos).split(/[;,]+/) : [])
      .map(function(e){ return txt(e); })
      .filter(Boolean).filter(function(e,i,a){ return a.indexOf(e)===i; });
    var cidade = txt(raw.cidade || raw.municipio || raw.Municipio || raw["Município"] || raw.Cidade || "");
    var uf = txt(raw.uf || raw.UF || raw.Estado || "");
    var cidadeUf = txt(raw.cidadeUf || raw.CidadeUf || raw["Cidade / UF"] || raw["Cidade/UF"] || raw["Cidade - UF"] || [cidade, uf].filter(Boolean).join(" / "));
    if (!cidade && cidadeUf) cidade = txt(cidadeUf.split(/[\/-]/)[0]);
    if (!uf && cidadeUf && cidadeUf.indexOf("/") > -1) uf = txt(cidadeUf.split("/").pop());
    var logradouro = txt(raw.logradouro || raw.Endereco || raw.endereco || raw["Endereço"] || "");
    var numero = txt(raw.numero || raw.Numero || raw["Número"] || "");
    var complemento = txt(raw.complemento || raw.Complemento || "");
    var bairro = txt(raw.bairro || raw.Bairro || "");
    var cep = txt(raw.cep || raw.CEP || "");
    var enderecoCompleto = txt(raw.enderecoCompleto || raw.EnderecoCompleto || "");
    if (!enderecoCompleto) {
      enderecoCompleto = [
        [logradouro, numero].filter(Boolean).join(", "),
        complemento,
        bairro,
        cidadeUf,
        cep
      ].filter(Boolean).join(" · ");
    }
    return { id:raw.id||raw.cnpj||raw.CNPJ||raw.cnpjLimpo||raw.escola||raw.NomeEscola||raw.nome||raw.razaoSocial||"", nome:raw.nome||raw.escola||raw.NomeEscola||raw.razaoSocial||raw["Razão Social"]||raw.fantasia||raw.Fantasia||"Escola sem nome",
      razao:raw.razaoSocial||raw.razao||raw["Razão Social"]||raw.nome||"", cnpj:raw.cnpj||raw.CNPJ||raw.cnpjLimpo||"", cidade:cidade, uf:uf, cidadeUf:cidadeUf,
      logradouro:logradouro, numero:numero, complemento:complemento, bairro:bairro, cep:cep,
      endereco:enderecoCompleto, status:raw.status||raw.situacao||raw.Situacao||"Ativa", emails:emails,
      emailPrincipal:raw.emailPrincipal||raw.email||raw.Email||emails[0]||"",
      oficios:Number(raw.oficios||0), confirmados:Number(raw.confirmados||0), ultimo:raw.ultimo||"â€”" };
  }

function syncFromSelect() {
  var sel = $("escola"); if(!sel) return;
  // ✅ Se já temos lista carregada do servidor, não sobrescreve
  if (escolasSmartOficio.length > 0) return;
  var listaSelect = Array.from(sel.options)
    .filter(function(o){ return txt(o.value) && !ehOpcaoPlaceholder(o.textContent); })
    .map(escolaDeOption).map(normalizarEscola)
    .sort(function(a,b){ return normalizarBusca(a.nome).localeCompare(normalizarBusca(b.nome)); });
  if (!listaSelect.length) return;
  escolasSmartOficio = listaSelect;
}

function popularSelectEscolas(lista) {
  var sel = $("escola");
  if (!sel || !Array.isArray(lista)) return;
  sel.innerHTML = "";
  lista.map(normalizarEscola).filter(function(e) { return txt(e.nome) && !ehOpcaoPlaceholder(e.nome); })
    .sort(function(a, b) { return normalizarBusca(a.nome).localeCompare(normalizarBusca(b.nome)); })
    .forEach(function(e) {
      var opt = document.createElement("option");
      opt.value = e.id || e.cnpj || e.nome;
      opt.textContent = e.nome;
      opt.dataset.id = e.id || "";
      opt.dataset.razao = e.razao || "";
      opt.dataset.cnpj = e.cnpj || "";
      opt.dataset.email = e.emailPrincipal || "";
      opt.dataset.cidade = e.cidade || "";
      opt.dataset.uf = e.uf || "";
      opt.dataset.endereco = e.endereco || "";
      opt.dataset.logradouro = e.logradouro || "";
      opt.dataset.numero = e.numero || "";
      opt.dataset.complemento = e.complemento || "";
      opt.dataset.bairro = e.bairro || "";
      opt.dataset.cep = e.cep || "";
      opt.dataset.status = e.status || "Ativa";
      opt.dataset.emailFinanceiro = e.emailFinanceiro || "";
      opt.dataset.emailDp = e.emailDp || "";
      opt.dataset.emailSecretaria = e.emailSecretaria || "";
      opt.dataset.oficios = e.oficios || 0;
      opt.dataset.confirmados = e.confirmados || 0;
      opt.dataset.ultimo = e.ultimo || "—";
      sel.appendChild(opt);
    });
  syncFromSelect();
  renderRecentes();
  limpar();
}

  function carregarEscolasDaPlanilha() {
    if(!window.google||!window.google.script||!window.google.script.run){ syncFromSelect(); renderRecentes(); return; }
    google.script.run.withSuccessHandler(popularSelectEscolas).withFailureHandler(function(err){ console.error("Erro ao carregar escolas:", err); toast("Erro ao carregar escolas: " + ((err && err.message) || err), "err", 6000); syncFromSelect(); renderRecentes(); }).listarEscolas(SISGEP_TOKEN_SESSAO);
  }

  function setInput(id, v) { var el=$(id); if(el) el.value=v||""; }
  function setText(id, v) { var el=$(id); if(el) el.textContent=v||"—"; }

  function preencherCompat(escola) {
    setInput("cnpj",escola.cnpj); setInput("email",emailSmartSelecionado||escola.emailPrincipal);
    setInput("enderecoEscola",escola.endereco); setInput("razaoSocialReceita",escola.razao);
    setInput("emailReceita",emailSmartSelecionado||escola.emailPrincipal);
    setInput("cidadeUfReceita",escola.cidadeUf||[escola.cidade,escola.uf].filter(Boolean).join(" / "));
    setInput("logradouroEscola",escola.logradouro); setInput("numeroEscola",escola.numero);
    setInput("complementoEscola",escola.complemento); setInput("bairroEscola",escola.bairro);
    setInput("cidadeEscola",escola.cidade); setInput("ufEscola",escola.uf); setInput("cepEscola",escola.cep);
    var sel=$("escola"); if(sel&&escola.id) sel.value=escola.id;
    ["cnpj","email","enderecoEscola","razaoSocialReceita","emailReceita","cidadeUfReceita","logradouroEscola","numeroEscola","complementoEscola","bairroEscola","cidadeEscola","ufEscola","cepEscola"].forEach(function(id){ var el=$(id); if(el) el.dispatchEvent(new Event("change",{bubbles:true})); });
  }

  function renderEmails(escola) {
    var wrap=$("escolaProfileEmails"); if(!wrap) return;
    var emails=escola.emails.length?escola.emails:[escola.emailPrincipal].filter(Boolean);
    if(!emails.length){ wrap.innerHTML='<span style="font-size:12px;color:var(--g400);">Nenhum e-mail cadastrado</span>'; return; }
    wrap.innerHTML = emails.map(function(em,idx){
      var princ=em===escola.emailPrincipal||idx===0, ativo=em===emailSmartSelecionado;
      return '<button type="button" class="email-pill '+(princ?"principal ":"")+(ativo?"ativo":"")+'" data-email="'+em+'">'+(princ?"★ ":"")+em+'</button>';
    }).join("");
    wrap.querySelectorAll(".email-pill").forEach(function(btn){ btn.onclick=function(){ emailSmartSelecionado=btn.dataset.email; preencherCompat(escolaSmartSelecionada); renderEmails(escolaSmartSelecionada); autoSave(); }; });
  }

  function salvarRecente(escola) {
    try { var r=JSON.parse(localStorage.getItem("sisgep_oficio_escolas_recentes")||"[]"); r=r.filter(function(i){return i.cnpj!==escola.cnpj;}); r.unshift(escola); r=r.slice(0,3); localStorage.setItem("sisgep_oficio_escolas_recentes",JSON.stringify(r)); renderRecentes(); } catch(e){}
  }

  function renderRecentes() {
    var box=$("listaEscolasRecentesOficio"); if(!box) return;
    syncFromSelect(); var termo=normalizarBusca($("escolaBusca")&&$("escolaBusca").value||"");
    var lista=escolasSmartOficio.filter(function(e){
      if(!termo) return true;
      return normalizarBusca([e.nome,e.razao,e.cnpj,e.cidade,e.uf,e.cidadeUf,(e.emails||[]).join(" ")].join(" ")).indexOf(termo)>=0;
    }).slice(0,8);
    if(!lista.length){ box.innerHTML=termo?'<div class="escola-recentes-empty">Nenhuma escola encontrada.</div>':'<div class="escola-recentes-empty">A lista aparecerá após carregar a base.</div>'; return; }
    box.innerHTML = lista.map(function(e,i){ return '<button type="button" class="escola-recente-btn" data-idx="'+i+'"><strong>'+escapeHtml(e.nome)+'</strong><span>'+escapeHtml([e.cnpj,e.cidadeUf||e.cidade].filter(Boolean).join(" - "))+'</span></button>'; }).join("");
    box.querySelectorAll(".escola-recente-btn").forEach(function(btn){ btn.onclick=function(){ selecionarEscola(lista[Number(btn.dataset.idx)]); }; });
  }

  function selecionarEscola(raw) {
    var e=normalizarEscola(raw);
    if(!txt(e.nome)||ehOpcaoPlaceholder(e.nome)){ limpar(); return; }
    escolaSmartSelecionada=e; emailSmartSelecionado=e.emailPrincipal||e.emails[0]||"";
    if($("escolaBusca")) $("escolaBusca").value=e.nome;
    if($("cardEscolaOficioSelecionada")) $("cardEscolaOficioSelecionada").style.display="block";
    if($("autocompleteEscolaSmart")) $("autocompleteEscolaSmart").style.display="none";
    if($("escolaSmartEmpty")) $("escolaSmartEmpty").style.display="none";
    var st=$("statusEscolaSelecionada"); if(st){ st.textContent="Escola selecionada"; st.classList.add("ok"); }
    if($("secaoCnpjEmail")) $("secaoCnpjEmail").style.display="none";
    setText("escolaProfileNome",e.nome); setText("escolaProfileRazao",e.razao); setText("escolaProfileCnpj",e.cnpj);
    setText("escolaProfileCnpjLinha",e.cnpj?"CNPJ "+e.cnpj:"CNPJ não informado");
    setText("escolaProfileEmailLinha",(emailSmartSelecionado||e.emailPrincipal)?"E-mail "+(emailSmartSelecionado||e.emailPrincipal):"E-mail não informado");
    setText("escolaProfileCidadeUf",e.cidadeUf||[e.cidade,e.uf].filter(Boolean).join(" / ")); setText("escolaProfileEndereco",e.endereco);
    setText("escolaProfileStatus",e.status); setText("escolaStatOficios",String(e.oficios||0));
    setText("escolaStatConfirmados",String(e.confirmados||0)); setText("escolaStatUltimo",e.ultimo||"—");
    var enderecoLinha=$("escolaProfileEnderecoLinha");
    if(enderecoLinha){ enderecoLinha.textContent=e.endereco||""; enderecoLinha.style.display=e.endereco?"block":"none"; }
    var totalOficios=Number(e.oficios||0), totalConfirmados=Number(e.confirmados||0), ultimo=e.ultimo||"—";
    var resumoHistorico=totalOficios
      ? totalOficios+" ofício"+(totalOficios===1?"":"s")+" · "+totalConfirmados+" confirmado"+(totalConfirmados===1?"":"s")+(ultimo&&ultimo!=="—"?" · último em "+ultimo:"")
      : "Nenhum ofício enviado para esta escola ainda.";
    setText("escolaHistoricoResumo",resumoHistorico);
    renderEmails(e); preencherCompat(e); salvarRecente(e); atualizarRevisaoOficio(); autoSave();
  }

 function buscar(termo) {
  termo = normalizarBusca(termo);
  syncFromSelect();
  if (!termo) return escolasSmartOficio.slice(0, 8);
  return escolasSmartOficio.filter(function(e) {
    var emails = Array.isArray(e.emails) ? e.emails.join(" ") : "";
    var textoBusca = [e.nome || "", e.razao || "", e.cnpj || "", e.cidade || "", e.uf || "", e.cidadeUf || "", e.endereco || "", emails].join(" ");
    return normalizarBusca(textoBusca).indexOf(termo) >= 0;
  }).slice(0, 8);
}

function renderDropdown(lista) {

  var dd = $("autocompleteEscolaSmart");
  var empty = $("escolaSmartEmpty");

  if (!dd) return;

  if (!lista || !lista.length) {
    dd.style.display = "none";

    if (empty) {
      empty.style.display = "flex";
    }

    return;
  }

  if (empty) {
    empty.style.display = "none";
  }

  dd.innerHTML = lista.map(function(e) {
    var cidadeLinha = e.cidadeUf || [e.cidade || '', e.uf || ''].filter(Boolean).join('/');

    return '' +
      '<button type="button" class="escola-smart-option" data-id="' + escapeHtml(e.id || e.cnpj || e.nome || '') + '">' +

        '<div>' +
          '<strong>' + escapeHtml(e.nome || 'Sem nome') + '</strong>' +

          '<span>' +
            escapeHtml(
              [
                e.cnpj || '',
                cidadeLinha
              ]
              .filter(Boolean)
              .join(' • ')
            ) +
          '</span>' +
        '</div>' +

        '<span class="escola-smart-badge">Selecionar</span>' +

      '</button>';

  }).join("");

  dd.style.display = "block";

  dd.querySelectorAll(".escola-smart-option").forEach(function(item) {

    item.onclick = function() {

      var esc = escolasSmartOficio.find(function(x) {

        return String(x.id || x.cnpj || x.nome || '') ===
               String(item.dataset.id || '');

      });

      if (esc) {
        selecionarEscola(esc);
      }

    };

  });

}

/* ✅ Expõe globalmente */
function mesclarEscolasBuscaServidor(lista) {
  if (!Array.isArray(lista) || !lista.length) return;
  var porChave = {};
  escolasSmartOficio.forEach(function(e) {
    porChave[String(e.id || e.cnpj || e.nome || "").toLowerCase()] = e;
  });
  lista.map(normalizarEscola).forEach(function(e) {
    if (!txt(e.nome) || ehOpcaoPlaceholder(e.nome)) return;
    var chave = String(e.id || e.cnpj || e.nome || "").toLowerCase();
    if (!porChave[chave]) {
      escolasSmartOficio.push(e);
      porChave[chave] = e;
    } else {
      Object.keys(e).forEach(function(k) {
        if ((porChave[chave][k] === "" || porChave[chave][k] === null || porChave[chave][k] === undefined) && e[k]) {
          porChave[chave][k] = e[k];
        }
      });
    }
  });
}

function buscarNoServidor(termo) {
  termo = txt(termo);
  if (termo.length < 2 || !window.google || !google.script || !google.script.run) return;
  var seq = ++buscaServidorSeq;
  var dd = $("autocompleteEscolaSmart");
  if (dd && !dd.innerHTML) {
    dd.innerHTML = '<div class="escola-smart-loading">Buscando...</div>';
    dd.style.display = "block";
  }
  google.script.run
    .withSuccessHandler(function(lista) {
      if (seq !== buscaServidorSeq) return;
      var normalizadas = (lista || []).map(normalizarEscola).filter(function(e) {
        return txt(e.nome) && !ehOpcaoPlaceholder(e.nome);
      });
      mesclarEscolasBuscaServidor(normalizadas);
      renderDropdown(normalizadas.length ? normalizadas.slice(0, 20) : buscar(termo));
      renderRecentes();
    })
    .withFailureHandler(function(err) {
      if (seq !== buscaServidorSeq) return;
      var empty = $("escolaSmartEmpty");
      if (empty) {
        empty.style.display = "flex";
        var msg = empty.querySelector("span");
        if (msg) msg.textContent = "Erro ao buscar: " + ((err && err.message) || err);
      }
    })
    .buscarEscolasOficioSmart(termo, SISGEP_TOKEN_SESSAO);
}

function acionarBuscaEscola(termo) {
  var resultado = buscar(termo);
  renderDropdown(resultado);
  renderRecentes();
  if (buscaServidorTimer) clearTimeout(buscaServidorTimer);
  // ✅ Sempre consulta o servidor quando há termo digitado
  if (txt(termo).length >= 2) {
    buscaServidorTimer = setTimeout(function() { buscarNoServidor(termo); }, 180);
  }
}

window.renderDropdown = renderDropdown;

/* ✅ Compatibilidade antiga */
window.renderDropdownEscolas = renderDropdown;


  function limpar() {
    escolaSmartSelecionada=null; emailSmartSelecionado="";
    if($("escolaBusca")) $("escolaBusca").value="";
    if($("cardEscolaOficioSelecionada")) $("cardEscolaOficioSelecionada").style.display="none";

  /* Regra por tipo de ofício.
   *
   * Filiação e desfiliação nascem de um documento assinado: a ficha é a
   * prova da autorização do desconto, e o CPF identifica quem autorizou.
   * As três taxas são cobrança prevista na CCT, incidem sobre o quadro
   * técnico-administrativo inteiro e não têm ficha para anexar — exigir
   * ficha e CPF ali era pedir 50 documentos para mandar uma lista de nomes.
   *
   * Definido pelo usuário em 18/08/2026: "pode até 50 trabalhadores, sendo
   * o CPF não obrigatório para as três taxas e tem que sair no ofício para
   * todas as taxas". Opcional é diferente de ausente: quando informado, o
   * CPF sai no documento. */
  /* CPF NÃO É OBRIGATÓRIO EM NENHUM TIPO.
   *
   * Decisão do usuário em 18/08/2026, com a razão junto: "pode ser opcional,
   * mas a sugestão que eu sei falar pra quem trabalha no SISGEP é que inclua
   * o CPF, que tem muita gente que não sabe nem o próprio CPF".
   *
   * Ou seja: o sistema PEDE o CPF, não exige. Travar a emissão por causa de
   * um número que a pessoa não tem na mão na hora só faz o ofício não sair —
   * e o ofício é o que a escola precisa receber. O que o sistema faz é dizer,
   * na tela, o que se perde sem ele (o vínculo com o cadastro do associado),
   * e deixar a decisão com quem está atendendo. */
  function oficioExigeCpf() { return false; }
  window.oficioExigeCpf = oficioExigeCpf;

  /* Ficha continua sendo exigida onde ela é a prova da autorização do
   * desconto: filiação e desfiliação nascem de um documento assinado. */
  function oficioExigeFichaECpf(tipo) {
    var t = String(tipo || "");
    return t === "Filiação" || t === "Desfiliação";
  }

  /* A recomendação muda de peso conforme o tipo: em Filiação e Desfiliação o
   * CPF é o que liga o ofício ao cadastro do associado — sem ele a
   * desfiliação não marca ninguém. Nos demais ele só sai impresso. */
  function atualizarRecomendacaoCpf() {
    var tipo = ($("tipo") && $("tipo").value) || "";
    var ligaCadastro = (tipo === "Filiação" || tipo === "Desfiliação");
    var texto = ligaCadastro
      ? "Sem CPF o ofício sai normalmente, mas o cadastro do associado não é atualizado."
      : "Sem CPF o ofício sai normalmente, só sem o número impresso ao lado do nome.";
    document.querySelectorAll("#listaTrabalhadores .cpf-recomendacao")
      .forEach(function (el) { el.textContent = texto; });
  }
  window.atualizarRecomendacaoCpf = atualizarRecomendacaoCpf;
  function oficioLimitePessoas(tipo) { return 50; }   // 50 em todos os tipos desde 18/08/2026
  window.oficioLimitePessoas = oficioLimitePessoas;

  function somenteDigitos(v) { return String(v || "").replace(/\D/g, ""); }
  function mascaraCpf(v) { var d = somenteDigitos(v).slice(0, 11); if (d.length <= 3) return d; if (d.length <= 6) return d.replace(/(\d{3})(\d+)/, "$1.$2"); if (d.length <= 9) return d.replace(/(\d{3})(\d{3})(\d+)/, "$1.$2.$3"); return d.replace(/(\d{3})(\d{3})(\d{3})(\d{1,2})/, "$1.$2.$3-$4"); }
  function slugArquivo(v) { return String(v || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-zA-Z0-9]+/g, "_").replace(/^_+|_+$/g, "").slice(0, 80) || "associado"; }

function cpfValido(dig) {
  var soma = 0;
  for (var i = 0; i < 9; i++) soma += parseInt(dig[i]) * (10 - i);
  var r1 = (soma * 10) % 11; if (r1 === 10 || r1 === 11) r1 = 0;
  if (r1 !== parseInt(dig[9])) return false;
  soma = 0;
  for (var i = 0; i < 10; i++) soma += parseInt(dig[i]) * (11 - i);
  var r2 = (soma * 10) % 11; if (r2 === 10 || r2 === 11) r2 = 0;
  return r2 === parseInt(dig[10]);
}

function validarCpfComFeedback(cpf) {
  var dig = String(cpf || "").replace(/\D/g, "");
  if (!dig) return { valido: false, mensagem: "CPF não informado.", cpfFormatado: "" };
  if (dig.length !== 11) return { valido: false, mensagem: "CPF inválido: deve ter 11 dígitos (informado: " + dig.length + ").", cpfFormatado: "" };
  if (/^(\d)\1{10}$/.test(dig)) return { valido: false, mensagem: "CPF inválido: sequência repetida.", cpfFormatado: "" };
  if (!cpfValido(dig)) return { valido: false, mensagem: "CPF inválido: dígitos verificadores incorretos.", cpfFormatado: "" };
  return { valido: true, mensagem: "CPF válido.", cpfFormatado: dig.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, "$1.$2.$3-$4") };
}

 function atualizarRevisaoOficio(p) {
  var painel = $("painelRevisaoOficio");
  if (!painel) return;

  if (!p) {
    p = {
      tipo: $("tipo")&&$("tipo").value || "",
      escola: getEscolaPayload(),
      beneficiarios: getTrabalhadoresPayload(),
      fichas: getFichasPayload()

  var esc = p.escola&&p.escola.nome || "";
  var em = p.escola&&p.escola.email || "";
  var bens = p.beneficiarios || [];
  var fichs = p.fichas || [];
  var pend = [];

  if (!p.tipo) pend.push("Selecione o tipo.");
  if (!esc || esc === "Selecione...") pend.push("Selecione uma escola.");
  if (!em) pend.push("Informe o e-mail.");
  if (!bens.length && p.tipo !== "Ofício Livre") pend.push("Adicione trabalhadores.");
  if (bens.some(function(b) { return !b.nome; })) pend.push("Complete o nome do trabalhador.");
  if (oficioExigeCpf(p.tipo) && bens.some(function(b) { return !b.cpf; })) pend.push("Complete o CPF.");
  if (oficioExigeFichaECpf(p.tipo) && bens.length > 0 && fichs.length === 0) pend.push("Anexe ao menos uma ficha.");
  if (bens.length > oficioLimitePessoas(p.tipo)) pend.push("Limite máximo de " + oficioLimitePessoas(p.tipo) + " trabalhadores para este tipo.");

  if (!p.tipo && !esc && !bens.length && !fichs.length) {
    painel.innerHTML = '<div class="revisao-empty">Preencha os dados para montar a revisão.</div>';
    return;
  }

      '<div class="revisao-item"><span>Escola</span><strong>' + (esc || "—") + '</strong></div>' +
      '<div class="revisao-item"><span>Beneficiários</span><strong>' + bens.length + '</strong></div>' +
      '<div class="revisao-item"><span>Fichas</span><strong>' + fichs.length + '</strong></div>' +
    '</div>' +
    (
      pend.length
        ? '<div class="revisao-alerta">⚠ ' + pend.join(" ") + '</div>'
        : '<div class="revisao-alerta" style="background:#f0fdf4;color:#166534;border-color:#6ee7b7;">✅ Dados prontos para emissão.</div>'
    );
}

  var nomeInp = card.querySelector(".input-nome-trabalhador");
  var cpfInp  = card.querySelector(".input-cpf-trabalhador");
  var escola  = ($("escolaBusca")&&$("escolaBusca").value || "").trim();
  var tipo    = ($("tipo")&&$("tipo").value || "").trim();
  var dataHoje = new Date().toLocaleDateString("pt-BR").replace(/\//g, "-");
  var nome = nomeInp ? nomeInp.value.trim() : "";
  var cpf  = cpfInp  ? somenteDigitos(cpfInp.value) : "";
  var nomeSlug = nome ? slugArquivo(nome) : "associado";
  var escolaSlug = escola ? slugArquivo(escola) : "escola";
  var tipoSlug = tipo ? slugArquivo(tipo) : "oficio";
  var nova = new DataTransfer();
  Array.from(dt.files).forEach(function(f, i) {
    var ext = f.name.includes(".") ? f.name.substring(f.name.lastIndexOf(".")) : "";
    var novo = "Ficha_" + nomeSlug + (cpf ? "_" + cpf : "") + "_" + escolaSlug + "_" + tipoSlug + "_" + dataHoje + "_" + (i + 1) + ext;
    try { nova.items.add(new File([f], novo, { type: f.type, lastModified: f.lastModified })); } catch(e) { nova.items.add(f); }
  });
  return nova;
}

/* ══════════════════════════════════════════════════════════════════════
   FILA DE ARQUIVOS COM CHECK DE EXCLUIR

   Pedido do usuário em 19/08/2026: "o módulo de ofício não tem um check
   para excluir as fichas em lote".

   Ao levantar, o defeito era maior e mais estranho do que o relato: a
   REMOÇÃO JÁ ESTAVA ESCRITA, e não tinha por onde ser acionada.
   `renderizarPreviewFichaCard` e `atualizarPreviewFichas` eram cascas —
   apagavam o container e não desenhavam nada:

       function renderizarPreviewFichaCard(prev, dt) { if (prev) prev.innerHTML = ""; }

   Como era ali que os botões apareceriam, `removerFicha` e
   `removerFichaCard` ficaram com ZERO chamadas nos 125 .gs e 80 .html —
   prontas, corretas e inalcançáveis. Numa leitura o código parecia
   completo; só executando se via que ninguém chamava.

   POR QUE ISSO IMPORTA NA OPERAÇÃO. Um <input type="file"> nativo não
   deixa tirar UM arquivo: escolher de novo substitui o conjunto inteiro.
   Errar um PDF em quatro custava refazer os quatro — e sem lista à vista,
   nem dava para saber qual estava errado.
   ══════════════════════════════════════════════════════════════════════ */

/** "142 KB", "2,1 MB" — quem confere anexo olha o tamanho antes do nome. */
function oficioTamanhoLegivel_(bytes) {
  var n = Number(bytes) || 0;
  if (n < 1024) return n + " B";
  if (n < 1024 * 1024) return Math.round(n / 1024) + " KB";
  return (n / (1024 * 1024)).toFixed(1).replace(".", ",") + " MB";
}

/**
 * Desenha a fila de arquivos com um check por linha e um botão que remove
 * os marcados. `aoRemover(indices)` recebe as posições marcadas.
 *
 * O botão nasce DESABILITADO e diz quantos vai remover. Botão de remoção
 * que fica sempre clicável, sem contagem, é o que se aperta por engano.
 */
function oficioDesenharFila_(container, arquivos, aoRemover) {
  if (!container) return;
  container.innerHTML = "";
  var lista = Array.prototype.slice.call(arquivos || []);
  if (!lista.length) return;

  var caixa = document.createElement("div");
  caixa.className = "of-fila-fichas";
  caixa.style.cssText = "border:1px solid var(--g200);border-radius:8px;overflow:hidden;background:#fff;";

  lista.forEach(function (f, i) {
    var linha = document.createElement("label");
    linha.style.cssText = "display:flex;align-items:center;gap:10px;padding:8px 10px;" +
      "font-size:12.5px;cursor:pointer;" + (i ? "border-top:1px solid var(--g100);" : "");
    var chk = document.createElement("input");
    chk.type = "checkbox";
    chk.className = "of-fila-chk";
    chk.dataset.idx = String(i);
    chk.style.cssText = "width:15px;height:15px;cursor:pointer;flex:none;";
    var nome = document.createElement("span");
    nome.textContent = "📄 " + f.name;
    nome.style.cssText = "flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--g700);";
    nome.title = f.name;
    var tam = document.createElement("span");
    tam.textContent = oficioTamanhoLegivel_(f.size);
    tam.style.cssText = "flex:none;color:var(--g400);font-size:11.5px;";
    linha.appendChild(chk); linha.appendChild(nome); linha.appendChild(tam);
    caixa.appendChild(linha);
  });

  var rodape = document.createElement("div");
  rodape.style.cssText = "display:flex;align-items:center;justify-content:space-between;" +
    "gap:10px;margin-top:8px;flex-wrap:wrap;";
  var resumo = document.createElement("span");
  var totalBytes = lista.reduce(function (s, f) { return s + (f.size || 0); }, 0);
  resumo.textContent = lista.length + (lista.length === 1 ? " arquivo · " : " arquivos · ") +
    oficioTamanhoLegivel_(totalBytes);
  resumo.style.cssText = "font-size:11.5px;color:var(--g500);";
  var btn = document.createElement("button");
  btn.type = "button";
  btn.className = "btn btn-red of-fila-remover";
  btn.disabled = true;
  btn.textContent = "Remover marcados";
  btn.style.cssText = "font-size:12px;padding:5px 12px;";

  function marcados() {
    return Array.prototype.slice.call(caixa.querySelectorAll(".of-fila-chk"))
      .filter(function (c) { return c.checked; })
      .map(function (c) { return Number(c.dataset.idx); });
  }
  caixa.addEventListener("change", function () {
    var n = marcados().length;
    btn.disabled = n === 0;
    btn.textContent = n ? "Remover marcados (" + n + ")" : "Remover marcados";
  });
  btn.onclick = function () {
    var idxs = marcados();
    if (idxs.length && typeof aoRemover === "function") aoRemover(idxs);
  };

  rodape.appendChild(resumo); rodape.appendChild(btn);
  container.appendChild(caixa); container.appendChild(rodape);
}

/** A fila do cartão de um trabalhador. */
function renderizarPreviewFichaCard(prev, dt) {
  if (!prev) return;
  oficioDesenharFila_(prev, dt && dt.files, function (idxs) {
    removerFichasCard(prev, idxs);
  });
}

/**
 * Remove do cartão os arquivos nas posições dadas.
 *
 * De uma vez, e não um a um em laço: apagar por índice enquanto a lista
 * encolhe desloca tudo que vem depois, e o segundo apagado seria o
 * arquivo errado.
 */
function removerFichasCard(refEl, idxs) {
  var card = refEl.closest(".trabalhador-card");
  if (!card) return;
  var inputFicha = card.querySelector(".input-ficha-trabalhador");
  var contador = card.querySelector(".ficha-contador");
  var preview = card.querySelector(".ficha-preview-individual");
  if (!inputFicha) return;

  var fora = {};
  (idxs || []).forEach(function (i) { fora[i] = true; });
  var nova = new DataTransfer();
  Array.from(inputFicha.files).forEach(function (f, i) { if (!fora[i]) nova.items.add(f); });
  inputFicha.files = nova.files;
  /* A fila acumulada do cartão vive no elemento, e não numa variável de
     closure: quando morava só na closure, remover aqui não a atualizava e
     o próximo anexo ressuscitava o arquivo apagado. */
  card._fichasDt = nova;

  var total = nova.files.length;
  if (contador) contador.textContent = total ? total + (total === 1 ? " ficha" : " fichas") : "Nenhuma ficha";
  renderizarPreviewFichaCard(preview, nova);
  sincronizarFichasGlobais();
}

/** Um só — o caminho antigo, agora em cima do de vários. */
function removerFichaCard(btn, idx) { removerFichasCard(btn, [idx]); }

/* ── A fila das FICHAS DO OFÍCIO (o PDF único da escola) ───────────────
 *
 * A fonte da verdade continua sendo `input.files`, espelhado em
 * window._fichasOficioDt. Não é preciosismo: a emissão lê exatamente
 * `$("fichasOficioLote").files`, e se a fila vivesse num array paralelo
 * os dois se desencontrariam — a tela mostraria uma coisa e o e-mail
 * levaria outra. Foi um desencontro assim que segurou a ficha dentro do
 * navegador na semana passada.
 */
function atualizarFilaFichasOficio() {
  var inp = $("fichasOficioLote");
  if (!inp) return;
  var n = inp.files ? inp.files.length : 0;
  var res = $("fichasOficioResumo");
  if (res) {
    res.textContent = n
      ? (n === 1 ? "1 arquivo anexado ao ofício" : n + " arquivos anexados ao ofício")
      : "";
  }
  oficioDesenharFila_($("fichasOficioFila"), inp.files, removerFichasOficio);
  if (typeof atualizarResumoTrabalhadores === "function") atualizarResumoTrabalhadores();
}

/** Tira do ofício os arquivos marcados. De uma vez, pela mesma razão do cartão. */
function removerFichasOficio(idxs) {
  var inp = $("fichasOficioLote");
  if (!inp) return;
  var fora = {};
  (idxs || []).forEach(function (i) { fora[i] = true; });
  var nova = new DataTransfer();
  Array.prototype.slice.call(inp.files || []).forEach(function (f, i) {
    if (!fora[i]) nova.items.add(f);
  });
  window._fichasOficioDt = nova;
  inp.files = nova.files;
  atualizarFilaFichasOficio();
  var quantos = (idxs || []).length;
  toast(quantos === 1 ? "1 ficha removida do ofício."
                      : quantos + " fichas removidas do ofício.", "ok");
}

  function sincronizarFichasGlobais() {
    var inputGlobal = $("fichas");
    if (!inputGlobal || typeof DataTransfer === "undefined") return;
    var dt = new DataTransfer();
    document.querySelectorAll(".trabalhador-card").forEach(function(card) {
      if (card._fichasDrive && card._fichasDrive.length) return;
      var fichaInp = card.querySelector(".input-ficha-trabalhador");
      if (fichaInp && fichaInp.files.length) {
        Array.from(fichaInp.files).forEach(function(f) { if (dt.files.length >= 25) return; try { dt.items.add(f); } catch(e) {} });
      }
    });
    inputGlobal.files = dt.files; window._fichasAcumuladas = dt; atualizarContadorFichas();
  }

  function restaurarVazio() { var l = $("listaTrabalhadores"); if (l && !l.querySelector(".trabalhador-card")) l.innerHTML = '<div class="worker-empty">👤 Nenhum trabalhador adicionado ainda.<br>Clique em <strong>"+ Adicionar"</strong> para começar.</div>'; }

  /* ══════════════════════════════════════════════════════════════════
     LOTE — colar a lista de pessoas e anexar todas as fichas de uma vez

     Pedido do usuário em 18/08/2026: "Hoje está cada trabalhador com sua
     ficha, preciso que tenha um modal ou um botão para enviar por lote" e
     "quando for o lote só adiciono as pessoas e coloco todas as fichas
     comparando com a quantidade de pessoas".

     São duas etapas independentes, e de propósito: a lista pode entrar sem
     ficha nenhuma (as três taxas não têm ficha), e as fichas podem entrar
     depois, todas juntas.

     O que NÃO se faz aqui: adivinhar em silêncio. As fichas são casadas com
     as pessoas por ORDEM, e a ordem de arquivo nem sempre é a ordem que a
     pessoa tem na cabeça. Por isso o par nome↔arquivo aparece na tela para
     conferência antes de emitir, e a divergência de quantidade é dita com
     todas as letras em vez de ser resolvida por conta própria.
     ══════════════════════════════════════════════════════════════════ */

  /** Lê o texto colado e devolve {pessoas, avisos}. Não cria nada. */
  function loteInterpretarTexto(texto) {
    var pessoas = [], avisos = [];
    String(texto || "").split(/\r?\n/).forEach(function (linha, i) {
      var bruta = String(linha || "").trim();
      if (!bruta) return;
      /* Aceita tabulação (colado de planilha), ponto-e-vírgula e vírgula.
         A vírgula vem por último: nome com "JÚNIOR, MARIA" é raro, mas
         separador de planilha é tab, e testar tab primeiro evita quebrar
         um nome que tenha vírgula. */
      var partes = bruta.indexOf("\t") !== -1 ? bruta.split("\t")
                 : bruta.indexOf(";")  !== -1 ? bruta.split(";")
                 : bruta.split(",");
      var nome = String(partes[0] || "").trim();
      var cpfBruto = partes.length > 1 ? somenteDigitos(partes.slice(1).join("")) : "";
      if (!nome) return;
      if (cpfBruto && cpfBruto.length !== 11) {
        avisos.push("Linha " + (i + 1) + " (" + nome + "): CPF com " + cpfBruto.length +
                    " dígitos — será deixado em branco.");
        cpfBruto = "";
      }
      pessoas.push({ nome: nome, cpf: cpfBruto });
    });
    return { pessoas: pessoas, avisos: avisos };
  }

  /* Fila do modal: a pessoa entra uma por vez, e só vira cartão no ofício
   * quando ela confirma. Ficar criando cartão a cada nome digitado
   * espalharia o trabalho pela tela inteira e tiraria a chance de conferir
   * a lista antes. */
  var lotePessoas = [];

  function loteAdicionarPessoa() {
    var iNome = $("loteNome"), iCpf = $("loteCpf");
    var bruto = String((iNome || {}).value || "").trim();
    if (!bruto) { toast("Informe o nome do trabalhador.", "warn"); if (iNome) iNome.focus(); return; }

    /* Colar várias linhas no campo de nome adiciona todas — quem tem a lista
     * pronta na planilha não precisa digitar de novo, e quem digita uma por
     * vez nem percebe que isso existe. */
    var linhas = bruto.split(/\r?\n/).map(function (t) { return t.trim(); }).filter(Boolean);
    var cpfDigitado = somenteDigitos((iCpf || {}).value || "");

    if (linhas.length > 1) {
      var r = loteInterpretarTexto(linhas.join("\n"));
      r.pessoas.forEach(function (p) { lotePessoas.push(p); });
      if (r.avisos.length) toast(r.avisos[0], "warn");
    } else {
      if (cpfDigitado && cpfDigitado.length !== 11) {
        toast("CPF com " + cpfDigitado.length + " dígitos. Deixe em branco ou complete.", "warn");
        if (iCpf) iCpf.focus();
        return;
      }
      lotePessoas.push({ nome: linhas[0], cpf: cpfDigitado });
    }

    if (iNome) iNome.value = "";
    if (iCpf) iCpf.value = "";
    loteRenderizarPrevia();
    if (iNome) iNome.focus();
  }

  function loteRemoverPessoa(indice) {
    lotePessoas.splice(indice, 1);
    loteRenderizarPrevia();
  }

  function loteRenderizarPrevia() {
    var caixa = $("loteTrabalhadoresPreview");
    var btnOk = $("btnConfirmarLoteTrabalhadores");
    if (!caixa) return;
    var r = { pessoas: lotePessoas, avisos: [] };
    var tipoAtual = ($("tipo") && $("tipo").value) || "";
    var limite = oficioLimitePessoas(tipoAtual);
    var jaTem = document.querySelectorAll("#listaTrabalhadores .trabalhador-card").length;
    var totalFinal = jaTem + r.pessoas.length;
    var comCpf = r.pessoas.filter(function (p) { return p.cpf; }).length;

    if (!r.pessoas.length) {
      caixa.innerHTML = '<div style="font-size:12.5px;color:var(--g400);">Nenhum trabalhador adicionado ainda.</div>';
      if (btnOk) { btnOk.disabled = true; btnOk.textContent = "Adicionar"; }
      return;
    }

    var estouro = totalFinal > limite;
    /* Zebra igual à lista de colaboradores do próprio ofício e do cartão de
       trabalhador — mesma linguagem visual dos dois lugares onde a pessoa já
       vê uma lista de gente neste módulo. */
    var linhas = r.pessoas.map(function (p, i) {
      return '<div style="display:flex;align-items:center;gap:10px;padding:8px 12px;font-size:12.5px;' +
        (i % 2 === 0 ? 'background:var(--g50);' : 'background:var(--surface);') + '">' +
        '<span style="width:22px;height:22px;border-radius:7px;background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:800;flex-shrink:0;">' + (i + 1) + '</span>' +
        '<span style="font-weight:700;color:var(--g900);">' + escaparHtmlLote(p.nome) + '</span>' +
        (p.cpf ? '<span style="color:var(--g500);margin-left:auto;font-size:11.5px;">' + formatarCpfLote(p.cpf) + '</span>' : '<span style="margin-left:auto;"></span>') +
        '<button type="button" class="lote-remover" data-i="' + i + '" title="Remover" ' +
        'style="border:none;background:transparent;color:var(--g400);cursor:pointer;font-size:14px;line-height:1;padding:2px 4px;">✕</button>' +
        '</div>';
    }).join("");

    /* Cabeçalho navy com contador dourado: o mesmo par que identifica o bloco
       "Colaborador(es)" no ofício gerado. Quem conferir a prévia reconhece o
       que vai sair no documento. */
    caixa.innerHTML =
      '<div style="border:1px solid var(--g200);border-radius:var(--rad);overflow:hidden;box-shadow:var(--sh-xs);">' +
      '<div style="background:linear-gradient(135deg,var(--navy),var(--navy2));padding:9px 12px;display:flex;align-items:center;gap:8px;">' +
      '<span style="font-size:11px;font-weight:900;color:rgba(255,255,255,.85);text-transform:uppercase;letter-spacing:.08em;">Vai ser adicionado</span>' +
      '<span style="margin-left:auto;background:var(--gold);color:var(--navy);font-size:11px;font-weight:800;padding:2px 9px;border-radius:999px;">' +
        r.pessoas.length + '</span></div>' +
      '<div style="padding:8px 12px;font-size:11.5px;color:var(--g600);border-bottom:1px solid var(--g100);">' +
        comCpf + ' de ' + r.pessoas.length + ' com CPF informado</div>' +
      linhas +
      (r.avisos.length
        ? '<div style="padding:10px 12px;border-top:1px solid var(--g100);background:var(--amber-lt);font-size:12px;color:var(--amber);line-height:1.6;">⚠ ' +
          r.avisos.map(escaparHtmlLote).join('<br>⚠ ') + '</div>'
        : '') +
      (estouro
        ? '<div style="padding:10px 12px;border-top:1px solid var(--g100);background:var(--red-lt);font-size:12px;color:var(--red);font-weight:700;">Excede o limite: ' +
          totalFinal + ' de ' + limite + ' para este tipo de ofício.</div>'
        : '') +
      '</div>';

    caixa.querySelectorAll(".lote-remover").forEach(function (b) {
      b.onclick = function () { loteRemoverPessoa(Number(b.dataset.i)); };
    });

    if (btnOk) {
      btnOk.disabled = estouro;
      btnOk.textContent = "Adicionar " + r.pessoas.length + (r.pessoas.length === 1 ? " ao ofício" : " ao ofício");
    }
  }

  function escaparHtmlLote(t) {
    return String(t == null ? "" : t).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }
  function formatarCpfLote(d) {
    var x = somenteDigitos(d);
    return x.length === 11 ? x.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, "$1.$2.$3-$4") : x;
  }

  /* Lista de escolas dentro do modal.
   *
   * Reaproveita escolasSmartOficio (a base já carregada pela tela) e
   * selecionarEscola() (o caminho que preenche CNPJ, e-mail e o cartão da
   * escola). Repetir essa lógica aqui criaria uma segunda verdade sobre
   * "qual escola está escolhida", e as duas divergiriam. */
  function loteRenderEscolas() {
    var box = $("loteEscolaLista"); if (!box) return;
    var termo = normalizarBusca(($("loteEscolaBusca") || {}).value || "");
    var base = (typeof escolasSmartOficio !== "undefined" && escolasSmartOficio) ? escolasSmartOficio : [];

    /* Sem busca, lista nenhuma. São centenas de escolas; despejar todas aqui
     * empurra as etapas 2 e 3 para fora da tela e obriga a rolar antes de
     * fazer qualquer coisa — que foi exatamente o que apareceu no primeiro
     * desenho. Duas letras já filtram o suficiente. */
    if (termo.length < 2) {
      box.style.display = "none";
      box.innerHTML = "";
      return;
    }

    var lista = base.filter(function (e) {
      return normalizarBusca([e.nome, e.razao, e.cnpj, e.cidade, e.uf, e.cidadeUf].join(" ")).indexOf(termo) >= 0;
    }).slice(0, 5);

    box.style.display = "";
    if (!lista.length) {
      box.innerHTML = '<div class="escola-recentes-empty">' +
        (base.length ? "Nenhuma escola encontrada." : "A lista aparecerá após carregar a base.") + "</div>";
      return;
    }
    box.innerHTML = lista.map(function (e, i) {
      return '<button type="button" class="escola-recente-btn" data-idx="' + i + '">' +
        "<strong>" + escapeHtml(e.nome) + "</strong><span>" +
        escapeHtml([e.cnpj, e.cidadeUf || e.cidade].filter(Boolean).join(" - ")) + "</span></button>";
    }).join("");
    box.querySelectorAll(".escola-recente-btn").forEach(function (btn) {
      btn.onclick = function () {
        selecionarEscola(lista[Number(btn.dataset.idx)]);
        loteMostrarEscolaEscolhida();
        loteRenderizarPrevia();
      };
    });
  }

  function loteMostrarEscolaEscolhida() {
    var faixa = $("loteEscolaSelecionada"); if (!faixa) return;
    var e = (typeof escolaSmartSelecionada !== "undefined") ? escolaSmartSelecionada : null;
    if (!e || !e.nome) { faixa.style.display = "none"; return; }
    faixa.style.display = "block";
    faixa.textContent = "✓ " + e.nome + (e.cnpj ? "  ·  CNPJ " + e.cnpj : "") +
      ((emailSmartSelecionado || e.emailPrincipal) ? "  ·  " + (emailSmartSelecionado || e.emailPrincipal) : "");
    var lista = $("loteEscolaLista"); if (lista) lista.style.display = "none";
  }

  /* Só a Taxa Assistencial precisa desta linha.
   *
   * Eu tinha mostrado ela também na Taxa Negocial, e o usuário viu duas
   * linhas de modo empilhadas na tela. O motivo: "Oposição à Taxa Negocial"
   * NÃO é um tipo próprio na aba de tipos — é uma variante da Taxa
   * Negocial, e o bloco dela (blocoOposicaoTaxaIA) já aparece quando esse
   * tipo é escolhido, com "Preencher manualmente", "Extrair de carta de
   * oposição (IA)" e agora "Via lote". Ou seja, a Taxa Negocial já tinha a
   * sua linha; quem não tinha era só a Assistencial. */
  /** Mostra/esconde a área de ficha dos cartões conforme o tipo escolhido. */
  /* O campo de ficha FICA, em todo tipo de ofício.
   *
   * Eu havia escondido nas três taxas, com o argumento de que ali não há
   * ficha. O argumento estava incompleto e o usuário pegou: "não tem a ficha
   * do trabalhador no modo individual, você tirou?".
   *
   * O furo: "Oposição à Taxa Negocial" NÃO é um tipo próprio no seletor —
   * roda dentro de "Taxa Negocial". E na oposição existe documento: a carta
   * de oposição, que o próprio texto do ofício cita como "conforme carta em
   * anexo". Esconder o campo por tipo deixava a oposição sem onde anexar a
   * prova dela.
   *
   * Como anexar ficha não é mais obrigatório em lugar nenhum, um campo
   * opcional a mais custa espaço; um campo ausente custa uma emissão que não
   * dá para fazer. Fica visível. */
  /* ═══════════════════════════════════════════════════════════════
     PADRÃO ÚNICO DE PREENCHIMENTO — INDIVIDUAL, LOTE E IA
     ═══════════════════════════════════════════════════════════════

     Pedido do usuário em 18/08/2026: "independente se é taxa negocial, taxa
     assistencial, ofício livre, tem dois formatos: individual e em lote, ou
     outro através da IA pra leitura... essa sequência é um padrão único".

     A diferença entre os três é UMA só: onde mora a ficha.

       individual → uma ficha por trabalhador, dentro do cartão
       lote       → nenhuma no cartão; um PDF único no fim (o escaneado
                    da escola costuma vir num arquivo só)
       ia         → o documento lido é a própria prova

     Escola, nomes, CPF, limite de 50, revisão, emissão, e as quatro ações
     finais (baixar, imprimir, e-mail, WhatsApp) são o MESMO caminho nos
     três. É isso que faz o padrão ser único de verdade, em vez de três
     fluxos parecidos que divergem com o tempo.

     No modo individual o bloco do PDF do ofício continua visível: anexar
     nunca é obrigatório, e um campo opcional a mais custa espaço enquanto
     um campo ausente custa uma emissão que não dá para fazer. */
  var MODO_OFICIO_ATUAL = "individual";

  function oficioModoAtual() { return MODO_OFICIO_ATUAL; }

  function oficioSetModo(modo) {
    MODO_OFICIO_ATUAL = (modo === "lote" || modo === "ia") ? modo : "individual";

    var mapa = { individual: "btnModoIndividual", lote: "btnModoLote", ia: "btnModoIAUnico" };
    Object.keys(mapa).forEach(function (m) {
      var btn = $(mapa[m]); if (!btn) return;
      btn.classList.toggle("btn-navy",   m === MODO_OFICIO_ATUAL);
      btn.classList.toggle("btn-outline", m !== MODO_OFICIO_ATUAL);
    });

    var ajuda = $("modoOficioAjuda");
    if (ajuda) {
      ajuda.innerHTML = MODO_OFICIO_ATUAL === "lote"
        ? "Adicione os trabalhadores um a um e anexe <strong>um PDF único</strong> com todas as fichas da escola, no fim. A quantidade de fichas não precisa bater com a de pessoas."
        : MODO_OFICIO_ATUAL === "ia"
        ? "Anexe o documento escaneado ou a foto. A IA <strong>sugere</strong> os dados; nada é gravado antes de você conferir."
        : "Um cartão por trabalhador, cada um com a sua ficha. O <strong>CPF é opcional</strong>.";
    }

    /* A ficha por trabalhador só faz sentido no individual. No lote ela sai
       de cena — foi o pedido: "em lote eu não preciso ficha". */
    var mostrarFichaCartao = (MODO_OFICIO_ATUAL === "individual");
    document.querySelectorAll("#listaTrabalhadores .trabalhador-ficha-area")
      .forEach(function (a) { a.style.display = mostrarFichaCartao ? "" : "none"; });

    var blocoPdf = $("blocoFichasOficio");
    if (blocoPdf) blocoPdf.style.display = (MODO_OFICIO_ATUAL === "ia") ? "none" : "block";

    /* Cada tipo tem a sua área de leitura por IA; abre só a do tipo atual. */
    var tipo = ($("tipo") && $("tipo").value) || "";
    var areasIA = { "Filiação": "filIA_areaUpload", "Desfiliação": "desfIA_areaUpload", "Oposição à Taxa Negocial": "oposIA_areaUpload" };
    Object.keys(areasIA).forEach(function (t) {
      var area = $(areasIA[t]); if (!area) return;
      area.style.display = (MODO_OFICIO_ATUAL === "ia" && t === tipo) ? "block" : "none";
    });

    var secaoPadrao = $("secaoOficioPadrao");
    if (secaoPadrao && tipo !== "Ofício Livre") {
      secaoPadrao.style.display = (MODO_OFICIO_ATUAL === "ia") ? "none" : "";
    }

    if (MODO_OFICIO_ATUAL === "lote") loteAbrirModal();
  }
  window.oficioSetModo   = oficioSetModo;
  window.oficioModoAtual = oficioModoAtual;

  /* Ofício Livre é a exceção, e o usuário foi explícito: "vamos enviar um
     ofício pro governo do estado, vou enviar um ofício para secretaria de
     saúde — usa um padrão de ofício, mas o texto é livre". Papel timbrado e
     número sequencial sim; escola, trabalhadores e os três modos, não.

     Até 18/08/2026 esse tipo estava INUTILIZÁVEL: secaoOficioLivre nascia
     display:none e nenhum arquivo do projeto a abria (procurei nos 205).
     Quem escolhia Ofício Livre via a tela de escola, não tinha onde
     escrever, e o backend recusava com "Destinatário é obrigatório". */
  function oficioAtualizarPorTipo() {
    var tipo = ($("tipo") && $("tipo").value) || "";
    var ehLivre = (tipo === "Ofício Livre");

    var secaoLivre  = $("secaoOficioLivre");
    var secaoPadrao = $("secaoOficioPadrao");
    var blocoModos  = $("blocoModosOficio");

    if (secaoLivre)  secaoLivre.style.display  = ehLivre ? "block" : "none";
    if (secaoPadrao) secaoPadrao.style.display = ehLivre ? "none"  : "";
    if (blocoModos)  blocoModos.style.display  = (ehLivre || !tipo) ? "none" : "block";

    /* IA só onde existe documento para ler. Em Taxa Assistencial não há
       carta nem ficha: botão que não faz nada confunde mais do que ajuda. */
    var btnIA = $("btnModoIAUnico");
    if (btnIA) {
      var temIA = (tipo === "Filiação" || tipo === "Desfiliação" || tipo === "Oposição à Taxa Negocial");
      btnIA.style.display = temIA ? "" : "none";
      if (!temIA && MODO_OFICIO_ATUAL === "ia") MODO_OFICIO_ATUAL = "individual";
    }

    if (!ehLivre) oficioSetModo(MODO_OFICIO_ATUAL === "lote" ? "individual" : MODO_OFICIO_ATUAL);
    atualizarRecomendacaoCpf();
  }
  window.oficioAtualizarPorTipo = oficioAtualizarPorTipo;

  /* Mantido para quem ainda chama pelo nome antigo. */
  function atualizarAreasFichaPorTipo() { oficioSetModo(MODO_OFICIO_ATUAL); }

  /* AVISO DE OFÍCIO REPETIDO — modal do sistema, não o confirm() do navegador.
   *
   * O usuário mandou a foto da caixa cinza do Chrome, com o cabeçalho "Uma
   * página incorporada em ...googleusercontent.com diz". Além de não ser do
   * sistema, ela despeja escola, número e data num parágrafo só: para achar
   * o número do ofício é preciso ler a frase inteira. Aqui cada dado tem sua
   * linha, e os botões dizem o que fazem no lugar de OK/Cancelar.
   *
   * Recebe a resposta crua do backend (res.duplicata + res.mensagem). Se por
   * qualquer motivo o modal não existir na página, cai no confirm() do
   * navegador — feio, mas emitir ofício não pode parar por causa de markup
   * faltando. */
  function abrirModalDuplicata(res, aoConfirmar, aoCancelar) {
    var info    = (res && res.duplicata) || {};
    var overlay = $("modalDuplicataOficio");

    if (!overlay) {
      var texto = (res && res.mensagem) || "Possível ofício duplicado detectado.";
      if (window.confirm(texto + "\n\nDeseja gerar mesmo assim?")) aoConfirmar();
      else if (aoCancelar) aoCancelar();
      return;
    }

    function escreve(id, valor) { var e = $(id); if (e) e.textContent = valor; }
    escreve("dupEscola", info.escola || "—");
    escreve("dupTipo",   info.tipo   || (($("tipo") && $("tipo").value) || "—"));
    escreve("dupNumero", info.numeroExistente || "—");
    escreve("dupData",   info.dataExistente   || "—");

    /* Quantos saíram na janela. Com três emissões no dia, saber que são três
       muda a leitura: não é "esqueci que emiti", é "alguém está repetindo". */
    var qtd  = Number(info.quantidade || 0);
    var elQt = $("dupQuantidade");
    if (elQt) {
      if (qtd > 1) {
        elQt.textContent = "São " + qtd + " ofícios deste tipo para esta escola nas últimas 24 horas.";
        elQt.style.display = "block";
      } else {
        elQt.style.display = "none";
      }
    }
    escreve("dupSubtitulo", info.escola ? info.escola : "Confira se não é o mesmo caso");

    var btnOk  = $("btnConfirmarDuplicata");
    var btnNao = $("btnCancelarDuplicata");
    var btnX   = $("btnFecharDuplicata");

    function fechar() {
      overlay.classList.remove("aberto");
      document.removeEventListener("keydown", aoTeclar);
    }
    function recusar() { fechar(); if (aoCancelar) aoCancelar(); }
    function aceitar() { fechar(); aoConfirmar(); }
    function aoTeclar(ev) { if (ev.key === "Escape") recusar(); }

    /* onclick (e não addEventListener) de propósito: o modal é reaberto a
       cada emissão e um listener acumulado dispararia a emissão duas vezes. */
    if (btnOk)  btnOk.onclick  = aceitar;
    if (btnNao) btnNao.onclick = recusar;
    if (btnX)   btnX.onclick   = recusar;
    overlay.onclick = function(ev) { if (ev.target === overlay) recusar(); };
    document.addEventListener("keydown", aoTeclar);

    overlay.classList.add("aberto");
  }
  window.abrirModalDuplicata = abrirModalDuplicata;

  function loteAbrirModal() {
    var ov = $("modalLoteTrabalhadores"); if (!ov) return;
    lotePessoas = [];
    var iNome = $("loteNome"); if (iNome) iNome.value = "";
    var iCpf = $("loteCpf"); if (iCpf) iCpf.value = "";
    var fi = $("loteFichasInput"); if (fi) fi.value = "";
    var res = $("loteFichasResumo"); if (res) res.textContent = "";
    var busca = $("loteEscolaBusca"); if (busca) busca.value = "";
    var box = $("loteEscolaLista"); if (box) { box.style.display = "none"; box.innerHTML = ""; }
    loteRenderEscolas();
    loteMostrarEscolaEscolhida();
    loteRenderizarPrevia();
    ov.classList.add("aberto");
    if (iNome) iNome.focus();
  }
  function loteFecharModal() {
    var ov = $("modalLoteTrabalhadores"); if (ov) ov.classList.remove("aberto");
  }

  function loteConfirmar() {
    var r = { pessoas: lotePessoas };
    if (!r.pessoas.length) { toast("Adicione ao menos um trabalhador.", "warn"); return; }
    /* Escola primeiro: sem ela o ofício não tem destinatário, e descobrir
     * isso só na hora de emitir faria a pessoa refazer a lista.
     *
     * A checagem olha os CAMPOS DA TELA — os mesmos que a emissão valida —
     * e não uma variável interna. Estado guardado em variável privada tende
     * a divergir do que a pessoa está vendo, e aí a tela recusa mostrando
     * uma escola escolhida na frente dela. */
    var nomeEscolaTela = txt(($("escolaBusca") || {}).value || "");
    var cnpjTela = somenteDigitos(($("cnpj") || {}).value || "");
    var escolaOk = !!nomeEscolaTela && !ehOpcaoPlaceholder(nomeEscolaTela) && cnpjTela.length === 14;
    if (!escolaOk) { toast("Escolha a escola antes de adicionar os trabalhadores.", "warn"); return; }
    var lista = $("listaTrabalhadores"); if (!lista) return;
    var vazio = lista.querySelector(".worker-empty"); if (vazio) vazio.remove();

    /* O lote APROVEITA os cartões em branco que já estão na tela antes de
       criar novos — sugestão do usuário em 18/08/2026: "quando for em lote
       ele deveria mudar o card de trabalhador acima e não criar outro".
       Ele está certo. A tela nasce com um cartão vazio; sem isto o lote
       empilhava os nomes DEPOIS dele, e o ofício saía com um "Trabalhador 1"
       em branco no meio da lista — ou pior, com um beneficiário sem nome
       barrando a emissão por um cartão que a pessoa nem preencheu. */
    function cartoesEmBranco() {
      return Array.prototype.filter.call(
        lista.querySelectorAll(".trabalhador-card"),
        function (c) {
          var n = c.querySelector(".input-nome-trabalhador");
          var f = c.querySelector(".input-cpf-trabalhador");
          return (!n || !txt(n.value)) && (!f || !somenteDigitos(f.value));
        });
    }
    var vagos = cartoesEmBranco();

    r.pessoas.forEach(function (p) {
      var card = vagos.shift();
      if (!card) { card = criarCardTrabalhador(); lista.appendChild(card); }
      var iNome = card.querySelector(".input-nome-trabalhador");
      var iCpf  = card.querySelector(".input-cpf-trabalhador");
      if (iNome) iNome.value = p.nome;
      if (iCpf && p.cpf) { iCpf.value = formatarCpfLote(p.cpf); }
    });

    renumerarTrabalhadores();
    atualizarResumoTrabalhadores();

    /* As fichas escolhidas no modal entram pelo mesmo caminho do botão
     * "Fichas em lote" — inclusive a regra de distribuir uma por pessoa
     * quando as quantidades coincidem. */
    /* As fichas escolhidas no modal vão para o bloco do OFÍCIO, não para os
     * cartões: o caso normal é um PDF único da escola, que não pertence a
     * uma pessoa. Quem quiser uma ficha por pessoa continua anexando no
     * cartão de cada uma. */
    var fi = $("loteFichasInput");
    var destino = $("fichasOficioLote");
    if (fi && fi.files && fi.files.length && destino) {
      var dt = new DataTransfer();
      Array.prototype.slice.call(fi.files).forEach(function (f) { dt.items.add(f); });
      destino.files = dt.files;
      destino.dispatchEvent(new Event("change"));
    }

    loteFecharModal();
    toast(r.pessoas.length + (r.pessoas.length === 1 ? " pessoa adicionada" : " pessoas adicionadas") +
          ". Confira os cartões antes de emitir.", "ok");
  }

  /** Distribui as fichas escolhidas, uma por pessoa, na ordem dos cartões. */
  function loteDistribuirFichas(arquivos) {
    var cards = Array.prototype.slice.call(
      document.querySelectorAll("#listaTrabalhadores .trabalhador-card"));
    if (!cards.length) { toast("Adicione as pessoas antes de anexar as fichas.", "warn"); return; }

    var lista = Array.prototype.slice.call(arquivos || []);
    /* Ordem alfabética do NOME DO ARQUIVO. O navegador entrega os arquivos
     * na ordem em que o sistema operacional listou, que não é confiável. */
    lista.sort(function (a, c) { return a.name.localeCompare(c.name, "pt-BR"); });

    /* A quantidade NÃO precisa bater com a de pessoas.
     *
     * O usuário apontou o caso real: "geralmente quando você escaneia, vem
     * um arquivo só com todas as fichas". Exigir uma ficha por pessoa
     * recusaria justamente o formato mais comum na secretaria. Quando as
     * quantidades coincidem, distribui uma para cada — dá para nomear cada
     * anexo com a pessoa certa. Quando não coincidem, todas vão para o
     * primeiro cartão como um lote só, e o backend numera os anexos em vez
     * de inventar de quem é cada um. */
    if (lista.length === cards.length) {
      cards.forEach(function (card, i) {
        var input = card.querySelector(".input-ficha-trabalhador");
        if (!input) return;
        var dt = new DataTransfer();
        dt.items.add(lista[i]);
        input.files = dt.files;
        /* Dispara o mesmo caminho do anexo individual — renomeia o arquivo
         * com o nome da pessoa, atualiza o contador e sincroniza o pool
         * global. Reaproveitar evita que os dois caminhos divirjam. */
        input.dispatchEvent(new Event("change"));
      });
      toast(lista.length + " fichas distribuídas, uma por pessoa. Confira cada cartão.", "ok");
      return;
    }

    var inputLote = cards[0].querySelector(".input-ficha-trabalhador");
    if (!inputLote) return;
    var dtLote = new DataTransfer();
    lista.forEach(function (f) { dtLote.items.add(f); });
    inputLote.files = dtLote.files;
    inputLote.dispatchEvent(new Event("change"));
    toast(lista.length + (lista.length === 1 ? " arquivo anexado" : " arquivos anexados") +
          " para " + cards.length + " pessoas. Como as quantidades diferem, foram anexados " +
          "como lote — confira antes de emitir.", "ok");
  }

  /** Existe pelo menos uma ficha anexada, em qualquer cartão? */
  function todosArquivosTemAlgumaFicha() {
    var oficio = $("fichasOficioLote");
    if (oficio && oficio.files && oficio.files.length) return true;
    var cards = document.querySelectorAll("#listaTrabalhadores .trabalhador-card");
    for (var i = 0; i < cards.length; i++) {
      var c = cards[i];
      if (c._fichasDrive && c._fichasDrive.length) return true;
      var inp = c.querySelector(".input-ficha-trabalhador");
      if (inp && inp.files && inp.files.length) return true;
    }
    return false;
  }

  function adicionarTrabalhadorDepois(referencia) {
    var l = $("listaTrabalhadores"); if (!l) return;
    var _tipoAtual = ($("tipo") && $("tipo").value) || "";
    var _limite = oficioLimitePessoas(_tipoAtual);
    if (l.querySelectorAll(".trabalhador-card").length >= _limite) { toast("Limite de " + _limite + " trabalhadores para este tipo de ofício.", "warn"); return; }
    var v = l.querySelector(".worker-empty"); if (v) v.remove();
    var novo = criarCardTrabalhador();
    if (referencia && referencia.parentNode === l) l.insertBefore(novo, referencia.nextSibling);
    else l.appendChild(novo);
    renumerarTrabalhadores();
    atualizarResumoTrabalhadores();
    var nome = novo.querySelector(".input-nome-trabalhador");
    if (nome && typeof nome.focus === "function") nome.focus();
    return novo;
  }

  function addTrabalhador() {
    return adicionarTrabalhadorDepois(null);
  }

function atualizarContadorFichas() {
  var cont = $("contadorFichas");
  if (!cont) return;

  var total = getFichasPayload().length;

  cont.textContent = total + " / 25 fichas";
  cont.style.display = total > 0 ? "flex" : "none";
  cont.style.cssText =
    "margin-top:12px;" +
    "display:" + (total > 0 ? "flex" : "none") + ";" +
    (
      total > 25
        ? "color:var(--red);border-color:#fca5a5;background:var(--red-lt);"
        : "color:var(--g600);border-color:var(--g200);background:var(--g50);"
    );

  atualizarPreviewFichas();
  atualizarPayloadOficio();

  if (typeof autoSave === "function") autoSave();
}


 function getFichasPayload() {
  var lista = $("listaTrabalhadores");
  if (!lista) return [];

  var cards = Array.from(lista.querySelectorAll(".trabalhador-card"));
  var trabalhadores = getTrabalhadoresPayload();
  var fichas = [];

  /* Fichas do OFÍCIO — o PDF único da escola, que não pertence a ninguém em
   * particular. Entram primeiro e sem beneficiário: o backend nomeia esses
   * anexos por escola e data, em vez de inventar de quem é cada um. */
  var inputOficio = $("fichasOficioLote");
  if (inputOficio && inputOficio.files && inputOficio.files.length) {
    Array.from(inputOficio.files).forEach(function (f) {
      fichas.push({
        ordem: fichas.length + 1,
        arquivoOriginal: f.name,
        arquivoSugerido: f.name,
        beneficiario: "",
        cpf: "",
        arquivo: f
      });
    });
  }

  cards.forEach(function(card, idxCard) {
    var trab = trabalhadores[idxCard] || {};

    var inputFicha = card.querySelector(".input-ficha-trabalhador");

    if (inputFicha && inputFicha.files && inputFicha.files.length) {
      Array.from(inputFicha.files).forEach(function(f) {
        fichas.push({
          ordem: fichas.length + 1,
          arquivoOriginal: f.name,
          arquivoSugerido: f.name,
          beneficiario: trab.nome || "",
          cpf: trab.cpf || "",
          cpfNumerico: trab.cpfNumerico || "",
          origem: "local",
          tipo: f.type || "application/pdf"
        });
      });
    }

    if (card._fichasDrive && card._fichasDrive.length) {
      card._fichasDrive.forEach(function(f) {
        fichas.push({
          ordem: fichas.length + 1,
          arquivoOriginal: f.nome || "",
          arquivoSugerido: f.nome || "",
          beneficiario: trab.nome || "",
          cpf: trab.cpf || "",
          cpfNumerico: trab.cpfNumerico || "",
          origem: "drive",
          driveId: f.id || f.driveId || "",
          tipo: f.tipo || "application/pdf"
        });
      });
    }
  });

  return fichas;
}

  function renomearFichasNoInput() {
    var inp = $("fichas"); if (!inp || !inp.files || !inp.files.length || typeof DataTransfer === "undefined") return;
    var p = getFichasPayload(), dt = new DataTransfer();
    Array.from(inp.files).forEach(function(f, i) {
      var n = p[i] ? p[i].arquivoSugerido : f.name;
      try { dt.items.add(new File([f], n, { type: f.type, lastModified: f.lastModified })); } catch(e) { dt.items.add(f); }
    });
    inp.files = dt.files;
  }

  function removerFicha(idx) {
    var inp = $("fichas"); if (!inp || !inp.files) return;
    if (!window._fichasAcumuladas) { window._fichasAcumuladas = new DataTransfer(); Array.from(inp.files).forEach(function(f) { window._fichasAcumuladas.items.add(f); }); }
    var nova = new DataTransfer();
    Array.from(window._fichasAcumuladas.files).forEach(function(f, i) { if (i !== idx) nova.items.add(f); });
    window._fichasAcumuladas = nova; inp.files = window._fichasAcumuladas.files; atualizarContadorFichas();
  }

  function atualizarPreviewFichas() { var prev = $("previewFichas"); if (prev) prev.innerHTML = ""; }
  function prepararFichasAntesDeEmitir() { sincronizarFichasGlobais(); renomearFichasNoInput(); atualizarPreviewFichas(); atualizarPayloadOficio(); }

  /* ─────────────────────────────────────────────
     PREVIEW, EMISSÃO, RESET
  ────────────────────────────────────────────── */
  function previewOficio(){
    var d=atualizarPayloadOficio();
    if(!d.tipo) return toast("Selecione o tipo do ofício.","warn");

    if(d.tipo!=="Ofício Livre"&&!d.beneficiarios.length) return toast("Adicione pelo menos um trabalhador.","warn");
    var novaAba=window.open("","_blank");
    if(!novaAba) return toast("Pop-up bloqueado pelo navegador.","warn");
    var payload = d.tipo==="Ofício Livre"
      ? {tipo:d.tipo, para:$("para")&&$("para").value, cargo:$("cargo")&&$("cargo").value, assunto:$("assunto")&&$("assunto").value, corpo:$("corpo")&&$("corpo").value, email:$("emailLivreAux")&&$("emailLivreAux").value}
      : {tipo:d.tipo, escola:d.escola.nome, cnpj:d.escola.cnpj, email:d.escola.email, endereco:d.escola.endereco, colaboradores:d.beneficiarios.map(function(b){return {nome:b.nome, cpf:b.cpf};})};
    google.script.run
      .withSuccessHandler(function(html){ novaAba.document.open(); novaAba.document.write(html); novaAba.document.close(); })
      .withFailureHandler(function(err){ try{novaAba.close();}catch(_){} toast("Erro ao gerar preview: "+((err&&err.message)||err),"err"); })
      .previewOficioWeb(payload, SISGEP_TOKEN_SESSAO);

  function gerarOficio(){
    var d=atualizarPayloadOficio();
    if(!d.tipo) return toast("Selecione o tipo.","warn");
    if(d.tipo!=="Ofício Livre"){
      if(!d.escola.nome||ehOpcaoPlaceholder(d.escola.nome)) return toast("Selecione uma escola.","warn");
      if(!d.escola.cnpj||somenteDigitos(d.escola.cnpj).length!==14) return toast("CNPJ inválido.","warn");
      if(!d.escola.email) return toast("Informe o e-mail.","warn");
      if(!d.beneficiarios.length) return toast("Adicione trabalhadores.","warn");
      if(d.beneficiarios.some(function(b){return !b.nome;})) return toast("Complete o nome do trabalhador.","warn");
      /* CPF NAO trava mais a emissao, em tipo nenhum. Eu havia criado
         oficioExigeCpf() devolvendo false e esquecido de ligar aqui: a tela
         dizia "(opcional)" no rotulo e o botao recusava com "Complete nome e
         CPF". O usuario pegou pelo print. Vale a razao que ele deu: "muita
         gente nao sabe nem o proprio CPF" — o oficio precisa sair. */
      if(oficioExigeCpf(d.tipo)&&d.beneficiarios.some(function(b){return !b.cpf;})) return toast("Complete o CPF.","warn");
      if(d.beneficiarios.length>oficioLimitePessoas(d.tipo)) return toast("Limite de "+oficioLimitePessoas(d.tipo)+" trabalhadores para este tipo.","warn");
    } else {
      /* Guardas MORTAS até 18/08/2026: a condição era `!$("x") && $("x").value`,
         que só seria verdadeira se o elemento não existisse — e aí o segundo
         termo estouraria. Na prática nunca avisava nada: o atendente clicava
         em emitir e recebia o erro cru do servidor ("Destinatário é
         obrigatório"), sem saber qual campo faltava. */
      var _val = function (id) { var e = $(id); return e ? String(e.value || "").trim() : ""; };
      if(!_val("para"))          return toast("Informe o destinatário.","warn");
      if(!_val("assunto"))       return toast("Informe o assunto do ofício.","warn");
      if(!_val("corpo"))         return toast("Informe o corpo do ofício.","warn");
      if(!_val("emailLivreAux")) return toast("Informe o e-mail do destinatário.","warn");
    }

    var btn=$("btnEmitir"), etapas=["⏳ Iniciando...","📄 Gerando...","🖨 PDF...","📧 Enviando...","💾 Registrando..."];
    var etapa=0, timer=setInterval(function(){etapa=Math.min(etapa+1,etapas.length-1);if(btn)btn.innerText=etapas[etapa];},8000);
    if(btn){btn.disabled=true;btn.innerText=etapas[0];}

    function aoSucesso(res){ clearInterval(timer); if(btn){btn.disabled=false;btn.innerText="✅ Emitir Documento;"} if(res&&res.erro) return toast(res.mensagem||"Erro ao emitir.","err"); finalizarPosEmissao(res.dados || {}); }
    function aoErro(err){ clearInterval(timer); if(btn){btn.disabled=false;btn.innerText="✅ Emitir Documento";} toast("Erro: "+((err&&err.message)||err),"err"); }

    // Envia gerarOficioWeb; se o servidor avisar de uma possível duplicata
    // (achado #4), pergunta ao atendente e, se confirmado, reenvia o mesmo
    // payload com confirmarDuplicata:true (sem re-processar fichas já lidas).
    function enviarGerarOficio(payload){
      google.script.run.withSuccessHandler(function(res){
        if (res && res.duplicataDetectada) {
          window.abrirModalDuplicata(res, function() {
            payload.confirmarDuplicata = true;
            enviarGerarOficio(payload);
          }, function() {
            clearInterval(timer); if(btn){btn.disabled=false;btn.innerText="✅ Emitir Documento";}
            toast("Emissão cancelada — ofício não gerado.","warn");
          });
          return;
        }
        aoSucesso(res);
      }).withFailureHandler(aoErro).gerarOficioWeb(payload, SISGEP_TOKEN_SESSAO);
    }

    if(d.tipo==="Ofício Livre"){
      enviarGerarOficio({ tipo:d.tipo, para:$("para")&&$("para").value, cargo:$("cargo")&&$("cargo").value, assunto:$("assunto")&&$("assunto").value, corpo:$("corpo")&&$("corpo").value, email:$("emailLivreAux")&&$("emailLivreAux").value });
      return;
    }

    /* Basta UMA ficha no ofício, não uma por pessoa — o escaneado costuma
     * vir num arquivo só. Antes exigia-se ficha em cada cartão. */
    var cards = document.querySelectorAll("#listaTrabalhadores .trabalhador-card");
    if (oficioExigeFichaECpf(d.tipo) && !todosArquivosTemAlgumaFicha()) {
      return aoErro(new Error("Anexe ao menos uma ficha para emitir este ofício."));
    }
    for (var i = 0; false && i < d.beneficiarios.length; i++) {
      var card = cards[i];
      var temDrive = card && card._fichasDrive && card._fichasDrive.length > 0;
      var fichaInpCheck = card && card.querySelector(".input-ficha-trabalhador");
      var temLocal = fichaInpCheck && fichaInpCheck.files && fichaInpCheck.files.length > 0;
      if (!temDrive && !temLocal) return aoErro(new Error('Trabalhador "' + d.beneficiarios[i].nome + '" sem ficha vinculada.'));
    }

    var todosArquivos = [];

    /* O PDF ÚNICO DO OFÍCIO ENTRA PRIMEIRO.
     *
     * Defeito medido em 18/08/2026, com o usuário reportando "a ficha não
     * está indo junto ao ofício no e-mail". A varredura abaixo lia SÓ os
     * cartões dos trabalhadores — o campo "Fichas do ofício"
     * (#fichasOficioLote), onde ele anexa o escaneado de todas as cartas da
     * escola, não era lido por ninguém na hora de emitir. O arquivo ficava
     * no navegador e o e-mail saía com o ofício sozinho, sem erro nenhum.
     *
     * getFichasPayload() já lia esse campo, mas só alimenta o painel de
     * revisão; quem monta o que vai para o backend é este trecho. Duas
     * leituras do mesmo campo, uma delas sem consumidor. */
    var inputFichasOficio = $("fichasOficioLote");
    if (inputFichasOficio && inputFichasOficio.files) {
      Array.from(inputFichasOficio.files).forEach(function (f) { todosArquivos.push(f); });
    }

    document.querySelectorAll("#listaTrabalhadores .trabalhador-card").forEach(function(card) {
      if (card._fichasDrive && card._fichasDrive.length) {
        card._fichasDrive.forEach(function(f) { todosArquivos.push({ _isDrive: true, driveId: f.id, nome: f.nome, tipo: f.tipo }); });
      } else {
        var fichaInp = card.querySelector(".input-ficha-trabalhador");
        if (fichaInp && fichaInp.files) Array.from(fichaInp.files).forEach(function(f) { todosArquivos.push(f); });
      }
    });

    Promise.all(todosArquivos.map(function(f) {
      if (f._isDrive) {
        return new Promise(function(resolve, reject) {
          google.script.run.withSuccessHandler(function(res) { resolve({ nome: res.nome, base64: res.base64, tipo: res.tipo, origem: "drive" }); }).withFailureHandler(function(err) { reject(err); }).obterArquivoDriveBase64(f.driveId, SISGEP_TOKEN_SESSAO);
        });
      }
      return new Promise(function(resolve, reject) {
        var reader = new FileReader();
        reader.onload = function(e) { var base64 = e.target.result.split(",")[1]; resolve({ nome: f.name, base64: base64, tipo: f.type || "application/pdf" }); };
        reader.onerror = function() { reject(new Error("Erro ao ler arquivo: " + f.name)); };
        reader.readAsDataURL(f);
      });
    })).then(function(fichasBase64) {
      enviarGerarOficio({
        tipo:d.tipo, escola:d.escola.nome, cnpj:d.escola.cnpj, email:d.escola.email, endereco:d.escola.endereco,
        colaboradores:d.beneficiarios.map(function(b){return {nome:b.nome, cpf:b.cpf};}),
        cpfs:d.beneficiarios.map(function(b){return b.cpf;}),
        fichas:fichasBase64
      });
    }).catch(function(err){ aoErro(err); });
  }

        + "<span>🕐</span><span>Aguardando confirmação de envio...</span></div>"
        + "</div>";
    }

    if (!$("sisgepToastStyle")) { var st=document.createElement("style"); st.id="sisgepToastStyle"; st.textContent="@keyframes slideUp{from{opacity:0;transform:translateX(-50%) translateY(16px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}"; document.head.appendChild(st); }

    toastEl.innerHTML = "<div style='flex:1;'><div style='margin-bottom:4px;font-size:13.5px;'>✅ <strong>Ofício " + (numero || "") + " gerado!</strong></div><div style='font-size:11px;color:rgba(255,255,255,.65);line-height:1.4;'>PDF salvo no Drive. Use os botões abaixo para enviar ou baixar.</div></div>"
      + "<button id='toastOficioFechar' style='background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.22);color:#fff;padding:6px 14px;border-radius:999px;cursor:pointer;font-size:12px;font-weight:700;white-space:nowrap;'>OK</button>";
    document.body.appendChild(toastEl);
    var btnFechar=$("toastOficioFechar"); if(btnFechar) btnFechar.onclick=function(){ if(toastEl.parentNode) toastEl.parentNode.removeChild(toastEl); };
    setTimeout(function(){ if(toastEl&&toastEl.parentNode) toastEl.parentNode.removeChild(toastEl); }, 8000);
