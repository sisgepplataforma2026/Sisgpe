  /* ─────────────────────────────────────────────
     TAXA ASSISTENCIAL — CONTROLES DA TELA

     O HTML já expunha todos os botões, mas nenhum deles chamava o backend.
     Este bloco mantém o fluxo existente (prévia, teste, fila e envio PRO),
     sempre com o token da sessão e com confirmação antes de um envio real.
  ────────────────────────────────────────────── */
  function taxaValor(id) {
    var campo = $(id);
    return campo ? txt(campo.value) : "";
  }

  function taxaPayloadMensagem() {
    return {
      assunto: taxaValor("taxaAssistencialAssunto"),
      corpo: taxaValor("taxaAssistencialCorpo")
    };
  }

  function taxaMensagemErro(err) {
    return String((err && err.message) || err || "Erro não identificado.");
  }

  function taxaOcuparBotao(btn, ocupado, textoOcupado) {
    if (!btn) return;
    if (!btn.dataset.rotuloOriginal) btn.dataset.rotuloOriginal = btn.innerHTML;
    btn.disabled = !!ocupado;
    btn.innerHTML = ocupado ? (textoOcupado || "⏳ Aguarde...") : btn.dataset.rotuloOriginal;
  }

  function taxaValidarMensagem(payload) {
    if (!payload.assunto) { toast("Informe o assunto do e-mail.", "warn"); return false; }
    if (!payload.corpo) { toast("Informe o corpo do e-mail.", "warn"); return false; }
    return true;
  }

  function taxaRenderStatus(resp) {
    resp = resp || {};
    var painel = $("painelStatusFila");
    if (painel) painel.style.display = Number(resp.total || 0) > 0 ? "block" : "none";
    [["statusFilaNumero", resp.numero || "—"], ["statusTotal", resp.total || 0],
      ["statusPendente", resp.pendente || 0], ["statusEnviado", resp.enviado || resp.enviados || 0],
      ["statusErro", resp.erro || resp.erros || 0]].forEach(function(item) {
        var no = $(item[0]); if (no) no.textContent = String(item[1]);
      });
    var iniciar = $("btnIniciarEnvioTaxa");
    if (iniciar) iniciar.disabled = !(Number(resp.pendente || 0) > 0 || resp.preparada === true);
    if (window.taxaProgresso && typeof window.taxaProgresso.atualizar === "function") {
      window.taxaProgresso.atualizar(resp);
    }
  }

  function taxaConsultarStatus() {
    google.script.run
      .withSuccessHandler(taxaRenderStatus)
      .withFailureHandler(function(err) { toast("Erro ao consultar a fila: " + taxaMensagemErro(err), "err", 6000); })
      .obterStatusFilaTaxaAssistencial(SISGEP_TOKEN_SESSAO);
  }

  function taxaLerAnexo(callback) {
    var input = $("taxaAnexoCCT");
    var arquivo = input && input.files && input.files[0];
    if (!arquivo) { callback(null); return; }
    var reader = new FileReader();
    reader.onload = function(ev) {
      callback({ nome: arquivo.name, tipo: arquivo.type || "application/octet-stream", base64: String(ev.target.result || "").split(",")[1] || "" });
    };
    reader.onerror = function() { toast("Não foi possível ler o anexo selecionado.", "err"); callback(null, true); };
    reader.readAsDataURL(arquivo);
  }

  function taxaPreview() {
    var payload = taxaPayloadMensagem();
    if (!taxaValidarMensagem(payload)) return;
    var aba = window.open("", "_blank");
    google.script.run
      .withSuccessHandler(function(resp) {
        if (!aba) { toast("Permita pop-ups para abrir a prévia.", "warn"); return; }
        aba.document.open(); aba.document.write((resp && resp.html) || ""); aba.document.close();
      })
      .withFailureHandler(function(err) { try { if (aba) aba.close(); } catch (_) {} toast("Erro ao gerar prévia: " + taxaMensagemErro(err), "err", 6000); })
      .previewOficioTaxaAssistencial(payload, SISGEP_TOKEN_SESSAO);
  }

  function taxaEnviarTeste() {
    var payload = taxaPayloadMensagem();
    payload.emailTeste = taxaValor("taxaAssistencialEmailTeste");
    if (!taxaValidarMensagem(payload)) return;
    if (!payload.emailTeste) { toast("Informe o e-mail de teste.", "warn"); return; }
    var btn = $("btnEnviarTesteTaxa");

      .withFailureHandler(function(err) { taxaOcuparBotao(btn, false); toast("Erro no teste: " + taxaMensagemErro(err), "err", 7000); })
      .enviarTesteTaxaAssistencial(payload, SISGEP_TOKEN_SESSAO);

  function taxaPrepararFila() {
    var payload = taxaPayloadMensagem();
    if (!taxaValidarMensagem(payload)) return;
    var btn = $("btnPrepararFilaTaxa");
    taxaOcuparBotao(btn, true, "⏳ Preparando...");

        .withSuccessHandler(function(resp) {

          taxaRenderStatus({ preparada:true, numero:resp.numero, total:resp.total, pendente:resp.validas, enviado:0, erro:Number(resp.invalidas || 0) + Number(resp.semEmail || 0) });
          toast((resp && resp.mensagem) || "Fila preparada.", "ok", 6000);
        })
        .withFailureHandler(function(err) { taxaOcuparBotao(btn, false); toast("Erro ao preparar fila: " + taxaMensagemErro(err), "err", 7000); })
        .prepararFilaTaxaAssistencial(payload, SISGEP_TOKEN_SESSAO);
    });
  }

  function taxaIniciarEnvio() {
    var payload = taxaPayloadMensagem();
    if (!taxaValidarMensagem(payload)) return;

        if (item.status !== "FALHA_ENTREGA")
          acoes += '<button onclick="marcarStatusMon(\'' + escapeHtml(item.numero) + '\',\'FALHA_ENTREGA\')" title="Falha" style="padding:4px 9px;border-radius:7px;background:var(--red-lt);color:#991b1b;font-size:11px;font-weight:700;border:none;cursor:pointer;margin-right:4px;">❌</button>';
        if (item.link)
          acoes += '<a href="' + item.link + '" target="_blank" style="padding:4px 9px;border-radius:7px;background:var(--blue-lt);color:var(--blue);font-size:11px;font-weight:700;text-decoration:none;">📄</a>';

          + '<td style="padding:12px 14px;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="' + escapeHtml(item.escola) + '">' + escapeHtml(item.escola) + '</td>'
          + '<td style="padding:12px 14px;font-size:11px;color:var(--g500);">' + escapeHtml(item.email) + '</td>'
          + '<td style="padding:12px 14px;">' + badge + alerta + '</td>'
          + '<td style="padding:12px 14px;font-size:11.5px;color:var(--g500);">' + (item.data || "—") + '</td>'
          + '<td style="padding:12px 14px;">' + acoes + '</td>'
          + '</tr>';
      }).join("");

  // ── CSS dos cards ──
  if (!document.getElementById("monCardStyle")) {
    var st = document.createElement("style");
    st.id = "monCardStyle";
    st.textContent =
      '.mon-cards{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-bottom:20px;}'
      + '.mon-card{cursor:pointer;border-radius:14px;transition:transform .15s,box-shadow .15s;user-select:none;}'
      + '.mon-card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,20,60,.12);}'
      + '.mon-card:active{transform:translateY(0) scale(.97);}'
      + '.mon-card-ativo{transform:translateY(-2px);}'
      + '.mon-card-inner{border-radius:14px;padding:16px;text-align:center;transition:border .15s,box-shadow .15s;}';
    document.head.appendChild(st);
  }

    '<div class="mon-cards" id="monCards">' + htmlCards + '</div>'
    + htmlFiltros
    + '<div class="of-table-wrap"><table class="of-table"><thead><tr>'
    + '<th>Número</th><th>Tipo</th><th>Escola</th><th>E-mail</th><th>Status</th><th>Data</th><th>Ações</th>'
    + '</tr></thead><tbody id="tabelaMonitoramentoBody">' + htmlLinhas + '</tbody></table></div>';

  // ── Bind cards ──
  painel.querySelectorAll(".mon-card").forEach(function(card) {
    card.addEventListener("click", function() {
      var status = card.dataset.status;
      // Click duplo no mesmo card limpa o filtro
      if (window._monFiltroAtivo === status) {
        window._monFiltroAtivo = "";
        status = "";
      } else {
        window._monFiltroAtivo = status;
      }
      var sel = document.getElementById("monFiltroStatus");
      if (sel) sel.value = status;
      aplicarFiltroMonitoramento();
    });
  });

  // ── Bind filtros ──
  var selStatus  = document.getElementById("monFiltroStatus");
  var inpEscola  = document.getElementById("monFiltroEscola");
  var btnLimpar  = document.getElementById("btnMonLimparFiltro");

  if (selStatus) selStatus.onchange = function() {
    window._monFiltroAtivo = this.value;
    aplicarFiltroMonitoramento();
  };
  if (inpEscola) inpEscola.oninput = debounce(function() {
    aplicarFiltroMonitoramento();
  }, 300);
  if (btnLimpar) btnLimpar.onclick = function() {
    window._monFiltroAtivo = "";
    if (selStatus) selStatus.value = "";
    if (inpEscola) inpEscola.value = "";
    aplicarFiltroMonitoramento();
  };

  // Restaura valor do select se havia filtro ativo
  if (window._monFiltroAtivo && selStatus) {
    selStatus.value = window._monFiltroAtivo;
  }
}
function badgeStatusMon(status) {

    ENVIADO:       { bg:"#dbeafe", cor:"#1e40af", emoji:"📤", label:"Enviado" },

    FALHA_ENTREGA: { bg:"var(--red-lt)", cor:"#991b1b", emoji:"❌", label:"Falha de entrega" },
    ERRO:          { bg:"#ede9fe", cor:"#7c3aed", emoji:"⚠️", label:"Erro" }
  };
  var c = cfg[status] || { bg:"var(--g100)", cor:"var(--g600)", emoji:"•", label: status };
  return '<span style="background:' + c.bg + ';color:' + c.cor + ';padding:4px 11px;border-radius:999px;font-size:11px;font-weight:800;white-space:nowrap;">' + c.emoji + ' ' + c.label + '</span>';

/* ═══════════════════════════════════════════════════════
   FILIAÇÃO VIA IA — leitura de formulário de sindicalização escaneado/foto
   Nada aqui grava ou envia nada sozinho: "Analisar formulário" só sugere;
   "Confirmar" só registra a ficha (que ainda passa pela aprovação normal).
   ═══════════════════════════════════════════════════════ */
var filIA_estado = { arquivoBase64: "", arquivoTipo: "", arquivoExtensao: "", escolas: [] };

/* Só cuida da PRÓPRIA área de leitura. Quem decide se a seção de escola e
   trabalhadores aparece é oficioSetModo/oficioAtualizarPorTipo — três
   funções mexendo no mesmo secaoOficioPadrao era corrida garantida, e no
   Ofício Livre a última a rodar reabria a seção que tinha acabado de sumir. */
function filIA_setModo(modo) {
  var areaUpload = $("filIA_areaUpload");
  if (areaUpload) areaUpload.style.display = (modo === "ia") ? "block" : "none";
  if (typeof window.oficioSetModo === "function") window.oficioSetModo(modo === "ia" ? "ia" : "individual");
}

function filIA_atualizarVisibilidade() {
  var tipo = $("tipo");
  var bloco = $("blocoFiliacaoIA");
  if (!tipo || !bloco) return;
  var ehFiliacao = tipo.value === "Filiação";
  bloco.style.display = ehFiliacao ? "block" : "none";
  if (!ehFiliacao) filIA_setModo("manual");
}

function filIA_initListener() {
  var tipo = $("tipo");
  if (tipo && !tipo.dataset.iaFilBound) {
    tipo.dataset.iaFilBound = "1";

}
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", filIA_initListener);
else filIA_initListener();

function filIA_analisar() {
  var input = $("filIA_arquivo");
  var status = $("filIA_status");
  var btn = $("filIA_btnAnalisar");
  if (!input || !input.files || !input.files.length) { toast("Selecione um arquivo primeiro.", "warn"); return; }

  var arquivo = input.files[0];
  var extensao = (arquivo.name.match(/\.[^.]+$/) || [".pdf"])[0];
  if (btn) { btn.disabled = true; btn.textContent = "⏳ Lendo documento..."; }
  if (status) status.textContent = "Fazendo OCR e extraindo dados — pode levar alguns segundos...";

  var reader = new FileReader();
  reader.onload = function(e) {
    var base64 = e.target.result.split(",")[1];
    filIA_estado.arquivoBase64 = base64;
    filIA_estado.arquivoTipo = arquivo.type || "application/pdf";
    filIA_estado.arquivoExtensao = extensao;

    google.script.run
      .withSuccessHandler(function(res) {
        if (btn) { btn.disabled = false; btn.textContent = "🔎 Analisar formulário"; }
        if (!res || !res.sucesso) {
          if (status) status.textContent = "";
          toast((res && res.mensagem) || "Não foi possível analisar o documento.", "err");
          return;
        }
        filIA_renderRevisao(res);
      })
      .withFailureHandler(function(err) {
        if (btn) { btn.disabled = false; btn.textContent = "🔎 Analisar formulário"; }
        if (status) status.textContent = "";
        toast("Erro ao analisar: " + ((err && err.message) || err), "err");
      })
      .analisarFormularioFiliacaoIA(base64, arquivo.name, arquivo.type || "application/pdf", SISGEP_TOKEN_SESSAO);
  };
  reader.onerror = function() { if (btn) { btn.disabled = false; btn.textContent = "🔎 Analisar formulário"; } toast("Erro ao ler o arquivo.", "err"); };
  reader.readAsDataURL(arquivo);
}

function filIA_renderRevisao(res) {
  var status = $("filIA_status");
  if (status) status.textContent = "";

  var d = res.dados || {};
  filIA_estado.escolas = res.listaEscolas || [];

  var tipoEl = $("filIA_tipo"), nomeEl = $("filIA_nome"), cpfEl = $("filIA_cpf"),
      cargoEl = $("filIA_cargo"), celularEl = $("filIA_celular"), emailEl = $("filIA_email"),
      enderecoEl = $("filIA_endereco"), escolaSel = $("filIA_escola"), confirmadoEl = $("filIA_confirmado");

  if (tipoEl) tipoEl.value = d.tipo === "RECADASTRAMENTO" ? "RECADASTRAMENTO" : "CADASTRAMENTO";
  if (nomeEl) nomeEl.value = d.nome || "";
  if (cpfEl) cpfEl.value = d.cpf || res.cpfDigitos || "";
  if (cargoEl) cargoEl.value = d.cargo || "";
  if (celularEl) celularEl.value = d.celular || "";
  if (emailEl) emailEl.value = d.email || "";
  if (enderecoEl) enderecoEl.value = [d.endereco, d.numero, d.bairro, d.cidade, d.uf].filter(Boolean).join(", ");
  if (confirmadoEl) confirmadoEl.checked = false;

  if (escolaSel) {
    escolaSel.innerHTML = "<option value=''>Selecione a escola...</option>" +
      filIA_estado.escolas.map(function(e, i) {
        var selecionada = res.escolaSugerida && e.nome === res.escolaSugerida ? " selected" : "";
        return "<option value='" + i + "'" + selecionada + ">" + (e.nome || "") + " (" + (e.associados || 0) + " associados)</option>";
      }).join("");
  }

  var alertasEl = $("filIA_alertas");
  if (alertasEl) {
    var alertas = res.alertas || [];
    alertasEl.innerHTML = alertas.length
      ? alertas.map(function(a) {
          return "<div style='background:#fef3c7;border:1px solid #fcd34d;border-radius:8px;padding:8px 12px;margin-bottom:6px;font-size:12px;color:#92400e;'>⚠ " + a + "</div>";
        }).join("")
      : "<div style='background:#dcfce7;border:1px solid #86efac;border-radius:8px;padding:8px 12px;font-size:12px;color:#166534;'>✅ Nenhuma pendência encontrada na conferência automática.</div>";

    if (d.observacoesLeitura) {
      var obsDiv = document.createElement("div");
      obsDiv.style.cssText = "background:#eff6ff;border:1px solid #bfdbfe;border-radius:8px;padding:8px 12px;margin-top:6px;font-size:12px;color:#1e3a8a;";
      obsDiv.textContent = "📝 Observações da leitura: " + d.observacoesLeitura;
      alertasEl.appendChild(obsDiv);
    }
  }

  var revisao = $("filIA_revisao");
  if (revisao) revisao.style.display = "block";
}

function filIA_confirmar() {
  var confirmadoEl = $("filIA_confirmado");
  if (!confirmadoEl || !confirmadoEl.checked) { toast("Marque a caixa confirmando que conferiu os dados contra o documento original.", "warn"); return; }

  var tipoEl = $("filIA_tipo"), nomeEl = $("filIA_nome"), cpfEl = $("filIA_cpf"),
      cargoEl = $("filIA_cargo"), celularEl = $("filIA_celular"), emailEl = $("filIA_email"),
      enderecoEl = $("filIA_endereco"), escolaSel = $("filIA_escola");

  var idxEscola = escolaSel ? escolaSel.value : "";
  if (idxEscola === "") { toast("Selecione a escola antes de confirmar.", "warn"); return; }
  var escola = filIA_estado.escolas[parseInt(idxEscola, 10)];
  if (!escola) { toast("Escola inválida — selecione novamente.", "warn"); return; }

  var enderecoPartes = String(enderecoEl ? enderecoEl.value : "").split(",").map(function(s) { return s.trim(); });

  var payload = {
    tipo: tipoEl ? tipoEl.value : "CADASTRAMENTO",
    nome: nomeEl ? nomeEl.value : "",
    cpf: cpfEl ? cpfEl.value : "",
    escola: escola.nome,
    cargo: cargoEl ? cargoEl.value : "",
    celular: celularEl ? celularEl.value : "",
    telefone1: celularEl ? celularEl.value : "",
    email: emailEl ? emailEl.value : "",
    endereco: enderecoPartes[0] || "",
    bairro: enderecoPartes[2] || "",
    cidade: enderecoPartes[3] || "",
    uf: enderecoPartes[4] || "",
    arquivoBase64: filIA_estado.arquivoBase64,
    arquivoTipo: filIA_estado.arquivoTipo,
    arquivoExtensao: filIA_estado.arquivoExtensao,
    confirmadoPeloAtendente: true
  };

  var btn = $("filIA_btnConfirmar");
  if (btn) { btn.disabled = true; btn.textContent = "⏳ Registrando..."; }

  google.script.run
    .withSuccessHandler(function(res) {
      if (btn) { btn.disabled = false; btn.textContent = "✅ Confirmar e registrar ficha"; }
      if (!res || !res.sucesso) { toast((res && res.mensagem) || "Falha ao registrar a ficha.", "err"); return; }
      toast(res.mensagem || "Ficha registrada.", "ok");
      var revisao = $("filIA_revisao");
      if (revisao) revisao.style.display = "none";
      var status = $("filIA_status");
      if (status) status.textContent = "✅ Ficha " + (res.idFicha || "") + " registrada — use o painel de Fichas Sindicais para aprovar.";
    })
    .withFailureHandler(function(err) {
      if (btn) { btn.disabled = false; btn.textContent = "✅ Confirmar e registrar ficha"; }
      toast("Erro: " + ((err && err.message) || err), "err");
    })
    .confirmarFiliacaoPapelIA(payload, SISGEP_TOKEN_SESSAO);
}

window.filIA_setModo = filIA_setModo;
window.filIA_analisar = filIA_analisar;
window.filIA_confirmar = filIA_confirmar;

/* ═══════════════════════════════════════════════════════
   OPOSIÇÃO À TAXA NEGOCIAL VIA IA — leitura de carta escaneada/foto
   Nada aqui grava ou envia nada sozinho: "Analisar carta" só sugere;
   "Confirmar oposição" só age depois que o atendente revisar os campos.
   ═══════════════════════════════════════════════════════ */
var oposIA_estado = { arquivoBase64: "", arquivoTipo: "", escolas: [] };

/* Só cuida da PRÓPRIA área de leitura. Quem decide se a seção de escola e
   trabalhadores aparece é oficioSetModo/oficioAtualizarPorTipo — três
   funções mexendo no mesmo secaoOficioPadrao era corrida garantida, e no
   Ofício Livre a última a rodar reabria a seção que tinha acabado de sumir. */
function oposIA_setModo(modo) {
  var areaUpload = $("oposIA_areaUpload");
  if (areaUpload) areaUpload.style.display = (modo === "ia") ? "block" : "none";
  if (typeof window.oficioSetModo === "function") window.oficioSetModo(modo === "ia" ? "ia" : "individual");
}

function oposIA_atualizarVisibilidade() {
  var tipo = $("tipo");
  var bloco = $("blocoOposicaoTaxaIA");
  if (!tipo || !bloco) return;
  /* Segue o tipo PRÓPRIO da oposição, não mais a cobrança. */
  var ehTaxaNegocial = tipo.value === "Oposição à Taxa Negocial";
  bloco.style.display = ehTaxaNegocial ? "block" : "none";
  if (!ehTaxaNegocial) oposIA_setModo("manual");
}

function oposIA_initListener() {
  var tipo = $("tipo");
  if (tipo && !tipo.dataset.iaOposBound) {
    tipo.dataset.iaOposBound = "1";
    tipo.addEventListener("change", oposIA_atualizarVisibilidade);
  }
}
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", oposIA_initListener);
else oposIA_initListener();

function oposIA_analisar() {
  var input = $("oposIA_arquivo");
  var status = $("oposIA_status");
  var btn = $("oposIA_btnAnalisar");
  if (!input || !input.files || !input.files.length) { toast("Selecione um arquivo primeiro.", "warn"); return; }

  var arquivo = input.files[0];
  if (btn) { btn.disabled = true; btn.textContent = "⏳ Lendo documento..."; }
  if (status) status.textContent = "Fazendo OCR e extraindo dados — pode levar alguns segundos...";

  var reader = new FileReader();
  reader.onload = function(e) {
    var base64 = e.target.result.split(",")[1];
    oposIA_estado.arquivoBase64 = base64;
    oposIA_estado.arquivoTipo = arquivo.type || "application/pdf";

    google.script.run
      .withSuccessHandler(function(res) {
        if (btn) { btn.disabled = false; btn.textContent = "🔎 Analisar carta"; }
        if (!res || !res.sucesso) {
          if (status) status.textContent = "";
          toast((res && res.mensagem) || "Não foi possível analisar o documento.", "err");
          return;
        }
        oposIA_renderRevisao(res);
      })
      .withFailureHandler(function(err) {
        if (btn) { btn.disabled = false; btn.textContent = "🔎 Analisar carta"; }
        if (status) status.textContent = "";
        toast("Erro ao analisar: " + ((err && err.message) || err), "err");
      })
      .analisarCartaOposicaoTaxaNegocialIA(base64, arquivo.name, arquivo.type || "application/pdf", SISGEP_TOKEN_SESSAO);
  };
  reader.onerror = function() { if (btn) { btn.disabled = false; btn.textContent = "🔎 Analisar carta"; } toast("Erro ao ler o arquivo.", "err"); };
  reader.readAsDataURL(arquivo);
}

function oposIA_renderRevisao(res) {
  var status = $("oposIA_status");
  if (status) status.textContent = "";

  var d = res.dados || {};
  oposIA_estado.escolas = res.sugestaoEscolas || [];

  var nomeEl = $("oposIA_nome"), cpfEl = $("oposIA_cpf"), motivoEl = $("oposIA_motivo"), escolaSel = $("oposIA_escola");
  if (nomeEl) nomeEl.value = d.nome || "";
  if (cpfEl) cpfEl.value = d.cpfFormatado || d.cpf || "";
  if (motivoEl) motivoEl.value = d.motivo || "";

  if (escolaSel) {
    escolaSel.innerHTML = "<option value=''>Selecione a escola...</option>" +
      oposIA_estado.escolas.map(function(e, i) {
        return "<option value='" + i + "'>" + (e.nome || "") + (e.cidade ? " — " + e.cidade : "") + "</option>";
      }).join("");
    if (!oposIA_estado.escolas.length && d.escolaTexto) {
      escolaSel.innerHTML += "<option value='' disabled>Nenhuma correspondência para \"" + d.escolaTexto + "\" — busque manualmente</option>";
    }
  }

  var alertasEl = $("oposIA_alertas");
  if (alertasEl) {
    var alertas = res.alertas || [];
    alertasEl.innerHTML = alertas.length
      ? alertas.map(function(a) {
          return "<div style='background:#fef3c7;border:1px solid #fcd34d;border-radius:8px;padding:8px 12px;margin-bottom:6px;font-size:12px;color:#92400e;'>⚠ " + a + "</div>";
        }).join("")
      : "<div style='background:#dcfce7;border:1px solid #86efac;border-radius:8px;padding:8px 12px;font-size:12px;color:#166534;'>✅ Nenhuma pendência encontrada na conferência automática.</div>";

    if (d.observacoesLeitura) {
      var obsDiv = document.createElement("div");
      obsDiv.style.cssText = "background:#eff6ff;border:1px solid #bfdbfe;border-radius:8px;padding:8px 12px;margin-top:6px;font-size:12px;color:#1e3a8a;";
      obsDiv.textContent = "📝 Observações da leitura: " + d.observacoesLeitura;
      alertasEl.appendChild(obsDiv);
    }
  }

  var revisao = $("oposIA_revisao");
  if (revisao) revisao.style.display = "block";
}

function oposIA_confirmar(confirmarDuplicata) {
  var nomeEl = $("oposIA_nome"), cpfEl = $("oposIA_cpf"), motivoEl = $("oposIA_motivo"), escolaSel = $("oposIA_escola");
  var idxEscola = escolaSel ? escolaSel.value : "";
  if (idxEscola === "") { toast("Selecione a escola antes de confirmar.", "warn"); return; }
  var escola = oposIA_estado.escolas[parseInt(idxEscola, 10)];
  if (!escola) { toast("Escola inválida — selecione novamente.", "warn"); return; }

  var payload = {
    nome: nomeEl ? nomeEl.value : "",
    cpf: cpfEl ? cpfEl.value : "",
    motivo: motivoEl ? motivoEl.value : "",
    escolaTexto: escola.nome,
    escolaNome: escola.nome,
    escolaCnpj: escola.cnpj,
    escolaEmail: escola.emailPrincipal || escola.emailsTodos || "",
    escolaUnidade: escola.unidade || "",
    cartaBase64: oposIA_estado.arquivoBase64,
    cartaTipo: oposIA_estado.arquivoTipo,
    confirmarDuplicata: !!confirmarDuplicata
  };

  var btn = $("oposIA_btnConfirmar");
  if (btn) { btn.disabled = true; btn.textContent = "⏳ Processando..."; }

  google.script.run
    .withSuccessHandler(function(res) {
      if (res && res.duplicataDetectada) {
        window.abrirModalDuplicata(res, function() {
          oposIA_confirmar(true);
        }, function() {
          if (btn) { btn.disabled = false; btn.textContent = "✅ Confirmar e gerar ofício de oposição à Taxa Negocial"; }
          toast("Confirmação cancelada.", "warn");
        });
        return;
      }
      if (btn) { btn.disabled = false; btn.textContent = "✅ Confirmar e gerar ofício de oposição à Taxa Negocial"; }
      if (!res || !res.sucesso) { toast((res && res.mensagem) || "Falha ao confirmar.", "err"); return; }
      toast(res.mensagem || "Oposição processada.", "ok");
      finalizarPosEmissao({ numero: res.numeroOficio, url: res.urlOficio });
    })
    .withFailureHandler(function(err) {
      if (btn) { btn.disabled = false; btn.textContent = "✅ Confirmar e gerar ofício de oposição à Taxa Negocial"; }
      toast("Erro: " + ((err && err.message) || err), "err");
    })
    .confirmarOposicaoTaxaNegocialIA(payload, SISGEP_TOKEN_SESSAO);
}

window.oposIA_setModo = oposIA_setModo;
window.oposIA_analisar = oposIA_analisar;
window.oposIA_confirmar = oposIA_confirmar;

})();
</script>

<script>
(function() {
  function el(id) { return document.getElementById(id); }

function esconderTodos() {
    ["blocoOficioNovo","blocoOficioHistorico","blocoTaxaAssistencial","blocoMonitoramento","blocoConferencia","blocoEscolas","centralEmailIA","sisgepDashboardExecutivo"].forEach(function(id){ if(el(id)) el(id).style.display="none"; });
    ["abaOficioNovo","abaOficioHistorico","abaTaxaAssistencial","abaMonitoramento","abaConferencia"].forEach(function(id){ if(el(id)) el(id).classList.remove("active"); });
  }

  function mostrarDashboardExecutivo() {
    esconderTodos();
    if(el("sisgepDashboardExecutivo")) el("sisgepDashboardExecutivo").style.display="block";
    if(typeof window.DashboardExecutivo!=="object" || typeof window.DashboardExecutivo.carregar!=="function") return;
    window.DashboardExecutivo.carregar();
  }

  function mostrarNovoOficio() { esconderTodos(); if(el("blocoOficioNovo")) el("blocoOficioNovo").style.display="block"; if(el("abaOficioNovo")) el("abaOficioNovo").classList.add("active"); }

  function mostrarHistorico() {
    esconderTodos();
    if(el("blocoOficioHistorico")) el("blocoOficioHistorico").style.display="block";
    if(el("abaOficioHistorico")) el("abaOficioHistorico").classList.add("active");
    setTimeout(function() {
      if (typeof Historico !== "undefined" && typeof Historico.carregar === "function") Historico.carregar();
      else if (typeof window.carregarHistoricoOficios === "function") window.carregarHistoricoOficios();
      else if (typeof initHistorico === "function") initHistorico();
    }, 400);
  }

  function mostrarTaxaAssistencial() { esconderTodos(); if(el("blocoTaxaAssistencial")) el("blocoTaxaAssistencial").style.display="block"; if(el("abaTaxaAssistencial")) el("abaTaxaAssistencial").classList.add("active"); }

/* Conferência de destinatários — a parada entre emitir e enviar, criada em
     02/09/2026. Fica ao lado do Monitoramento porque é a mesma pergunta em dois
     tempos: aqui, antes de sair; lá, depois. */
  function mostrarConferencia() {
    esconderTodos();
    if(el("blocoConferencia")) el("blocoConferencia").style.display="block";
    if(el("abaConferencia")) el("abaConferencia").classList.add("active");
    setTimeout(function() { if(typeof window.carregarConferenciaDestinatarios === "function") window.carregarConferenciaDestinatarios(); }, 300);
  }

  function mostrarMonitoramento() {
    esconderTodos();
    if(el("blocoMonitoramento")) el("blocoMonitoramento").style.display="block";
    if(el("abaMonitoramento")) el("abaMonitoramento").classList.add("active");
    setTimeout(function() { if(typeof window.carregarMonitoramento === "function") window.carregarMonitoramento(); }, 300);
  }

  /* Mensalidade virou módulo próprio no Financeiro (FIN-F5). Mantida como
     ponte para não quebrar chamador antigo que ainda peça a aba daqui. */
  function mostrarMensalidades() {
    if (typeof window.spIr === "function") return window.spIr("mensalidades");
  }

  function iniciarAbasOficios() {
    if(el("abaOficioNovo")) el("abaOficioNovo").onclick=mostrarNovoOficio;
    if(el("abaOficioHistorico")) el("abaOficioHistorico").onclick=mostrarHistorico;
    if(el("abaTaxaAssistencial")) el("abaTaxaAssistencial").onclick=mostrarTaxaAssistencial;
 if(el("abaMonitoramento")) el("abaMonitoramento").onclick=mostrarMonitoramento;
    if(el("abaConferencia")) el("abaConferencia").onclick=mostrarConferencia;
    if(el("btnVoltarEmissao")) el("btnVoltarEmissao").onclick=mostrarNovoOficio;
    if(el("btnAplicarFiltroHist")) el("btnAplicarFiltroHist").onclick=function(){ if(typeof window.carregarHistoricoOficios==="function") window.carregarHistoricoOficios(); else if(typeof Historico!=="undefined") Historico.carregar(); };
    if(el("btnAtualizarMonitoramento")) el("btnAtualizarMonitoramento").onclick=mostrarMonitoramento;
    if(el("btnAbrirDashboardExecutivo")) el("btnAbrirDashboardExecutivo").onclick=mostrarDashboardExecutivo;
    mostrarNovoOficio();
  }

 window.mostrarHistoricoOficio = mostrarHistorico;
  window.mostrarNovoOficio = mostrarNovoOficio;
  window.mostrarDashboardExecutivo = mostrarDashboardExecutivo;
  window.initAbasOficios = iniciarAbasOficios;
window.mostrarAbaOficio = function(aba) {
    if (aba === "novo")                  mostrarNovoOficio();
    else if (aba === "historico")        mostrarHistorico();
    else if (aba === "taxaAssistencial") mostrarTaxaAssistencial();
    else if (aba === "monitoramento")    mostrarMonitoramento();
    else if (aba === "mensalidades")     mostrarMensalidades();
    else if (aba === "dashboard")        mostrarDashboardExecutivo();
    else if (aba === "escolas") {
      esconderTodos();
      var blocoEsc = el("blocoEscolas");
      if (blocoEsc) blocoEsc.style.display = "block";
      if (typeof window.initCadastroEscolas === "function") window.initCadastroEscolas();
    }
    else if (aba === "centralIA") {
      esconderTodos();
      var central = el("centralEmailIA");
      if (central) central.style.display = "block";
      if (typeof window.carregarEmailsIA === "function") window.carregarEmailsIA();
    }
  };

  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", iniciarAbasOficios);
  else iniciarAbasOficios();

  window.abrirModalEnvioOficioSISGEP = function(dados, aoConfirmar) {
    dados = dados || {};
    var modal = document.getElementById("modalEnvioOficioSISGEP");
    var btn = document.getElementById("btnModalEnviarOficioAgora");
    if (!modal || !btn) { if(typeof aoConfirmar==="function") aoConfirmar(); return; }
    document.getElementById("modalEnvioNumero").textContent = dados.numero || "—";
    document.getElementById("modalEnvioTipo").textContent = dados.tipo || "Ofício";
    document.getElementById("modalEnvioEscola").textContent = dados.escola || "Não informado";
    document.getElementById("modalEnvioEmail").textContent = dados.email || "E-mail cadastrado na fila de envio";
    var anexosEl = document.getElementById("modalEnvioAnexos");
    if (anexosEl) {
      var partes = String(dados.anexos || "PDF do ofício").split("+").map(function(p){return p.trim();}).filter(Boolean);
      anexosEl.innerHTML = partes.map(function(p){ return "<div style='display:inline-flex;align-items:center;gap:5px;background:var(--green-lt);border:1.5px solid #6ee7b7;color:var(--green-dk);font-size:12px;font-weight:700;padding:5px 12px;border-radius:8px;'>📎 " + p + "</div>"; }).join("");
    }
    btn.disabled = false; btn.innerHTML = "📨 Enviar agora";

    /* SELETOR DE DESTINATARIOS — 02/09/2026.

       ESTA e a definicao que vale. `abrirModalEnvioOficioSISGEP` existe DUAS
       vezes: aqui e no OficiosFormulario.html:952. No escopo global unico do
       Apps Script o segundo `window.x = function` sobrescreve o primeiro, e
       este arquivo e incluido DEPOIS (index.html:758 contra 441). Eu editei a
       do Formulario primeiro e a mudanca simplesmente nao rodava — sem erro
       nenhum, porque a funcao existia e funcionava, so nao era esta.

       As duas ficam sincronizadas de proposito enquanto a duplicata existir; o
       t141 conta as definicoes e cobra que todas montem o seletor, para que a
       proxima pessoa nao caia no mesmo buraco. */
    if (typeof window.modalEnvioMontarSeletor === "function") {
      try { window.modalEnvioMontarSeletor(dados.filaId, dados.email); } catch (eSel) {}
    }

    btn.onclick = function() {
      /* O que a pessoa escolheu vence o que veio do cadastro. Se o seletor nao
         carregou, `dados.email` continua valendo — o envio nao pode depender de
         uma tela auxiliar ter funcionado. */
      if (typeof window.modalEnvioDestinatariosEscolhidos === "function") {
        try {
          var escolhidos = window.modalEnvioDestinatariosEscolhidos();
          if (escolhidos && escolhidos.length) dados.email = escolhidos.join("; ");
        } catch (eEsc) {}
      }
      btn.disabled = true; btn.innerHTML = "⏳ Enviando...";
      if(typeof aoConfirmar==="function") aoConfirmar();
    };
    modal.classList.add("aberto");
  };

  window.fecharModalEnvioOficioSISGEP = function() {
    var modal = document.getElementById("modalEnvioOficioSISGEP");

      + '<span style="position:absolute;left:11px;font-size:14px;color:var(--g400);pointer-events:none;">🔎</span>'

        item.addEventListener("mousedown", function(e) {
          e.preventDefault(); e.stopPropagation();
          card._fichasDrive = [{ id: arq.id, nome: arq.nome, tipo: arq.tipo, url: arq.url }];
          if (contadorEl) contadorEl.textContent = "1 ficha (☁️ Nuvem)";
          if (previewEl) previewEl.innerHTML = '<div style="display:flex;align-items:center;gap:8px;padding:7px 11px;background:var(--green-lt);border-radius:9px;border:1.5px solid #6ee7b7;font-size:12px;font-weight:700;color:var(--green-dk);">'
            + '<span>📄</span><span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + String(arq.nome||"").replace(/&/g,"&amp;").replace(/</g,"&lt;") + '</span>'
            + '<span style="font-size:10px;color:var(--g500);flex-shrink:0;">☁️ Nuvem</span>'
            + '<button type="button" onclick="(function(btn){var c=btn.closest(\'.trabalhador-card\');c._fichasDrive=[];btn.closest(\'.ficha-preview-individual\').innerHTML=\'\';c.querySelector(\'.ficha-contador\').textContent=\'Nenhuma ficha\';})(this)" style="margin-left:6px;background:var(--red);color:#fff;border:none;padding:2px 8px;border-radius:6px;cursor:pointer;font-size:11px;font-weight:700;">✕</button>'
            + '</div>';
          var nomeInp = card.querySelector(".input-nome-trabalhador");
          if (nomeInp && !nomeInp.value.trim()) {
            nomeInp.value = arq.nome.replace(/\.pdf$/i,"").replace(/\.jpe?g$/i,"").replace(/\.png$/i,"").replace(/^FICHA\s+SINDICALIZA[ÇC][ÃA]O\s+/i,"").replace(/^FICHA\s+/i,"").replace(/_\d{14,}.*$/,"").trim()
              .replace(/\b\w+/g,function(p){ var m=["da","de","do","das","dos","e","em","na","no","nas","nos","a","o","as","os"]; return m.indexOf(p.toLowerCase())>-1?p.toLowerCase():p.charAt(0).toUpperCase()+p.slice(1).toLowerCase(); });
            if(typeof atualizarResumoTrabalhadores==="function") atualizarResumoTrabalhadores();
          }
          if(typeof sincronizarFichasGlobais==="function") sincronizarFichasGlobais();
          wrap.remove();
        });
        results.appendChild(item);
      });
    }

    input.addEventListener("input", function() {
      clearTimeout(timer); var termo = input.value.trim(); results.style.display="none"; contador.textContent="";
      if (termo.length < 3) return;
      results.style.display="block"; results.innerHTML='<div style="padding:10px;font-size:12px;color:var(--g400);">⏳ Buscando...</div>';
      timer = setTimeout(function() {
        google.script.run.withSuccessHandler(function(lista){ renderizarDrive(lista||[], termo); }).withFailureHandler(function(err){ results.innerHTML='<div style="padding:9px;font-size:12px;color:var(--red);">Erro: '+((err&&err.message)||err)+'</div>'; }).buscarFichasDrive(termo, SISGEP_TOKEN_SESSAO);
      }, 400);
    });
    input.addEventListener("keydown", function(e){ if(e.key==="Escape") wrap.remove(); });
    btnFch.addEventListener("click", function(){ wrap.remove(); });
    setTimeout(function() {
      document.addEventListener("mousedown", function fecharFora(e){ if(!wrap.contains(e.target)){ wrap.remove(); document.removeEventListener("mousedown",fecharFora); } });
    }, 200);
  }

/* ─────────────────────────────────────────────
     HISTÓRICO DE OFÍCIOS
  ────────────────────────────────────────────── */
  var Historico = {
    selecionados: [],
    _sort: { col: "data", dir: "desc" },
    _dadosCache: [],

    ordenar: function(lista) {
      var col = Historico._sort.col;
      var dir = Historico._sort.dir;
      return lista.slice().sort(function(a, b) {
        var va = String(a[col] || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
        var vb = String(b[col] || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
        if (col === "data") {
          var pa = va.split(/[\/\s]/), pb = vb.split(/[\/\s]/);
          if (pa.length >= 3 && pb.length >= 3) {
            var da = new Date(pa[2], pa[1]-1, pa[0]);
            var db = new Date(pb[2], pb[1]-1, pb[0]);
            if (!isNaN(da) && !isNaN(db)) return dir === "asc" ? da - db : db - da;
          }
        }
        if (col === "numero") {
          var na = parseInt(va.split("/")[0]) || 0;
          var nb = parseInt(vb.split("/")[0]) || 0;
          return dir === "asc" ? na - nb : nb - na;
        }
        var r = va.localeCompare(vb, "pt-BR");
        return dir === "asc" ? r : -r;
      });
    },

    initOrdenacao: function() {
      var _cabTextos = {};
      document.querySelectorAll("#blocoOficioHistorico thead th[data-hist-col]").forEach(function(th) {
        _cabTextos[th.dataset.histCol] = th.textContent.trim();
        if (th._histSortBound) return;
        th._histSortBound = true;
        th.addEventListener("click", function() {
          var col = this.dataset.histCol;
          if (Historico._sort.col === col) {
            Historico._sort.dir = Historico._sort.dir === "asc" ? "desc" : "asc";
          } else {
            Historico._sort.col = col;
            Historico._sort.dir = col === "data" ? "desc" : "asc";
          }
          document.querySelectorAll("#blocoOficioHistorico thead th[data-hist-col]").forEach(function(h) {
            h.textContent = _cabTextos[h.dataset.histCol] || h.textContent.replace(/ [↑↓]$/, "");
          });
          this.textContent = (_cabTextos[col] || col) + (Historico._sort.dir === "asc" ? " ↑" : " ↓");
          if (Historico._dadosCache.length) Historico.renderLista(Historico._dadosCache);
        });
      });
    },

    renderLista: function(lista) {
      var tbody = document.getElementById("corpoHistorico");
      var contEl = document.getElementById("contadorResultados");
      var fEscola = (document.getElementById("filtroEscola")||{}).value||"";
      var fNumero = (document.getElementById("filtroNumero")||{}).value||"";
      var fStatus = ((document.getElementById("filtroStatus")||{}).value||"").toUpperCase();
      var fTipo   = ((document.getElementById("filtroTipo")||{}).value||"").toLowerCase();

      var filtrada = lista.filter(function(item) {
        var numero=String(item.numero||"").toLowerCase(), tipo=String(item.tipo||"").toLowerCase();
        var escola=String(item.escola||"").toLowerCase(), status=String(item.status||"").toUpperCase();
        if(fEscola&&escola.indexOf(fEscola.toLowerCase())<0) return false;
        if(fNumero&&numero.indexOf(fNumero.toLowerCase())<0) return false;
        if(fStatus&&status!==fStatus) return false;
        if(fTipo&&tipo.indexOf(fTipo)<0) return false;
        return true;
      });

      var ordenada = Historico.ordenar(filtrada);

      if(contEl) contEl.textContent = ordenada.length + " registro(s) encontrado(s)";
      if(!ordenada.length){
        tbody.innerHTML = '<tr><td colspan="7"><div class="of-table-empty">Nenhum registro encontrado.</div></td></tr>';
        Historico.bindFiltros();
        return;
      }

      tbody.innerHTML = ordenada.map(function(item) {
        var status=String(item.status||"").toUpperCase().trim();
        var badgeClass=status==="CONFIRMADO"?"hist-confirmado":status==="ENVIADO"?"hist-enviado":"hist-pendente";
        var url=String(item.url||item.linkPdf||"").trim();
        var num=String(item.numero||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
        var abrirBtn=url?'<button type="button" class="btn btn-outline btn-sm" onclick="window.open(\''+url+'\',\'_blank\')">📥 PDF</button>':'<button type="button" class="btn btn-ghost btn-sm" disabled>Sem link</button>';
        return '<tr data-numero="'+num+'" data-url="'+url+'">'
          +'<td><input type="checkbox" class="hist-check" data-numero="'+num+'"></td>'
          +'<td style="font-weight:700;">'+num+'</td>'
          +'<td>'+String(item.tipo||"").replace(/</g,"&lt;")+'</td>'
          +'<td style="max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="'+String(item.escola||"").replace(/"/g,"&quot;")+'">'+String(item.escola||"").replace(/</g,"&lt;")+'</td>'
          +'<td>'+String(item.data||"")+'</td>'
          +'<td><span class="hist-badge '+badgeClass+'">'+status+'</span></td>'
          +'<td><div class="row-btns">'+abrirBtn
          +'<button type="button" class="btn btn-outline btn-sm" onclick="Historico.editar(\''+num+'\')" title="Editar status">✏️</button>'
          +'<button type="button" class="btn btn-teal btn-sm" onclick="Historico.reenviar(\''+num+'\')" title="Reenviar">📧</button>'
          +'<button type="button" class="btn btn-red btn-sm" onclick="Historico.excluir(\''+num+'\')" title="Excluir">🗑</button>'
          +'</div></td></tr>';
      }).join("");

      var checkTodos=document.getElementById("checkTodos");
      if(checkTodos){ checkTodos.onchange=function(){ document.querySelectorAll(".hist-check").forEach(function(cb){cb.checked=checkTodos.checked;}); Historico.atualizarSelecionados(); }; }
      document.querySelectorAll(".hist-check").forEach(function(cb){ cb.onchange=function(){Historico.atualizarSelecionados();}; });
      Historico.bindFiltros();
    },

    carregar: function() {
      var tbody = document.getElementById("corpoHistorico");
      var contEl = document.getElementById("contadorResultados");
      var fEscola = (document.getElementById("filtroEscola")||{}).value||"";
      var fNumero = (document.getElementById("filtroNumero")||{}).value||"";
      var fStatus = ((document.getElementById("filtroStatus")||{}).value||"").toUpperCase();
      var fTipo   = ((document.getElementById("filtroTipo")||{}).value||"").toLowerCase();
      if(!tbody) return;
      tbody.innerHTML='<tr><td colspan="7"><div class="of-table-empty">⏳ Carregando...</div></td></tr>';
      Historico.selecionados=[]; Historico.atualizarBarraAcoes();
      Historico.initOrdenacao();

      /* TRAVA DE ESPERA — a tela não pode ficar em "Carregando..." para sempre.
       *
       * Relato do usuário em 19/08/2026: "o histórico só está carregando".
       * Medido no emulador, o caminho normal e o de erro conhecido chegam ao
       * fim; o que não existia era o terceiro caso — a chamada que NÃO VOLTA.
       * Quando nenhum dos dois handlers dispara (função ausente no projeto
       * publicado, execução interrompida, sessão derrubada no meio), a tabela
       * fica no "Carregando..." indefinidamente, sem erro e sem log.
       *
       * "Carregando" eterno é a pior mensagem possível: quem lê fica
       * esperando em vez de agir. Passados 20 segundos a tela diz o que
       * aconteceu e oferece o caminho. */
      var respondeu = false;
      var espera = setTimeout(function() {
        if (respondeu) return;
        if (contEl) contEl.textContent = "0 registro(s)";
        tbody.innerHTML = '<tr><td colspan="7"><div class="of-table-empty">' +
          '⏱️ O servidor não respondeu ao carregar o histórico.<br>' +
          '<small>Recarregue a tela (F5). Se repetir, o painel <strong>Execuções</strong> ' +
          'do Apps Script mostra o erro real.</small></div></td></tr>';
      }, 20000);

      google.script.run
        .withSuccessHandler(function(resp) {
          respondeu = true; clearTimeout(espera);
          /* O ERRO DO BACKEND PRECISA APARECER. Ele volta pelo caminho de
           * SUCESSO — { erro:true, mensagem:"...", itens:[] } —, e a versão
           * anterior lia só `itens`. Com a aba faltando, a tela dizia
           * "Nenhum registro encontrado": uma mentira tranquila, que faz
           * quem lê concluir que não há ofício nenhum quando na verdade a
           * origem dos dados sumiu. Medido no emulador em 19/08/2026. */
          if (resp && resp.erro) {
            if (contEl) contEl.textContent = "0 registro(s)";
            /* Escape LOCAL, de propósito. O escapeHtml do arquivo mora no
               primeiro IIFE (linha 20) e este bloco está no segundo — usá-lo
               aqui daria ReferenceError e trocaria uma mensagem ausente por
               uma tela quebrada. Peguei isso conferindo o escopo antes de
               rodar, não depois. */
            var seguro = String(resp.mensagem || "O servidor recusou a leitura.")
              .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
            tbody.innerHTML = '<tr><td colspan="7"><div class="of-table-empty">' +
              '⚠️ Não foi possível carregar o histórico.<br><small>' + seguro +
              '</small></div></td></tr>';
            return;
          }
          var lista = (resp && Array.isArray(resp.itens)) ? resp.itens : (Array.isArray(resp) ? resp : []);
          Historico._dadosCache = lista;
          Historico.renderLista(lista);
        })
        .withFailureHandler(function(err) {
          respondeu = true; clearTimeout(espera);
          if(contEl) contEl.textContent="0 registro(s)";
          tbody.innerHTML='<tr><td colspan="7"><div class="of-table-empty">Erro: '+((err&&err.message)||err||"")+'</div></td></tr>';
        })
        .listarHistoricoOficios({ escola: fEscola, numero: fNumero, status: fStatus, tipo: fTipo }, SISGEP_TOKEN_SESSAO);
    },

    bindFiltros: function() {
      var btnAplicar=document.getElementById("btnAplicarFiltroHist"), btnLimpar=document.getElementById("btnLimparFiltros");
      var fEscola=document.getElementById("filtroEscola"), fNumero=document.getElementById("filtroNumero"), fStatus=document.getElementById("filtroStatus"), fTipo=document.getElementById("filtroTipo");
      if(btnAplicar&&!btnAplicar.dataset.bH){btnAplicar.dataset.bH="1";btnAplicar.addEventListener("click",Historico.carregar);}
      if(btnLimpar&&!btnLimpar.dataset.bH){btnLimpar.dataset.bH="1";btnLimpar.addEventListener("click",function(){[fEscola,fNumero,fStatus,fTipo].forEach(function(el){if(el)el.value="";});Historico.carregar();});}
      [fEscola,fNumero].forEach(function(el){if(el&&!el.dataset.bH){el.dataset.bH="1";el.addEventListener("keyup",function(e){if(e.key==="Enter")Historico.carregar();});}});
      [fStatus,fTipo].forEach(function(el){if(el&&!el.dataset.bH){el.dataset.bH="1";el.addEventListener("change",function(){ Historico.renderLista(Historico._dadosCache); });}});
    },

    atualizarSelecionados: function() {
      Historico.selecionados=[];
      document.querySelectorAll(".hist-check:checked").forEach(function(cb){Historico.selecionados.push(cb.dataset.numero);});
      Historico.atualizarBarraAcoes();
    },

    atualizarBarraAcoes: function() {
      var barra=document.getElementById("histBarraAcoes"); if(!barra) return;
      var qtd=Historico.selecionados.length;
      if(qtd>0){barra.style.display="flex";var label=barra.querySelector(".hist-barra-label");if(label)label.textContent=qtd+" selecionado(s)";}
      else{barra.style.display="none";}
    },

    /* REENVIO — deixou de ser um confirm cego em 01/09/2026.
       O usuario reenviava sem ver para onde ia, e o caso da FAESA mostrou o
       custo disso: tres oficios reenviados para um endereco que nao recebia
       mais. Agora a tela MOSTRA o destino do cadastro antes de mandar, e
       permite acrescentar outro endereco — ou substituir, quando o do
       cadastro esta morto. */
    reenviar: function(numero) {
      if(!numero) return;
      var tr=document.querySelector("tr[data-numero='"+numero+"']");
      var url=tr?(tr.dataset.url||""):"", cells=tr?tr.querySelectorAll("td"):[];
      var tipo=cells[2]?cells[2].textContent.trim():"", escola=cells[3]?cells[3].textContent.trim():"";

      Historico._reenvioCtx={numero:numero,url:url,tipo:tipo,escola:escola};
      var g=function(id){return document.getElementById(id);};
      if(g("histReenvNumero")) g("histReenvNumero").textContent=numero;
      if(g("histReenvEscola")) g("histReenvEscola").textContent=escola||"—";
      if(g("histReenvTipo"))   g("histReenvTipo").textContent=tipo||"—";
      if(g("histReenvCadastro")) g("histReenvCadastro").value="carregando…";
      if(g("histReenvExtra"))  g("histReenvExtra").value="";
      if(g("histReenvSomente")) g("histReenvSomente").checked=false;
      Historico._reenvioAtualizarAviso();
      var ov=g("histReenvOverlay"); if(ov) ov.classList.add("aberto");

      /* Busca o destino do cadastro so para MOSTRAR. E leitura; o envio
         continua resolvendo o destino no servidor, que e onde a verdade
         esta — a tela nao manda para onde ela acha que e. */
      google.script.run
        .withSuccessHandler(function(r){
          var campo=g("histReenvCadastro"); if(!campo) return;
          campo.value=(r&&r.emails)?r.emails:"(nenhum e-mail no cadastro)";
          Historico._reenvioAtualizarAviso();
        })
        .withFailureHandler(function(){ var c=g("histReenvCadastro"); if(c) c.value="(não foi possível ler o cadastro)"; })
        .obterDestinoReenvioOficio(numero, SISGEP_TOKEN_SESSAO);
    },

    _reenvioCtx: null,

    _reenvioAtualizarAviso: function() {
      var g=function(id){return document.getElementById(id);};
      var somente=g("histReenvSomente"), aviso=g("histReenvAviso"), extra=g("histReenvExtra");
      if(!aviso) return;
      var temExtra=!!(extra && extra.value.trim());
      if(somente && somente.checked && temExtra){
        aviso.style.display="block";
        aviso.textContent="O endereço do cadastro NÃO vai receber. Use isto quando ele estiver recusando e-mail.";
      } else if(temExtra){
        aviso.style.display="block";
        aviso.textContent="O ofício vai para o cadastro E para o endereço informado.";
      } else {
        aviso.style.display="none";
      }
    },

    reenvioFechar: function() {
      var ov=document.getElementById("histReenvOverlay"); if(ov) ov.classList.remove("aberto");
      Historico._reenvioCtx=null;
    },

    reenvioConfirmar: function() {
      var ctx=Historico._reenvioCtx; if(!ctx) return;
      var g=function(id){return document.getElementById(id);};
      var extra=g("histReenvExtra")?g("histReenvExtra").value.trim():"";
      var somente=!!(g("histReenvSomente")&&g("histReenvSomente").checked);
      if(somente && !extra){ toast("Informe o endereço antes de marcar 'somente este'.","err"); return; }

      var btn=g("histReenvOk");
      if(btn){ btn.disabled=true; btn.textContent="Enviando…"; }

      google.script.run
        .withSuccessHandler(function(r){
          if(btn){ btn.disabled=false; btn.textContent="Reenviar ▸"; }
          toast((r&&!r.erro)?(r.mensagem||"Reenviado."):(r&&r.mensagem)||"Erro.", (r&&!r.erro)?"ok":"err");
          if(r&&!r.erro) Historico.reenvioFechar();
        })
        .withFailureHandler(function(err){
          if(btn){ btn.disabled=false; btn.textContent="Reenviar ▸"; }
          toast("Erro: "+((err&&err.message)||err), "err");
        })
        .reenviarOficio({
          numero:ctx.numero, url:ctx.url, escola:ctx.escola, tipo:ctx.tipo,
          emailsExtras:extra, somenteExtras:somente
        }, SISGEP_TOKEN_SESSAO);
    },

    excluir: function(numero) {
      if(!numero) return;
      if(!window.confirm("Excluir o registro do ofício "+numero+"?\n\nEsta ação não pode ser desfeita.")) return;
      google.script.run
        .withSuccessHandler(function(r){ toast((r&&r.ok)?(r.mensagem||"Excluído."):(r&&r.mensagem)||"Erro ao excluir.", (r&&r.ok)?"ok":"err"); if(r&&r.ok) Historico.carregar(); })
        .withFailureHandler(function(err){ toast("Erro: "+((err&&err.message)||err), "err"); })
        .excluirRegistroOficio(numero, SISGEP_TOKEN_SESSAO);
    },

    excluirSelecionados: function() {
      if(!Historico.selecionados.length){ toast("Selecione ao menos um registro.", "warn"); return; }
      if(!window.confirm("Excluir "+Historico.selecionados.length+" registro(s)?\n\nEsta ação não pode ser desfeita.")) return;
      google.script.run
        .withSuccessHandler(function(r){ toast((r&&r.ok)?(r.mensagem||"Excluídos."):(r&&r.mensagem)||"Erro.", (r&&r.ok)?"ok":"err"); if(r&&r.ok) Historico.carregar(); })
        .withFailureHandler(function(err){ toast("Erro: "+((err&&err.message)||err), "err"); })
        .excluirRegistrosOficio(Historico.selecionados, SISGEP_TOKEN_SESSAO);
    },

    editar: function(numero) {
      var novoStatus=window.prompt("Ofício "+numero+"\n\nAlterar status para:\n1 - ENVIADO\n2 - CONFIRMADO\n3 - PENDENTE\n4 - FALHA_ENTREGA\n5 - ERRO\n\nDigite o número:");
      var mapa={"1":"ENVIADO","2":"CONFIRMADO","3":"PENDENTE","4":"FALHA_ENTREGA","5":"ERRO"};
      var status=mapa[String(novoStatus||"").trim()]; if(!status){ toast("Opção inválida.","warn"); return; }
      var obs=window.prompt("Observação (opcional):")||"Alterado manualmente.";
      google.script.run
        .withSuccessHandler(function(r){ toast((r&&!r.erro)?(r.mensagem||"Atualizado."):(r&&r.mensagem)||"Erro.", (r&&!r.erro)?"ok":"err"); if(!r||!r.erro) Historico.carregar(); })
        .withFailureHandler(function(err){ toast("Erro: "+((err&&err.message)||err),"err"); })
        .atualizarStatusOficio(numero, status, obs, SISGEP_TOKEN_SESSAO);
    }
  };

  window.Historico = Historico;
  window.carregarHistoricoOficios = function(){ Historico.carregar(); };
  window.abrirBuscaFichaDriveCard = abrirBuscaFichaDriveCard;
})();
</script>

<script id="sisgep-sidebar-js">
(function(){
  function ativarAba(aba){
 var mapa = {novo:'abaOficioNovo',historico:'abaOficioHistorico',monitoramento:'abaMonitoramento',taxa:'abaTaxaAssistencial'};
    var id = mapa[aba];
    if(id){var b=document.getElementById(id);if(b)b.click();}
  }
  document.querySelectorAll('.sb-nav,.sb-sub').forEach(function(el){
    el.addEventListener('click',function(){
      document.querySelectorAll('.sb-nav').forEach(function(n){n.classList.remove('active');});
      var navEl = el.classList.contains('sb-sub') ? (function(){var p=el.previousElementSibling;while(p&&!p.classList.contains('sb-nav'))p=p.previousElementSibling;return p;})() : el;
      if(navEl) navEl.classList.add('active');
      var aba = el.getAttribute('data-aba')||(navEl&&navEl.getAttribute('data-aba'));
      ativarAba(aba);
      var tipo = el.getAttribute('data-tipo');
      if(tipo){
        setTimeout(function(){
          var sel = document.querySelector('select[id*="tipo"],select[id*="Tipo"]');
          if(sel){
            Array.from(sel.options).forEach(function(opt){
              if(opt.value.toLowerCase().replace(/[-_]/g,'').includes(tipo.replace(/-/g,''))||opt.text.toLowerCase().replace(/[-_]/g,'').includes(tipo.replace(/-/g,''))){
                sel.value=opt.value;
                sel.dispatchEvent(new Event('change',{bubbles:true}));
              }
            });
          }
        },300);
      }
    });
  });
  // Sync sidebar when native tabs are clicked
 var idMap = {abaOficioNovo:'novo',abaOficioHistorico:'historico',abaMonitoramento:'monitoramento',abaTaxaAssistencial:'novo'};

    var btn = document.getElementById(id);

      var aba = idMap[id];
      document.querySelectorAll('.sb-nav').forEach(function(n){n.classList.remove('active');});

      if(match) match.classList.add('active');
    });
  });
})();
