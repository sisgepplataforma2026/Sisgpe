<script>
/* ══════════════════════════════════════════════════════════
   RECIBOS DIVERSOS — Scripts_ReciboDiversos.html
   ✅ Formulário unificado (1 a 25 beneficiários)
   ✅ Envio automático ao emitir (WhatsApp + e-mail)
   ✅ Status: Aguardando → Assinado → Enviado contabilidade
   ✅ Anexo do assinado: upload base64 ou colar link
   ✅ Envio para contabilidade com o arquivo correto
   ✅ Histórico com paginação
══════════════════════════════════════════════════════════ */

/* ─── ESTADO GLOBAL ─── */
var _rdPagAtual      = 1;
var _rdItensForm     = [];   // lista de beneficiários no formulário
var _rdItemSeq       = 0;
var _rdBotoesVinculados = false;
var RD_MAX_LOTE      = 25;

/* ─── HELPERS ─── */
function rdG(id){ return document.getElementById(id); }

function rdEsc(str){
  if(!str) return "";
  return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function rdStatus(msg, tipo, elId){
  var el = rdG(elId || "rdStatusGlobal");
  if(!el) return;
  if(!msg){ el.className = "rd-status"; el.style.display="none"; el.textContent = ""; return; }
  el.className = "rd-status " + (tipo || "info");
  el.style.display = "block";
  el.textContent = msg;
}

function rdMascaraValor(input){
  if(!input) return;
  var valor = String(input.value || "").replace(/\D/g,'');
  if(!valor){ input.value = ""; return; }
  valor = (parseInt(valor,10) / 100).toFixed(2).replace(".", ",")
    .replace(/\B(?=(\d{3})+(?!\d))/g, ".");
  input.value = "R$ " + valor;
}

function rdMascaraTelefone(input){
  if(!input) return;
  var v = String(input.value || "").replace(/\D/g,"").substring(0,11);
  if(v.length > 10) v = v.replace(/^(\d{2})(\d{5})(\d{4})$/, "($1) $2-$3");
  else if(v.length > 6) v = v.replace(/^(\d{2})(\d{4,5})(\d{0,4})$/, "($1) $2-$3");
  else if(v.length > 2) v = v.replace(/^(\d{2})(\d+)$/, "($1) $2");
  input.value = v;
}

function rdMascaraCPF(input){
  if(!input) return;
  var v = String(input.value || "").replace(/\D/g,"").substring(0,11);
  if(v.length > 9) v = v.replace(/^(\d{3})(\d{3})(\d{3})(\d{0,2})$/, "$1.$2.$3-$4");
  else if(v.length > 6) v = v.replace(/^(\d{3})(\d{3})(\d{0,3})$/, "$1.$2.$3");
  else if(v.length > 3) v = v.replace(/^(\d{3})(\d{0,3})$/, "$1.$2");
  input.value = v;
}

function rdParseValor(v){
  if(!v) return 0;
  var txt = String(v).replace(/[^\d,]/g,'').replace(/\./g,'').replace(',','.');
  var num = parseFloat(txt);
  return isNaN(num) ? 0 : num;
}

function rdFormatarBR(n){
  return Number(n||0).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
}

function rdDetectarTipoDoc(input, badgeId){
  var d = String(input.value).replace(/\D/g,"");
  var badge = rdG(badgeId || "rdMTipoBadge");
  if(!badge) return;
  if(d.length===11){ badge.className="doc-tipo-badge badge-pf visivel"; badge.textContent="👤 Pessoa Física (CPF)"; }
  else if(d.length===14){ badge.className="doc-tipo-badge badge-pj visivel"; badge.textContent="🏢 Pessoa Jurídica (CNPJ)"; }
  else { badge.className="doc-tipo-badge"; badge.textContent=""; }
}

/* ═══════════════════════════════════════
   FORMULÁRIO — LISTA DE BENEFICIÁRIOS
═══════════════════════════════════════ */
function rdAdicionarBeneficiario(dados){
  if(_rdItensForm.length >= RD_MAX_LOTE){
    rdStatus("Limite máximo de " + RD_MAX_LOTE + " beneficiários atingido.","warn");
    return;
  }
  _rdItemSeq++;
  var id = "rdi_" + _rdItemSeq;
  _rdItensForm.push({
    id: id,
    nome: (dados && dados.nome) || "",
    cpf:  (dados && dados.cpf)  || "",
    valor:(dados && dados.valor)|| "",
    formaPgto: (dados && dados.formaPgto) || "PIX",
    pixChave:  (dados && dados.pixChave)  || "",
    chequeNum: (dados && dados.chequeNum) || "",
    chequeBanco:   (dados && dados.chequeBanco)   || "Sicoob",
    chequeAgencia: (dados && dados.chequeAgencia) || "3010",
    chequeSerie:   (dados && dados.chequeSerie)   || "001",
    chequeData:    (dados && dados.chequeData)    || "",
    email:    (dados && dados.email)    || "",
    whatsapp: (dados && dados.whatsapp) || "",
    descricao:(dados && dados.descricao)|| ""
  });
  rdRenderFormulario();
  // Foca no nome do item recém adicionado
  setTimeout(function(){
    var el = rdG("rdNome_" + id);
    if(el) el.focus();
  }, 80);
}

function rdRemoverBeneficiario(id){
  _rdItensForm = _rdItensForm.filter(function(i){ return i.id !== id; });
  rdRenderFormulario();
  rdRecalcularTotal();
}

function rdAtualizarBenef(id, campo, valor){
  var item = _rdItensForm.find(function(i){ return i.id === id; });
  if(item) item[campo] = valor;
  if(campo === "valor") rdRecalcularTotal();
}

function rdRecalcularTotal(){
  var total = _rdItensForm.reduce(function(s,i){ return s + rdParseValor(i.valor); }, 0);
  var el = rdG("rdTotalLote");
  if(el) el.textContent = total > 0 ? "R$ " + rdFormatarBR(total) : "";
  var row = rdG("rdTotalRow");
  if(row) row.style.display = _rdItensForm.length > 1 ? "flex" : "none";
}

function rdAlternarFormaBenef(id){
  var item = _rdItensForm.find(function(i){ return i.id === id; });
  if(!item) return;
  var sel = rdG("rdForma_" + id);
  if(!sel) return;
  item.formaPgto = sel.value;
  var pixRow  = rdG("rdPixRow_"  + id);
  var chqRow  = rdG("rdChqRow_"  + id);
  var dinRow  = rdG("rdDinRow_"  + id);
  if(pixRow) pixRow.style.display = item.formaPgto === "PIX"    ? "" : "none";
  if(chqRow) chqRow.style.display = item.formaPgto === "CHEQUE" ? "grid" : "none";
  if(dinRow) dinRow.style.display = (item.formaPgto === "DINHEIRO" || item.formaPgto === "TRANSFERENCIA") ? "" : "none";
}

            '<input id="rdNome_' + item.id + '" type="text" value="' + rdEsc(item.nome) + '" placeholder="Nome completo" ' +
            'style="width:100%;height:38px;border:1.5px solid var(--g200);border-radius:10px;padding:0 10px;font-size:13px;font-family:inherit;" ' +

        '<div style="display:grid;grid-template-columns:160px 1fr;gap:10px;margin-bottom:10px;">' +

              '<option value="DINHEIRO"'    + (item.formaPgto==="DINHEIRO"?"    selected":"") + '>💵 Dinheiro</option>' +
              '<option value="TRANSFERENCIA"'+(item.formaPgto==="TRANSFERENCIA"?" selected":"") + '>🏦 Transferência</option>' +
              '<option value="CHEQUE"'      + (item.formaPgto==="CHEQUE"?"      selected":"") + '>📋 Cheque</option>' +

          '<div id="rdPixRow_' + item.id + '" ' + (isCheque||isDin ? 'style="display:none;"' : '') + '>' +
            '<div style="font-size:10px;font-weight:800;color:var(--g500);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;">Chave PIX</div>' +
            '<input type="text" value="' + rdEsc(item.pixChave) + '" placeholder="CPF, e-mail, telefone ou chave aleatória" ' +

          '<div id="rdDinRow_' + item.id + '" ' + (!isDin ? 'style="display:none;"' : '') + '>' +

          '</div>' +
        '</div>' +

        // Linha Cheque
        '<div id="rdChqRow_' + item.id + '" ' + (!isCheque ? 'style="display:none;"' : 'style="display:grid;"') + ' ' +
        'style="grid-template-columns:1fr 100px 70px 1fr 150px;gap:8px;margin-bottom:10px;">' +
          '<div>' +
            '<div style="font-size:10px;font-weight:800;color:var(--g500);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;">Banco</div>' +

            'style="width:100%;height:38px;border:1.5px solid var(--g200);border-radius:10px;padding:0 10px;font-size:13px;font-family:inherit;" ' +
            'oninput="rdAtualizarBenef(\'' + item.id + '\',\'chequeBanco\',this.value)">' +

          '<div>' +
            '<div style="font-size:10px;font-weight:800;color:var(--g500);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;">Agência</div>' +
            '<input type="text" value="' + rdEsc(item.chequeAgencia||"3010") + '" ' +
            'style="width:100%;height:38px;border:1.5px solid var(--g200);border-radius:10px;padding:0 10px;font-size:13px;font-family:inherit;" ' +
            'oninput="rdAtualizarBenef(\'' + item.id + '\',\'chequeAgencia\',this.value)">' +
          '</div>' +
          '<div>' +
            '<div style="font-size:10px;font-weight:800;color:var(--g500);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;">Série</div>' +
            '<input type="text" value="' + rdEsc(item.chequeSerie||"001") + '" ' +
            'style="width:100%;height:38px;border:1.5px solid var(--g200);border-radius:10px;padding:0 10px;font-size:13px;font-family:inherit;" ' +
            'oninput="rdAtualizarBenef(\'' + item.id + '\',\'chequeSerie\',this.value)">' +
          '</div>' +
          '<div>' +
            '<div style="font-size:10px;font-weight:800;color:var(--g500);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;">Nº Cheque *</div>' +
            '<input type="text" value="' + rdEsc(item.chequeNum) + '" placeholder="000123" ' +
            'style="width:100%;height:38px;border:1.5px solid var(--g200);border-radius:10px;padding:0 10px;font-size:13px;font-family:inherit;" ' +
            'oninput="rdAtualizarBenef(\'' + item.id + '\',\'chequeNum\',this.value)">' +
          '</div>' +
          '<div>' +
            '<div style="font-size:10px;font-weight:800;color:var(--g500);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;">Data</div>' +
            '<input type="date" value="' + rdEsc(item.chequeData||"") + '" ' +
            'style="width:100%;height:38px;border:1.5px solid var(--g200);border-radius:10px;padding:0 10px;font-size:13px;font-family:inherit;" ' +
            'oninput="rdAtualizarBenef(\'' + item.id + '\',\'chequeData\',this.value)">' +

        '</div>' +

        // Linha 4: E-mail + WhatsApp
        '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">' +
          '<div>' +
            '<div style="font-size:10px;font-weight:800;color:var(--g500);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;">' +
              '📧 E-mail <span style="font-weight:400;text-transform:none;letter-spacing:0;font-size:10px;color:var(--g400);">· envio automático ao emitir</span>' +
            '</div>' +
            '<input type="email" value="' + rdEsc(item.email) + '" placeholder="email@exemplo.com" ' +
            'style="width:100%;height:38px;border:1.5px solid var(--g200);border-radius:10px;padding:0 10px;font-size:13px;font-family:inherit;" ' +
            'oninput="rdAtualizarBenef(\'' + item.id + '\',\'email\',this.value)">' +
          '</div>' +
          '<div>' +
            '<div style="font-size:10px;font-weight:800;color:var(--g500);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;">' +
              '💬 WhatsApp <span style="font-weight:400;text-transform:none;letter-spacing:0;font-size:10px;color:var(--g400);">· envio automático ao emitir</span>' +

            '<input type="text" value="' + rdEsc(item.whatsapp) + '" placeholder="(27) 99999-9999" ' +

/* ═══════════════════════════════════════
   EMITIR — PREVIEW E GERAÇÃO
═══════════════════════════════════════ */
function rdPreviewFormulario(){
  var candidato = _rdItensForm.find(function(i){ return i.nome && i.cpf && i.valor && i.descricao; });
  if(!candidato){
    rdStatus("Preencha ao menos 1 beneficiário completo para pré-visualizar.", "warn");
    return;
  }
  rdStatus("Gerando prévia...","info");
  loader(true);
  google.script.run
    .withSuccessHandler(function(html){
      loader(false); rdStatus("","info");
      if(!html){ rdStatus("Erro ao gerar prévia.", "error"); return; }
      var novaAba = window.open("","_blank");
      if(novaAba){ novaAba.document.open(); novaAba.document.write(html); novaAba.document.close(); }
    })
    .withFailureHandler(function(err){
      loader(false); rdStatus("Erro: " + ((err&&err.message)||err), "error");
    })
    .previewReciboDiverso({
      pagadorNome: candidato.nome,
      pagadorDoc:  candidato.cpf,
      valor:       candidato.valor,
      descricao:   candidato.descricao,
      formaPgto:   candidato.formaPgto || "PIX",
      pixChave:    candidato.pixChave  || "",
      chequeNum:   candidato.chequeNum || ""
    }, SISGEP_TOKEN_SESSAO);
}

function rdEmitirRecibos(){
  if(!_rdItensForm.length){
    rdStatus("Adicione pelo menos 1 beneficiário.", "warn");
    return;
  }

  // Validar todos
  var erros = [];
  _rdItensForm.forEach(function(item, idx){
    var n = idx + 1;
    if(!item.nome)      erros.push("Beneficiário " + n + ": nome não informado.");
    if(!item.cpf)       erros.push("Beneficiário " + n + ": CPF/CNPJ não informado.");
    if(!item.valor || item.valor === "R$ 0,00") erros.push("Beneficiário " + n + ": valor não informado.");
    if(!item.descricao) erros.push("Beneficiário " + n + ": descrição não informada.");
    if(item.formaPgto === "PIX" && !item.pixChave) erros.push("Beneficiário " + n + ": chave PIX não informada.");
    if(item.formaPgto === "CHEQUE" && !item.chequeNum) erros.push("Beneficiário " + n + ": número do cheque não informado.");
  });

  if(erros.length){
    rdStatus(erros[0], "error");
    return;
  }

  var btnEmitir = rdG("rdBtnEmitir");
  if(btnEmitir){ btnEmitir.disabled = true; btnEmitir.textContent = "⏳ Emitindo..."; }
  rdStatus("Emitindo " + _rdItensForm.length + " recibo(s)...", "info");
  loader(true);

  var dadosLote = _rdItensForm.map(function(item){
    return {
      pagadorNome:    item.nome,
      pagadorDoc:     item.cpf,
      valor:          item.valor,
      descricao:      item.descricao,
      formaPgto:      item.formaPgto,
      pixChave:       item.pixChave      || "",
      chequeNum:      item.chequeNum     || "",
      chequeBanco:    item.chequeBanco   || "Sicoob",
      chequeAgencia:  item.chequeAgencia || "3010",
      chequeSerie:    item.chequeSerie   || "001",
      chequeData:     item.chequeData    || "",
      email:          item.email         || "",
      whatsapp:       item.whatsapp      || ""
    };
  });

  // Individual ou lote
  var funcao = dadosLote.length === 1 ? "gerarReciboDiverso" : "gerarLoteReciboDiversos";
  var payload = dadosLote.length === 1 ? dadosLote[0] : dadosLote;

  google.script.run
    .withSuccessHandler(function(res){
      loader(false);
      if(btnEmitir){ btnEmitir.disabled = false; btnEmitir.textContent = "✅ Emitir Recibos"; }

      // Normalizar resposta individual vs lote
      var arquivos = [];
      if(dadosLote.length === 1){
        if(!res || !res.ok){ rdStatus("Erro: " + ((res&&res.mensagem)||"desconhecido"), "error"); return; }
        arquivos = [{ numero: res.numero, url: res.url, download: res.download,
          nome: dadosLote[0].pagadorNome, valor: dadosLote[0].valor,
          descricao: dadosLote[0].descricao, email: dadosLote[0].email,
          whatsapp: dadosLote[0].whatsapp, statusEmail: res.statusEmail }];
      } else {
        if(!res || res.erro){ rdStatus("Erro: " + ((res&&res.mensagem)||"desconhecido"), "error"); return; }
        arquivos = res.arquivos || [];
      }

      if(!arquivos.length){ rdStatus("Nenhum recibo gerado.", "warn"); return; }

      rdStatus("", "info");

      // Envio automático de WhatsApp para cada beneficiário
      arquivos.forEach(function(arq){
        if(arq.whatsapp){
          rdAbrirWhatsApp_(arq);
        }
      });

      // Limpa o formulário e mostra resultado
      _rdItensForm = [];
      rdRenderFormulario();

      // Renderiza os cards de resultado
      rdRenderResultado(arquivos);

      // Atualiza histórico se estiver visível
      _rdCarregarHistoricoSilencioso();
    })

function rdAbrirWhatsApp_(arq){
  var num = String(arq.whatsapp || "").replace(/\D/g,"");
  if(!num) return;
  if(num.length >= 10 && !num.startsWith("55")) num = "55" + num;

  var hoje = new Date();
  var data = String(hoje.getDate()).padStart(2,'0') + "/" +
             String(hoje.getMonth()+1).padStart(2,'0') + "/" +
             hoje.getFullYear();

  var msg =
    "💰 *Recibo Nº " + (arq.numero||"—") + "* — SindEducação-ES\n" +
    "━━━━━━━━━━━━━━━━━━━━\n" +
    "📅 *Data:* " + data + "\n" +
    "👤 *Beneficiário:* " + (arq.nome||"—") + "\n" +
    "💰 *Valor:* R$ " + (arq.valor||"—") + "\n" +
    (arq.descricao ? "📝 *Referente a:* " + arq.descricao + "\n" : "") +
    "━━━━━━━━━━━━━━━━━━━━\n" +
    "📄 *Acesse seu recibo:*\n" + (arq.url||"") + "\n\n" +
    "Após assinar (físico ou pelo Gov.br), por favor devolva o documento assinado.\n\n" +
    "_SINDEDUCAÇÃO-ES_";

  window.open("https://wa.me/" + num + "?text=" + encodeURIComponent(msg), "_blank");
}

function rdUploadAnexo(numero){
  var input = rdG("rdFileAnexo_" + numero);
  var statusEl = rdG("rdStatusAnexo_" + numero);
  if(!input || !input.files || !input.files[0]) return;

  var file = input.files[0];
  if(file.size > 10 * 1024 * 1024){
    if(statusEl) statusEl.textContent = "❌ Arquivo muito grande. Máximo: 10MB.";
    return;
  }

  if(statusEl) statusEl.textContent = "⏳ Enviando arquivo...";

  var reader = new FileReader();
  reader.onload = function(e){
    var base64 = e.target.result.split(",")[1];
    loader(true);
    google.script.run
      .withSuccessHandler(function(res){
        loader(false);
        if(!res || !res.ok){
          if(statusEl) statusEl.textContent = "❌ " + (res&&res.mensagem||"Erro ao enviar.");
          return;
        }
        if(statusEl) statusEl.textContent = "✅ Arquivo salvo com sucesso!";
        setTimeout(function(){ _rdCarregarHistorico(); }, 1000);
      })
      .withFailureHandler(function(err){
        loader(false);
        if(statusEl) statusEl.textContent = "❌ Erro: " + ((err&&err.message)||err);
      })
      .salvarAnexoAssinadoDiverso({
        numero:   numero,
        base64:   base64,
        nomeArq:  file.name,
        mimeType: file.type || "application/pdf"
      }, SISGEP_TOKEN_SESSAO);
  };
  reader.readAsDataURL(file);
}

function rdSalvarLink(numero){
  var input  = rdG("rdLinkAnexo_" + numero);
  var statusEl = rdG("rdStatusAnexo_" + numero);
  var link   = input ? String(input.value || "").trim() : "";

  if(!link){
    if(statusEl) statusEl.textContent = "❌ Cole o link do Drive.";
    return;
  }

  if(statusEl) statusEl.textContent = "⏳ Salvando link...";
  loader(true);

  google.script.run
    .withSuccessHandler(function(res){
      loader(false);
      if(!res || !res.ok){
        if(statusEl) statusEl.textContent = "❌ " + (res&&res.mensagem||"Erro.");
        return;
      }
      if(statusEl) statusEl.textContent = "✅ Link salvo com sucesso!";
      setTimeout(function(){ _rdCarregarHistorico(); }, 1000);
    })
    .withFailureHandler(function(err){
      loader(false);
      if(statusEl) statusEl.textContent = "❌ Erro: " + ((err&&err.message)||err);
    })
    .salvarLinkAssinadoDiverso({ numero: numero, link: link }, SISGEP_TOKEN_SESSAO);
}

function rdEnviarContabilidade(r){
  var emailTo = prompt("E-mail da contabilidade:", "contabilidade@sindeducacao.com");

function _rdCarregarHistoricoSilencioso(){
  var blocoHist = rdG("rdBlocoHistorico");
  if(blocoHist && blocoHist.style.display !== "none") _rdCarregarHistorico();
}

function _rdCarregarHistorico(){
  var filtros = {
    nome:     (rdG("rdFiltNome")||{}).value   || "",
    numero:   (rdG("rdFiltNumero")||{}).value || "",
    status:   (rdG("rdFiltStatus")||{}).value || "",
    dataDe:   (rdG("rdFiltDataDe")||{}).value || "",
    dataAte:  (rdG("rdFiltDataAte")||{}).value|| "",
    pagina:   _rdPagAtual,
    porPagina:20
  };

  var corpo = rdG("rdHistCorpo");
  if(corpo) corpo.innerHTML = '<div class="rd-vazio">⏳ Carregando...</div>';

  var pag = rdG("rdPaginacao");
  if(pag) pag.style.display = "none";

  google.script.run
    .withSuccessHandler(function(res){
      if(!res || !res.ok){
        if(corpo) corpo.innerHTML = '<div class="rd-vazio">❌ Erro ao carregar.</div>';
        return;
      }
      var sub = rdG("rdHistSub");
      if(sub) sub.textContent = res.total + " recibo(s) encontrado(s)";

      if(!res.dados || !res.dados.length){
        if(corpo) corpo.innerHTML = '<div class="rd-vazio">📭 Nenhum recibo encontrado.</div>';
        return;
      }
      _rdRenderizarHistorico(res);
    })
    .withFailureHandler(function(err){
      if(corpo) corpo.innerHTML = '<div class="rd-vazio">❌ Erro: ' + ((err&&err.message)||err) + '</div>';
    })
    .listarHistoricoReciboDiversos(filtros, SISGEP_TOKEN_SESSAO);
}

      var bh = '<button class="rd-pag-btn" ' + (res.pagina<=1?"disabled":"") + ' onclick="_rdPagAtual=' + (res.pagina-1) + ';_rdCarregarHistorico()">‹</button>';
      var ini = Math.max(1, res.pagina-2), fim = Math.min(res.paginas, res.pagina+2);
      for(var p=ini; p<=fim; p++) bh += '<button class="rd-pag-btn' + (p===res.pagina?" ativo":"") + '" onclick="_rdPagAtual=' + p + ';_rdCarregarHistorico()">' + p + '</button>';
      bh += '<button class="rd-pag-btn" ' + (res.pagina>=res.paginas?"disabled":"") + ' onclick="_rdPagAtual=' + (res.pagina+1) + ';_rdCarregarHistorico()">›</button>';
      btns.innerHTML = bh;
    }
  } else if(pag){ pag.style.display = "none"; }
}

/* ═══════════════════════════════════════
   AÇÕES DO HISTÓRICO
═══════════════════════════════════════ */
function _rdReenviarEmailRd(r){
  if(!confirm("Reenviar e-mail do recibo " + r.numero + " para " + r.email + "?")) return;
  loader(true);
  google.script.run
    .withSuccessHandler(function(res){ loader(false); alert(res.ok?"✅ "+res.mensagem:"❌ "+res.mensagem); if(res.ok) _rdCarregarHistorico(); })
    .withFailureHandler(function(err){ loader(false); alert("Erro: "+((err&&err.message)||err)); })
    .reenviarEmailReciboDiverso({ email:r.email, linkPdf:r.linkPdf, numero:r.numero, nome:r.pagadorNome||r.nome, valor:r.valor, descricao:r.descricao }, SISGEP_TOKEN_SESSAO);
}

function _rdWhatsHistorico(r){
  var num = String(r.whatsapp||"").replace(/\D/g,"");
  if(num.length>=10 && !num.startsWith("55")) num = "55" + num;
  var msg = "Olá, " + (r.pagadorNome||r.nome||"") + "!\n\nSegue o recibo nº " + r.numero + ".\n💰 Valor: R$ " + r.valor + "\n📋 " + r.descricao + "\n\n🔗 " + r.linkPdf + "\n\nApós assinar, devolva o documento assinado.\n\nAtenciosamente,\nSINDEDUCAÇÃO-ES";
  window.open("https://wa.me/" + num + "?text=" + encodeURIComponent(msg), "_blank");
}

function _rdExcluirRd(numero){
  if(!confirm("Excluir o recibo " + numero + " do histórico?\n\nO arquivo no Drive não será excluído.")) return;
  loader(true);
  google.script.run
    .withSuccessHandler(function(res){ loader(false); alert(res.ok?"✅ "+res.mensagem:"❌ "+res.mensagem); if(res.ok) _rdCarregarHistorico(); })
    .withFailureHandler(function(err){ loader(false); alert("Erro: "+((err&&err.message)||err)); })
    .excluirReciboDiverso({ numero: numero }, SISGEP_TOKEN_SESSAO);
}

/* ═══════════════════════════════════════
   TABS E BIND
═══════════════════════════════════════ */
function _rdBindTabs(){
  var tabNovo = rdG("rdTabNovo");
  var tabHist = rdG("rdTabHistorico");

  if(tabNovo && !tabNovo.dataset.bound){
    tabNovo.dataset.bound = "1";
    tabNovo.addEventListener("click", function(){
      tabNovo.classList.add("active"); tabHist.classList.remove("active");
      rdG("rdBlocoNovo").style.display = ""; rdG("rdBlocoHistorico").style.display = "none";
    });
  }
  if(tabHist && !tabHist.dataset.bound){
    tabHist.dataset.bound = "1";
    tabHist.addEventListener("click", function(){
      tabHist.classList.add("active"); tabNovo.classList.remove("active");
      rdG("rdBlocoNovo").style.display = "none"; rdG("rdBlocoHistorico").style.display = "";
      _rdPagAtual = 1; _rdCarregarHistorico();
    });
  }
}

function _rdBindBotoes(){
  document.addEventListener("click", function(e){
    var btn = e.target && e.target.closest ? e.target.closest("button") : null;
    if(!btn) return;

    var id = btn.id;

    if(id === "rdBtnAdicionarBenef"){ e.preventDefault(); rdAdicionarBeneficiario(null); return; }
    if(id === "rdBtnPreview")       { e.preventDefault(); rdPreviewFormulario(); return; }
    if(id === "rdBtnEmitir")        { e.preventDefault(); rdEmitirRecibos(); return; }
    if(id === "rdBtnBuscar")        { e.preventDefault(); _rdPagAtual=1; _rdCarregarHistorico(); return; }
    if(id === "rdBtnLimparFilt"){
      e.preventDefault();
      ["rdFiltNome","rdFiltNumero","rdFiltStatus","rdFiltDataDe","rdFiltDataAte"].forEach(function(fid){ var el=rdG(fid); if(el) el.value=""; });
      _rdPagAtual=1; _rdCarregarHistorico(); return;
    }
  }, false);
}

/* ═══════════════════════════════════════
   INIT
═══════════════════════════════════════ */
function initReciboDiversos(){
  _rdBindTabs();
  if(!_rdBotoesVinculados){
    _rdBindBotoes();
    _rdBotoesVinculados = true;
  }
  if(_rdItensForm.length === 0){
    rdAdicionarBeneficiario(null); // começa com exatamente 1 item
  }
}

window.initReciboDiversos     = initReciboDiversos;
window.initReciboDiversosNovo = initReciboDiversos;

if(document.readyState === "loading"){
  document.addEventListener("DOMContentLoaded", initReciboDiversos);
} else {
  initReciboDiversos();
}
</script>
