<div id="patrimonioAdmin" style="min-height:100%;background:#f0f4f8;font-family:'Plus Jakarta Sans',Arial,sans-serif;color:#0f172a;">
  <style>#patrimonioAdmin *{box-sizing:border-box}.pa-head{background:linear-gradient(135deg,var(--navy,#001f4d),var(--blue,#1565C0));color:#fff;padding:22px 24px;display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap}.pa-title{font-size:21px;font-weight:900}.pa-sub{font-size:12px;color:rgba(255,255,255,.68);margin-top:4px}.pa-wrap{padding:18px 22px 34px}.pa-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}.pa-card,.pa-panel{background:#fff;border:1px solid var(--g200,#e2e8f0);border-radius:14px;box-shadow:0 2px 10px rgba(0,20,60,.06)}.pa-card{padding:15px}.pa-card small{font-size:10px;font-weight:900;color:var(--g500,#64748b);text-transform:uppercase}.pa-card strong{display:block;font-size:26px;color:var(--navy,#001f4d);margin-top:7px}.pa-panel{overflow:hidden}.pa-bar{padding:14px 16px;border-bottom:1px solid #eef2f7;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.pa-form{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr auto;gap:10px;padding:14px 16px;background:var(--g50,#f8fafc);border-bottom:1px solid #eef2f7}.pa-field label{display:block;font-size:10px;font-weight:900;color:var(--g500,#64748b);text-transform:uppercase;margin-bottom:4px}.pa-field input,.pa-field select{width:100%;height:36px;border:1.5px solid #dbe4ef;border-radius:9px;padding:0 10px;font-family:inherit}.pa-btn{height:34px;border-radius:9px;border:1px solid var(--g300,#cbd5e1);background:#fff;color:var(--g700,#334155);font-size:12px;font-weight:800;padding:0 12px;cursor:pointer;font-family:inherit}.pa-btn.primary{background:linear-gradient(135deg,var(--navy,#001f4d),var(--blue,#1565C0));color:#fff;border-color:var(--blue,#1565C0)}.pa-search{padding:12px 16px;display:flex;gap:8px}.pa-search input{flex:1;height:36px;border:1.5px solid #dbe4ef;border-radius:999px;padding:0 14px}.pa-table{width:100%;border-collapse:collapse;min-width:760px}.pa-table th{background:var(--g50,#f8fafc);color:var(--g500,#64748b);font-size:10px;text-transform:uppercase;text-align:left;padding:10px}.pa-table td{font-size:12.5px;padding:11px 10px;border-top:1px solid var(--g100,#f1f5f9)}#patrimonioAdmin .pill{border-radius:999px;padding:3px 9px;font-size:10.5px;font-weight:900}#patrimonioAdmin .ok{background:#dcfce7;color:#166534}#patrimonioAdmin .warn{background:var(--amber-lt,#fef3c7);color:#92400e}#patrimonioAdmin .off{background:var(--red-lt,#fee2e2);color:#991b1b}@media(max-width:1000px){.pa-grid{grid-template-columns:repeat(2,1fr)}.pa-form{grid-template-columns:1fr 1fr}}</style>
  <div class="pa-head"><div><div class="pa-title">Patrimônio</div><div class="pa-sub">Inventário, bens, localização e manutenção</div></div><button class="pa-btn" onclick="spIr('sofia',null,{mensagem:'Preciso de apoio com inventário patrimonial.'})">Consultar SOFIA</button></div>
  <div class="pa-wrap"><div class="pa-grid"><div class="pa-card"><small>Total de bens</small><strong id="paTotal">0</strong></div><div class="pa-card"><small>Em uso</small><strong id="paUso">0</strong></div><div class="pa-card"><small>Manutenção</small><strong id="paManut">0</strong></div><div class="pa-card"><small>Valor estimado</small><strong id="paValor">R$ 0,00</strong></div></div>
    <div class="pa-panel"><div class="pa-bar"><strong>Controle patrimonial</strong><div><button class="pa-btn" onclick="paExportar()">Exportar CSV</button><button class="pa-btn" onclick="spIr('relatorios')">Relatórios</button></div></div>
      <div class="pa-form"><div class="pa-field"><label>Bem</label><input id="paNome" placeholder="Notebook, mesa, impressora..."></div><div class="pa-field"><label>Local</label><input id="paLocal" placeholder="Sede, sala..."></div><div class="pa-field"><label>Valor</label><input id="paValorCampo" placeholder="0,00"></div><div class="pa-field"><label>Status</label><select id="paStatus"><option>Em uso</option><option>Manutenção</option><option>Baixado</option></select></div><button class="pa-btn primary" onclick="paSalvar()">Salvar</button></div>
      <div class="pa-search"><input id="paBusca" placeholder="Buscar bem, local ou status..." oninput="paRender()"><button class="pa-btn" onclick="paLimpar()">Limpar</button></div><div style="overflow:auto"><table class="pa-table"><thead><tr><th>Bem</th><th>Local</th><th>Valor</th><th>Status</th><th>Ações</th></tr></thead><tbody id="paTabela"></tbody></table></div>
    </div>
  </div>
  <script>(function(){var KEY="sisgep_patrimonio_v1",edit="";function g(i){return document.getElementById(i)}function dados(){try{return JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){return[]}}function salvar(l){localStorage.setItem(KEY,JSON.stringify(l||[]))}function num(v){v=String(v||"").replace(/\./g,"").replace(",",".").replace(/[^\d.-]/g,"");v=Number(v);return isFinite(v)?v:0}function moeda(v){return Number(v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"})}function esc(s){return String(s||"").replace(/[&<>"']/g,function(c){return({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c])})}function cls(s){return s==="Em uso"?"ok":s==="Manutenção"?"warn":"off"}window.paRender=function(){var l=dados(),b=String((g("paBusca")||{}).value||"").toLowerCase(),f=l.filter(function(x){return !b||[x.nome,x.local,x.status].join(" ").toLowerCase().indexOf(b)>=0});g("paTotal").textContent=l.length;g("paUso").textContent=l.filter(function(x){return x.status==="Em uso"}).length;g("paManut").textContent=l.filter(function(x){return x.status==="Manutenção"}).length;g("paValor").textContent=moeda(l.reduce(function(s,x){return s+Number(x.valor||0)},0));g("paTabela").innerHTML=f.length?f.map(function(x){return"<tr><td><strong>"+esc(x.nome)+"</strong></td><td>"+esc(x.local)+"</td><td>"+moeda(x.valor)+"</td><td><span class='pill "+cls(x.status)+"'>"+esc(x.status)+"</span></td><td><button class='pa-btn' onclick=\"paEditar('"+x.id+"')\">Editar</button> <button class='pa-btn' onclick=\"paExcluir('"+x.id+"')\">Excluir</button></td></tr>"}).join(""):"<tr><td colspan='5' style='text-align:center;color:#94a3b8;padding:24px'>Nenhum bem cadastrado.</td></tr>"};window.paSalvar=function(){var x={id:edit||String(Date.now()),nome:g("paNome").value,local:g("paLocal").value,valor:num(g("paValorCampo").value),status:g("paStatus").value};if(!x.nome)return toast("Informe o bem.","warn");var l=dados(),i=l.findIndex(function(a){return a.id===x.id});if(i>=0)l[i]=x;else l.push(x);salvar(l);paLimpar();paRender()};window.paEditar=function(id){var x=dados().find(function(a){return a.id===id});if(!x)return;edit=id;g("paNome").value=x.nome;g("paLocal").value=x.local;g("paValorCampo").value=String(x.valor||"").replace(".",",");g("paStatus").value=x.status};window.paExcluir=function(id){if(confirm("Excluir bem?")){salvar(dados().filter(function(x){return x.id!==id}));paRender()}};window.paLimpar=function(){edit="";["paNome","paLocal","paValorCampo"].forEach(function(i){g(i).value=""});g("paStatus").value="Em uso"};window.paExportar=function(){var rows=[["Bem","Local","Valor","Status"]].concat(dados().map(function(x){return[x.nome,x.local,x.valor,x.status]}));var csv=rows.map(function(r){return r.map(function(c){return'"'+String(c||"").replace(/"/g,'""')+'"'}).join(";")}).join("\n");var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));a.download="sisgep-patrimonio.csv";a.click()};window.initPatrimonio=paRender;if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",paRender);else setTimeout(paRender,80)})();</script>
</div>
