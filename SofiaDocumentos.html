<script>
/* ═══════════════════════════════════════════════════════════
   SOFIA DOCUMENTOS — Controller
═══════════════════════════════════════════════════════════ */
(function() {
"use strict";

var SD = {
  aberto: false,
  analisando: false,
  ultimoTipo: "",
  ultimaEscola: "",
  pendencias: 0,
  textoGerado: "",
  debTimer: null
};

function g(id) { return document.getElementById(id); }
function esc(t) { return String(t||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

/* ── Toggle painel ── */
window.sofiaDocToggle = function() {
  var panel = g("sofiaDocPanel");
  if (!panel) return;
  SD.aberto = !SD.aberto;
  panel.style.display = SD.aberto ? "flex" : "none";
  if (SD.aberto) sofiaDocAnalisar();
};

window.sofiaDocFechar = function() {
  var panel = g("sofiaDocPanel");
  if (panel) panel.style.display = "none";
  SD.aberto = false;
};

/* ── Adiciona mensagem no painel ── */
function sofiaMsg(html, tipo) {
  var body = g("sofiaDocBody"); if (!body) return;
  var el = document.createElement("div");
  el.className = "sofia-msg";
  el.innerHTML = html;
  body.appendChild(el);
  body.scrollTop = body.scrollHeight;
}

function sofiaAlerta(txt, tipo) {
  var body = g("sofiaDocBody"); if (!body) return;
  var el = document.createElement("div");
  el.className = "sofia-alert " + (tipo || "info");
  el.textContent = txt;
  body.appendChild(el);
  body.scrollTop = body.scrollHeight;
}

function sofiaLoading() {
  var body = g("sofiaDocBody"); if (!body) return null;
  var el = document.createElement("div");
  el.className = "sofia-msg loading";
  el.innerHTML = '<div class="sofia-dot-anim"><span></span><span></span><span></span></div><span>SOFIA analisando...</span>';
  body.appendChild(el);
  body.scrollTop = body.scrollHeight;
  return el;
}

function sofiaClearBody() {
  var body = g("sofiaDocBody"); if (!body) return;
  body.innerHTML = "";
}

/* ── Analisa o formulário atual ── */
window.sofiaDocAnalisar = function() {
  if (SD.analisando) return;

  var tipo    = (g("tipo") ? g("tipo").value : "") || "";
  var escola  = (g("escolaProfileNome") ? g("escolaProfileNome").textContent : "").replace(/—/g,"").trim();
  var email   = (g("email") ? g("email").value : "") || "";
  var lista   = document.querySelectorAll("#listaTrabalhadores .trabalhador-card") || [];
  var qtd     = lista.length;
  var corpo   = (g("corpo") ? g("corpo").value : "") || "";

  // Só reanalisa se algo mudou
  var chave = tipo + escola + qtd;
  if (chave === SD._lastChave && !SD.aberto) return;
  SD._lastChave = chave;

  sofiaClearBody();

  var pendencias = 0;
  var alertas = [];

  // Saudação
  sofiaMsg("Analisando o fluxo atual...");

  // Tipo
  if (!tipo) {
    alertas.push({ txt: "Selecione o tipo de ofício para começar.", tipo: "warn" });
    pendencias++;
  } else {
    alertas.push({ txt: "✓ Tipo definido: " + tipo, tipo: "ok" });
  }

  // Escola
  if (tipo && tipo !== "Ofício Livre") {
    if (!escola || escola === "—") {
      alertas.push({ txt: "Selecione uma escola no campo de busca.", tipo: "warn" });
      pendencias++;
    } else {
      alertas.push({ txt: "✓ Escola: " + escola, tipo: "ok" });
      if (!email) {
        alertas.push({ txt: "A escola não tem e-mail cadastrado. Adicione um antes de emitir.", tipo: "err" });
        pendencias++;
      }
    }
  }

  // Trabalhadores
  if (tipo && tipo !== "Ofício Livre" && tipo !== "Taxa Assistencial") {
    if (qtd === 0) {
      alertas.push({ txt: "Adicione pelo menos 1 trabalhador vinculado.", tipo: "warn" });
      pendencias++;
    } else {
      // Verifica CPFs
      var semCpf = 0;
      lista.forEach(function(card) {
        var cpf = card.querySelector(".input-cpf-trabalhador");
        if (cpf && !String(cpf.value || "").replace(/\D/g, "")) semCpf++;
      });
      if (semCpf > 0) {
        alertas.push({ txt: semCpf + " trabalhador(es) sem CPF preenchido.", tipo: "warn" });
        pendencias++;
      } else {
        alertas.push({ txt: "✓ " + qtd + " trabalhador(es) com dados completos.", tipo: "ok" });
      }
    }
  }

  // Ofício Livre
  if (tipo === "Ofício Livre") {
    var para = g("para") ? g("para").value.trim() : "";
    if (!para) { alertas.push({ txt: "Informe o destinatário do Ofício Livre.", tipo: "warn" }); pendencias++; }
    if (!corpo) { alertas.push({ txt: "Use o botão IA para gerar o corpo do ofício.", tipo: "info" }); }
  }

  alertas.forEach(function(a) { sofiaAlerta(a.txt, a.tipo); });

  // Atualiza badge
  SD.pendencias = pendencias;
  var badge = g("sofiaIaBadge");
  if (badge) {
    badge.style.display = pendencias > 0 ? "block" : "none";
    badge.textContent = pendencias;
  }

  // Se tudo ok, sugere ação
  if (pendencias === 0 && tipo) {
    sofiaMsg("✅ Fluxo pronto para emissão! Clique em <strong>Emitir Documento</strong> ou peça para eu gerar o texto.", "ok");
  }

  // Se tem corpo gerado, mostra
  if (SD.textoGerado) {
    sofiaExibirTexto(SD.textoGerado);
  }
};

/* ── Gerar texto com IA ── */
window.sofiaDocGerarTexto = function() {
  var tipo        = g("tipo")              ? g("tipo").value.trim()                         : "";
  var escola      = g("escolaProfileNome") ? g("escolaProfileNome").textContent.replace(/—/g,"").trim() : "";
  var cnpj        = g("escolaProfileCnpj") ? g("escolaProfileCnpj").textContent.replace(/—/g,"").trim() : "";
  var destinat    = g("para")              ? g("para").value.trim()                         : "";
  var cargo       = g("cargo")             ? g("cargo").value.trim()                        : "";
  var instituicao = g("instituicao")       ? g("instituicao").value.trim()                  : "";
  var assunto     = g("assunto")           ? g("assunto").value.trim()                      : "";
  var corpoAtual  = g("corpo")             ? g("corpo").value.trim()                        : "";

  if (!tipo) {
    sofiaAlerta("Selecione o tipo de ofício antes de gerar o texto.", "warn");
    return;
  }

  // Abre painel se fechado
  var panel = g("sofiaDocPanel");
  if (panel) panel.style.display = "flex";
  SD.aberto = true;

  sofiaClearBody();
  var loader = sofiaLoading();

  SD.analisando = true;

  var prompt =
    "Você é especialista em elaboração de ofícios sindicais do SindEducação-ES.\n\n"
    + "Gere apenas o corpo textual do ofício, sem cabeçalho, sem número, sem data e sem assinatura.\n\n"
    + "Dados disponíveis:\n"
    + "Tipo do ofício: " + tipo + "\n"
    + (escola ? "Escola: " + escola + "\n" : "")
    + (cnpj   ? "CNPJ: " + cnpj + "\n" : "")
    + (destinat ? "Destinatário: " + destinat + "\n" : "")
    + (cargo    ? "Cargo/Função: " + cargo + "\n" : "")
    + (instituicao ? "Instituição: " + instituicao + "\n" : "")
    + (assunto  ? "Assunto/Referência: " + assunto + "\n" : "")
    + (corpoAtual ? "Texto já digitado pelo usuário (usar como base): " + corpoAtual + "\n" : "")
    + "\nRegras:\n"
    + "- Responda em português do Brasil formal e sindical.\n"
    + "- Não crie número de ofício, data ou assinatura.\n"
    + "- Não use markdown, negrito ou separadores.\n"
    + "- Não invente dados. Use exatamente os dados fornecidos.\n"
    + "- Retorne apenas o corpo do ofício.\n"
    + "- Para Filiação: mencione a Cláusula 56ª da CCT 2026/2027 (vigência 01/03/2026 a 28/02/2027). O desconto é de 2% sobre o salário-base, autorizado expressamente pelo associado via ficha de filiação. O repasse deve ocorrer até o 10º dia do mês subsequente.\n"
    + "- Para Desfiliação: solicite cessação imediata dos descontos de mensalidade sindical (2%), conforme Cláusula 56ª da CCT 2026/2027.\n"
    + "- Para Taxa Negocial: mencione a Cláusula 57ª da CCT 2026/2027. A taxa é de 6% paga em 3 parcelas mensais de 2%, com repasse até o 10º dia útil do mês subsequente ao desconto. Ficam isentos os filiados ao SindEducação-ES.\n"
    + "- Para Taxa Assistencial: mencione a Cláusula 58ª da CCT 2026/2027. O valor é de 4% da folha salarial bruta dos educadores técnico-administrativos, em duas parcelas de 2%, com vencimentos em 15 de abril e 15 de maio de 2027.";

  google.script.run
    .withSuccessHandler(function(texto) {
      SD.analisando = false;
      if (loader && loader.parentNode) loader.remove();
      texto = String(texto || "").trim();
      if (!texto) {
        sofiaAlerta("A IA não retornou nenhum texto. Tente novamente.", "err");
        return;
      }
      SD.textoGerado = texto;
      sofiaExibirTexto(texto);

      // Preenche o campo automaticamente
      var campo = g("corpo");
      if (campo) {
        campo.value = texto;
        campo.dispatchEvent(new Event("input", { bubbles: true }));
        var contador = g("contadorCorpo");
        if (contador) contador.textContent = texto.length + " / 3000";
      }
    })
    .withFailureHandler(function(err) {
      SD.analisando = false;
      if (loader && loader.parentNode) loader.remove();
      sofiaAlerta("Erro ao gerar texto: " + ((err && err.message) || err), "err");
    })
    .iaAssistente(prompt, SISGEP_TOKEN_SESSAO);
};

function sofiaExibirTexto(texto) {
  var body = g("sofiaDocBody"); if (!body) return;
  var wrap = document.createElement("div");
  wrap.className = "sofia-texto-sug";
  wrap.innerHTML =
    '<div class="sofia-texto-sug-label">✨ Texto gerado pela SOFIA</div>'
    + '<div class="sofia-texto-sug-content">' + esc(texto) + '</div>'
    + '<div class="sofia-texto-sug-btns">'
    + '<button class="sofia-btn sofia-btn-primary" onclick="sofiaAplicarTexto()">✅ Aplicar no campo</button>'
    + '<button class="sofia-btn sofia-btn-secondary" onclick="sofiaDocGerarTexto()">↻ Regenerar</button>'
    + '</div>';
  body.appendChild(wrap);
  body.scrollTop = body.scrollHeight;
}

window.sofiaAplicarTexto = function() {
  if (!SD.textoGerado) return;
  var campo = g("corpo");
  if (campo) {
    campo.value = SD.textoGerado;
    campo.dispatchEvent(new Event("input", { bubbles: true }));
    var contador = g("contadorCorpo");
    if (contador) contador.textContent = SD.textoGerado.length + " / 3000";
    campo.focus();
  }
  sofiaAlerta("✓ Texto aplicado no campo do ofício!", "ok");
};

/* ── Chat livre com SOFIA ── */
window.sofiaDocChat = function() {
  var input = g("sofiaDocChatInput");
  var txt = input ? input.value.trim() : "";
  if (!txt) return;
  if (input) input.value = "";

  sofiaMsg('<strong>Você:</strong> ' + esc(txt));
  var loader = sofiaLoading();

  var tipo    = g("tipo")              ? g("tipo").value : "";
  var escola  = g("escolaProfileNome") ? g("escolaProfileNome").textContent.replace(/—/g,"").trim() : "";

  var prompt =
    "Você é a SOFIA, assistente sindical do SindEducação-ES, especialista em ofícios sindicais, CCT, filiação, taxas e mensalidades.\n"
    + "Contexto atual: o usuário está no módulo de Documentos.\n"
    + (tipo ? "Tipo de ofício selecionado: " + tipo + ".\n" : "")
    + (escola ? "Escola selecionada: " + escola + ".\n" : "")
    + "Pergunta do usuário: " + txt + "\n\n"
    + "Responda de forma objetiva, em português formal, em no máximo 3 parágrafos.";

  google.script.run
    .withSuccessHandler(function(resp) {
      if (loader && loader.parentNode) loader.remove();
      sofiaMsg('<strong>SOFIA:</strong> ' + esc(String(resp || "").trim()));
    })
    .withFailureHandler(function(err) {
      if (loader && loader.parentNode) loader.remove();
      sofiaAlerta("Erro: " + ((err && err.message) || err), "err");
    })
    .iaAssistente(prompt, SISGEP_TOKEN_SESSAO);
};

/* ── Monitoramento automático do formulário ── */
function monitorarFormulario() {
  var tipo   = g("tipo");
  var busca  = g("escolaBusca");
  var lista  = g("listaTrabalhadores");

  if (tipo) {
    tipo.addEventListener("change", function() {
      clearTimeout(SD.debTimer);
      SD.debTimer = setTimeout(sofiaDocAnalisar, 400);
    });
  }

  if (busca) {
    busca.addEventListener("input", function() {
      clearTimeout(SD.debTimer);
      SD.debTimer = setTimeout(sofiaDocAnalisar, 600);
    });
  }

  if (lista) {
    var obs = new MutationObserver(function() {
      clearTimeout(SD.debTimer);
      SD.debTimer = setTimeout(sofiaDocAnalisar, 500);
    });
    obs.observe(lista, { childList: true, subtree: true });
  }
}

/* ── Sobrescreve o botão IA da action bar para usar SOFIA ── */
function bindBotaoIA() {
  var btn = g("btnIAOficio");
  if (!btn || btn.dataset.sofiaBind) return;
  btn.dataset.sofiaBind = "1";
  btn.removeAttribute("onclick");
  btn.onclick = null;

  // Adiciona badge
  if (!g("sofiaIaBadge")) {
    var badge = document.createElement("span");
    badge.id = "sofiaIaBadge";
    btn.style.position = "relative";
    btn.appendChild(badge);
  }

  btn.addEventListener("click", function(e) {
    e.preventDefault();
    e.stopPropagation();
    sofiaDocGerarTexto();
  }, true);
}

/* ── Bind botão send e Enter ── */
function bindSend() {
  var btn = g("sofiaDocSendBtn");
  if (btn) btn.onclick = function() { sofiaDocChat(); };
  var input = g("sofiaDocChatInput");
  if (input) input.addEventListener("keydown", function(e) {
    if (e.key === "Enter") { e.preventDefault(); sofiaDocChat(); }
  });
}

/* ── Init ── */
function init() {
  monitorarFormulario();
  bindBotaoIA();
  bindSend();
  setTimeout(sofiaDocAnalisar, 800);
}

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", init);
} else {
  init();
}

// Re-bind quando o módulo documentos for aberto (navegação SOFIA)
document.addEventListener("sofiaModuloAberto", function(e) {
  if (e.detail && e.detail.modulo === "documentos") {
    setTimeout(function() {
      bindBotaoIA();
      sofiaDocAnalisar();
    }, 500);
  }
});

})();
</script>
