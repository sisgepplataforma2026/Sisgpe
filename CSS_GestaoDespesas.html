<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --navy:   #001f4d;
  --navy2:  #002f6c;
  --gold:   #C9A84C;
  --white:  #ffffff;
  --bg:     #f0f4f9;
  --text:   #0f172a;
  --muted:  #475569;
  --border: #e2e8f0;
  --green:  #059669;
  --red:    #dc2626;
  --blue:   #1565C0;
  --amber:  #d97706;
  --purple: #7c3aed;
  --radius: 12px;
}

html, body { height: 100%; font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--text); }

/* ── TOPBAR ── */
.topbar {
  background: linear-gradient(135deg, var(--navy), var(--navy2));
  border-bottom: 3px solid var(--gold);
  padding: 0 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 60px;
  position: sticky;
  top: 0;
  z-index: 100;
}

.topbar-left { display: flex; align-items: center; gap: 16px; }
.topbar-brand { font-size: 17px; font-weight: 900; color: var(--white); letter-spacing: .01em; }
.topbar-module { font-size: 12px; font-weight: 600; color: var(--gold); background: rgba(201,168,76,.15); padding: 3px 10px; border-radius: 999px; border: 1px solid rgba(201,168,76,.3); }
.topbar-back { font-size: 13px; color: rgba(255,255,255,.7); text-decoration: none; display: flex; align-items: center; gap: 4px; transition: color .2s; }
.topbar-back:hover { color: var(--white); }

/* ── TABS ── */
.tabs-wrap { background: var(--white); border-bottom: 1px solid var(--border); padding: 0 24px; display: flex; gap: 4px; overflow-x: auto; }
.tab-btn {
  padding: 14px 18px;
  font-size: 13px;
  font-weight: 700;
  color: var(--muted);
  border: none;
  background: none;
  cursor: pointer;
  border-bottom: 3px solid transparent;
  white-space: nowrap;
  transition: color .2s, border-color .2s;
  display: flex;
  align-items: center;
  gap: 6px;
  font-family: inherit;
}
.tab-btn:hover { color: var(--navy); }
.tab-btn.active { color: var(--navy); border-bottom-color: var(--gold); }
.tab-badge { background: var(--red); color: #fff; font-size: 10px; font-weight: 800; padding: 1px 6px; border-radius: 999px; }

/* ── MAIN ── */
.main { max-width: 1200px; margin: 0 auto; padding: 24px 20px 48px; }

.tab-panel { display: none; }
.tab-panel.active { display: block; }

/* ── STAT CARDS ── */
.stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px; margin-bottom: 24px; }

.stat-card {
  background: var(--white);
  border-radius: var(--radius);
  padding: 18px 20px;
  border: 1px solid var(--border);
  border-left: 4px solid var(--navy);
  position: relative;
  overflow: hidden;
}

.stat-card.green  { border-left-color: var(--green); }
.stat-card.amber  { border-left-color: var(--amber); }
.stat-card.blue   { border-left-color: var(--blue); }
.stat-card.red    { border-left-color: var(--red); }
.stat-card.purple { border-left-color: var(--purple); }

.stat-label { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 6px; }
.stat-value { font-size: 28px; font-weight: 900; color: var(--navy); line-height: 1; }
.stat-sub   { font-size: 12px; color: var(--muted); margin-top: 4px; font-weight: 500; }

/* ── SECTION HEADER ── */
.section-header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-bottom: 16px; }
.section-title  { font-size: 17px; font-weight: 800; color: var(--navy); }

/* ── FILTERS BAR ── */
.filters-bar {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 20px;
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  align-items: flex-end;
  margin-bottom: 16px;
}

.filter-group { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 140px; }
.filter-label { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.filter-group select,
.filter-group input {
  border: 1.5px solid var(--border);
  border-radius: 8px;
  padding: 8px 10px;
  font-family: inherit;
  font-size: 13px;
  color: var(--text);
  background: var(--white);
  height: 36px;
}
.filter-group select:focus,
.filter-group input:focus { outline: none; border-color: var(--blue); }

/* ── TABLE ── */
.table-wrap { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }

table { width: 100%; border-collapse: collapse; font-size: 13px; }
thead tr { background: #f8fafc; border-bottom: 2px solid var(--border); }
th { padding: 12px 14px; font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; text-align: left; white-space: nowrap; }
td { padding: 12px 14px; border-bottom: 1px solid #f1f5f9; vertical-align: middle; }
tbody tr:last-child td { border-bottom: none; }
tbody tr:hover { background: #f8fafc; }

.td-nome { font-weight: 700; color: var(--navy); max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.td-num  { font-size: 11px; font-weight: 700; color: var(--muted); }
.td-val  { font-weight: 700; white-space: nowrap; }

/* ── BADGES ── */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  font-weight: 700;
  padding: 3px 9px;
  border-radius: 999px;
  white-space: nowrap;
}

.badge-pendente     { background: #f1f5f9; color: #475569; border: 1px solid #cbd5e1; }
.badge-aguardando   { background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; }
.badge-doc          { background: #fff7ed; color: #c2410c; border: 1px solid #fed7aa; }
.badge-enviado      { background: #f5f3ff; color: #6d28d9; border: 1px solid #ddd6fe; }
.badge-pago         { background: #f0fdf4; color: #15803d; border: 1px solid #bbf7d0; }
.badge-cancelado    { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }

.badge-venc-ok      { background: #f0fdf4; color: #166534; border: 1px solid #86efac; }
.badge-venc-urgente { background: #fff7ed; color: #9a3412; border: 1px solid #fdba74; }
.badge-venc-vencido { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }

/* ── ACTIONS ── */
.action-btn {
  padding: 5px 10px;
  font-size: 11px;
  font-weight: 700;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--white);
  cursor: pointer;
  color: var(--text);
  font-family: inherit;
  transition: all .15s;
  white-space: nowrap;
}
.action-btn:hover { border-color: var(--navy); color: var(--navy); }
.action-btn.danger:hover { border-color: var(--red); color: var(--red); }
.action-btn.success:hover { border-color: var(--green); color: var(--green); }

.actions-cell { display: flex; gap: 4px; flex-wrap: wrap; }

/* ── BUTTONS ── */
.btn {
  padding: 10px 18px;
  font-size: 13px;
  font-weight: 700;
  border-radius: 10px;
  border: none;
  cursor: pointer;
  font-family: inherit;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: opacity .2s, transform .1s;
}
.btn:active { transform: scale(.98); }
.btn:disabled { opacity: .5; cursor: not-allowed; }

.btn-navy   { background: var(--navy); color: var(--white); }
.btn-navy:hover   { opacity: .9; }
.btn-green  { background: var(--green); color: var(--white); }
.btn-green:hover  { opacity: .9; }
.btn-gold   { background: var(--gold); color: var(--navy); }
.btn-gold:hover   { opacity: .9; }
.btn-outline { background: var(--white); color: var(--navy); border: 1.5px solid var(--border); }
.btn-outline:hover { border-color: var(--navy); }
.btn-sm { padding: 7px 12px; font-size: 12px; }

/* ── FORM ── */
.form-card { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius); padding: 28px; max-width: 640px; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.form-grid .full { grid-column: 1 / -1; }
.form-group { display: flex; flex-direction: column; gap: 5px; }
.form-label { font-size: 12px; font-weight: 700; color: var(--navy); }
.form-label .req { color: var(--red); margin-left: 2px; }
.form-label .opt { font-weight: 400; color: var(--muted); font-size: 11px; margin-left: 4px; }

input, select, textarea {
  border: 1.5px solid var(--border);
  border-radius: 8px;
  padding: 10px 12px;
  font-family: inherit;
  font-size: 13px;
  color: var(--text);
  background: #fafbfc;
  transition: border-color .2s;
}
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--blue); background: var(--white); }
textarea { resize: vertical; min-height: 70px; }

.form-actions { display: flex; gap: 10px; margin-top: 20px; }

/* ── LOTE CARD ── */
.lote-item {
  background: var(--white);
  border: 1.5px solid var(--border);
  border-radius: 10px;
  padding: 14px 16px;
  display: grid;
  grid-template-columns: 24px 1fr auto;
  align-items: center;
  gap: 12px;
  transition: border-color .2s;
}
.lote-item:hover { border-color: #94a3b8; }
.lote-item.selected { border-color: var(--blue); background: #eff6ff; }

.lote-item input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; accent-color: var(--blue); }
.lote-nome  { font-size: 14px; font-weight: 700; color: var(--navy); }
.lote-meta  { font-size: 12px; color: var(--muted); margin-top: 2px; }
.lote-valor { font-size: 15px; font-weight: 800; color: var(--navy); white-space: nowrap; }

.lote-grid { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }

/* ── ALERT / TOAST ── */
.alert {
  padding: 12px 16px;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 600;
  display: none;
  align-items: flex-start;
  gap: 8px;
  margin-bottom: 16px;
}
.alert.show  { display: flex; }
.alert.error { background: #fef2f2; border: 1px solid #fecaca; color: var(--red); }
.alert.success { background: #f0fdf4; border: 1px solid #bbf7d0; color: #166534; }
.alert.info  { background: #eff6ff; border: 1px solid #bfdbfe; color: #1d4ed8; }

/* ── TOAST ── */
.toast {
  position: fixed;
  bottom: 24px;
  right: 24px;
  background: var(--navy);
  color: var(--white);
  padding: 12px 20px;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 700;
  box-shadow: 0 8px 30px rgba(0,20,60,.25);
  z-index: 999;
  transform: translateY(80px);
  opacity: 0;
  transition: all .3s;
  max-width: 340px;
}
.toast.show { transform: translateY(0); opacity: 1; }
.toast.success { background: var(--green); }
.toast.error   { background: var(--red); }

/* ── LOADER ── */
.loader { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 48px 0; color: var(--muted); font-size: 14px; font-weight: 600; }
.spinner { width: 28px; height: 28px; border: 3px solid #e2e8f0; border-top-color: var(--blue); border-radius: 50%; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ── EMPTY ── */
.empty { text-align: center; padding: 48px 24px; color: var(--muted); }
.empty-icon { font-size: 40px; margin-bottom: 12px; }
.empty p { font-size: 14px; line-height: 1.6; }

/* ── PAGINATION ── */
.pagination { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 16px 0 0; }
.page-btn {
  padding: 6px 12px;
  font-size: 12px;
  font-weight: 700;
  border: 1.5px solid var(--border);
  border-radius: 8px;
  background: var(--white);
  cursor: pointer;
  font-family: inherit;
  color: var(--text);
  transition: all .15s;
}
.page-btn:hover { border-color: var(--navy); color: var(--navy); }
.page-btn.active { background: var(--navy); color: var(--white); border-color: var(--navy); }
.page-btn:disabled { opacity: .4; cursor: not-allowed; }

/* ── MODAL ── */
.modal-bg {
  position: fixed;
  inset: 0;
  background: rgba(0,20,60,.5);
  z-index: 200;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.modal-bg.open { display: flex; }
.modal {
  background: var(--white);
  border-radius: 16px;
  padding: 28px;
  max-width: 460px;
  width: 100%;
  box-shadow: 0 24px 64px rgba(0,20,60,.25);
}
.modal-title { font-size: 17px; font-weight: 800; color: var(--navy); margin-bottom: 8px; }
.modal-body  { font-size: 14px; color: var(--muted); line-height: 1.6; margin-bottom: 20px; }
.modal-actions { display: flex; gap: 10px; justify-content: flex-end; }

@media (max-width: 640px) {
  .form-grid { grid-template-columns: 1fr; }
  .form-grid .full { grid-column: 1; }
  .stats-grid { grid-template-columns: 1fr 1fr; }
  .main { padding: 16px 12px 48px; }
  .filters-bar { flex-direction: column; }
  .filter-group { min-width: 100%; }
}
</style>
