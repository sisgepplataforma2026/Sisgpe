<!DOCTYPE html>
<html>
<head>
<base target="_top">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{ --navy:#001f4d; --blue:#1565C0; --gold:#C9A84C; --ok:#059669; --erro:#dc2626; --alerta:#d97706; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ font-family:'Plus Jakarta Sans',system-ui,sans-serif; color:#1a2233; padding:16px; background:#f4f6fa; min-height:100vh; }
  h2{ color:var(--navy); font-size:19px; margin-bottom:2px; }
  .sub{ color:#6b7280; font-size:12px; margin-bottom:16px; }
  .card{ background:#fff; border:1px solid #e2e8f0; border-radius:14px; padding:18px; margin-bottom:14px; box-shadow:0 4px 18px rgba(0,20,60,.05); }
  label{ font-size:12px; font-weight:700; color:#42505f; display:block; margin:8px 0 6px; }
  input{ width:100%; padding:14px 12px; border:1.5px solid #d3dbe4; border-radius:10px; font-size:20px; font-family:inherit; text-transform:uppercase; text-align:center; letter-spacing:.03em; }
  input:focus{ outline:none; border-color:var(--navy); }
  .btn{ padding:14px; border:none; border-radius:10px; font-weight:800; font-family:inherit; font-size:15px; cursor:pointer; width:100%; margin-top:10px; }
  .btn.p{ background:var(--navy); color:#fff; }
  .btn.ok{ background:var(--ok); color:#fff; }
  .btn:disabled{ opacity:.55; cursor:default; }
  .contador{ background:var(--navy); color:#fff; border-radius:12px; padding:10px 16px; display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; font-size:13px; }
  .contador b{ font-size:20px; }
  .ticket{ border-radius:12px; padding:16px; margin-top:14px; }
  .ticket.disp{ background:#ecfdf5; border:1.5px solid var(--ok); }
  .ticket.usado{ background:#fef2f2; border:1.5px solid var(--erro); }
  .ticket.cancel{ background:#fffbeb; border:1.5px solid var(--alerta); }
  .ticket .num{ font-size:13px; font-weight:800; color:var(--navy); letter-spacing:.02em; margin-bottom:6px; }
  .ticket .nome{ font-size:18px; font-weight:800; margin-bottom:4px; }
  .ticket .meta{ font-size:13px; color:#4b5563; }
  .tag{ display:inline-block; font-size:11px; font-weight:800; padding:3px 10px; border-radius:999px; text-transform:uppercase; margin-top:8px; }
  .tag.disp{ background:#d1fae5; color:#065f46; }
  .tag.usado{ background:#fee2e2; color:#7f1d1d; }
  .tag.cancel{ background:#fef3c7; color:#78350f; }
  .msg{ padding:10px 12px; border-radius:9px; font-size:13px; margin-top:10px; font-weight:600; }
  .msg.erro{ background:#fdecea; color:#7f1d1d; }
  .msg.aviso{ background:#fffbeb; color:#78350f; }
  .msg.ok{ background:#e6f4ea; color:#14532d; }
  .aviso-sessao{ background:#fdecea; color:#7f1d1d; padding:12px 16px; border-radius:10px; font-size:13px; font-weight:700; text-align:center; }
</style>
</head>
<body>
  <h2>🎟️ Check-in — Entrada do Evento</h2>
  <div class="sub">Festa Compasso da Vida 2026</div>

  <div class="contador">
    <span>Confirmados nesta sessão</span>
    <b id="ckContador">0</b>
  </div>

  <div id="ckSemSessao" style="display:none" class="aviso-sessao">
    Sessão não identificada. Abra este check-in a partir do botão "Abrir Check-in" dentro do SISGEP.
  </div>

  <div id="ckApp">
    <div class="card">
      <label for="ckCodigo">Número do ingresso</label>
      <input id="ckCodigo" placeholder="000123" autocomplete="off" inputmode="numeric">
      <button class="btn p" id="btnCkBuscar">Buscar ingresso</button>
      <div id="ckMsg"></div>
    </div>

    <div id="ckResultado"></div>
  </div>

<script>
  function ckObterTokenSessao(){
    try{
      var params = new URLSearchParams(window.location.search);
      var t = params.get('sessao') || '';
      if(t){
        var url = new URL(window.location.href);
        url.searchParams.delete('sessao');
        window.history.replaceState(null, '', url.pathname + (url.search || ''));
      }
      return t;
    }catch(e){ return ''; }
  }
  var CK_TOKEN = ckObterTokenSessao();
  var CK_CONTADOR = 0;
  var CK_INGRESSO_ATUAL = null;

  if(!CK_TOKEN){
    document.getElementById('ckSemSessao').style.display = 'block';
    document.getElementById('ckApp').style.display = 'none';
  }

  function ckMsg(html, tipo){
    var box = document.getElementById('ckMsg');
    box.innerHTML = html ? '<div class="msg '+(tipo||'erro')+'">'+html+'</div>' : '';
  }

  function ckEsc(t){
    return String(t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function ckFormatarData(v){
    if(!v) return '';
    try{ var d = new Date(v); return isNaN(d.getTime()) ? String(v) : d.toLocaleString('pt-BR'); }
    catch(e){ return String(v); }
  }

  function ckRenderTicket(ing){
    var box = document.getElementById('ckResultado');
    if(!ing){ box.innerHTML=''; return; }

    var cls = 'disp', tagTxt = 'Pode entrar', extra = '';
    if(ing.status === 'UTILIZADO'){
      cls = 'usado'; tagTxt = 'Já utilizado';
      extra = '<div class="meta" style="margin-top:6px">Check-in em '+ckEsc(ckFormatarData(ing.checkinEm))+(ing.checkinPor?' por '+ckEsc(ing.checkinPor):'')+'</div>';
    } else if(ing.status === 'CANCELADO'){
      cls = 'cancel'; tagTxt = 'Cancelado';
    }

    box.innerHTML =
      '<div class="ticket '+cls+'">'
      + '<div class="num">'+ckEsc(ing.numero)+'</div>'
      + '<div class="nome">'+ckEsc(ing.nome)+'</div>'
      + '<div class="meta">'+ckEsc((ing.categoria||'').toUpperCase())+(ing.escola?' · '+ckEsc(ing.escola):'')+'</div>'
      + '<span class="tag '+cls+'">'+tagTxt+'</span>'
      + extra
      + (cls==='disp' ? '<button class="btn ok" id="btnCkConfirmar">✅ Confirmar entrada</button>' : '')
      + '</div>';

    var btnConfirmar = document.getElementById('btnCkConfirmar');
    if(btnConfirmar){
      btnConfirmar.addEventListener('click', ckConfirmarEntrada);
    }
  }

  function ckBuscar(){
    var codigo = document.getElementById('ckCodigo').value.trim();
    if(!codigo){ ckMsg('Digite o número do ingresso.', 'erro'); return; }
    ckMsg('');
    document.getElementById('ckResultado').innerHTML = '';
    var btn = document.getElementById('btnCkBuscar');
    btn.disabled = true; btn.textContent = 'Buscando…';
    google.script.run
      .withSuccessHandler(function(r){
        btn.disabled = false; btn.textContent = 'Buscar ingresso';
        if(!r || r.ok !== true){ ckMsg(ckEsc((r&&r.mensagem)||'Ingresso não encontrado.'), 'erro'); return; }
        CK_INGRESSO_ATUAL = r;
        ckRenderTicket(r);
      })
      .withFailureHandler(function(e){
        btn.disabled = false; btn.textContent = 'Buscar ingresso';
        ckMsg('Erro: '+ckEsc((e&&e.message)||String(e||'')), 'erro');
      })
      .checkin_buscarIngresso(codigo, CK_TOKEN);
  }

  function ckConfirmarEntrada(){
    if(!CK_INGRESSO_ATUAL) return;
    var btn = document.getElementById('btnCkConfirmar');
    if(btn){ btn.disabled = true; btn.textContent = 'Confirmando…'; }
    google.script.run
      .withSuccessHandler(function(r){
        if(!r || r.ok !== true){
          ckMsg(ckEsc((r&&r.mensagem)||'Não foi possível confirmar a entrada.'), r&&r.jaUsado?'aviso':'erro');
          if(r && (r.status==='UTILIZADO'||r.status==='CANCELADO')){
            CK_INGRESSO_ATUAL.status = r.status;
            CK_INGRESSO_ATUAL.checkinEm = r.checkinEm||CK_INGRESSO_ATUAL.checkinEm;
            CK_INGRESSO_ATUAL.checkinPor = r.checkinPor||CK_INGRESSO_ATUAL.checkinPor;
            ckRenderTicket(CK_INGRESSO_ATUAL);
          }
          return;
        }
        CK_CONTADOR++;
        document.getElementById('ckContador').textContent = CK_CONTADOR;
        ckMsg('✅ Entrada confirmada: '+ckEsc(r.nome), 'ok');
        CK_INGRESSO_ATUAL.status = 'UTILIZADO';
        ckRenderTicket(CK_INGRESSO_ATUAL);
        document.getElementById('ckCodigo').value = '';
        document.getElementById('ckCodigo').focus();
      })
      .withFailureHandler(function(e){
        if(btn){ btn.disabled = false; btn.textContent = '✅ Confirmar entrada'; }
        ckMsg('Erro: '+ckEsc((e&&e.message)||String(e||'')), 'erro');
      })
      .checkin_confirmarEntrada(CK_INGRESSO_ATUAL.numero, CK_TOKEN);
  }

  document.getElementById('btnCkBuscar').addEventListener('click', ckBuscar);
  document.getElementById('ckCodigo').addEventListener('keydown', function(e){
    if(e.key === 'Enter'){ e.preventDefault(); ckBuscar(); }
  });
  document.getElementById('ckCodigo').focus();
</script>
</body>
</html>
