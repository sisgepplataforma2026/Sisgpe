<div id="eventosAdmin" style="min-height:100%;background:#f0f4f8;font-family:'Plus Jakarta Sans',Arial,sans-serif;color:#0f172a;">
<style>
#eventosAdmin *{box-sizing:border-box}.ev-head{background:linear-gradient(135deg,var(--navy,#001f4d),var(--blue,#1565C0));color:#fff;padding:22px 24px;display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap}.ev-title{font-size:21px;font-weight:900}.ev-sub{font-size:12px;color:rgba(255,255,255,.72);margin-top:4px}.ev-wrap{padding:18px 22px 34px}.ev-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}.ev-card,.ev-panel{background:#fff;border:1px solid #e2e8f0;border-radius:14px;box-shadow:0 2px 10px rgba(0,20,60,.06)}.ev-card{padding:15px}.ev-card small{font-size:10px;font-weight:900;color:#64748b;text-transform:uppercase}.ev-card strong{display:block;font-size:28px;color:#001f4d;margin-top:7px}.ev-panel{overflow:hidden}.ev-bar{padding:14px 16px;border-bottom:1px solid #eef2f7;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.ev-form{display:grid;grid-template-columns:1.4fr .9fr .9fr .9fr auto;gap:10px;padding:14px 16px;background:#f8fafc;border-bottom:1px solid #eef2f7}.ev-field label{display:block;font-size:10px;font-weight:900;color:#64748b;text-transform:uppercase;margin-bottom:4px}.ev-field input,.ev-field select{width:100%;height:36px;border:1.5px solid #dbe4ef;border-radius:9px;padding:0 10px;font-family:inherit}.ev-btn{height:34px;border-radius:9px;border:1px solid #cbd5e1;background:#fff;color:#334155;font-size:12px;font-weight:800;padding:0 12px;cursor:pointer;font-family:inherit}.ev-btn.primary{background:linear-gradient(135deg,#001f4d,#1565C0);color:#fff;border-color:#1565C0}.ev-btn.bingo{background:#eaf7ef;color:#136c36;border-color:#b8e1c7}.ev-search{padding:12px 16px;display:flex;gap:8px}.ev-search input{flex:1;height:36px;border:1.5px solid #dbe4ef;border-radius:999px;padding:0 14px}.ev-table{width:100%;border-collapse:collapse;min-width:860px}.ev-table th{background:#f8fafc;color:#64748b;font-size:10px;text-transform:uppercase;text-align:left;padding:10px}.ev-table td{font-size:12.5px;padding:11px 10px;border-top:1px solid #f1f5f9}.ev-pill{border-radius:999px;padding:3px 9px;font-size:10.5px;font-weight:900}.ev-ok{background:#dcfce7;color:#166534}.ev-warn{background:#fef3c7;color:#92400e}.ev-blue{background:#dbeafe;color:#1e40af}.ev-callout{background:#eef2ff;border:1px solid #c7d2fe;border-radius:14px;padding:14px 16px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}.ev-callout b{display:block;font-size:13px}.ev-callout span{display:block;font-size:12px;color:#475569;margin-top:2px}@media(max-width:1000px){.ev-grid{grid-template-columns:repeat(2,1fr)}.ev-form{grid-template-columns:1fr 1fr}}
</style>
<div class="ev-head"><div><div class="ev-title">Eventos</div><div class="ev-sub">Agenda sindical, atividades, comunicados e programações</div></div><button class="ev-btn" onclick="spIr('sofia',null,{mensagem:'Preciso planejar um evento sindical.'})">Planejar com SOFIA</button></div>
<div class="ev-wrap">
  <div class="ev-callout"><div><b>Operações especiais do módulo Eventos</b><span>Emissão de ingressos, check-in e Bingo são abertos pela URL oficial da homologação.</span></div><div><button class="ev-btn primary" onclick="evAbrirPainel('compasso')">📋 Inscrições — Compasso 2026 →</button> <button class="ev-btn" onclick="evAbrirPainel('emissao')">Abrir emissão de ingressos →</button> <button class="ev-btn" onclick="evAbrirPainel('checkin')">🎟️ Abrir check-in →</button> <button class="ev-btn bingo" onclick="evAbrirBingo()">🎲 Bingo — painel →</button> <button class="ev-btn bingo" onclick="evAbrirPainel('bingo-telao')">📺 Telão →</button> <button class="ev-btn bingo" onclick="evCopiarLinkInscricao()">🔗 Copiar link de inscrição</button></div></div>
  <div class="ev-grid"><div class="ev-card"><small>Próximos</small><strong id="evProximos">0</strong></div><div class="ev-card"><small>Hoje</small><strong id="evHoje">0</strong></div><div class="ev-card"><small>Comunicação</small><strong id="evComunicacao">0</strong></div><div class="ev-card"><small>Concluídos</small><strong id="evConcluidos">0</strong></div></div>
  <div class="ev-panel"><div class="ev-bar"><strong>Calendário operacional</strong><div><button class="ev-btn" onclick="evExportar()">Exportar CSV</button><button class="ev-btn" onclick="spIr('documentos',null,{aba:'novo'})">Gerar ofício</button></div></div>
    <div class="ev-form"><div class="ev-field"><label>Evento</label><input id="evNome" placeholder="Ex.: Bingo, assembleia, reunião ou visita"></div><div class="ev-field"><label>Data</label><input id="evData" type="date"></div><div class="ev-field"><label>Tipo</label><select id="evTipo"><option>Assembleia</option><option>Reunião</option><option>Visita</option><option>Comunicado</option><option>Bingo</option><option>Festa / Confraternização</option><option>Campanha</option><option>Evento Institucional</option><option>Outro</option></select></div><div class="ev-field"><label>Status</label><select id="evStatus"><option>Planejado</option><option>Em andamento</option><option>Concluido</option></select></div><button class="ev-btn primary" onclick="evSalvar()">Salvar</button></div>
    <div class="ev-search"><input id="evBusca" placeholder="Buscar evento, tipo ou status..." oninput="evRender()"><button class="ev-btn" onclick="evLimpar()">Limpar</button></div>
    <div style="overflow:auto"><table class="ev-table"><thead><tr><th>Evento</th><th>Data</th><th>Tipo</th><th>Status</th><th>Ações</th></tr></thead><tbody id="evTabela"></tbody></table></div>
  </div>
</div>
<script>
(function(){
var EV_CACHE=[],EV_EDITANDO="";
function g(i){return document.getElementById(i)}
function esc(s){return String(s||"").replace(/[&<>"']/g,function(c){return({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c])})}
function tokenSessao(){return typeof SISGEP_TOKEN_SESSAO!=="undefined"?SISGEP_TOKEN_SESSAO:""}
function avisar(m,t){if(typeof toast==="function")toast(m,t)}
function cls(s){return s==="Concluido"?"ev-ok":s==="Em andamento"?"ev-warn":"ev-blue"}
function pintar(){var b=String((g('evBusca')||{}).value||'').toLowerCase(),h=new Date().toISOString().slice(0,10),f=EV_CACHE.filter(function(x){return !b||[x.nome,x.tipo,x.status].join(' ').toLowerCase().indexOf(b)>=0});g('evProximos').textContent=EV_CACHE.filter(function(x){return x.data>=h&&x.status!=="Concluido"}).length;g('evHoje').textContent=EV_CACHE.filter(function(x){return x.data===h}).length;g('evComunicacao').textContent=EV_CACHE.filter(function(x){return x.tipo==='Comunicado'}).length;g('evConcluidos').textContent=EV_CACHE.filter(function(x){return x.status==='Concluido'}).length;g('evTabela').innerHTML=f.length?f.map(function(x){return "<tr><td><strong>"+esc(x.nome)+"</strong></td><td>"+esc(x.data||'-')+"</td><td>"+esc(x.tipo)+"</td><td><span class='ev-pill "+cls(x.status)+"'>"+esc(x.status)+"</span></td><td><button class='ev-btn bingo' onclick=\"evAbrirBingo('"+esc(x.id)+"')\">🎯 Bingo</button> <button class='ev-btn' onclick=\"evEditar('"+esc(x.id)+"')\">Editar</button> <button class='ev-btn' onclick=\"evExcluir('"+esc(x.id)+"')\">Excluir</button></td></tr>"}).join(''):"<tr><td colspan='5' style='text-align:center;padding:24px;color:#94a3b8'>Nenhum evento cadastrado.</td></tr>"}
window.evRender=function(){google.script.run.withSuccessHandler(function(l){EV_CACHE=l||[];pintar()}).withFailureHandler(function(e){avisar('Erro ao carregar eventos: '+((e&&e.message)||e),'err')}).listarEventosAgenda(tokenSessao())};
window.evSalvar=function(){var x={id:EV_EDITANDO||'',nome:g('evNome').value,data:g('evData').value,tipo:g('evTipo').value,status:g('evStatus').value};if(!x.nome.trim())return avisar('Informe o evento.','warn');google.script.run.withSuccessHandler(function(r){if(!r||!r.ok)return avisar((r&&r.mensagem)||'Erro ao salvar.','err');avisar(r.mensagem||'Evento salvo.','ok');evLimpar();evRender()}).withFailureHandler(function(e){avisar('Erro: '+((e&&e.message)||e),'err')}).salvarEventoAgenda(x,tokenSessao())};
window.evEditar=function(id){var x=EV_CACHE.find(function(a){return a.id===id});if(!x)return;EV_EDITANDO=id;g('evNome').value=x.nome;g('evData').value=x.data;g('evTipo').value=x.tipo;g('evStatus').value=x.status};
window.evExcluir=function(id){if(!confirm('Excluir evento?'))return;google.script.run.withSuccessHandler(function(r){if(!r||!r.ok)return avisar((r&&r.mensagem)||'Erro ao excluir.','err');evRender()}).withFailureHandler(function(e){avisar('Erro: '+((e&&e.message)||e),'err')}).excluirEventoAgenda(id,tokenSessao())};
window.evLimpar=function(){EV_EDITANDO='';g('evNome').value='';g('evData').value='';g('evTipo').value='Assembleia';g('evStatus').value='Planejado'};
window.evExportar=function(){var rows=[["Evento","Data","Tipo","Status"]].concat(EV_CACHE.map(function(x){return[x.nome,x.data,x.tipo,x.status]})),csv=rows.map(function(r){return r.map(function(c){return '"'+String(c||'').replace(/"/g,'""')+'"'}).join(';')}).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='sisgep-eventos.csv';a.click()};
window.evAbrirPainel=function(painel,eventoId){var token=tokenSessao();if(!token)return avisar('Sessão não encontrada. Entre novamente no SISGEP.','err');google.script.run.withSuccessHandler(function(base){var url=String(base||'')+'?painel='+encodeURIComponent(painel)+'&sessao='+encodeURIComponent(token);if(eventoId)url+='&evento='+encodeURIComponent(eventoId);window.open(url,'_blank')}).withFailureHandler(function(e){avisar('Não foi possível abrir o painel: '+((e&&e.message)||e),'err')}).eventos_obterWebAppUrl(token)};
window.evAbrirEmissaoIngressos=function(){evAbrirPainel('emissao')};
window.evAbrirCheckin=function(){evAbrirPainel('checkin')};
window.evAbrirBingo=function(eventoId){evAbrirPainel('bingo',eventoId)};
/* O LINK DE INSCRIÇÃO É PARA DIVULGAR, não para abrir aqui.
   É ele que vai no WhatsApp e no Instagram do sindicato. Por isso a ação é
   COPIAR, e não window.open: quem clica quer o endereço na área de
   transferência, não mais uma aba aberta.

   A rota é pública (?bingo-inscricao=<eventoId>) e NÃO leva token de sessão —
   se levasse, o link do sindicato carregaria a credencial de quem o gerou
   para dentro de todo grupo de WhatsApp em que fosse colado. */
window.evCopiarLinkInscricao=function(eventoId){
  var token=tokenSessao();
  if(!token)return avisar('Sessão não encontrada. Entre novamente no SISGEP.','err');
  var id=String(eventoId||prompt('ID do evento para a inscrição:')||'').trim();
  if(!id)return;
  google.script.run.withSuccessHandler(function(base){
    var url=String(base||'')+'?bingo-inscricao='+encodeURIComponent(id);
    var pronto=function(){avisar('Link copiado: '+url,'ok')};
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).then(pronto,function(){prompt('Copie o link:',url)});
    }else{prompt('Copie o link:',url)}
  }).withFailureHandler(function(e){
    avisar('Não foi possível montar o link: '+((e&&e.message)||e),'err');
  }).eventos_obterWebAppUrl(token);
};
window.initEventos=evRender;if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',evRender);else setTimeout(evRender,80);
})();
</script>
</div>
