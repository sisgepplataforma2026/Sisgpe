<script>
/* ═══════════════════════════════════════════
   Helpers.html — utilitários globais SISGEP
   Ofícios
═══════════════════════════════════════════ */

var estado = {
  arquivosSelecionados: [],
  contadorTrabalhador:  0
};

var CONFIG = {
  LIMITE_TRABALHADORES: 25
};

/* ── loader (stub — sem spinner visível neste módulo) ── */
function loader(status) {
  console.log("Loader:", status);
}

/* toast(msg, tipo, dur) vive em OficiosStyles.html (versão "rica", com ícone e
   barra de progresso). Havia uma segunda implementação aqui que, por ordem de
   include() (Helpers carrega depois de OficiosStyles), sobrescrevia o toast
   rico pela versão simples — corrigido removendo a duplicata daqui. */

/* ── utilitários de string ── */
function escapeHtml(texto) {
  return String(texto || "")
    .replace(/&/g,  "&amp;")
    .replace(/</g,  "&lt;")
    .replace(/>/g,  "&gt;")
    .replace(/"/g,  "&quot;")
    .replace(/'/g,  "&#039;");
}

function onlyDigits(valor) {
  return String(valor || "").replace(/\D/g, "");
}

function formatarCNPJFrontend(valor) {
  valor = onlyDigits(valor);
  return valor.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{2}).*/, "$1.$2.$3/$4-$5");
}

/* ── Utils (compatibilidade com código legado) ── */
var Utils = {
  aplicarMascaraCPF: function(input) {
    if (!input) return;
    var v = onlyDigits(input.value);
    v = v.replace(/^(\d{3})(\d)/,           "$1.$2");
    v = v.replace(/^(\d{3})\.(\d{3})(\d)/,  "$1.$2.$3");
    v = v.replace(/\.(\d{3})(\d)/,           ".$1-$2");
    input.value = v.substring(0, 14);
  },

  /* Telefone brasileiro, fixo ou celular.
   *
   * Mora aqui e não na tela porque o CLAUDE.md manda: máscara é do Utils,
   * uma só para o sistema inteiro. Cada tela com a sua diverge no primeiro
   * ajuste — e telefone gravado em três formatos diferentes quebra qualquer
   * busca depois.
   *
   * Formata enquanto se digita, então precisa aguentar número incompleto:
   * "(27) 9" tem que sair de "279", não esperar os onze dígitos. */
  aplicarMascaraTelefone: function(input) {
    if (!input) return;
    var d = onlyDigits(input.value).substring(0, 11);
    var v = d;
    if (d.length > 2)  v = "(" + d.substring(0,2) + ") " + d.substring(2);
    if (d.length > 6)  {
      var corte = d.length > 10 ? 7 : 6;   // celular: 5 dígitos antes do traço
      v = "(" + d.substring(0,2) + ") " + d.substring(2, corte) + "-" + d.substring(corte);
    }
    input.value = v;
  },

  /* Validação completa com dígitos verificadores */
  validarCPF: function(cpf) {
    var dig = onlyDigits(cpf);
    if (dig.length !== 11) return false;
    if (/^(\d)\1{10}$/.test(dig)) return false;
    var soma = 0;
    for (var i = 0; i < 9; i++) soma += parseInt(dig[i]) * (10 - i);
    var r1 = (soma * 10) % 11; if (r1 === 10 || r1 === 11) r1 = 0;
    if (r1 !== parseInt(dig[9])) return false;
    soma = 0;
    for (var j = 0; j < 10; j++) soma += parseInt(dig[j]) * (11 - j);
    var r2 = (soma * 10) % 11; if (r2 === 10 || r2 === 11) r2 = 0;
    return r2 === parseInt(dig[10]);
  }
};

/* ════════════════════════════════════════════════════════════════════════
   INÍCIO · o resumo da Home, com um dono só

   HISTÓRICO — 31/08/2026, auditoria do Módulo 01.

   Este bloco nasceu como um "passe de confiabilidade" que rodava DEPOIS do
   index.html para corrigir a semântica dele. Eram duas chamadas ao mesmo
   endpoint, escrevendo nos MESMOS 11 ids do DOM, com leituras que discordavam:

     index.html    lia `prioridades` (compatibilidade) → fonte que falhou virava 0
     Helpers.html  lia `statusFontes` (a verdade)      → fonte que falhou virava ⚠

   Para ganhar a disputa, este arquivo usava `setTimeout(..., 450)` com o
   comentário "garante que este passe seja o último a refletir na UI". Mas 450 ms
   é palpite sobre a rede: quem escreve por último é quem RESPONDE por último.
   O t108 provou por execução — com o index respondendo depois, a Home passava a
   exibir "0" para um módulo que ela NÃO tinha conseguido ler, que é exatamente o
   que o InicioResumo.gs foi escrito para impedir (garantia nº 2 do cabeçalho).

   A correção não é ajustar o tempo: é eliminar a disputa. Agora existe um dono
   só do resumo — este arquivo — e uma chamada só. O `carregarResumoInicio()` do
   index.html delega para cá.

   O que este bloco renderiza, a partir de UMA resposta:
     · os cinco contadores de prioridade e o total;
     · os cinco indicadores de saúde (inclusive Ofícios, que o servidor já
       calculava e não tinha onde aparecer);
     · as atividades recentes da SOFIA (vieram do index.html nesta mesma
       correção, para não sobrar meia renderização lá);
     · a hora real da atualização.

   Semântica preservada: zero continua sendo zero; falha vira aviso âmbar com o
   motivo no title; módulo sem acesso some da lista em vez de exibir 0.
════════════════════════════════════════════════════════════════════════ */

/* Trava de reentrância. Sem ela, uma segunda chamada (navegação, botão de
   atualizar que venha a existir) dispara outra ida ao servidor e recria a
   corrida que esta correção acabou de fechar. */
var _inicioResumoEmVoo = false;

function inicioAplicarFonteNaHome_(fonte, idValor) {
  var el = document.getElementById(idValor);
  if (!el) return 0;
  var linha = el.closest ? el.closest(".spPriority") : null;

  if (fonte && fonte.semAcesso) {
    if (linha) linha.style.display = "none";
    return 0;
  }

  if (linha) linha.style.display = "";

  if (!fonte || !fonte.ok) {
    el.textContent = "⚠";
    el.style.color = "#f59e0b";
    el.title = (fonte && fonte.mensagem) || "Não foi possível atualizar esta informação.";
    if (linha) linha.title = el.title;
    return 0;
  }

  var valor = Number(fonte.valor || 0);
  el.textContent = valor;
  el.style.color = "";
  el.title = "";
  if (linha) linha.title = "";
  return isFinite(valor) ? valor : 0;
}

function inicioAplicarSaudeFonte_(fonte, idSaude) {
  var el = document.getElementById(idSaude);
  if (!el) return;

  if (!fonte || !fonte.ok) {
    el.textContent = fonte && fonte.semAcesso ? "SEM ACESSO" : "NÃO ATUALIZADO";
    el.className = "amber";
    el.title = fonte && fonte.mensagem ? fonte.mensagem : "Fonte indisponível.";
    return;
  }

  var atencao = Number(fonte.valor || 0) > 0;
  el.textContent = atencao ? "ATENÇÃO" : "OK";
  el.className = atencao ? "amber" : "green";
  el.title = "";
}

/* Atividades da SOFIA. Veio do index.html na correção de 31/08 — enquanto a
   renderização morava lá, tirar a chamada duplicada do index deixaria esta
   caixa sem quem a preenchesse.

   O filtro por identidade é do SERVIDOR (InicioResumo.gs): a aba
   Sofia_Auditoria é global e guarda a pergunta de todos. Aqui só se desenha o
   que já veio filtrado — nunca reabrir esse filtro na tela. */
function inicioAplicarAtividadesSofia_(itens) {
  var box = document.getElementById("spAtividadesSofia");
  if (!box) return;

  itens = itens || [];
  if (!itens.length) {
    box.innerHTML = "<div class='spAt'><p>Nenhuma interação registrada com a SOFIA ainda.</p></div>";
    return;
  }

  box.innerHTML = itens.map(function (a) {
    /* escapeHtml() é o utilitário único deste arquivo. O index.html tinha uma
       função de escape própria e idêntica declarada inline — duas implementações
       da mesma coisa é como uma delas fica para trás numa correção futura. */
    var hora = (a.dataHora || "").split(" ")[1] || a.dataHora || "";
    var classe = a.ok ? "ok" : "warn";
    return "<div class='spAt'><span class='" + classe + "'>" + (a.ok ? "✓" : "!") + "</span>" +
           "<p>[" + escapeHtml(a.dominio) + "] " + escapeHtml(a.pergunta || "(sem descrição)") + "</p>" +
           "<time>" + escapeHtml(hora) + "</time>" +
           "<b class='" + classe + "'>" + (a.ok ? "Concluído" : "Erro") + "</b></div>";
  }).join("");
}

function inicioMostrarAtualizacao_(dataHora) {
  var rail = document.querySelector("#mInicio .spRightRail .spRailCard");
  if (!rail) return;
  var head = rail.querySelector(".spRailHead");
  if (!head) return;

  var el = document.getElementById("spInicioAtualizadoEm");
  if (!el) {
    el = document.createElement("div");
    el.id = "spInicioAtualizadoEm";
    el.style.cssText = "font-size:10px;color:rgba(255,255,255,.45);margin:-8px 0 8px 2px;";
    head.insertAdjacentElement("afterend", el);
  }
  el.textContent = dataHora ? ("Atualizado em " + dataHora) : "Atualização não confirmada";
}

/**
 * Carrega e desenha o resumo da Home. Dono único: chamado pelo
 * carregarResumoInicio() do index.html, uma vez por carga.
 */
function inicioAtualizarResumoSeguro_() {
  if (!(window.google && google.script && google.script.run)) return;
  if (typeof SISGEP_TOKEN_SESSAO === "undefined" || !SISGEP_TOKEN_SESSAO) return;
  if (_inicioResumoEmVoo) return;

  _inicioResumoEmVoo = true;

  google.script.run
    .withSuccessHandler(function (r) {
      _inicioResumoEmVoo = false;

      /* Resposta vazia ou malformada não pode passar por "carregou". Sem este
         ramo, a Home ficaria com os valores estáticos do HTML e ninguém saberia
         que a atualização não aconteceu. */
      if (!r || !r.ok) {
        inicioMostrarAtualizacao_("");
        return;
      }

      var f = r.statusFontes || {};
      var total = 0;

      total += inicioAplicarFonteNaHome_(f.notasFiscais, "spPrioNF");
      total += inicioAplicarFonteNaHome_(f.emails, "spPrioEmails");
      total += inicioAplicarFonteNaHome_(f.oficios, "spPrioOficios");
      total += inicioAplicarFonteNaHome_(f.juridico, "spPrioJuridico");
      total += inicioAplicarFonteNaHome_(f.escolasIncompletas, "spPrioEscolas");

      var totalEl = document.getElementById("spPrioridadesTotal");
      if (totalEl) totalEl.textContent = total;

      inicioAplicarSaudeFonte_(f.notasFiscais, "spSaudeFinanceiro");
      inicioAplicarSaudeFonte_(f.escolasIncompletas, "spSaudeAdministrativo");
      inicioAplicarSaudeFonte_(f.juridico, "spSaudeJuridico");
      inicioAplicarSaudeFonte_(f.emails, "spSaudeComunicacao");
      /* Ofícios: o servidor já devolvia saude.oficios e não havia elemento
         para recebê-lo. É o único módulo em uso diário — justamente o que
         fazia falta no painel. */
      inicioAplicarSaudeFonte_(f.oficios, "spSaudeOficios");

      inicioAplicarAtividadesSofia_(r.atividadesRecentes);
      inicioMostrarAtualizacao_(r.atualizadoEm || "");
    })
    .withFailureHandler(function (e) {
      _inicioResumoEmVoo = false;
      console.error("[Início] falha ao carregar o resumo da Home:", e);

      /* Falha de rede/sessão precisa APARECER. O comportamento anterior era só
         console.error, e a Home seguia exibindo os valores estáticos do HTML
         como se fossem dados do dia. */
      inicioMostrarAtualizacao_("");
      ["spSaudeFinanceiro", "spSaudeAdministrativo", "spSaudeJuridico",
       "spSaudeComunicacao", "spSaudeOficios"].forEach(function (id) {
        inicioAplicarSaudeFonte_(null, id);
      });
    })
    .getResumoInicioSISGEP(SISGEP_TOKEN_SESSAO);
}
</script>
