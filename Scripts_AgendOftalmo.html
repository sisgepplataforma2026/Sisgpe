<script>
var AgendOftalmo = (function(){
  'use strict';
function mostrarLoaderSistema(texto) {
  var overlay = document.getElementById('spLoadingOverlay');
  var campoTexto = document.getElementById('spLoadingOverlayTexto');

  if (campoTexto) {
    campoTexto.textContent = texto || 'Processando...';
  }

  if (overlay) {
    overlay.classList.add('spLoadingOverlay-ativo');
  }
}

function ocultarLoaderSistema() {
  var overlay = document.getElementById('spLoadingOverlay');

  if (overlay) {
    overlay.classList.remove('spLoadingOverlay-ativo');
  }
}
  var _slotAtual = null;
  var _dadosAtual = null;
  var _slotsCache = [];
  var _filtroAgenda = 'TODOS';
  var _modoVisualizacao = 'TABELA';
  var _modoSequencial = false;
var _timerBuscaNome = null;
var _associadosEncontrados = [];

  function init() {
  var hoje = new Date();

  var dataInput = document.getElementById('oftalmoData');
  if (dataInput && !dataInput.value) {
    dataInput.value = hoje.toISOString().split('T')[0];
  }

  if (dataInput) {
    carregarDia();
  }

  /* CPF DO TITULAR */
  var cpfTit = document.getElementById('oftalmoCpfTitular');

  if (cpfTit && !cpfTit.dataset.bndOft) {
    cpfTit.dataset.bndOft = '1';

    cpfTit.addEventListener('input', function () {
      this.value = formatarCPFOftalmoInput(this.value);
    });

    cpfTit.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        validarCpf();
      }
    });

    cpfTit.addEventListener('blur', function () {
      this.value = formatarCPFOftalmoInput(this.value);
    });
  }

  /* CPF DO DEPENDENTE */
  var cpfDep = document.getElementById('oftalmoCpfDep');

  if (cpfDep && !cpfDep.dataset.bndOft) {
    cpfDep.dataset.bndOft = '1';

    cpfDep.addEventListener('input', function () {
      this.value = formatarCPFOftalmoInput(this.value);
    });

    cpfDep.addEventListener('blur', function () {
      this.value = formatarCPFOftalmoInput(this.value);
    });
  }

  /* TELEFONE */
  var tel = document.getElementById('oftalmoTelefone');

  if (tel && !tel.dataset.bndOft) {
    tel.dataset.bndOft = '1';

    tel.addEventListener('input', function () {
      this.value = formatarTelefoneOftalmo(this.value);
    });

    tel.addEventListener('blur', function () {
      this.value = formatarTelefoneOftalmo(this.value);
    });
  }

  /* E-MAIL */
  var email = document.getElementById('oftalmoEmail');

  if (email && !email.dataset.bndOft) {
    email.dataset.bndOft = '1';

    email.addEventListener('input', function () {
      this.value = String(this.value || '')
        .replace(/\s/g, '')
        .toLowerCase();
    });

    email.addEventListener('blur', function () {
      validarEmailOftalmo(this);
    });
  }

  /* AUTOCOMPLETE PELO NOME */
  var nomeTitular = document.getElementById('oftalmoNomeTitular');

  if (nomeTitular && !nomeTitular.dataset.autocompleteOftalmo) {
    nomeTitular.dataset.autocompleteOftalmo = '1';
    nomeTitular.setAttribute('autocomplete', 'off');

    nomeTitular.addEventListener('input', function () {
      buscarAssociadoPorNome(this.value);
    });

    nomeTitular.addEventListener('focus', function () {
      if (
        Array.isArray(_associadosEncontrados) &&
        _associadosEncontrados.length &&
        this.value.trim().length >= 2
      ) {
        renderizarSugestoesAssociados(
          _associadosEncontrados
        );
      }
    });
  }

  /* DATA DE NASCIMENTO DO DEPENDENTE */
  var dataNasc = document.getElementById('oftalmoDataNascDep');

  if (dataNasc && !dataNasc.dataset.bndOft) {
    dataNasc.dataset.bndOft = '1';

    dataNasc.addEventListener('change', function () {
      calcularIdade(this.value);
    });
  }

  /* FECHA O AUTOCOMPLETE AO CLICAR FORA */
  if (!document.body.dataset.bndAutoOftalmo) {
    document.body.dataset.bndAutoOftalmo = '1';

    document.addEventListener('click', function (evento) {
      var lista = document.getElementById(
        'oftalmoAutocompleteNome'
      );

      var campoNome = document.getElementById(
        'oftalmoNomeTitular'
      );

      if (
        lista &&
        !lista.contains(evento.target) &&
        evento.target !== campoNome
      ) {
        lista.style.display = 'none';
      }
    });
  }
}
  function isoParaBr(iso) {
    if (!iso) return '';
    var p = String(iso).split('-');
    if (p.length !== 3) return iso;
    return p[2] + '/' + p[1] + '/' + p[0];
  }

  function normalizarTexto(txt) {
    return String(txt || '')
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '')
      .toUpperCase()
      .trim();
  }

  function carregarDia() {
    var el = document.getElementById('oftalmoData');
    if (!el || !el.value) { _toast('Selecione uma data.', 'aviso'); return; }

    var dataBR = isoParaBr(el.value);
    mostrarLoaderSistema('Carregando horários...');

    google.script.run
      .withSuccessHandler(function(r) {
        ocultarLoaderSistema();
        if (!r || !r.ok) { _toast((r && r.erro) || 'Erro ao carregar horários.', 'erro'); return; }
        _slotsCache = Array.isArray(r.slots) ? r.slots : [];
        _renderTudo();
      })
      .withFailureHandler(function(e) {
        ocultarLoaderSistema();
        _toast('Erro: ' + (e && e.message ? e.message : e), 'erro');
      })
      .listarHorariosOftalmo(dataBR, (typeof SISGEP_TOKEN_SESSAO !== "undefined" ? SISGEP_TOKEN_SESSAO : ""));
  }

  function _renderTudo() {
    var slots = _filtrarSlots(_slotsCache);
    _renderSlots(slots);
    _renderCards(slots);
    _renderResumoDia(_slotsCache);
    _atualizarStats(_slotsCache);
  }

  function _filtrarSlots(slots) {
    var lista = Array.isArray(slots) ? slots.slice() : [];
    var buscaEl = document.getElementById('oftalmoBuscaAgenda');
    var busca = normalizarTexto(buscaEl ? buscaEl.value : '');

    lista = lista.filter(function(s){
      if (_filtroAgenda === 'LIVRE')      return !!s.livre || s.status === 'CANCELADO';
      if (_filtroAgenda === 'RESERVADO')  return !s.livre && s.status !== 'CANCELADO' && !s.compareceu;
      if (_filtroAgenda === 'COMPARECEU') return !!s.compareceu;
      return true;
    });

    if (busca) {
      lista = lista.filter(function(s){
        var nome = obterNomeSlot(s);
        var cpf  = obterCpfSlot(s);
        var alvo = normalizarTexto([s.hora, s.status, s.tipo, nome, cpf, s.telefone, s.escola].join(' '));
        return alvo.indexOf(busca) !== -1;
      });
    }

    return lista;
  }

  function _renderSlots(slots) {
    var tbody = document.getElementById('oftalmoTbody');
    if (!tbody) return;

    if (!slots || !slots.length) {
      tbody.innerHTML = '<tr><td colspan="8" class="td-vazio">Nenhum horário encontrado para o filtro aplicado.</td></tr>';
      return;
    }

    tbody.innerHTML = slots.map(function(s){
      var nome      = obterNomeSlot(s);
      var cpf       = obterCpfSlot(s);
      var tipoBadge = s.tipo
        ? '<span class="badge ' + (s.tipo === 'DEPENDENTE' ? 'badge-violet' : 'badge-info') + '">' + escapeHtml(s.tipo) + '</span>'
        : '';

      return '<tr>' +
        '<td><strong>' + escapeHtml(s.hora || '') + '</strong></td>' +
        '<td>' + montarStatusHtml(s) + '</td>' +
        '<td>' + tipoBadge + '</td>' +
        '<td>' + escapeHtml(nome || '') + '</td>' +
        '<td>' + escapeHtml(formatarCPFOftalmo(cpf)) + '</td>' +
        '<td>' + escapeHtml(s.telefone || '') + '</td>' +
        '<td>' + escapeHtml(s.escola   || '') + '</td>' +
        '<td style="white-space:nowrap;">' + montarAcoesHtml(s) + '</td>' +
        '</tr>';
    }).join('');
  }

  function _renderCards(slots) {
    var wrap = document.getElementById('oftalmoCards');
    if (!wrap) return;

    if (!slots || !slots.length) {
      wrap.innerHTML = '<div class="oftalmo-empty-card">Nenhum horário encontrado para o filtro aplicado.</div>';
      return;
    }

    wrap.innerHTML = slots.map(function(s){
      var nome   = obterNomeSlot(s);
      var cpf    = obterCpfSlot(s);
      var classe = 'livre';
      if (s.status === 'CANCELADO') classe = 'cancelado';
      else if (s.compareceu)        classe = 'compareceu';
      else if (!s.livre)            classe = 'reservado';

      return '<div class="oftalmo-card-slot ' + classe + '">' +
        '<div class="oftalmo-card-top">' +
          '<div class="oftalmo-card-hora">' + escapeHtml(s.hora || '') + '</div>' +
          montarStatusHtml(s) +
        '</div>' +
        '<div class="oftalmo-card-nome">' + escapeHtml(nome || 'Horário livre') + '</div>' +
        '<div class="oftalmo-card-info">' +
          (s.livre || s.status === 'CANCELADO'
            ? 'Disponível para reserva.'
            : 'CPF: ' + escapeHtml(cpf || '-') + '<br>Escola: ' + escapeHtml(s.escola || '-')
          ) +
        '</div>' +
        '<div class="oftalmo-card-acoes">' + montarAcoesHtml(s) + '</div>' +
      '</div>';
    }).join('');
  }

  function _renderResumoDia(slots) {
    var proxEl = document.getElementById('oftalmoProximos');
    if (!proxEl) return;

    var lista    = Array.isArray(slots) ? slots : [];
    var proximos = lista.filter(function(s){ return !s.livre && s.status !== 'CANCELADO'; }).slice(0, 5);

    proxEl.innerHTML = proximos.length
      ? proximos.map(function(s){
          var nome = obterNomeSlot(s);
          return '<div class="oftalmo-proximo">' +
            '<strong>' + escapeHtml(s.hora || '') + ' — ' + escapeHtml(nome || 'Paciente') + '</strong>' +
            '<span>' + escapeHtml(s.escola || 'Escola não informada') + '</span>' +
          '</div>';
        }).join('')
      : '<div class="oftalmo-proximo vazio">Nenhum atendimento reservado.</div>';

    _set('oftalmoPendSemTelefone', lista.filter(function(s){ return !s.livre && s.status !== 'CANCELADO' && !String(s.telefone || '').trim(); }).length);
    _set('oftalmoPendSemEmail',    lista.filter(function(s){ return !s.livre && s.status !== 'CANCELADO' && !String(s.email    || '').trim(); }).length);
    _set('oftalmoPendCancelados',  lista.filter(function(s){ return s.status === 'CANCELADO'; }).length);
  }

  function montarStatusHtml(s) {
    if (s.status === 'CANCELADO') return '<span class="slot-cancelado">● Cancelado</span>';
    if (s.livre)                  return '<span class="slot-livre">● Livre</span>';
    if (s.compareceu)             return '<span class="slot-compareceu">✔ Compareceu</span>';
    return '<span class="slot-reservado">● Reservado</span>';
  }

  function montarAcoesHtml(s) {
    var hora = escapeAttr(s.hora || '');
    var id   = escapeAttr(s.id   || '');

    if (s.livre || s.status === 'CANCELADO') {
      return '<button type="button" class="btn-acao primary" onclick="AgendOftalmo.abrirModal(\'' + hora + '\', \'' + id + '\')">📅 Reservar</button>';
    }

    var slotJson = encodeURIComponent(JSON.stringify(s || {}));
    var html = '';

    if (s.compareceu) {
      html += '<button type="button" class="btn-acao" onclick="AgendOftalmo.marcarCompareceu(\'' + id + '\', false)">↩ Desfazer</button> ';
    }

    html += '<button type="button" class="btn-acao whats" onclick="AgendOftalmo.abrirAcoesJSON(decodeURIComponent(\'' + slotJson + '\'))">📱</button> ';
    html += '<button type="button" class="btn-acao danger" onclick="AgendOftalmo.cancelar(\'' + id + '\')">✕</button>';

    return html;
  }

  function obterNomeSlot(s) {
    if (!s) return '';
    return s.tipo === 'DEPENDENTE'
      ? (s.nomeBeneficiario || s.nomeTitular || '')
      : (s.nomeTitular || s.nomeBeneficiario || '');
  }

  function obterCpfSlot(s) {
    if (!s) return '';
    return s.tipo === 'DEPENDENTE'
      ? (s.cpfBeneficiario || s.cpfTitular || '')
      : (s.cpfTitular || s.cpfBeneficiario || '');
  }

  function _atualizarStats(slots) {
    slots = Array.isArray(slots) ? slots : [];
    _set('oftalmoStatTotal',       slots.length);
    _set('oftalmoStatReservados',  slots.filter(function(s){ return !s.livre && s.status !== 'CANCELADO'; }).length);
    _set('oftalmoStatLivres',      slots.filter(function(s){ return !!s.livre || s.status === 'CANCELADO'; }).length);
    _set('oftalmoStatCompareceram',slots.filter(function(s){ return !!s.compareceu; }).length);
  }

  function filtrarAgenda(filtro) {
    _filtroAgenda = filtro || 'TODOS';
    document.querySelectorAll('.oftalmo-chip').forEach(function(btn){
      btn.classList.toggle('active', btn.dataset.filtro === _filtroAgenda);
    });
    _renderTudo();
  }

  function buscarNaAgenda() { _renderTudo(); }

  function alternarVisualizacao() {
    _modoVisualizacao = _modoVisualizacao === 'TABELA' ? 'CARDS' : 'TABELA';
    var tabela = document.getElementById('oftalmoTabelaWrap');
    var cards  = document.getElementById('oftalmoCardsWrap');
    var btn    = document.getElementById('btnOftalmoModo');
    if (tabela) tabela.style.display = _modoVisualizacao === 'TABELA' ? '' : 'none';
    if (cards)  cards.style.display  = _modoVisualizacao === 'CARDS'  ? '' : 'none';
    if (btn) btn.textContent = _modoVisualizacao === 'TABELA' ? '🧩 Cards' : '📋 Tabela';
  }

  function trocarTab(tab) {
    var ag = document.getElementById('oftalmoTabAgenda');
    var hi = document.getElementById('oftalmoTabHistorico');
    var ta = document.getElementById('tabAgenda');
    var th = document.getElementById('tabHistorico');
    if (ag) ag.style.display = tab === 'agenda'    ? '' : 'none';
    if (hi) hi.style.display = tab === 'historico' ? '' : 'none';
    if (ta) ta.classList.toggle('active', tab === 'agenda');
    if (th) th.classList.toggle('active', tab === 'historico');
    if (tab === 'historico') carregarHistorico();
  }

  function abrirModal(hora, id) {
    if (!hora) { _toast('Horário inválido. Recarregue a agenda.', 'erro'); return; }

    _slotAtual = { hora: hora, id: id || '' };

    var dataEl = document.getElementById('oftalmoData');
    _set('oftalmoModalTitulo',   'Reservar Horário');
    _set('oftalmoModalSubtitulo','📅 ' + isoParaBr(dataEl ? dataEl.value : '') + ' às ' + hora);
    _set('resumoDataOftalmo',    isoParaBr(dataEl ? dataEl.value : ''));
    _set('resumoHoraOftalmo',    hora);

    document.querySelectorAll('input[name="oftalmoTipo"]').forEach(function(r){ r.checked = r.value === 'TRABALHADOR'; });
    atualizarTipo();

    ['oftalmoCpfTitular','oftalmoNomeTitular','oftalmoEscola','oftalmoTelefone','oftalmoEmail',
     'oftalmoCpfDep','oftalmoNomeDep','oftalmoDataNascDep'].forEach(function(idCampo){
      var el = document.getElementById(idCampo);
      if (el) el.value = '';
    });

    var par = document.getElementById('oftalmoParentesco'); if (par) par.value = '';
    var vEl = document.getElementById('oftalmoValidacaoCpf'); if (vEl) { vEl.textContent = ''; vEl.style.color = ''; }
    var iEl = document.getElementById('oftalmoIdadeDep');    if (iEl) { iEl.textContent = ''; iEl.style.color = ''; }
    var mEl = document.getElementById('oftalmoMsgModal');    if (mEl) mEl.style.display = 'none';

    var modal = document.getElementById('modalOftalmo');
    if (modal) { document.body.appendChild(modal); modal.style.display = 'flex'; }
  }

  function fecharModal() {
    var modal = document.getElementById('modalOftalmo');
    if (modal) modal.style.display = 'none';
    _slotAtual = null;
  }

  function fecharModalAcoes() {
    var modal = document.getElementById('modalOftalmoAcoes');
    if (modal) modal.style.display = 'none';
    _modoSequencial = false;
    _dadosAtual = null;
  }

  function atualizarTipo() {
    var r   = document.querySelector('input[name="oftalmoTipo"]:checked');
    var sec = document.getElementById('oftalmoSecDependente');
    if (sec) sec.style.display = (r && r.value === 'DEPENDENTE') ? '' : 'none';
  }

  function validarCpf() {
    var cpfEl  = document.getElementById('oftalmoCpfTitular');
    var valEl  = document.getElementById('oftalmoValidacaoCpf');
    var nomeEl = document.getElementById('oftalmoNomeTitular');
    if (!cpfEl || !valEl) return;

    var cpf = cpfEl.value.replace(/\D/g, '');
    if (cpf.length !== 11) { valEl.textContent = '⚠ CPF inválido.'; valEl.style.color = 'var(--red)'; return; }

    valEl.textContent = '⏳ Validando...';
    valEl.style.color = 'var(--g400)';

    google.script.run
      .withSuccessHandler(function(r){
        if (!r || !r.valido) { valEl.textContent = '✕ ' + ((r && r.erro) || 'CPF não encontrado.'); valEl.style.color = 'var(--red)'; return; }
        var sit = String(r.situacao || '').toUpperCase();
        if (sit === 'INADIMPLENTE' || sit === 'INATIVO') {
          valEl.textContent = '⚠ Associado ' + sit.toLowerCase() + '. Confirme antes de agendar.';
          valEl.style.color = 'var(--amber)';
        } else {
          valEl.textContent = '✔ Associado validado' + (r.aviso ? ' (' + r.aviso + ')' : '') + '.';
          valEl.style.color = 'var(--green)';
        }
        if (r.nome && nomeEl && !nomeEl.value) nomeEl.value = r.nome;
      })
      .withFailureHandler(function(){ valEl.textContent = '⚠ Erro na validação.'; valEl.style.color = 'var(--amber)'; })
      .validarAssociadoOftalmo(cpf, (typeof SISGEP_TOKEN_SESSAO !== "undefined" ? SISGEP_TOKEN_SESSAO : ""));
  }

  function calcularIdade(dataNasc) {
    var el = document.getElementById('oftalmoIdadeDep');
    if (!el || !dataNasc) return;
    var nasc  = new Date(dataNasc);
    var hoje  = new Date();
    var idade = hoje.getFullYear() - nasc.getFullYear();
    var m     = hoje.getMonth() - nasc.getMonth();
    if (m < 0 || (m === 0 && hoje.getDate() < nasc.getDate())) idade--;
    if (idade < 12) { el.textContent = '⚠ ' + idade + ' anos — mínimo 12 anos.'; el.style.color = 'var(--red)'; }
    else            { el.textContent = '✔ ' + idade + ' anos.';                   el.style.color = 'var(--green)'; }
  }

  function salvarReserva() {
    if (!_slotAtual || !_slotAtual.hora) { _msgModal('Horário não selecionado. Feche e selecione novamente.', 'erro'); return; }

    var tipo    = document.querySelector('input[name="oftalmoTipo"]:checked');
    var tipoVal = tipo ? tipo.value : 'TRABALHADOR';
    var cpfTit  = _val('oftalmoCpfTitular').replace(/\D/g, '');
    var nomeTit = _val('oftalmoNomeTitular');
    var escola  = _val('oftalmoEscola');
    var tel     = _val('oftalmoTelefone');
    var email   = _val('oftalmoEmail');

    function _err(msg) { _msgModal(msg, 'erro'); }

    if (cpfTit.length !== 11) { _err('Informe o CPF do titular.'); return; }
    if (!nomeTit)              { _err('Informe o nome do titular.'); return; }
    if (!escola)               { _err('Informe a escola.'); return; }
    if (!tel)                  { _err('Informe o telefone.'); return; }

    var dataEl = document.getElementById('oftalmoData');
    var dados  = {
      idSlot: _slotAtual.id || '', data: isoParaBr(dataEl ? dataEl.value : ''),
      hora: _slotAtual.hora, tipo: tipoVal,
      cpfTitular: cpfTit, nomeTitular: nomeTit,
      escola: escola, telefone: tel, email: email,
      cpfBeneficiario: cpfTit, nomeBeneficiario: nomeTit,
      dataNasc: '', parentesco: ''
    };

    if (tipoVal === 'DEPENDENTE') {
      var nomeDep  = _val('oftalmoNomeDep');
      var dataNasc = _val('oftalmoDataNascDep');
      var paren    = _val('oftalmoParentesco');
      var cpfDep   = _val('oftalmoCpfDep').replace(/\D/g, '');
      if (!nomeDep)  { _err('Informe o nome do dependente.'); return; }
      if (!dataNasc) { _err('Informe a data de nascimento.'); return; }
      if (!paren)    { _err('Informe o grau de parentesco.'); return; }
      var nasc  = new Date(dataNasc);
      var hoje  = new Date();
      var idade = hoje.getFullYear() - nasc.getFullYear();
      var mes   = hoje.getMonth() - nasc.getMonth();
      if (mes < 0 || (mes === 0 && hoje.getDate() < nasc.getDate())) idade--;
      if (idade < 12) { _err('O dependente deve ter no mínimo 12 anos.'); return; }
      dados.cpfBeneficiario  = cpfDep || cpfTit;
      dados.nomeBeneficiario = nomeDep;
      dados.dataNasc         = dataNasc;
      dados.parentesco       = paren;
    }

    var btn = document.getElementById('btnSalvarOftalmo');
    if (btn) btn.disabled = true;
    _msgModal('', '');
    mostrarLoaderSistema('Salvando agendamento...');

    google.script.run
      .withSuccessHandler(function(r){
        ocultarLoaderSistema();
        if (btn) btn.disabled = false;
        if (!r || !r.ok) { _msgModal((r && r.erro) || 'Erro ao salvar.', 'erro'); return; }
        _dadosAtual = Object.assign({}, dados, { id: r.id || '' });
        fecharModal();
        carregarDia();
        _abrirModalAcoes(_dadosAtual);
      })
      .withFailureHandler(function(e){
        ocultarLoaderSistema();
        if (btn) btn.disabled = false;
        _msgModal('Erro: ' + (e && e.message ? e.message : e), 'erro');
      })
      .reservarHorarioOftalmo(dados, (typeof SISGEP_TOKEN_SESSAO !== "undefined" ? SISGEP_TOKEN_SESSAO : ""));
  }

  function abrirAcoes(slot) { _dadosAtual = slot; _abrirModalAcoes(slot); }

  function abrirAcoesJSON(json) {
    try { abrirAcoes(JSON.parse(json || '{}')); }
    catch(e) { _toast('Não foi possível abrir as ações deste agendamento.', 'erro'); }
  }

  function _abrirModalAcoes(d) {
    if (!d) return;
    var nome = d.tipo === 'DEPENDENTE' ? (d.nomeBeneficiario || d.nomeTitular) : (d.nomeTitular || d.nomeBeneficiario);
    var el   = document.getElementById('oftalmoAcoesResumo');
    if (el) {
      el.innerHTML =

        ? (ag.cpfBeneficiario || ag.cpfTitular || '')

  function limparFiltros() {
    ['oftalmoFiltroInicio','oftalmoFiltroFim'].forEach(function(id){ var el = document.getElementById(id); if (el) el.value = ''; });
    var s = document.getElementById('oftalmoFiltroStatus'); if (s) s.value = 'TODOS';
    var t = document.getElementById('oftalmoTbodyHist');
    if (t) t.innerHTML = '<tr><td colspan="8" class="td-vazio">Aplique os filtros para carregar o histórico.</td></tr>';
  }

  function formatarTelefoneOftalmo(v) {
    v = String(v || '').replace(/\D/g, '').slice(0, 11);
    if (v.length <= 10) return v.replace(/^(\d{2})(\d{4})(\d{0,4}).*/, function(_, a, b, c){ return c ? '(' + a + ') ' + b + '-' + c : '(' + a + ') ' + b; });
    return v.replace(/^(\d{2})(\d{5})(\d{0,4}).*/, function(_, a, b, c){ return c ? '(' + a + ') ' + b + '-' + c : '(' + a + ') ' + b; });
  }

  function escapeHtml(v) {
    return String(v == null ? '' : v)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
  }

  function escapeAttr(v) {
    return String(v == null ? '' : v)
      .replace(/\\/g, '\\\\').replace(/'/g, "\\'")
      .replace(/"/g, '&quot;').replace(/\n/g, ' ').replace(/\r/g, ' ');
  }

  function _val(id) { var el = document.getElementById(id); return el ? String(el.value || '').trim() : ''; }
  function _set(id, v) { var el = document.getElementById(id); if (el) el.textContent = v; }

  function _toast(msg, tipo) {
    console.log('[AgendOftalmo]', msg);
    if (window.Swal) {
      Swal.fire({ icon: tipo === 'erro' ? 'error' : tipo === 'ok' ? 'success' : 'info', title: msg, timer: 2200, showConfirmButton: false });
    }
  }

function formatarCPFOftalmo(cpf) {
  var v = String(cpf || '').replace(/\D/g, '');
  if (!v) return '';
  if (v.length !== 11) return v;
  return v.replace(/^(\d{3})(\d{3})(\d{3})(\d{2})$/, '$1.$2.$3-$4');
}
function formatarCPFOftalmoInput(valor) {
  var cpf = String(valor || '').replace(/\D/g, '').slice(0, 11);
  if (cpf.length <= 3) return cpf;
  if (cpf.length <= 6) return cpf.replace(/^(\d{3})(\d+)/, '$1.$2');
  if (cpf.length <= 9) return cpf.replace(/^(\d{3})(\d{3})(\d+)/, '$1.$2.$3');
  return cpf.replace(/^(\d{3})(\d{3})(\d{3})(\d{1,2})$/, '$1.$2.$3-$4');
}
  function _msgModal(txt, tipo) {
    var el = document.getElementById('oftalmoMsgModal');
    if (!el) return;
    if (!txt) { el.style.display = 'none'; return; }
    el.textContent = txt;
    el.className   = 'msg-status ativo ' + (tipo || 'info');
    el.style.display = 'block';
  }

window.AgendOftalmo = AgendOftalmo;

function initAgendOftalmo() {
  if (typeof window.AgendOftalmo === 'undefined' || !window.AgendOftalmo.init) {
    console.warn('[AgendOftalmo] Módulo ainda não carregado, aguardando...');
    setTimeout(initAgendOftalmo, 300);
    return;
  }
  window.AgendOftalmo.init();
