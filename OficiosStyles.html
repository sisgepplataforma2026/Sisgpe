
<style>
/* ═══════════════════════════════════════════
   SISGEP · OFÍCIOS · CSS PREMIUM 2026
   Padrão: Navy + Gold + Plus Jakarta Sans
═══════════════════════════════════════════ */
:root {
  --navy:      #001f4d;
  --navy2:     #002f6c;
  --blue:      #1565C0;
  --blue-lt:   #e8f0fe;
  --gold:      #C9A84C;
  --gold2:     #f0c843;
  --gold-lt:   #fdf6e3;
  --bg:        #f0f4f9;
  --surface:   #ffffff;
  --g50:       #f8fafc;
  --g100:      #f1f5f9;
  --g200:      #e2e8f0;
  --g300:      #cbd5e1;
  --g400:      #94a3b8;
  --g500:      #64748b;
  --g600:      #475569;
  --g700:      #334155;
  --g800:      #1e293b;
  --g900:      #0f172a;
  --green:     #059669;
  --green-lt:  #d1fae5;
  --green-dk:  #065f46;
  --red:       #dc2626;
  --red-lt:    #fee2e2;
  --amber:     #d97706;
  --amber-lt:  #fef3c7;
  --teal:      #0d9488;
  --rad:       12px;
  --rad-lg:    20px;
  --rad-xl:    28px;
  --sh-xs:     0 1px 3px rgba(0,20,60,.06), 0 1px 2px rgba(0,20,60,.04);
  --sh-sm:     0 2px 8px rgba(0,20,60,.07), 0 1px 3px rgba(0,20,60,.05);
  --sh-md:     0 6px 24px rgba(0,20,60,.10), 0 2px 8px rgba(0,20,60,.06);
  --sh-lg:     0 16px 48px rgba(0,20,60,.14), 0 4px 16px rgba(0,20,60,.08);
  --sh-xl:     0 28px 64px rgba(0,20,60,.18), 0 8px 24px rgba(0,20,60,.10);
  --border:    1px solid var(--g200);
  --border-blue: 1px solid #bfdbfe;
}

/* ── Reset ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  min-height: 100%;
  background: #e8edf5;
  background-image:
    radial-gradient(ellipse at 0% 0%, rgba(21,101,192,.10) 0%, transparent 40%),
    radial-gradient(ellipse at 100% 100%, rgba(201,168,76,.07) 0%, transparent 40%);
}

body { margin: 0; padding: 0; }

/* ── Wrapper ── */
.of-wrap {
  font-family: 'Plus Jakarta Sans', sans-serif;
  color: var(--g900);
  width: 100%;
  max-width: 1480px;
  margin: 0 auto;
  padding: 20px 24px 48px;
}

/* ════════════════════════════════════════
   HEADER
════════════════════════════════════════ */
.of-header {
  background:
    radial-gradient(ellipse at 90% -10%, rgba(201,168,76,.20) 0%, transparent 40%),
    radial-gradient(ellipse at 10% 120%, rgba(21,101,192,.25) 0%, transparent 45%),
    linear-gradient(135deg, #001230 0%, var(--navy) 30%, var(--navy2) 65%, #0d52b5 100%);
  border-radius: var(--rad-xl);
  padding: 30px 36px;
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 16px;
  box-shadow: var(--sh-xl);
  position: relative;
  overflow: hidden;
}

.of-header::before {
  content: '';
  position: absolute;
  inset: 0;
  background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.018'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
  pointer-events: none;
}

.of-header::after {
  content: '';
  position: absolute;
  right: -40px;
  top: -60px;
  width: 280px;
  height: 280px;
  background: radial-gradient(circle, rgba(255,255,255,.05) 0%, transparent 70%);
  pointer-events: none;
}

.of-header > div { position: relative; z-index: 1; }

.of-header h2 {
  font-size: 26px;
  font-weight: 900;
  color: #fff;
  letter-spacing: -.6px;
  margin-bottom: 5px;
  line-height: 1.15;
}

.of-header p {
  font-size: 13.5px;
  color: rgba(255,255,255,.62);
  font-weight: 500;
}

.of-badge {
  background: rgba(201,168,76,.16);
  border: 1.5px solid rgba(201,168,76,.45);
  color: var(--gold2);
  font-size: 10.5px;
  font-weight: 800;
  letter-spacing: .14em;
  text-transform: uppercase;
  padding: 8px 18px;
  border-radius: 999px;
  flex-shrink: 0;
  position: relative;
  z-index: 1;
  box-shadow: 0 2px 12px rgba(201,168,76,.18);
}

/* ════════════════════════════════════════
   ABAS
════════════════════════════════════════ */
.of-tabs {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
  background: rgba(255,255,255,.88);
  border: var(--border);
  border-radius: 999px;
  padding: 5px;
  margin-bottom: 20px;
  width: fit-content;
  box-shadow: var(--sh-sm);
  backdrop-filter: blur(12px);
}

.of-tab {
  height: 40px;
  padding: 0 20px;
  border: none;
  border-radius: 999px;
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  transition: all .2s cubic-bezier(.4,0,.2,1);
  color: var(--g500);
  background: transparent;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  white-space: nowrap;
  position: relative;
}

.of-tab:hover {
  color: var(--navy2);
  background: var(--g100);
}

.of-tab.active {
  background: linear-gradient(135deg, var(--navy2) 0%, #0d52b5 100%);
  color: #fff;
  box-shadow: 0 4px 16px rgba(0,47,108,.32), inset 0 1px 0 rgba(255,255,255,.12);
}

/* ════════════════════════════════════════
   CARDS BASE
════════════════════════════════════════ */
.of-card {
  background: var(--surface);
  border: var(--border);
  border-radius: var(--rad-lg);
  box-shadow: var(--sh-sm);
  margin-bottom: 16px;
  overflow: hidden;
  transition: box-shadow .22s, border-color .22s;
}

.of-card:hover {
  box-shadow: var(--sh-md);
  border-color: #d0ddf0;
}

.of-card-head {
  padding: 18px 22px 16px;
  border-bottom: 1px solid var(--g100);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  background: linear-gradient(180deg, #fafcff 0%, var(--surface) 100%);
}

.of-card-head-l {
  display: flex;
  align-items: center;
  gap: 13px;
}

.of-step {
  width: 34px;
  height: 34px;
  border-radius: 11px;
  background: linear-gradient(135deg, var(--navy) 0%, var(--navy2) 50%, var(--blue) 100%);
  color: #fff;
  font-size: 14px;
  font-weight: 900;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  box-shadow: 0 4px 12px rgba(0,47,108,.28), inset 0 1px 0 rgba(255,255,255,.14);
}

.of-card-ico {
  width: 34px;
  height: 34px;
  border-radius: 11px;
  background: var(--blue-lt);
  color: var(--navy2);
  font-size: 15px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.of-card-title {
  font-size: 14.5px;
  font-weight: 800;
  color: var(--g900);
  letter-spacing: -.15px;
}

.of-card-sub {
  font-size: 11.5px;
  color: var(--g400);
  margin-top: 2px;
  font-weight: 500;
}

.of-card-body { padding: 20px 22px; }

/* ════════════════════════════════════════
   FORM GRID
════════════════════════════════════════ */
.fg { display: grid; gap: 14px; }
.fg-2 { grid-template-columns: repeat(2, minmax(0,1fr)); }
.fg-3 { grid-template-columns: repeat(3, minmax(0,1fr)); }
.fg-4 { grid-template-columns: repeat(4, minmax(0,1fr)); }
.fg-full { grid-column: 1/-1; }

.fld {
  display: flex;
  flex-direction: column;
  gap: 7px;
  position: relative;
}

.fld label {
  font-size: 10.5px;
  font-weight: 800;
  letter-spacing: .09em;
  text-transform: uppercase;
  color: var(--g500);
}

.fld input,
.fld select,
.fld textarea {
  width: 100%;
  min-height: 48px;
  border: 1.5px solid var(--g200);
  border-radius: var(--rad);
  background: linear-gradient(180deg, #fff 0%, #fbfdff 100%);
  color: var(--g900);
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 13.5px;
  font-weight: 500;
  padding: 0 14px;
  outline: none;
  transition: border-color .18s, box-shadow .18s, background .18s;
}

.fld textarea {
  min-height: 190px;
  padding: 14px;
  resize: vertical;
  line-height: 1.65;
}

.fld input::placeholder,
.fld textarea::placeholder { color: var(--g300); font-weight: 400; }

.fld input:focus,
.fld select:focus,
.fld textarea:focus {
  border-color: var(--blue);
  box-shadow: 0 0 0 3.5px rgba(21,101,192,.10), 0 4px 14px rgba(0,20,60,.05);
  background: #fff;
}

.fld input[readonly] {
  background: var(--g50);
  color: var(--g600);
  cursor: default;
  border-color: var(--g200);
}

.fld-help {
  font-size: 11px;
  color: var(--g400);
  line-height: 1.45;
  font-weight: 500;
}

.preview-inline {
  min-height: 48px;
  display: flex;
  align-items: center;
  background: var(--g50);
  border: 1.5px solid var(--g200);
  border-radius: var(--rad);
  padding: 0 14px;
  font-size: 13px;
  color: var(--g600);
  font-weight: 600;
}

/* ════════════════════════════════════════
   BOTÕES
════════════════════════════════════════ */
.btn {
  height: 42px;
  padding: 0 18px;
  border: none;
  border-radius: var(--rad);
  cursor: pointer;
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 13px;
  font-weight: 700;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  transition: all .18s cubic-bezier(.4,0,.2,1);
  white-space: nowrap;
  letter-spacing: -.1px;
}

.btn:hover { transform: translateY(-1px); }
.btn:active { transform: translateY(0) scale(.98); }
.btn[disabled] { opacity: .42; cursor: not-allowed; pointer-events: none; transform: none !important; }

.btn-navy {
  background: linear-gradient(135deg, var(--navy2) 0%, #0d52b5 100%);
  color: #fff;
  box-shadow: 0 4px 14px rgba(0,47,108,.26), inset 0 1px 0 rgba(255,255,255,.12);
}
.btn-navy:hover { box-shadow: 0 8px 24px rgba(0,47,108,.34); }

.btn-outline {
  background: var(--surface);
  color: var(--g700);
  border: 1.5px solid var(--g200);
}
.btn-outline:hover { border-color: var(--blue); color: var(--blue); background: var(--blue-lt); }

.btn-ghost {
  background: var(--g100);
  color: var(--g700);
  border: 1.5px solid var(--g200);
}
.btn-ghost:hover { background: var(--g200); }

.btn-gold {
  background: linear-gradient(135deg, #b8922e 0%, var(--gold) 45%, var(--gold2) 100%);
  color: var(--navy);
  font-weight: 900;
  box-shadow: 0 4px 16px rgba(201,168,76,.32), inset 0 1px 0 rgba(255,255,255,.22);
}
.btn-gold:hover { box-shadow: 0 8px 26px rgba(201,168,76,.46); }

.btn-teal { background: var(--teal); color: #fff; box-shadow: 0 4px 12px rgba(13,148,136,.24); }
.btn-teal:hover { box-shadow: 0 8px 20px rgba(13,148,136,.36); }

.btn-red { background: var(--red); color: #fff; box-shadow: 0 4px 12px rgba(220,38,38,.22); }
.btn-red:hover { box-shadow: 0 8px 20px rgba(220,38,38,.34); }

.btn-on-dark {
  background: rgba(255,255,255,.13);
  color: #fff;
  border: 1.5px solid rgba(255,255,255,.24);
  backdrop-filter: blur(8px);
}
.btn-on-dark:hover { background: rgba(255,255,255,.22); }

.btn-sm { height: 36px; padding: 0 14px; font-size: 12px; border-radius: 10px; }

.row-btns { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

/* ════════════════════════════════════════
   AUTOCOMPLETE / DROPDOWN
════════════════════════════════════════ */
.autocomplete-lista {
  position: absolute;
  top: 100%;
  left: 0;
  right: 0;
  background: var(--surface);
  border: 1.5px solid var(--blue);
  border-top: none;
  border-radius: 0 0 var(--rad) var(--rad);
  box-shadow: var(--sh-md);
  z-index: 999;
  max-height: 280px;
  overflow-y: auto;
}

.autocomplete-item {
  padding: 11px 14px;
  font-size: 13px;
  cursor: pointer;
  border-bottom: 1px solid var(--g100);
  transition: background .12s;
}
.autocomplete-item:hover { background: var(--blue-lt); }
.autocomplete-item:last-child { border-bottom: none; }
.autocomplete-item-nome { font-weight: 700; color: var(--g900); }
.autocomplete-item-sub { font-size: 11px; color: var(--g400); margin-top: 2px; }

/* ════════════════════════════════════════
   CARD INTELIGENTE DA ESCOLA
════════════════════════════════════════ */
.escola-smart-card,
.escola-smart-card-premium {
  border-color: #d4e4f8;
  box-shadow: var(--sh-md);
}

.of-card-head.escola-smart-head-premium {
  background: linear-gradient(180deg, #f4f9ff 0%, #fafcff 100%);
}

.escola-smart-grid,
.escola-smart-grid-premium {
  display: grid;
  grid-template-columns: minmax(0,1fr) 290px;
  gap: 16px;
  align-items: start;
}

.escola-search-wrap,
.escola-search-wrap-premium { min-width: 0; }

.escola-search-control,
.escola-search-control-premium {
  position: relative;
  display: flex;
  align-items: center;
}

.escola-search-icon {
  position: absolute;
  left: 14px;
  z-index: 2;
  font-size: 14px;
  opacity: .60;
}

.escola-search-control input,
.escola-search-control-premium input {
  padding-left: 42px !important;
  padding-right: 48px !important;
  min-height: 52px !important;
  border-radius: 14px !important;
  font-size: 14px !important;
  font-weight: 600 !important;
  background: linear-gradient(180deg, #fff 0%, #f8fbff 100%) !important;
  border-color: var(--g200) !important;
  box-shadow: var(--sh-xs) !important;
}

.escola-search-control input:focus,
.escola-search-control-premium input:focus {
  border-color: var(--blue) !important;
  box-shadow: 0 0 0 3.5px rgba(21,101,192,.10), var(--sh-sm) !important;
  background: #fff !important;
}

.escola-clear-btn {
  position: absolute;
  right: 10px;
  width: 30px;
  height: 30px;
  border: none;
  border-radius: 9px;
  background: var(--g100);
  color: var(--g500);
  font-size: 18px;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all .15s;
  line-height: 1;
}
.escola-clear-btn:hover { background: var(--red-lt); color: var(--red); }

/* Dropdown de resultados */
.escola-smart-dropdown,
.escola-smart-dropdown-premium {
  position: absolute;
  top: calc(100% + 6px);
  left: 0;
  right: 0;
  z-index: 1000;
  background: var(--surface);
  border: 1.5px solid #c5d8f6;
  border-radius: 16px;
  box-shadow: var(--sh-lg);
  overflow: hidden;
  max-height: 340px;
  overflow-y: auto;
  padding: 6px;
}

.escola-smart-option {
  width: 100%;
  border: 1.5px solid transparent;
  background: var(--surface);
  padding: 11px 13px;
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 10px;
  text-align: left;
  border-radius: 12px;
  cursor: pointer;
  font-family: 'Plus Jakarta Sans', sans-serif;
  margin-bottom: 3px;
  transition: all .14s;
}
.escola-smart-option:last-child { margin-bottom: 0; }
.escola-smart-option:hover {
  border-color: #bfdbfe;
  background: linear-gradient(135deg, var(--blue-lt), #fff);
}

.escola-smart-option strong {
  display: block;
  font-size: 13px;
  font-weight: 800;
  color: var(--g900);
  margin-bottom: 3px;
}
.escola-smart-option span {
  display: block;
  font-size: 11px;
  color: var(--g500);
  line-height: 1.4;
}

.escola-smart-badge {
  align-self: center;
  background: var(--blue-lt);
  color: var(--blue);
  border-radius: 8px;
  padding: 5px 10px;
  font-size: 10.5px;
  font-weight: 800;
  white-space: nowrap;
  letter-spacing: .03em;
}

.escola-smart-empty,
.escola-smart-empty-premium {
  margin-top: 10px;
  border: 1.5px dashed var(--g200);
  background: var(--g50);
  border-radius: 12px;
  padding: 14px;
  display: none;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  max-width: 560px;
}
.escola-smart-empty strong { display: block; font-size: 13px; color: var(--g900); font-weight: 800; }
.escola-smart-empty span { display: block; font-size: 11px; color: var(--g500); margin-top: 2px; }

/* ── Badge status escola ── */
.escola-card-status {
  border: 1.5px solid var(--g200);
  background: var(--g50);
  color: var(--g500);
  border-radius: 999px;
  padding: 6px 14px;
  font-size: 11px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: .06em;
  transition: all .2s;
}
.escola-card-status.ok {
  background: var(--green-lt);
  border-color: #6ee7b7;
  color: var(--green-dk);
}

/* ── Lista recentes / A-Z ── */
.escola-recentes-box,
.escola-recentes-box-premium {
  background: linear-gradient(180deg, #f8fbff 0%, #fff 100%);
  border: 1.5px solid #d4e4f8;
  border-radius: 16px;
  padding: 14px;
  box-shadow: var(--sh-xs);
}

.escola-recentes-title {
  font-size: 10.5px;
  font-weight: 900;
  color: var(--g400);
  text-transform: uppercase;
  letter-spacing: .10em;
  margin-bottom: 10px;
}

.escola-recentes-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
  max-height: 400px;
  overflow-y: auto;
  padding-right: 2px;
}

.escola-recentes-empty {
  font-size: 12px;
  color: var(--g400);
  line-height: 1.6;
  font-weight: 500;
}

.escola-recente-btn {
  border: 1.5px solid var(--g200);
  background: #fff;
  border-radius: 12px;
  padding: 10px 12px;
  text-align: left;
  cursor: pointer;
  font-family: 'Plus Jakarta Sans', sans-serif;
  transition: all .16s;
  width: 100%;
}
.escola-recente-btn:hover {
  border-color: #93c5fd;
  background: var(--blue-lt);
  transform: translateY(-1px);
  box-shadow: var(--sh-xs);
}
.escola-recente-btn strong {
  display: block;
  font-size: 12px;
  font-weight: 800;
  color: var(--g800);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.escola-recente-btn span {
  display: block;
  margin-top: 3px;
  font-size: 10.5px;
  color: var(--g500);
}

/* ════════════════════════════════════════
   CARD PERFIL DA ESCOLA (selecionada)
════════════════════════════════════════ */
.escola-profile,
.escola-profile-premium {
  border: 1.5px solid #c5d8f6;
  border-radius: 20px;
  overflow: hidden;
  background: var(--surface);
  box-shadow: var(--sh-lg);
  margin-top: 16px;
}

.escola-profile-head,
.escola-profile-head-premium {
  padding: 20px 22px;
  background:
    radial-gradient(circle at 88% 0%, rgba(201,168,76,.24) 0%, transparent 36%),
    linear-gradient(135deg, #001230 0%, var(--navy) 35%, var(--navy2) 65%, #1058b0 100%);
  color: #fff;
  display: flex;
  justify-content: space-between;
  gap: 16px;
  align-items: center;
  position: relative;
  overflow: hidden;
}

.escola-profile-head-premium::after {
  content: '';
  position: absolute;
  right: -60px;
  top: -80px;
  width: 240px;
  height: 240px;
  background: radial-gradient(circle, rgba(255,255,255,.10) 0%, transparent 68%);
  pointer-events: none;
}

.escola-profile-kicker {
  font-size: 10px;
  font-weight: 900;
  color: var(--gold2);
  letter-spacing: .12em;
  text-transform: uppercase;
  margin-bottom: 6px;
  opacity: .9;
}

.escola-profile h3 {
  font-size: 17px;
  font-weight: 900;
  color: #fff;
  margin: 0 0 4px;
  letter-spacing: -.3px;
  line-height: 1.25;
}

.escola-profile p { font-size: 12px; color: rgba(255,255,255,.70); margin: 0; }

.escola-profile-main {
  display: flex;
  align-items: center;
  gap: 14px;
  min-width: 0;
  position: relative;
  z-index: 1;
}

.escola-avatar-premium {
  width: 54px;
  height: 54px;
  border-radius: 16px;
  background: rgba(255,255,255,.12);
  border: 1.5px solid rgba(255,255,255,.22);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  flex-shrink: 0;
  box-shadow: 0 4px 14px rgba(0,0,0,.20);
}

.escola-profile-line {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin-top: 10px;
}

.escola-profile-line span {
  display: inline-flex;
  align-items: center;
  min-height: 26px;
  border: 1px solid rgba(255,255,255,.20);
  background: rgba(255,255,255,.10);
  border-radius: 999px;
  padding: 0 10px;
  font-size: 11.5px;
  font-weight: 700;
  color: rgba(255,255,255,.92);
}

.escola-profile-actions {
  display: flex;
  gap: 7px;
  position: relative;
  z-index: 1;
  flex-shrink: 0;
}

.escola-profile-actions button {
  width: 34px;
  height: 34px;
  border: 1.5px solid rgba(255,255,255,.22);
  background: rgba(255,255,255,.10);
  border-radius: 10px;
  color: #fff;
  font-size: 14px;
  font-weight: 800;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all .15s;
  backdrop-filter: blur(6px);
}
.escola-profile-actions button:hover {
  background: rgba(255,255,255,.22);
  transform: translateY(-1px);
}

/* Grid de dados da escola */
.escola-profile-grid,
.escola-profile-grid-premium {
  display: grid;
  grid-template-columns: repeat(4, minmax(0,1fr));
  gap: 1px;
  background: var(--g100);
}

.escola-profile-grid div,
.escola-profile-grid-premium div {
  background: linear-gradient(180deg, #fff 0%, #fafcff 100%);
  padding: 16px 18px;
}

.escola-profile-grid span,
.escola-profile-grid-premium span {
  display: block;
  font-size: 10px;
  font-weight: 800;
  color: var(--g400);
  text-transform: uppercase;
  letter-spacing: .07em;
  margin-bottom: 8px;
}

.escola-profile-grid strong,
.escola-profile-grid-premium strong {
  display: block;
  font-size: 13px;
  font-weight: 800;
  color: var(--g900);
  word-break: break-word;
}

/* Painel de e-mails */
.escola-email-panel,
.escola-email-panel-premium {
  padding: 18px 22px;
  border-top: 1px solid var(--g100);
  background: #fafcff;
}

.escola-email-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 12px;
  margin-bottom: 12px;
}

.escola-email-head span { font-size: 12px; font-weight: 800; color: var(--g800); }
.escola-email-head small { font-size: 11px; color: var(--g400); font-weight: 500; }

.escola-email-pills { display: flex; flex-wrap: wrap; gap: 8px; }

.email-pill {
  border: 1.5px solid var(--g200);
  background: var(--g50);
  color: var(--g700);
  border-radius: 999px;
  padding: 7px 12px;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  transition: all .15s;
}
.email-pill:hover { border-color: var(--blue); color: var(--blue); }
.email-pill.principal { background: var(--gold-lt); border-color: rgba(201,168,76,.50); color: #7a5200; }
.email-pill.ativo { background: var(--blue-lt); border-color: rgba(21,101,192,.35); color: var(--blue); }

.escola-add-email {
  display: grid;
  grid-template-columns: minmax(0,1fr) auto;
  gap: 8px;
  margin-top: 12px;
}

.escola-add-email input {
  width: 100%;
  min-height: 40px;
  border: 1.5px solid var(--g200);
  border-radius: 11px;
  padding: 0 13px;
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 13px;
  font-weight: 500;
  outline: none;
  transition: border-color .15s, box-shadow .15s;
}
.escola-add-email input:focus {
  border-color: var(--blue);
  box-shadow: 0 0 0 3px rgba(21,101,192,.09);
}

.escola-add-email button {
  border: none;
  border-radius: 999px;
  padding: 0 16px;
  background: linear-gradient(135deg, var(--navy2), #0d52b5);
  color: #fff;
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 12px;
  font-weight: 800;
  cursor: pointer;
  transition: all .15s;
  box-shadow: 0 3px 10px rgba(0,47,108,.22);
}
.escola-add-email button:hover { box-shadow: 0 6px 18px rgba(0,47,108,.32); }

/* Stats da escola */
.escola-profile-stats,
.escola-profile-stats-premium {
  display: grid;
  grid-template-columns: repeat(3, minmax(0,1fr));
  gap: 1px;
  background: var(--g100);
  border-top: 1px solid var(--g100);
}

.escola-profile-stats div,
.escola-profile-stats-premium div {
  background: linear-gradient(180deg, #fff 0%, #fafcff 100%);
  padding: 15px 18px;
}

.escola-profile-stats span,
.escola-profile-stats-premium span {
  display: block;
  font-size: 10px;
  font-weight: 800;
  color: var(--g400);
  text-transform: uppercase;
  letter-spacing: .07em;
  margin-bottom: 8px;
}

.escola-profile-stats strong,
.escola-profile-stats-premium strong {
  display: block;
  font-size: 14px;
  font-weight: 900;
  color: var(--g900);
}

/* Edição compat */
.escola-compat-fields { border-top: 1px solid var(--g100); padding-top: 18px; }
.escola-edit-title {
  font-size: 11px;
  font-weight: 900;
  color: var(--g500);
  text-transform: uppercase;
  letter-spacing: .09em;
  margin-bottom: 14px;
}

/* ════════════════════════════════════════
   TRABALHADORES
════════════════════════════════════════ */
.worker-zone {
  border: 2px dashed var(--g200);
  border-radius: 18px;
  background: linear-gradient(180deg, #fafcff 0%, #f5f8fd 100%);
  padding: 12px;
  min-height: 90px;
  transition: border-color .2s;
}
.worker-zone:hover { border-color: #bfdbfe; }

.worker-empty {
  padding: 36px 20px;
  text-align: center;
  color: var(--g400);
  font-size: 13px;
  line-height: 1.9;
  font-weight: 500;
}

.trabalhador-card {
  background: var(--surface);
  border: 1.5px solid var(--g200);
  border-radius: 16px;
  margin-bottom: 10px;
  overflow: hidden;
  transition: border-color .16s, box-shadow .16s;
}
.trabalhador-card:hover { border-color: #bfdbfe; box-shadow: var(--sh-sm); }

.trabalhador-card-topo {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 11px 16px;
  background: linear-gradient(180deg, #f8fbff 0%, #fafcff 100%);
  border-bottom: 1px solid var(--g100);
}

.trabalhador-topo-esquerda { display: flex; align-items: center; gap: 10px; }

.trabalhador-badge-numero {
  width: 26px;
  height: 26px;
  border-radius: 8px;
  background: linear-gradient(135deg, var(--navy2), var(--blue));
  color: #fff;
  font-size: 12px;
  font-weight: 900;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  box-shadow: 0 3px 8px rgba(0,47,108,.24);
}

.trabalhador-titulo { font-size: 13px; font-weight: 800; color: var(--g800); }
.trabalhador-sub { font-size: 11px; color: var(--g400); margin-top: 1px; font-weight: 500; }
.trabalhador-topo-acoes { display: flex; align-items: center; gap: 7px; flex-shrink: 0; }

.trabalhador-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  padding: 14px 16px;
}

.trabalhador-campo label {
  font-size: 10.5px;
  font-weight: 800;
  letter-spacing: .07em;
  text-transform: uppercase;
  color: var(--g500);
  display: block;
  margin-bottom: 6px;
}

.input-nome-trabalhador,
.input-cpf-trabalhador {
  width: 100%;
  min-height: 44px;
  border: 1.5px solid var(--g200);
  border-radius: 11px;
  background: linear-gradient(180deg, #fff 0%, #fbfdff 100%);
  color: var(--g900);
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 13.5px;
  font-weight: 500;
  padding: 0 13px;
  outline: none;
  transition: border-color .15s, box-shadow .15s;
}

.input-nome-trabalhador:focus,
.input-cpf-trabalhador:focus {
  border-color: var(--blue);
  box-shadow: 0 0 0 3.5px rgba(21,101,192,.10);
  background: #fff;
}

.alertaFicha {
  margin: 0 14px 12px;
  font-size: 11.5px;
  font-weight: 600;
  padding: 8px 12px;
  border-radius: 9px;
  background: var(--g50);
  border: 1.5px solid var(--g200);
  color: var(--g500);
}

.btn-remover-trabalhador-premium {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  border: 1.5px solid var(--g200);
  background: var(--surface);
  color: var(--g400);
  cursor: pointer;
  font-size: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all .15s;
  flex-shrink: 0;
}
.btn-remover-trabalhador-premium:hover {
  background: var(--red);
  border-color: var(--red);
  color: #fff;
  box-shadow: 0 3px 10px rgba(220,38,38,.28);
}

.btn-adicionar-trabalhador-card {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  border: 1.5px solid #93c5fd;
  background: #eff6ff;
  color: var(--navy2);
  cursor: pointer;
  font-size: 18px;
  font-weight: 900;
  line-height: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all .15s;
  flex-shrink: 0;
}
.btn-adicionar-trabalhador-card:hover {
  background: var(--navy2);
  border-color: var(--navy2);
  color: #fff;
  box-shadow: 0 3px 10px rgba(0,47,108,.24);
}

/* ════════════════════════════════════════
   REVISÃO
════════════════════════════════════════ */
.revisao-oficio {
  border: 1.5px solid var(--g200);
  border-radius: 18px;
  overflow: hidden;
  background: var(--surface);
}
.revisao-empty {
  padding: 24px;
  font-size: 13px;
  color: var(--g400);
  text-align: center;
  font-weight: 500;
}

.revisao-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0,1fr));
  gap: 1px;
  background: var(--g100);
}

.revisao-item {
  background: linear-gradient(180deg, #fff 0%, #fafcff 100%);
  padding: 16px 18px;
}
.revisao-item span {
  display: block;
  font-size: 10px;
  font-weight: 900;
  letter-spacing: .07em;
  text-transform: uppercase;
  color: var(--g400);
  margin-bottom: 8px;
}
.revisao-item strong {
  display: block;
  font-size: 14px;
  font-weight: 900;
  color: var(--g900);
  word-break: break-word;
}

.revisao-alerta {
  padding: 13px 18px;
  background: var(--amber-lt);
  color: #92400e;
  border-top: 1.5px solid #fcd34d;
  font-size: 12.5px;
  font-weight: 700;
  line-height: 1.5;
}

/* ════════════════════════════════════════
   BARRA DE AÇÃO (sticky)
════════════════════════════════════════ */
.of-action-bar {
  background:
    radial-gradient(ellipse at 80% 50%, rgba(201,168,76,.12) 0%, transparent 55%),
    linear-gradient(135deg, #001230 0%, var(--navy) 30%, var(--navy2) 60%, #0d52b5 100%);
  border-radius: var(--rad-lg);
  padding: 18px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
  box-shadow: var(--sh-xl);
  position: sticky;
  bottom: 14px;
  z-index: 40;
  margin-top: 8px;
  margin-bottom: 14px;
  border: 1.5px solid rgba(255,255,255,.08);
}

.of-action-bar-info { position: relative; z-index: 1; }
.of-action-bar-title {
  font-size: 15px;
  font-weight: 900;
  color: #fff;
  margin-bottom: 3px;
  letter-spacing: -.2px;
}
.of-action-bar-sub { font-size: 12px; color: rgba(255,255,255,.60); font-weight: 500; }
.of-action-bar-btns { display: flex; gap: 9px; flex-wrap: wrap; position: relative; z-index: 1; }

/* Botão emitir especial */
.of-action-bar .btn-gold {
  height: 46px;
  padding: 0 24px;
  font-size: 14px;
  border-radius: 13px;
}

/* ════════════════════════════════════════
   STATUS DE SINCRONIZAÇÃO
════════════════════════════════════════ */
#statusSincronizacao {
  min-height: 48px;
  display: flex;
  align-items: center;
  padding: 10px 14px;
  border-radius: var(--rad);
  font-size: 13px;
  font-weight: 600;
  line-height: 1.5;
}

/* ════════════════════════════════════════
   TABELA HISTÓRICO
════════════════════════════════════════ */
.of-table-wrap {
  overflow: auto;
  border: 1.5px solid var(--g200);
  border-radius: var(--rad-lg);
  background: var(--surface);
}

.of-table {
  width: 100%;
  min-width: 860px;
  border-collapse: collapse;
}

.of-table thead th {
  background: linear-gradient(180deg, #f8fbff 0%, #f1f5f9 100%);
  color: var(--g500);
  font-size: 10.5px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: .07em;
  text-align: left;
  padding: 13px 15px;
  border-bottom: 1.5px solid var(--g200);
}

.of-table tbody td {
  padding: 13px 15px;
  border-bottom: 1px solid var(--g100);
  font-size: 13px;
  color: var(--g800);
  font-weight: 500;
}

.of-table tbody tr:last-child td { border-bottom: none; }
.of-table tbody tr:hover td { background: #f8fbff; }

.hist-badge {
  display: inline-flex;
  align-items: center;
  font-size: 11px;
  font-weight: 800;
  padding: 4px 11px;
  border-radius: 999px;
  text-transform: uppercase;
  letter-spacing: .04em;
}
.hist-enviado { background: #dbeafe; color: #1d4ed8; }
.hist-confirmado { background: var(--green-lt); color: var(--green-dk); }
.hist-pendente { background: var(--amber-lt); color: #92400e; }
.of-table-empty { padding: 36px; text-align: center; color: var(--g400); font-size: 13px; font-weight: 500; }

/* ════════════════════════════════════════
   MODAL
════════════════════════════════════════ */
.of-modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,18,48,.65);
  z-index: 9999;
  align-items: center;
  justify-content: center;
  padding: 20px;
  backdrop-filter: blur(6px);
}
.of-modal-overlay.aberto { display: flex; animation: fadeIn .2s ease; }
@keyframes fadeIn { from{opacity:0} to{opacity:1} }

.of-modal {
  background: var(--surface);
  border-radius: var(--rad-xl);
  width: 100%;
  max-width: 760px;
  max-height: 90vh;
  display: flex;
  flex-direction: column;
  box-shadow: 0 40px 90px rgba(0,20,60,.36), 0 8px 30px rgba(0,20,60,.16);
  animation: riseUp .22s cubic-bezier(.4,0,.2,1);
  border: 1px solid rgba(255,255,255,.08);
}
@keyframes riseUp { from{opacity:0;transform:translateY(18px) scale(.96)} to{opacity:1;transform:none} }

.of-modal-head {
  background:
    radial-gradient(ellipse at 90% 0%, rgba(201,168,76,.20) 0%, transparent 40%),
    linear-gradient(135deg, var(--navy) 0%, var(--navy2) 55%, #1058b0 100%);
  color: #fff;
  padding: 20px 24px;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  flex-shrink: 0;
  border-radius: var(--rad-xl) var(--rad-xl) 0 0;
}

.of-modal-head-title { font-size: 16px; font-weight: 900; letter-spacing: -.2px; }
.of-modal-head-sub { font-size: 11.5px; color: rgba(255,255,255,.70); margin-top: 4px; }

.of-modal-close {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: rgba(255,255,255,.12);
  border: 1.5px solid rgba(255,255,255,.22);
  color: #fff;
  cursor: pointer;
  font-size: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background .15s;
  flex-shrink: 0;
}
.of-modal-close:hover { background: rgba(255,255,255,.26); }

.of-modal-body { overflow-y: auto; padding: 24px; flex: 1; }
.of-modal-foot {
  padding: 16px 24px;
  border-top: 1px solid var(--g100);
  display: flex;
  justify-content: flex-end;
  gap: 9px;
  flex-shrink: 0;
  background: linear-gradient(180deg, var(--surface) 0%, #fafcff 100%);
  border-radius: 0 0 var(--rad-xl) var(--rad-xl);
}

/* ════════════════════════════════════════
   FILA / STATUS
════════════════════════════════════════ */
.rascunho-badge {
  display: none;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  color: var(--green);
  font-weight: 700;
  margin-left: 8px;
}
.rascunho-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); }

.fila-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 10px; margin-bottom: 18px; }

.fila-card {
  border: 1.5px solid var(--g200);
  border-radius: var(--rad);
  padding: 14px;
  text-align: center;
  background: var(--g50);
  transition: box-shadow .16s;
}
.fila-card:hover { box-shadow: var(--sh-sm); }
.fila-card.total   { border-color: #bfdbfe; background: var(--blue-lt); }
.fila-card.pendente{ border-color: #fcd34d; background: var(--amber-lt); }
.fila-card.enviado { border-color: #6ee7b7; background: var(--green-lt); }
.fila-card.erro    { border-color: #fca5a5; background: var(--red-lt); }

.fila-num { font-size: 28px; font-weight: 900; line-height: 1.1; }
.fila-lbl { font-size: 10.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .07em; color: var(--g500); margin-top: 5px; }
.fila-card.total   .fila-num { color: var(--blue); }
.fila-card.pendente.fila-num { color: var(--amber); }
.fila-card.enviado .fila-num { color: var(--green); }
.fila-card.erro    .fila-num { color: var(--red); }

/* Info boxes */
.info-box { border-radius: var(--rad); padding: 12px 15px; font-size: 12.5px; line-height: 1.65; font-weight: 600; }
.info-box.blue  { background: var(--blue-lt); border: 1.5px solid #bfdbfe; color: #1e40af; }
.info-box.amber { background: var(--amber-lt); border: 1.5px solid #fcd34d; color: #92400e; }
.info-box.green { background: var(--green-lt); border: 1.5px solid #6ee7b7; color: var(--green-dk); }

.contador-corpo { font-size: 11px; color: var(--g400); text-align: right; margin-top: 5px; font-weight: 500; }

#statusConsultaCnpj { display: none; margin-top: 12px; }
#painelDivergenciasCnpj, #painelDadosExternosCnpj { display: none; margin-top: 12px; }

/* Barra de ações em massa */
#histBarraAcoes {
  border-radius: var(--rad);
  border: 1.5px solid #bfdbfe !important;
}

/* ════════════════════════════════════════
   FICHAS / AREA TRABALHADOR
════════════════════════════════════════ */
.trabalhador-ficha-area {
  margin: 0 16px 14px !important;
  padding: 12px 14px !important;
  background: linear-gradient(180deg, #f8fbff 0%, #f4f8fe 100%) !important;
  border-radius: 12px !important;
  border: 1.5px dashed var(--g200) !important;
}

/* ════════════════════════════════════════
   FICHAS VINCULADAS
════════════════════════════════════════ */
.fichas-vinculadas { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
.ficha-vinculada-item {
  border: 1.5px solid var(--g200);
  background: var(--g50);
  border-radius: 11px;
  padding: 10px 13px;
  display: flex;
  justify-content: space-between;
  gap: 12px;
  align-items: center;
}
.ficha-vinculada-item strong { display: block; font-size: 12.5px; font-weight: 800; color: var(--g800); }
.ficha-vinculada-item span { display: block; margin-top: 2px; font-size: 11px; color: var(--g500); }
.ficha-vinculada-item small { font-size: 10.5px; color: var(--g400); text-align: right; flex-shrink: 0; }

/* ════════════════════════════════════════
   RESPONSIVO
════════════════════════════════════════ */

<script>
/* ── chips de município ── */
window.initChipsMunicipio = function() {
  var wrap=document.getElementById("wrapBuscaEscola")||document.querySelector(".escola-search-wrap-premium");
  if(!wrap||document.getElementById("municipioChips")) return;

  var municipios=["Vitória","Serra","Cariacica","Vila Velha","Viana","Guarapari","Fundão","Domingos Martins"];
  var chipsDiv=document.createElement("div");
  chipsDiv.id="municipioChips"; chipsDiv.className="municipio-chips";

  var ativo=null;
  municipios.forEach(function(m){
    var btn=document.createElement("button");
    btn.type="button"; btn.className="municipio-chip"; btn.textContent=m;
    btn.onclick=function(){
      if(ativo===m){ ativo=null; btn.classList.remove("ativo"); var busca=document.getElementById("escolaBusca"); if(busca){busca.value="";busca.dispatchEvent(new Event("input"));} }
      else {
        document.querySelectorAll(".municipio-chip").forEach(function(c){c.classList.remove("ativo");});
        ativo=m; btn.classList.add("ativo");
        var busca=document.getElementById("escolaBusca");
        if(busca){ busca.value=m; busca.dispatchEvent(new Event("input")); busca.focus(); }
      }
    };
    chipsDiv.appendChild(btn);
  });

  wrap.insertBefore(chipsDiv, wrap.firstChild);
};

/* ── toast enriquecido — sobrescreve o toast simples ── */
(function() {
  var BOX_ID="sisgepToastRich";
  function getBox(){ var b=document.getElementById(BOX_ID); if(!b){b=document.createElement("div");b.id=BOX_ID;b.className="sisgep-toast-rich";document.body.appendChild(b);} return b; }
  var ICONS={ok:"✓",err:"✕",warn:"!",info:"i"};
  var LABELS={ok:"",err:"",warn:"Atenção",info:""};
  window.toast=function(msg,tipo,dur){
    tipo=tipo||"info"; dur=dur||4000;
    var box=getBox();
    var item=document.createElement("div"); item.className="sisgep-toast-item"; item.style.position="relative";
    item.innerHTML='<div class="toast-icon toast-icon-'+tipo+'">'+ICONS[tipo]+'</div>'
 +'<div class="toast-title">'+(LABELS[tipo]?'<span style="font-weight:500;margin-right:4px;">'+LABELS[tipo]+'</span>':"")+(typeof escapeHtml === "function" ? escapeHtml(String(msg||"")) : String(msg||""))+'</div></div>'
      +'<button class="toast-close" title="Fechar">✕</button>'
      +'<div class="toast-bar"><div class="toast-bar-fill toast-bar-fill-'+tipo+'" style="animation-duration:'+dur+'ms;"></div></div>';
var timer=setTimeout(function(){fechar();},dur);
    function fechar(){clearTimeout(timer);item.classList.add("saindo");setTimeout(function(){item.remove();},220);}
    item.querySelector(".toast-close").onclick=fechar;
    box.appendChild(item);
    // auto-limpar se tiver muitos
    if(box.children.length>5) box.children[0].remove();
  };
})();

/* ── barra de exportação no histórico ── */
window.initHistExportBar = function() {
  var card=document.getElementById("blocoOficioHistorico"); if(!card) return;
  var cardBody=card.querySelector(".of-card-body"); if(!cardBody||document.getElementById("histExportBar")) return;
  var bar=document.createElement("div"); bar.id="histExportBar"; bar.className="hist-export-bar";
bar.innerHTML='<span class="hist-export-title">Exportar resultados filtrados</span>'
    +'<button id="btnExportHistCSV" class="btn-export">📊 CSV</button>';
  cardBody.insertBefore(bar, cardBody.firstChild);

  document.getElementById("btnExportHistCSV").addEventListener("click", function() {
    var tbody = document.getElementById("corpoHistorico");
    if (!tbody) return;
    var linhas = Array.from(tbody.querySelectorAll("tr")).map(function(tr) {
      return Array.from(tr.querySelectorAll("td")).slice(1, 6).map(function(td) {
        return '"' + (td.textContent || "").trim().replace(/"/g, '""') + '"';
      }).join(";");
    }).filter(Boolean);
    if (!linhas.length) { toast("Nenhum dado para exportar.", "warn"); return; }
    var csv = "Número;Tipo;Escola;Data;Status\n" + linhas.join("\n");
    var blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = "historico_oficios.csv"; a.click();
    URL.revokeObjectURL(url);
  });
};

/* ── inicialização de todas as melhorias de layout ── */
document.addEventListener("DOMContentLoaded",function(){
  setTimeout(function(){
    window.initChipsMunicipio&&initChipsMunicipio();
    window.initHistExportBar&&initHistExportBar();
  },800);
});
</script>
