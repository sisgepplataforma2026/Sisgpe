<div id="juridicoAdmin" style="min-height:100%;background:#f0f4f8;font-family:'Plus Jakarta Sans',Arial,sans-serif;color:#0f172a;">
  <style>
    #juridicoAdmin *{box-sizing:border-box}.mod-head{background:linear-gradient(135deg,#001f4d,#1565C0);color:#fff;padding:22px 24px;display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap}.mod-title{font-size:21px;font-weight:900}.mod-sub{font-size:12px;color:rgba(255,255,255,.68);margin-top:4px}.mod-wrap{padding:18px 22px 34px}.mod-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}.mod-card,.mod-panel{background:#fff;border:1px solid #e2e8f0;border-radius:14px;box-shadow:0 2px 10px rgba(0,20,60,.06)}.mod-card{padding:15px}.mod-card small{font-size:10px;font-weight:900;color:#64748b;text-transform:uppercase}.mod-card strong{display:block;font-size:28px;color:#001f4d;margin-top:7px}.mod-panel{overflow:hidden}.mod-bar{padding:14px 16px;border-bottom:1px solid #eef2f7;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.mod-form{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr auto;gap:10px;padding:14px 16px;background:#f8fafc;border-bottom:1px solid #eef2f7}.mod-field label{display:block;font-size:10px;font-weight:900;color:#64748b;text-transform:uppercase;margin-bottom:4px}.mod-field input,.mod-field select{width:100%;height:36px;border:1.5px solid #dbe4ef;border-radius:9px;padding:0 10px;font-family:inherit}.mod-btn{height:34px;border-radius:9px;border:1px solid #cbd5e1;background:#fff;color:#334155;font-size:12px;font-weight:800;padding:0 12px;cursor:pointer;font-family:inherit}.mod-btn.primary{background:linear-gradient(135deg,#001f4d,#1565C0);color:#fff;border-color:#1565C0}.mod-search{padding:12px 16px;display:flex;gap:8px}.mod-search input{flex:1;height:36px;border:1.5px solid #dbe4ef;border-radius:999px;padding:0 14px}.mod-table{width:100%;border-collapse:collapse;min-width:760px}.mod-table th{background:#f8fafc;color:#64748b;font-size:10px;text-transform:uppercase;text-align:left;padding:10px}.mod-table td{font-size:12.5px;padding:11px 10px;border-top:1px solid #f1f5f9}.pill{border-radius:999px;padding:3px 9px;font-size:10.5px;font-weight:900}.ok{background:#dcfce7;color:#166534}.warn{background:#fef3c7;color:#92400e}.off{background:#fee2e2;color:#991b1b}@media(max-width:1000px){.mod-grid{grid-template-columns:repeat(2,1fr)}.mod-form{grid-template-columns:1fr 1fr}}
  </style>
  <div class="mod-head"><div><div class="mod-title">Jurídico</div><div class="mod-sub">Processos, notificações, prazos e documentos</div></div><button class="mod-btn" onclick="spIr('sofia',null,{mensagem:'Preciso de apoio jurídico sindical.'})">Consultar SOFIA</button></div>
  <div class="mod-wrap">
    <div class="mod-grid"><div class="mod-card"><small>Ativos</small><strong id="jurAtivos">0</strong></div><div class="mod-card"><small>Prazos 15d</small><strong id="jurPrazos">0</strong></div><div class="mod-card"><small>Notificações</small><strong id="jurNotificacoes">0</strong></div><div class="mod-card"><small>Concluídos</small><strong id="jurConcluidos">0</strong></div></div>
    <div class="mod-panel"><div class="mod-bar"><strong>Controle jurídico</strong><div><button class="mod-btn" onclick="jurExportar()">Exportar CSV</button><button class="mod-btn" onclick="spIr('documentos',null,{aba:'novo'})">Gerar documento</button></div></div>
      <div class="mod-form"><div class="mod-field"><label>Assunto</label><input id="jurAssunto" placeholder="Ex.: Notificação escolar"></div><div class="mod-field"><label>Tipo</label><select id="jurTipo"><option>Processo</option><option>Notificação</option><option>Contrato</option><option>Consulta</option></select></div><div class="mod-field"><label>Prazo</label><input id="jurPrazo" type="date"></div><div class="mod-field"><label>Status</label><select id="jurStatus"><option>Ativo</option><option>Atenção</option><option>Concluído</option></select></div><button class="mod-btn primary" onclick="jurSalvar()">Salvar</button></div>
      <div class="mod-search"><input id="jurBusca" placeholder="Buscar assunto, tipo ou status..." oninput="jurRender()"><button class="mod-btn" onclick="jurLimpar()">Limpar</button></div>
      <div style="overflow:auto"><table class="mod-table"><thead><tr><th>Assunto</th><th>Tipo</th><th>Prazo</th><th>Status</th><th>Ações</th></tr></thead><tbody id="jurTabela"></tbody></table></div>
    </div>
  </div>
  <script>
  (function(){
    var edit="", cache=[];
    function g(i){return document.getElementById(i)}
    function token(){return typeof SISGEP_TOKEN_SESSAO!=="undefined"?SISGEP_TOKEN_SESSAO:""}
    function esc(s){return String(s||"").replace(/[&<>"']/g,function(c){return({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c])})}
    function dias(d){if(!d)return 999;var h=new Date();h.setHours(0,0,0,0);return Math.ceil((new Date(d+"T00:00:00")-h)/86400000)}
    function cls(s){return s==="Concluído"?"ok":s==="Atenção"?"warn":"off"}

    function renderLista(l){
      var b=String((g("jurBusca")||{}).value||"").toLowerCase();
      var f=l.filter(function(x){return !b||[x.assunto,x.tipo,x.status].join(" ").toLowerCase().indexOf(b)>=0});
      g("jurAtivos").textContent=l.filter(function(x){return x.status!=="Concluído"}).length;
      g("jurPrazos").textContent=l.filter(function(x){var d=dias(x.prazo);return d>=0&&d<=15&&x.status!=="Concluído"}).length;
      g("jurNotificacoes").textContent=l.filter(function(x){return x.tipo==="Notificação"}).length;
      g("jurConcluidos").textContent=l.filter(function(x){return x.status==="Concluído"}).length;
      g("jurTabela").innerHTML=f.length?f.map(function(x){
        return "<tr><td><strong>"+esc(x.assunto)+"</strong></td><td>"+esc(x.tipo)+"</td><td>"+esc(x.prazo||"-")+"</td><td><span class='pill "+cls(x.status)+"'>"+esc(x.status)+"</span></td><td><button class='mod-btn' onclick=\"jurEditar('"+x.id+"')\">Editar</button> <button class='mod-btn' onclick=\"jurExcluir('"+x.id+"')\">Excluir</button></td></tr>";
      }).join(""):"<tr><td colspan='5' style='text-align:center;color:#94a3b8;padding:24px'>Nenhum registro.</td></tr>";
    }

    window.jurRender=function(){
      google.script.run
        .withSuccessHandler(function(r){
          if(!r||!r.ok){ g("jurTabela").innerHTML="<tr><td colspan='5' style='text-align:center;color:#991b1b;padding:24px'>"+esc((r&&r.mensagem)||"Não foi possível carregar.")+"</td></tr>"; return; }
          cache=r.itens||[];
          renderLista(cache);
        })
        .withFailureHandler(function(e){
          g("jurTabela").innerHTML="<tr><td colspan='5' style='text-align:center;color:#991b1b;padding:24px'>Erro ao carregar: "+esc(e&&e.message?e.message:e)+"</td></tr>";
        })
        .listarProcessosJuridicos(token());
    };

    window.jurSalvar=function(){
      var assunto=g("jurAssunto").value;
      if(!String(assunto||"").trim()) return alert("Informe o assunto.");
      var dados={id:edit||"", assunto:assunto, tipo:g("jurTipo").value, prazo:g("jurPrazo").value, status:g("jurStatus").value};
      var btn=document.querySelector(".mod-btn.primary");
      if(btn){btn.disabled=true;btn.textContent="Salvando...";}
      google.script.run
        .withSuccessHandler(function(r){
          if(btn){btn.disabled=false;btn.textContent="Salvar";}
          if(!r||!r.ok){ alert("Erro: "+((r&&r.mensagem)||"não foi possível salvar.")); return; }
          jurLimpar();
          jurRender();
        })
        .withFailureHandler(function(e){
          if(btn){btn.disabled=false;btn.textContent="Salvar";}
          alert("Erro ao salvar: "+(e&&e.message?e.message:e));
        })
        .salvarProcessoJuridico(dados, token());
    };

    window.jurEditar=function(id){
      var x=cache.find(function(a){return a.id===id});
      if(!x) return;
      edit=id;
      g("jurAssunto").value=x.assunto;
      g("jurTipo").value=x.tipo;
      g("jurPrazo").value=x.prazo;
      g("jurStatus").value=x.status;
    };

    window.jurExcluir=function(id){
      if(!confirm("Excluir registro?")) return;
      google.script.run
        .withSuccessHandler(function(r){
          if(!r||!r.ok){ alert("Erro: "+((r&&r.mensagem)||"não foi possível excluir.")); return; }
          jurRender();
        })
        .withFailureHandler(function(e){ alert("Erro ao excluir: "+(e&&e.message?e.message:e)); })
        .excluirProcessoJuridico(id, token());
    };

    window.jurLimpar=function(){
      edit="";
      ["jurAssunto","jurPrazo"].forEach(function(i){g(i).value=""});
      g("jurTipo").value="Processo";
      g("jurStatus").value="Ativo";
    };

    window.jurExportar=function(){
      var rows=[["Assunto","Tipo","Prazo","Status"]].concat(cache.map(function(x){return[x.assunto,x.tipo,x.prazo,x.status]}));
      var csv=rows.map(function(r){return r.map(function(c){return'"'+String(c||"").replace(/"/g,'""')+'"'}).join(";")}).join("\n");
      var a=document.createElement("a");
      a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
      a.download="sisgep-juridico.csv";
      a.click();
    };

    window.initJuridico=jurRender;
    if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",jurRender); else setTimeout(jurRender,80);
  })();
  </script>
</div>
