dding:11px 10px;border-top:1px solid #f1f5f9}.pill{border-radius:999px;padding:3px 9px;font-size:10.5px;font-weight:900}.ok{background:#dcfce7;color:#166534}.warn{background:#fef3c7;color:#92400e}.off{background:#fee2e2;color:#991b1b}.jur-link-assunto{background:none;border:none;padding:0;font:inherit;color:#0f172a;font-weight:700;cursor:pointer;text-align:left}.jur-link-assunto:hover{color:#1565C0;text-decoration:underline}@media(max-width:1000px){.mod-grid{grid-template-columns:repeat(2,1fr)}.mod-form{grid-template-columns:1fr 1fr}}

          <div class="mod-field"><label>Tipo</label><select id="jurFTipo"><option>Processo</option><option>Notificação</option><option>Contrato</option><option>Consulta</option></select></div>

        <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap">
          <button class="mod-btn" onclick="jurEnviarAnexo()" id="jurBtnAnexo">Enviar anexo</button>

  <script>
  (function(){
    console.log("[JUR] script do Jurídico carregado. readyState=", document.readyState);
    if(window.__jurInicializado){
      console.warn("[JUR] script injetado de novo na mesma página — ignorando para não duplicar chamadas.");
      return;
    }
    window.__jurInicializado=true;
    var edit="", cache=[], fichaId="";
    var fichaAssociado={cpf:"",nome:""}, fichaEscola={cnpj:"",nome:""};
    var vigiaBuscaAssociado=null, vigiaBuscaEscola=null;
    var ultimaBuscaAssociados=[], ultimaBuscaEscolas=[];
    function g(i){return document.getElementById(i)}
    function token(){return typeof SISGEP_TOKEN_SESSAO!=="undefined"?SISGEP_TOKEN_SESSAO:""}
    function esc(s){return String(s||"").replace(/[&<>"']/g,function(c){return({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c])})}
    function dias(d){if(!d)return 999;var h=new Date();h.setHours(0,0,0,0);return Math.ceil((new Date(d+"T00:00:00")-h)/86400000)}
    function cls(s){return s==="Concluído"?"ok":s==="Atenção"?"warn":"off"}

    function renderLista(l){
      var b=String((g("jurBusca")||{}).value||"").toLowerCase();
      var f=l.filter(function(x){return !b||[x.assunto,x.tipo,x.status,x.cnj,x.responsavel,x.area,x.associadoNome,x.escolaNome].join(" ").toLowerCase().indexOf(b)>=0});
      g("jurAtivos").textContent=l.filter(function(x){return x.status!=="Concluído"}).length;
      g("jurPrazos").textContent=l.filter(function(x){var d=dias(x.prazo);return d>=0&&d<=15&&x.status!=="Concluído"}).length;
      g("jurNotificacoes").textContent=l.filter(function(x){return x.tipo==="Notificação"}).length;
      g("jurConcluidos").textContent=l.filter(function(x){return x.status==="Concluído"}).length;
      g("jurTabela").innerHTML=f.length?f.map(function(x){
        return "<tr><td><button class='jur-link-assunto' onclick=\"jurAbrirFicha('"+x.id+"')\">"+esc(x.assunto)+"</button></td><td>"+esc(x.tipo)+"</td><td>"+esc(x.prazo||"-")+"</td><td><span class='pill "+cls(x.status)+"'>"+esc(x.status)+"</span></td><td><button class='mod-btn' onclick=\"jurAbrirFicha('"+x.id+"')\">Detalhes</button> <button class='mod-btn' onclick=\"jurExcluir('"+x.id+"')\">Excluir</button></td></tr>";
      }).join(""):"<tr><td colspan='5' style='text-align:center;color:#94a3b8;padding:24px'>Nenhum registro.</td></tr>";
    }

    window.jurRender=function(){
      console.log("[JUR] jurRender chamado. token=", token()?"(presente, "+token().length+" chars)":"(VAZIO)", "g(jurTabela)=", !!g("jurTabela"));
      if(typeof google==="undefined"||!google.script||!google.script.run){
        console.error("[JUR] google.script.run indisponível neste contexto.");
        if(g("jurTabela")) g("jurTabela").innerHTML="<tr><td colspan='5' style='text-align:center;color:#991b1b;padding:24px'>Erro interno: conexão com o servidor indisponível.</td></tr>";
        return;
      }
      google.script.run
        .withSuccessHandler(function(r){
          console.log("[JUR] jurListarProcessos respondeu:", r);
          if(!r||!r.ok){ g("jurTabela").innerHTML="<tr><td colspan='5' style='text-align:center;color:#991b1b;padding:24px'>"+esc((r&&r.mensagem)||"Não foi possível carregar.")+"</td></tr>"; return; }
          cache=r.itens||[];
          renderLista(cache);
        })
        .withFailureHandler(function(e){
          console.error("[JUR] jurListarProcessos falhou:", e);
          g("jurTabela").innerHTML="<tr><td colspan='5' style='text-align:center;color:#991b1b;padding:24px'>Erro ao carregar: "+esc(e&&e.message?e.message:e)+"</td></tr>";
        })
        .jurListarProcessos(token());
    };

    // Cadastro rápido (form do topo) — só os 4 campos essenciais, pra não
    // atrapalhar quem só quer abrir um registro rapidamente. Os campos
    // jurídicos completos e o anexo ficam na ficha do processo.
    window.jurSalvar=function(){
      var assunto=g("jurAssunto").value;
      if(!String(assunto||"").trim()) return alert("Informe o assunto.");
      var dados={id:"", assunto:assunto, tipo:g("jurTipo").value, prazo:g("jurPrazo").value, status:g("jurStatus").value};
      var btn=document.querySelector(".mod-form .mod-btn.primary");
      var avisouDemora=false;
      if(btn){btn.disabled=true;btn.textContent="Salvando...";}
      var vigia=setTimeout(function(){
        avisouDemora=true;
        if(btn){btn.disabled=false;btn.textContent="Salvar";}
        alert("O servidor está demorando para responder. Se o registro salvar mesmo assim, a lista vai atualizar sozinha daqui a pouco. Evite clicar em Salvar de novo antes disso, pra não duplicar.");
      },25000);
      google.script.run
        .withSuccessHandler(function(r){
          clearTimeout(vigia);
          if(btn){btn.disabled=false;btn.textContent="Salvar";}
          if(!r||!r.ok){ if(!avisouDemora) alert("Erro: "+((r&&r.mensagem)||"não foi possível salvar.")); return; }
          jurLimpar();
          jurRender();
        })
        .withFailureHandler(function(e){
          clearTimeout(vigia);
          if(btn){btn.disabled=false;btn.textContent="Salvar";}
          if(!avisouDemora) alert("Erro ao salvar: "+(e&&e.message?e.message:e));
        })
        .jurSalvarProcesso(dados, token());
    };

    window.jurExcluir=function(id){
      if(!confirm("Excluir registro?")) return;
      google.script.run
        .withSuccessHandler(function(r){
          if(!r||!r.ok){ alert("Erro: "+((r&&r.mensagem)||"não foi possível excluir.")); return; }
          jurRender();
        })
        .withFailureHandler(function(e){ alert("Erro ao excluir: "+(e&&e.message?e.message:e)); })
        .jurExcluirProcesso(id, token());
    };

    window.jurLimpar=function(){
      edit="";
      ["jurAssunto","jurPrazo"].forEach(function(i){g(i).value=""});
      g("jurTipo").value="Processo";
      g("jurStatus").value="Ativo";
    };

    window.jurExportar=function(){
      var rows=[["Assunto","Tipo","Prazo","Status","Número CNJ","Área","Responsável","Autor","Réu"]].concat(cache.map(function(x){return[x.assunto,x.tipo,x.prazo,x.status,x.cnj,x.area,x.responsavel,x.autor,x.reu]}));
      var csv=rows.map(function(r){return r.map(function(c){return'"'+String(c||"").replace(/"/g,'""')+'"'}).join(";")}).join("\n");
      var a=document.createElement("a");
      a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
      a.download="sisgep-juridico.csv";
      a.click();
    };

    // ---------------- Vínculos: Associado e Escola ----------------

    function renderAnexo(link, nome){
      g("jurFAnexoAtual").innerHTML=link
        ? "<div class='jur-anexo-atual'>📎 <a href='"+esc(link)+"' target='_blank' rel='noopener'>"+esc(nome||"Documento anexado")+"</a><button class='mod-btn' style='height:auto;padding:2px 8px;margin-left:auto' onclick='jurExcluirAnexoAtual()'>Excluir</button></div>"
        : "<div style='font-size:12.5px;color:#94a3b8;margin-bottom:10px'>Nenhum documento anexado ainda.</div>";
    }

    window.jurExcluirAnexoAtual=function(){
      if(!confirm("Excluir o documento anexado a este processo?")) return;
      google.script.run
        .withSuccessHandler(function(r){
          if(!r||!r.ok){ alert("Erro: "+((r&&r.mensagem)||"não foi possível excluir o anexo.")); return; }
          renderAnexo("","");
          jurRender();
        })
        .withFailureHandler(function(e){ alert("Erro ao excluir anexo: "+(e&&e.message?e.message:e)); })
        .jurExcluirAnexo(fichaId, token());
    };

    function renderVinculosChips(){
      var chips="";
      if(fichaAssociado.cpf||fichaAssociado.nome){
        chips+="<span class='jur-chip'>👤 "+esc(fichaAssociado.nome||fichaAssociado.cpf)+" <button onclick=\"jurLimparVinculo('associado')\" title='Remover'>&times;</button></span>";
      }
      if(fichaEscola.cnpj||fichaEscola.nome){
        chips+="<span class='jur-chip'>🏫 "+esc(fichaEscola.nome||fichaEscola.cnpj)+" <button onclick=\"jurLimparVinculo('escola')\" title='Remover'>&times;</button></span>";
      }
      g("jurFVinculosSelecionados").innerHTML=chips;
    }

    // Máscara do número CNJ: NNNNNNN-NN.NNNN.N.NN.NNNN (padrão nacional).
    window.jurMascararCnj=function(input){
      var d=input.value.replace(/\D/g,"").slice(0,20);
      var v=d.slice(0,7);
      if(d.length>7) v+="-"+d.slice(7,9);
      if(d.length>9) v+="."+d.slice(9,13);
      if(d.length>13) v+="."+d.slice(13,14);
      if(d.length>14) v+="."+d.slice(14,16);
      if(d.length>16) v+="."+d.slice(16,20);
      input.value=v;
    };

    window.jurLimparVinculo=function(tipo){
      if(tipo==="associado"){ fichaAssociado={cpf:"",nome:""}; g("jurFAssociadoBusca").value=""; }
      if(tipo==="escola"){ fichaEscola={cnpj:"",nome:""}; g("jurFEscolaBusca").value=""; }
      renderVinculosChips();
    };

    window.jurBuscarAssociadoDigitado=function(){
      clearTimeout(vigiaBuscaAssociado);
      var termo=g("jurFAssociadoBusca").value;
      var lista=g("jurFAssociadoLista");
      if(String(termo||"").trim().length<2){ lista.classList.remove("aberto"); return; }
      vigiaBuscaAssociado=setTimeout(function(){
        google.script.run
          .withSuccessHandler(function(r){
            if(!r||!r.ok){ lista.innerHTML="<div class='vazio'>"+esc((r&&r.mensagem)||"Erro na busca.")+"</div>"; lista.classList.add("aberto"); return; }
            ultimaBuscaAssociados=r.itens||[];
            lista.innerHTML=ultimaBuscaAssociados.length?ultimaBuscaAssociados.map(function(a,i){
              return "<div class='item' onclick='jurSelecionarAssociado("+i+")'><b>"+esc(a.nome)+"</b><span>"+esc(a.cpf||"")+(a.escola?" · "+esc(a.escola):"")+"</span></div>";
            }).join(""):"<div class='vazio'>Nenhum associado encontrado.</div>";
            lista.classList.add("aberto");
          })
          .withFailureHandler(function(e){ lista.innerHTML="<div class='vazio'>Erro: "+esc(e&&e.message?e.message:e)+"</div>"; lista.classList.add("aberto"); })
          .jurBuscarAssociado(termo, token());
      },300);
    };

    window.jurSelecionarAssociado=function(idx){
      var a=ultimaBuscaAssociados[idx];
      if(!a) return;
      fichaAssociado={cpf:a.cpf||"",nome:a.nome||""};
      g("jurFAssociadoBusca").value="";
      g("jurFAssociadoLista").classList.remove("aberto");
      renderVinculosChips();
      // O "escola" que vem do cadastro de Associados é nome informal
      // (Sindicalização), diferente da base de Escolas por CNPJ (Ofícios) —
      // não dá pra vincular automático (só ~4% batem entre as duas bases).
      // Em vez de arriscar vincular errado, só pré-preenche a busca pra
      // poupar digitação; quem confirma a escola certa é o usuário.
      if(a.escola && !fichaEscola.nome){
        g("jurFEscolaBusca").value=a.escola;
        jurBuscarEscolaDigitada();
      }
    };

    window.jurBuscarEscolaDigitada=function(){
      clearTimeout(vigiaBuscaEscola);
      var termo=g("jurFEscolaBusca").value;
      var lista=g("jurFEscolaLista");
      if(String(termo||"").trim().length<2){ lista.classList.remove("aberto"); return; }
      vigiaBuscaEscola=setTimeout(function(){
        google.script.run
          .withSuccessHandler(function(r){
            if(!r||!r.ok){ lista.innerHTML="<div class='vazio'>"+esc((r&&r.mensagem)||"Erro na busca.")+"</div>"; lista.classList.add("aberto"); return; }
            ultimaBuscaEscolas=(r.itens||[]).map(function(e){
              return { nome:e.escola||e.nome||e.NomeEscola||"", cnpj:e.cnpjLimpo||e.cnpj||"", cidade:e.cidade||e.municipio||"" };
            });
            lista.innerHTML=ultimaBuscaEscolas.length?ultimaBuscaEscolas.map(function(e,i){
              return "<div class='item' onclick='jurSelecionarEscola("+i+")'><b>"+esc(e.nome)+"</b><span>"+esc(e.cnpj)+(e.cidade?" · "+esc(e.cidade):"")+"</span></div>";
            }).join(""):"<div class='vazio'>Nenhuma escola encontrada.</div>";
            lista.classList.add("aberto");
          })
          .withFailureHandler(function(e){ lista.innerHTML="<div class='vazio'>Erro: "+esc(e&&e.message?e.message:e)+"</div>"; lista.classList.add("aberto"); })
          .jurBuscarEscolaVinculo(termo, token());
      },300);
    };

    window.jurSelecionarEscola=function(idx){
      var e=ultimaBuscaEscolas[idx];
      if(!e) return;
      fichaEscola={cnpj:e.cnpj||"",nome:e.nome||""};
      g("jurFEscolaBusca").value="";
      g("jurFEscolaLista").classList.remove("aberto");
      renderVinculosChips();
    };

    document.addEventListener("click",function(ev){
      if(!ev.target.closest("#jurFAssociadoBusca") && !ev.target.closest("#jurFAssociadoLista")){ var l1=g("jurFAssociadoLista"); if(l1) l1.classList.remove("aberto"); }
      if(!ev.target.closest("#jurFEscolaBusca") && !ev.target.closest("#jurFEscolaLista")){ var l2=g("jurFEscolaLista"); if(l2) l2.classList.remove("aberto"); }
    });

    // ---------------- Ficha do processo ----------------

    window.jurAbrirFicha=function(id){
      var x=cache.find(function(a){return a.id===id});
      if(!x) return;
      fichaId=id;
      g("jurFAssunto").value=x.assunto||"";
      g("jurFTipo").value=x.tipo||"Processo";
      g("jurFArea").value=x.area||"";
      g("jurFStatus").value=x.status||"Ativo";
      g("jurFPrazo").value=x.prazo||"";
      g("jurFResponsavel").value=x.responsavel||"";
      g("jurFCnj").value=x.cnj||"";
      g("jurFAutor").value=x.autor||"";
      g("jurFReu").value=x.reu||"";
      g("jurFResponsavelEmail").value=x.responsavelEmail||"";
      fichaAssociado={cpf:x.associadoCpf||"",nome:x.associadoNome||""};
      fichaEscola={cnpj:x.escolaCnpj||"",nome:x.escolaNome||""};
      g("jurFAssociadoBusca").value="";
      g("jurFEscolaBusca").value="";
      renderVinculosChips();
      g("jurFArquivo").value="";
      g("jurBtnCancelarArquivo").style.display="none";
      g("jurBtnLerIA").style.display="none";
      g("jurIAResultado").style.display="none";
      renderAnexo(x.linkDocumento, x.nomeArquivo);
      g("jurFMeta").innerHTML="Criado por "+esc(x.criadoPor||"—")+" em "+esc(x.criadoEm||"—")+"<br>Última atualização por "+esc(x.atualizadoPor||"—")+" em "+esc(x.atualizadoEm||"—");
      g("jurFNovoPrazoDescricao").value="";
      g("jurFNovoPrazoData").value="";
      g("jurFNovaAudienciaData").value="";
      g("jurFNovaAudienciaHora").value="";
      g("jurFNovaAudienciaTipo").value="";
      g("jurFNovaAudienciaLocal").value="";
      jurCarregarPrazos();
      jurCarregarAudiencias();
      g("jurModalOverlay").classList.add("aberto");
    };

    window.jurFecharFicha=function(){
      g("jurModalOverlay").classList.remove("aberto");
      fichaId="";
    };

    // ---------------- Prazos do processo ----------------

    function jurFormatarDataBr_(iso){
      if(!iso) return "-";
      var p=String(iso).split("-");
      return p.length===3?(p[2]+"/"+p[1]+"/"+p[0]):iso;
    }

    window.jurCarregarPrazos=function(){
      var lista=g("jurFListaPrazos");
      lista.innerHTML="<div class='jur-vazio-sub'>Carregando...</div>";
      google.script.run
        .withSuccessHandler(function(r){
          if(!r||!r.ok){ lista.innerHTML="<div class='jur-vazio-sub'>"+esc((r&&r.mensagem)||"Não foi possível carregar os prazos.")+"</div>"; return; }
          var itens=r.itens||[];
          lista.innerHTML=itens.length?itens.map(function(p){
            return "<div class='jur-subitem"+(p.cumprido?" cumprido":"")+"'><input type='checkbox' "+(p.cumprido?"checked":"")+" onchange=\"jurAlternarPrazo('"+p.id+"',this.checked)\" style='margin-top:2px'><div class='corpo'><b>"+esc(p.descricao)+"</b><span>"+esc(jurFormatarDataBr_(p.data))+"</span></div><div class='acoes'><button onclick=\"jurRemoverPrazo('"+p.id+"')\" title='Excluir'>🗑️</button></div></div>";
          }).join(""):"<div class='jur-vazio-sub'>Nenhum prazo cadastrado ainda.</div>";
        })
        .withFailureHandler(function(e){ lista.innerHTML="<div class='jur-vazio-sub'>Erro: "+esc(e&&e.message?e.message:e)+"</div>"; })
        .jurListarPrazos(fichaId, token());
    };

    window.jurAdicionarPrazo=function(){
      var descricao=g("jurFNovoPrazoDescricao").value;
      var data=g("jurFNovoPrazoData").value;
      if(!String(descricao||"").trim()) return alert("Descreva o prazo (ex.: Contestação).");
      if(!data) return alert("Informe a data do prazo.");
      google.script.run
        .withSuccessHandler(function(r){
          if(!r||!r.ok){ alert("Erro: "+((r&&r.mensagem)||"não foi possível salvar o prazo.")); return; }
          g("jurFNovoPrazoDescricao").value="";
          g("jurFNovoPrazoData").value="";
          jurCarregarPrazos();
        })
        .withFailureHandler(function(e){ alert("Erro ao salvar prazo: "+(e&&e.message?e.message:e)); })
        .jurSalvarPrazo({idProcesso:fichaId, descricao:descricao, data:data}, token());
    };

    window.jurAlternarPrazo=function(id, cumprido){
      google.script.run
        .withSuccessHandler(function(r){
          if(!r||!r.ok){ alert("Erro: "+((r&&r.mensagem)||"não foi possível atualizar.")); jurCarregarPrazos(); return; }
          jurCarregarPrazos();
        })
        .withFailureHandler(function(e){ alert("Erro: "+(e&&e.message?e.message:e)); jurCarregarPrazos(); })
        .jurMarcarPrazo(id, cumprido, token());
    };

    window.jurRemoverPrazo=function(id){
      if(!confirm("Excluir este prazo?")) return;
      google.script.run
        .withSuccessHandler(function(r){
          if(!r||!r.ok){ alert("Erro: "+((r&&r.mensagem)||"não foi possível excluir.")); return; }
          jurCarregarPrazos();
        })
        .withFailureHandler(function(e){ alert("Erro: "+(e&&e.message?e.message:e)); })
        .jurExcluirPrazo(id, token());
    };

    // ---------------- Audiências ----------------

    window.jurCarregarAudiencias=function(){
      var lista=g("jurFListaAudiencias");
      lista.innerHTML="<div class='jur-vazio-sub'>Carregando...</div>";
      google.script.run
        .withSuccessHandler(function(r){
          if(!r||!r.ok){ lista.innerHTML="<div class='jur-vazio-sub'>"+esc((r&&r.mensagem)||"Não foi possível carregar as audiências.")+"</div>"; return; }
          var itens=r.itens||[];
          lista.innerHTML=itens.length?itens.map(function(a){
            var linha2=[a.tipo,a.local].filter(Boolean).join(" · ");
            return "<div class='jur-subitem'><div class='corpo'><b>"+esc(jurFormatarDataBr_(a.data))+(a.hora?" às "+esc(a.hora):"")+"</b><span>"+esc(linha2||"—")+(a.observacao?" · "+esc(a.observacao):"")+"</span></div><div class='acoes'><button onclick=\"jurRemoverAudiencia('"+a.id+"')\" title='Excluir'>🗑️</button></div></div>";
          }).join(""):"<div class='jur-vazio-sub'>Nenhuma audiência marcada ainda.</div>";
        })
        .withFailureHandler(function(e){ lista.innerHTML="<div class='jur-vazio-sub'>Erro: "+esc(e&&e.message?e.message:e)+"</div>"; })
        .jurListarAudiencias(fichaId, token());
    };

    window.jurAdicionarAudiencia=function(){
      var data=g("jurFNovaAudienciaData").value;
      var hora=g("jurFNovaAudienciaHora").value;
      var tipo=g("jurFNovaAudienciaTipo").value;
      var local=g("jurFNovaAudienciaLocal").value;
      if(!data) return alert("Informe a data da audiência.");
      google.script.run
        .withSuccessHandler(function(r){
          if(!r||!r.ok){ alert("Erro: "+((r&&r.mensagem)||"não foi possível salvar a audiência.")); return; }
          g("jurFNovaAudienciaData").value="";
          g("jurFNovaAudienciaHora").value="";
          g("jurFNovaAudienciaTipo").value="";
          g("jurFNovaAudienciaLocal").value="";
          jurCarregarAudiencias();
        })
        .withFailureHandler(function(e){ alert("Erro ao salvar audiência: "+(e&&e.message?e.message:e)); })
        .jurSalvarAudiencia({idProcesso:fichaId, data:data, hora:hora, tipo:tipo, local:local}, token());
    };

    window.jurRemoverAudiencia=function(id){
      if(!confirm("Excluir esta audiência?")) return;
      google.script.run
        .withSuccessHandler(function(r){
          if(!r||!r.ok){ alert("Erro: "+((r&&r.mensagem)||"não foi possível excluir.")); return; }
          jurCarregarAudiencias();
        })
        .withFailureHandler(function(e){ alert("Erro: "+(e&&e.message?e.message:e)); })
        .jurExcluirAudiencia(id, token());
    };

    window.jurSalvarFicha=function(){
      var assunto=g("jurFAssunto").value;
      if(!String(assunto||"").trim()) return alert("Informe o assunto.");
      var dados={
        id:fichaId, assunto:assunto, tipo:g("jurFTipo").value, status:g("jurFStatus").value,
        prazo:g("jurFPrazo").value, area:g("jurFArea").value, responsavel:g("jurFResponsavel").value,
        cnj:g("jurFCnj").value, autor:g("jurFAutor").value, reu:g("jurFReu").value,
        responsavelEmail:g("jurFResponsavelEmail").value,
        associadoCpf:fichaAssociado.cpf, associadoNome:fichaAssociado.nome,
        escolaCnpj:fichaEscola.cnpj, escolaNome:fichaEscola.nome
      };
      var btn=g("jurBtnSalvarFicha");
      if(btn){btn.disabled=true;btn.textContent="Salvando...";}
      google.script.run
        .withSuccessHandler(function(r){
          if(btn){btn.disabled=false;btn.textContent="Salvar alterações";}
          if(!r||!r.ok){ alert("Erro: "+((r&&r.mensagem)||"não foi possível salvar.")); return; }
          jurFecharFicha();
          jurRender();
        })
        .withFailureHandler(function(e){
          if(btn){btn.disabled=false;btn.textContent="Salvar alterações";}
          alert("Erro ao salvar: "+(e&&e.message?e.message:e));
        })
        .jurSalvarProcesso(dados, token());
    };

    window.jurAtualizarBotaoCancelarArquivo=function(){
      var input=g("jurFArquivo");
      var tem=input&&input.files&&input.files.length>0;
      g("jurBtnCancelarArquivo").style.display=tem?"inline-block":"none";
      g("jurBtnLerIA").style.display=tem?"inline-block":"none";
      g("jurIAResultado").style.display="none";
    };

    // Lê o arquivo escolhido com IA e pré-preenche os campos da ficha pra
    // revisão — nunca salva sozinho. O usuário confere/edita e clica em
    // "Salvar alterações" como sempre.
    window.jurLerComIA=function(){
      var input=g("jurFArquivo");
      var arquivo=input&&input.files&&input.files[0];
      if(!arquivo) return alert("Escolha um arquivo primeiro.");
      if(arquivo.size>10*1024*1024) return alert("Arquivo maior que 10MB.");

      var btn=g("jurBtnLerIA");
      if(btn){btn.disabled=true;btn.textContent="Lendo com IA...";}
      var resultado=g("jurIAResultado");
      resultado.style.display="none";

      var leitor=new FileReader();
      leitor.onload=function(e){
        var base64=String(e.target.result||"").split(",")[1]||"";
        google.script.run
          .withSuccessHandler(function(r){
            if(btn){btn.disabled=false;btn.textContent="✦ Ler com IA";}
            if(!r||!r.sucesso){
              resultado.style.display="block";
              resultado.innerHTML="<strong>Não foi possível ler o documento.</strong><br>"+esc((r&&r.mensagem)||"Erro desconhecido.");
              return;
            }
            var d=r.dados;
            if(d.assunto) g("jurFAssunto").value=d.assunto;
            if(d.tipo) g("jurFTipo").value=d.tipo;
            if(d.area) g("jurFArea").value=d.area;
            if(d.cnj) g("jurFCnj").value=d.cnj;
            if(d.autor) g("jurFAutor").value=d.autor;
            if(d.reu) g("jurFReu").value=d.reu;
            if(d.prazoDescricao) g("jurFNovoPrazoDescricao").value=d.prazoDescricao;
            if(d.prazoData) g("jurFNovoPrazoData").value=d.prazoData;

            var msg="<strong>✦ Campos preenchidos pela IA — revise antes de salvar.</strong>";
            if(d.prazoDescricao||d.prazoData) msg+="<br>Prazo sugerido (\""+esc(d.prazoDescricao||"")+"\", "+esc(d.prazoData||"?")+") já está no formulário de Prazos do processo — clique em \"+ Adicionar\" lá embaixo se quiser confirmá-lo.";
            if((r.alertas||[]).length) msg+="<ul style='margin:8px 0 0;padding-left:18px'>"+r.alertas.map(function(a){return "<li>"+esc(a)+"</li>";}).join("")+"</ul>";
            resultado.style.display="block";
            resultado.innerHTML=msg;
          })
          .withFailureHandler(function(err){
            if(btn){btn.disabled=false;btn.textContent="✦ Ler com IA";}
            resultado.style.display="block";
            resultado.innerHTML="<strong>Erro ao ler o documento:</strong> "+esc(err&&err.message?err.message:err);
          })
          .jurAnalisarDocumentoIA(base64, arquivo.name, arquivo.type||"application/pdf", token());
      };
      leitor.onerror=function(){
        if(btn){btn.disabled=false;btn.textContent="✦ Ler com IA";}
        alert("Não foi possível ler o arquivo selecionado.");
      };
      leitor.readAsDataURL(arquivo);
    };

    window.jurCancelarSelecaoArquivo=function(){
      g("jurFArquivo").value="";
      g("jurBtnCancelarArquivo").style.display="none";
    };

    window.jurEnviarAnexo=function(){
      var input=g("jurFArquivo");
      var arquivo=input&&input.files&&input.files[0];
      if(!arquivo) return alert("Escolha um arquivo primeiro.");
      if(arquivo.size>10*1024*1024) return alert("Arquivo maior que 10MB.");
      if(!fichaId) return alert("Salve o processo antes de anexar um documento.");

      var btn=g("jurBtnAnexo");
      if(btn){btn.disabled=true;btn.textContent="Enviando...";}
      var leitor=new FileReader();
      leitor.onload=function(e){
        var base64=String(e.target.result||"").split(",")[1]||"";
        google.script.run
          .withSuccessHandler(function(r){
            if(btn){btn.disabled=false;btn.textContent="Enviar anexo";}
            if(!r||!r.ok){ alert("Erro: "+((r&&r.mensagem)||"não foi possível enviar o anexo.")); return; }
            renderAnexo(r.link, r.nome);
            input.value="";
            g("jurBtnCancelarArquivo").style.display="none";
            jurRender();
          })
          .withFailureHandler(function(err){
            if(btn){btn.disabled=false;btn.textContent="Enviar anexo";}
            alert("Erro ao enviar anexo: "+(err&&err.message?err.message:err));
          })
          .jurUploadDocumento({idProcesso:fichaId, base64:base64, nome:arquivo.name, tipo:arquivo.type||"application/pdf"}, token());
      };
      leitor.onerror=function(){
        if(btn){btn.disabled=false;btn.textContent="Enviar anexo";}
        alert("Não foi possível ler o arquivo selecionado.");
      };
      leitor.readAsDataURL(arquivo);
    };

    window.initJuridico=jurRender;
    if(document.readyState==="loading"){
      console.log("[JUR] aguardando DOMContentLoaded para chamar jurRender.");
      document.addEventListener("DOMContentLoaded",jurRender);
    } else {
      console.log("[JUR] chamando jurRender via setTimeout(80ms).");
      setTimeout(jurRender,80);
    }
  })();
  </script>
</div>
