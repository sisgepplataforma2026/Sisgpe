function escapeHtml(str){

  if(str === null || str === undefined){
    return "";
  }

  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

}
function limparReciboStatus(){

function setReciboStatus(msg, tipo){

  var box = document.getElementById("recStatus");

  if(!box) return;

  box.style.display = "block";

  var bg = "#e8f7ee";
  var borda = "#2e7d32";
  var cor = "#1b5e20";

  if(tipo === "warn"){
    bg = "#fff3cd";
    borda = "#f59e0b";
    cor = "#7c4a03";
  }

  if(tipo === "err"){
    bg = "#f8d7da";
    borda = "#c62828";
    cor = "#7f1d1d";
  }

  if(tipo === "info"){
    bg = "#eef4ff";
    borda = "#3b82f6";

  box.innerHTML =
    '<div style="padding:12px;border-radius:10px;background:' +
    bg +
    ';border:1px solid ' +
    borda +
    ';color:' +
    cor +
    ';">' +
    msg +
    '</div>';
}

function carregarConfigRecibo(force){

  if(!force && window.__CFG_RECIBO__){
    return window.__CFG_RECIBO__;

  google.script.run

    .withSuccessHandler(function(cfg){

      if(!cfg){

        window.__CFG_RECIBO__ = {

}

function aplicarMascaraTelefoneRecibo(input){

  if(!input) return;

  var v = String(input.value || "")
    .replace(/\D/g, "")
    .substring(0, 11);

  if(v.length > 10){

    v = v.replace(
      /^(\d{2})(\d{5})(\d{4})$/,
      "($1) $2-$3"
    );

  }else if(v.length > 6){

    v = v.replace(
      /^(\d{2})(\d{4})(\d+)$/,
      "($1) $2-$3"
    );

  }else if(v.length > 2){

    v = v.replace(
      /^(\d{2})(\d+)$/,
      "($1) $2"
    );
  }

  input.value = v;
}

function isEmailValido(email){

  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/
    .test(
      String(email || "").trim()
    );
}

function validarEmailInline(input){

  if(!input) return true;

  var v = String(input.value || "").trim();

  if(!v){

    input.style.borderColor = "#e2e8f0";

    return true;
  }

  var ok = isEmailValido(v);

  input.style.borderColor =
    ok ? "#059669" : "#dc2626";

  return ok;
}

function parseValorRecibo_(valor){

  if(valor === null || valor === undefined || valor === ""){
    return 0;
  }

  var texto = String(valor)
    .trim()
    .replace(/\s/g, "")
    .replace(/^R\$/i, "");

  if(
    texto.indexOf(",") > -1 &&
    texto.indexOf(".") > -1
  ){

    texto = texto
      .replace(/\./g, "")
      .replace(",", ".");

  }else if(texto.indexOf(",") > -1){

    texto = texto.replace(",", ".");
  }

  var n = parseFloat(texto);

  return isNaN(n) ? 0 : n;
}

function formatarValorReciboBR_(numero){

  return Number(numero || 0)
    .toLocaleString("pt-BR", {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    });
}

function atualizarConferenciaRecibo(){

  var painel   = document.getElementById("painelConferenciaRecibo");
  var qtdEl    = document.getElementById("confRecQtd");
  var somaEl   = document.getElementById("confRecSoma");
  var totalEl  = document.getElementById("confRecTotal");
  var difEl    = document.getElementById("confRecDif");
  var statusEl = document.getElementById("confRecStatus");

  var campoTotal =
    document.getElementById("recValor");

  var linhas = document.querySelectorAll(
    ".linha-trabalhador-recibo"
  );

  var qtd  = 0;
  var soma = 0;

  linhas.forEach(function(linha){

    var nome = String(
      (linha.querySelector(".rec-nome") || {}).value || ""
    ).trim();

    var valor = String(
      (linha.querySelector(".rec-valor") || {}).value || ""
    ).trim();

    if(!nome && !valor){
      return;
    }

    qtd++;

    soma += parseValorRecibo_(valor);
  });

  var total = campoTotal
    ? parseValorRecibo_(campoTotal.value)
    : 0;

  var diferenca = Math.abs(soma - total);

  if(painel){
    painel.style.display =
      (qtd > 0 || total > 0)
        ? "block"
        : "none";
  }

  if(qtdEl){
    qtdEl.textContent = String(qtd);
  }

  if(somaEl){
    somaEl.textContent =
      "R$ " + formatarValorReciboBR_(soma);
  }

  if(totalEl){
    totalEl.textContent =
      "R$ " + formatarValorReciboBR_(total);
  }

  if(difEl){
    difEl.textContent =
      "R$ " + formatarValorReciboBR_(diferenca);
  }

  if(statusEl){

    if(total <= 0 && qtd > 0){

      statusEl.textContent =
        "⚠️ Informe o valor total do processo/alvará para validar o lote.";

      statusEl.style.color = "#b45309";

    }else if(qtd === 0){

      statusEl.textContent =
        "ℹ️ Adicione beneficiários para iniciar a conferência.";

      statusEl.style.color = "#1d4ed8";

    }else if(diferenca <= 0.009){

      statusEl.textContent =
        "✅ Valores conferem.";

      statusEl.style.color = "#065f46";

    }else{

      statusEl.textContent =
        "⚠️ Diferença detectada entre a soma dos beneficiários e o valor total do processo.";

      statusEl.style.color = "#b91c1c";
    }
  }
}
function atualizarDashboardFinanceiroProcesso(){
  var painel = document.getElementById("painelFinanceiroProcesso");
  var select = document.getElementById("recProcessoSelect");

  var totalEl = document.getElementById("dashProcTotal");
  var pagoEl = document.getElementById("dashProcPago");
  var saldoEl = document.getElementById("dashProcSaldo");
  var percEl = document.getElementById("dashProcPercentual");
  var barraEl = document.getElementById("dashProcBarra");
  var msgEl = document.getElementById("dashProcMensagem");

  if(!painel) return;

  if(!select || !select.value){
    painel.style.display = "none";
    return;
  }

  painel.style.display = "block";

  if(totalEl) totalEl.innerText = "R$ 0,00";
  if(pagoEl) pagoEl.innerText = "R$ 0,00";
  if(saldoEl) saldoEl.innerText = "R$ 0,00";
  if(percEl) percEl.innerText = "0%";
  if(barraEl) barraEl.style.width = "0%";
  if(msgEl) msgEl.innerText = "Carregando resumo financeiro...";

  google.script.run
    .withSuccessHandler(function(res){
      if(!res || res.erro){
        if(msgEl) msgEl.innerText = (res && res.mensagem) || "Não foi possível carregar o resumo financeiro.";
        return;
      }

      var total = Number(res.totalProcesso || 0);
      var pago = Number(res.totalPago || 0);
      var saldo = Number(res.saldo || 0);
      var percentual = Number(res.percentualPago || 0);

      if(percentual < 0) percentual = 0;
      if(percentual > 100) percentual = 100;

      if(totalEl) totalEl.innerText = "R$ " + formatarValorReciboBR_(total);
      if(pagoEl) pagoEl.innerText = "R$ " + formatarValorReciboBR_(pago);
      if(saldoEl) saldoEl.innerText = "R$ " + formatarValorReciboBR_(saldo);
      if(percEl) percEl.innerText = formatarValorReciboBR_(percentual).replace(",0", "") + "%";
      if(barraEl) barraEl.style.width = percentual + "%";

      if(msgEl){
        if(total <= 0){
          msgEl.innerText = "Informe o valor total do processo para acompanhar o saldo.";
        }else if(saldo <= 0){
          msgEl.innerText = "Processo totalmente quitado.";
        }else{
          msgEl.innerText = "Saldo restante: R$ " + formatarValorReciboBR_(saldo) + ".";
        }
      }
    })
    .withFailureHandler(function(err){
      if(msgEl){
        msgEl.innerText = "Erro ao carregar resumo financeiro: " + ((err && err.message) || err || "");
      }
    })
    .obterResumoFinanceiroProcesso(select.value, SISGEP_TOKEN_SESSAO);
}

function preencherLinhaComCadastroAnteriorRecibo_(linha, cadastro){
  if(!linha || !cadastro || !cadastro.ok) return;

  var pixEl   = linha.querySelector(".rec-pix");
  var emailEl = linha.querySelector(".rec-email");
  var whatsEl = linha.querySelector(".rec-whatsapp");
  var obsEl   = linha.querySelector(".rec-obs");

  if(pixEl && !String(pixEl.value || "").trim() && cadastro.pix){
    pixEl.value = cadastro.pix;
  }

  if(emailEl && !String(emailEl.value || "").trim() && cadastro.email){
    emailEl.value = cadastro.email;
    validarEmailInline(emailEl);
  }

  if(whatsEl && !String(whatsEl.value || "").trim() && cadastro.whatsapp){
    whatsEl.value = cadastro.whatsapp;
    aplicarMascaraTelefoneRecibo(whatsEl);
  }

  if(obsEl && !String(obsEl.value || "").trim() && cadastro.observacao){
    obsEl.value = cadastro.observacao;
  }
}

function buscarCadastroLinhaRecibo_(linha){
  if(!linha) return;

  var nomeEl = linha.querySelector(".rec-nome");
  var cpfEl  = linha.querySelector(".rec-cpf");

  var nome = String((nomeEl || {}).value || "").trim();
  var cpf  = String((cpfEl || {}).value || "").trim();

  if(!nome && !cpf) return;

  google.script.run
    .withSuccessHandler(function(resp){
      if(!resp || !resp.ok) return;
      preencherLinhaComCadastroAnteriorRecibo_(linha, resp);
    })
    .withFailureHandler(function(err){
      console.error("Erro ao buscar cadastro anterior:", err);
    })
    .buscarCadastroBeneficiarioRecibo({
      nome: nome,
      cpf: cpf
    }, SISGEP_TOKEN_SESSAO);
}

function copiarParaClipboard_(texto, btnEl, labelOriginal){
  try{
    navigator.clipboard.writeText(texto).then(function(){
      if(btnEl){
        btnEl.textContent = "✓ Copiado!";
        btnEl.style.background = "#059669";

        setTimeout(function(){
          btnEl.textContent = labelOriginal;
          btnEl.style.background = "";
        }, 2000);
      }
    });
  }catch(_){
    var ta = document.createElement("textarea");
    ta.value = texto;
    ta.style.position = "fixed";
    ta.style.opacity = "0";

    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    document.body.removeChild(ta);

    if(btnEl){
      btnEl.textContent = "✓ Copiado!";
      btnEl.style.background = "#059669";

      setTimeout(function(){
        btnEl.textContent = labelOriginal;
        btnEl.style.background = "";
      }, 2000);
    }
  }
}

function copiarWhatsAppRecibo_(btnId, msgEncoded){
  var btn = document.getElementById(btnId);
  var msg = decodeURIComponent(String(msgEncoded || ""));

  copiarParaClipboard_(
    msg,
    btn,
    "📋 Copiar link"
  );
}

function abrirWhatsAppRecibo_(numeroRecibo, telefone, nome, processo, empresa, urlPdf){
  var arq = {
    numero: numeroRecibo || "",
    nome: nome || "",
    url: urlPdf || ""
  };

  var msg = gerarMensagemWhatsRecibo(
    arq,
    processo || "",
    empresa || ""
  );

  var numeroLimpo = String(telefone || "").replace(/\D/g, "");

  if(numeroLimpo.length === 11 && !numeroLimpo.startsWith("55")){
    numeroLimpo = "55" + numeroLimpo;
  }

  if(!numeroLimpo){
    alert("WhatsApp não informado.");
    return;
  }

  var link = "https://wa.me/" + numeroLimpo + "?text=" + encodeURIComponent(msg);

  google.script.run
    .withSuccessHandler(function(){})
    .withFailureHandler(function(err){
      console.error("Erro ao atualizar status do WhatsApp:", err);
    })
    .atualizarStatusWhatsappRecibo(numeroRecibo, "WHATSAPP_ABERTO", SISGEP_TOKEN_SESSAO);

  window.open(link, "_blank");
}

    inset:0;
    background:rgba(15,23,42,.72);
    backdrop-filter:blur(8px);
    z-index:99999;
    display:flex;

      background:linear-gradient(135deg,#001f4d,#003b82);
      color:#fff;
      padding:12px 16px;
      display:flex;
      justify-content:space-between;

        <button id="btnVisualizarRecibo" style="
          background:rgba(255,255,255,.12);
          border:1px solid rgba(255,255,255,.24);

          padding:7px 12px;
          border-radius:8px;
          cursor:pointer;
          font-weight:700;
        ">👁 Visualizar</button>

        <button id="btnImprimirRecibo" style="
          background:#C9A84C;
          border:none;
          color:#001f4d;
          padding:7px 12px;
          border-radius:8px;
          cursor:pointer;
          font-weight:800;
        ">🖨 Imprimir</button>

        <button id="btnDownloadRecibo" style="

          color:#fff;
          padding:7px 12px;
          border-radius:8px;
          cursor:pointer;
          font-weight:700;
        ">⬇ Baixar</button>

  var corpoHtml = gerarCorpoEmailReciboHTML_(
    nome,
    numero,
    processo,
    empresa,
    urlPdf
  );

function modoReciboPosGeracao(res){
  window.__ULTIMO_RESULTADO_RECIBO__ = res || null;

  var btnGerar = document.getElementById("btnGerarRecibo");
  var btnNovo  = document.getElementById("btnNovoRecibo");
  var resEl    = document.getElementById("recResultado");

  if(btnGerar) btnGerar.style.display = "none";
  if(btnNovo) btnNovo.style.display = "inline-block";

  if(resEl){
    resEl.style.display = "block";

    var totalGeradoEl = document.getElementById("recTotalGerado");
    var valorTotalEl  = document.getElementById("recValorTotal");
    var processoResEl = document.getElementById("recProcessoRes");

    if(totalGeradoEl) totalGeradoEl.textContent = (res.totalGerado || 0) + " recibo(s)";
    if(valorTotalEl) valorTotalEl.textContent = "R$ " + (res.valorTotal || "0,00");
    if(processoResEl) processoResEl.textContent = (res.processo || "") + " · " + (res.empresa || "");
  }

  var btnEmail = document.getElementById("btnEnviarEmailRecibo");

  if(btnEmail){
    btnEmail.onclick = function(){
      var emailEl = document.getElementById("recEmail");
      var destino = emailEl ? String(emailEl.value || "").trim() : "";

      if(!destino){
        alert("Informe o e-mail no campo do processo.");
        if(emailEl) emailEl.focus();
        return;
      }

      var resultado = window.__ULTIMO_RESULTADO_RECIBO__;

      if(!resultado || !resultado.arquivos || !resultado.arquivos.length){
        alert("Nenhum recibo disponível para envio.");
        return;
      }

      var primeiro = resultado.arquivos[0] || {};

      var assunto = gerarAssuntoEmailRecibo_(
        primeiro.numero || "",
        resultado.processo || ""
      );

      var corpoHtml = gerarCorpoEmailReciboHTML_(
        primeiro.nome || "BENEFICIÁRIO(A)",
        primeiro.numero || "",
        resultado.processo || "",
        resultado.empresa || "",
        primeiro.url || ""
      );

      loader(true);

      google.script.run
        .withSuccessHandler(function(ret){
          loader(false);

          if(ret && ret.erro){
            alert(ret.mensagem || "Erro ao enviar e-mail.");
            return;
          }

          alert((ret && ret.mensagem) || "E-mail enviado com sucesso!");
        })
        .withFailureHandler(function(err){
          loader(false);
          alert("Erro ao enviar e-mail: " + ((err && err.message) || err || ""));
        })
        .enviarReciboManualPorEmail({
          destino: destino,
          assunto: assunto,
          corpoHtml: corpoHtml,
          empresa: resultado.empresa || "",
          processo: resultado.processo || "",
          valorTotal: resultado.valorTotal || "",
          arquivos: resultado.arquivos || []
        }, SISGEP_TOKEN_SESSAO);
    };
  }

  var btnWhats = document.getElementById("btnEnviarWhatsRecibo");

  if(btnWhats){
    btnWhats.onclick = function(){
      var resultado = window.__ULTIMO_RESULTADO_RECIBO__;

      if(!resultado || !resultado.arquivos || !resultado.arquivos.length){
        alert("Nenhum recibo disponível.");
        return;
      }

      var arq = resultado.arquivos[0];
      var msg = gerarMensagemWhatsRecibo(
        arq,
        resultado.processo || "",
        resultado.empresa || ""
      );

      window.open(
        "https://wa.me/?text=" + encodeURIComponent(msg),
        "_blank"
      );
    };
  }

  renderizarListaArquivosRecibo(res);

  try{
    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });
  }catch(_){}
}

  function mascaraCPF_(valor){
    var v = String(valor || "").replace(/\D/g, "").substring(0,11);
    if(v.length > 9) return v.replace(/^(\d{3})(\d{3})(\d{3})(\d{0,2}).*/, "$1.$2.$3-$4");
    if(v.length > 6) return v.replace(/^(\d{3})(\d{3})(\d{0,3}).*/, "$1.$2.$3");
    if(v.length > 3) return v.replace(/^(\d{3})(\d{0,3}).*/, "$1.$2");
    return v;
  }

  function mascaraTelefone_(valor){
    var v = String(valor || "").replace(/\D/g, "").substring(0,11);
    if(v.length > 10){
      v = v.replace(/^(\d{2})(\d)/g, "($1) $2");
      v = v.replace(/(\d{5})(\d)/, "$1-$2");
    }else if(v.length > 5){
      v = v.replace(/^(\d{2})(\d)/g, "($1) $2");
      v = v.replace(/(\d{4})(\d)/, "$1-$2");
    }else if(v.length > 2){
      v = v.replace(/^(\d{2})(\d)/g, "($1) $2");
    }
    return v;
  }

  function mascaraValor_(valor){
    var v = String(valor || "").replace(/\D/g, "");
    if(!v) return "";
    return (parseInt(v,10) / 100).toLocaleString("pt-BR", {
      minimumFractionDigits:2,
      maximumFractionDigits:2
    });
  }

    if(!d.nome){ alert("Informe o nome do beneficiário."); nomeEl.focus(); return false; }

    if(String(d.cpf).replace(/\D/g,"").length !== 11){ alert("Informe um CPF válido."); cpfEl.focus(); return false; }
    if(!d.valor || d.valor === "0,00"){ alert("Informe o valor."); valorEl.focus(); return false; }

    if(d.formaPagamento === "PIX" && !d.pix){
      alert("Informe a chave PIX.");
      pixEl.focus();
      return false;

    if(d.formaPagamento === "CHEQUE"){

      if(!d.chequeAgencia){ alert("Informe a agência."); chequeAgenciaEl.focus(); return false; }
      if(!d.chequeSerie){ alert("Informe a série."); chequeSerieEl.focus(); return false; }
      if(!d.chequeNumero){ alert("Informe o número do cheque."); chequeNumeroEl.focus(); return false; }
      if(!d.chequeData){ alert("Informe a data do cheque."); chequeDataEl.focus(); return false; }

    if(!d.processo){ alert("Informe ou selecione o processo."); return false; }

    if(exigeRecibo && (!div.dataset.numeroRecibo || !div.dataset.urlRecibo)){

function coletarBeneficiariosRecibo(){
  var linhas = document.querySelectorAll(".linha-trabalhador-recibo");
  var trabalhadores = [];
  var erros = [];

  linhas.forEach(function(linha, idx){
    var n = idx + 1;

    var nome = String((linha.querySelector(".rec-nome") || {}).value || "").trim();
    var cpf = String((linha.querySelector(".rec-cpf") || {}).value || "").trim();
    var valor = String((linha.querySelector(".rec-valor") || {}).value || "").trim();
    var formaPagamento = String((linha.querySelector(".rec-forma") || {}).value || "PIX").trim().toUpperCase();

    var tipoPix = String((linha.querySelector(".rec-tipo-pix") || {}).value || "").trim();
    var pix = String((linha.querySelector(".rec-pix") || {}).value || "").trim();

    var chequeBanco = String((linha.querySelector(".rec-cheque-banco") || {}).value || "Sicoob").trim();
    var chequeAgencia = String((linha.querySelector(".rec-cheque-agencia") || {}).value || "3010").trim();
    var chequeSerie = String((linha.querySelector(".rec-cheque-serie") || {}).value || "001").trim();
    var chequeNumero = String((linha.querySelector(".rec-cheque-numero") || {}).value || "").trim();
    var chequeData = String((linha.querySelector(".rec-cheque-data") || {}).value || "").trim();

    var email = String((linha.querySelector(".rec-email") || {}).value || "").trim();
    var whatsapp = String((linha.querySelector(".rec-whatsapp") || {}).value || "").trim();
    var observacao = String((linha.querySelector(".rec-obs") || {}).value || "").trim();

    if(!nome && !cpf && !valor && !pix && !email && !whatsapp && !observacao && !chequeNumero){
      return;
    }

    if(formaPagamento !== "CHEQUE"){
      formaPagamento = "PIX";
    }

    if(!nome) erros.push("Linha " + n + ": nome não informado");
    if(!cpf) erros.push("Linha " + n + ": CPF não informado");
    if(!valor || valor === "R$ 0,00" || valor === "0,00") erros.push("Linha " + n + ": valor não informado");

    if(formaPagamento === "PIX" && !pix){
      erros.push("Linha " + n + ": PIX não informado");
    }

    if(formaPagamento === "CHEQUE"){
      if(!chequeBanco) erros.push("Linha " + n + ": banco do cheque não informado");
      if(!chequeAgencia) erros.push("Linha " + n + ": agência do cheque não informada");
      if(!chequeSerie) erros.push("Linha " + n + ": série do cheque não informada");
      if(!chequeNumero) erros.push("Linha " + n + ": número do cheque não informado");
      if(!chequeData) erros.push("Linha " + n + ": data do cheque não informada");
    }

    if(email && !isEmailValido(email)){
      erros.push("Linha " + n + ": e-mail inválido");
    }

    trabalhadores.push({
      nome: nome,
      cpf: cpf,
      valor: valor,
      formaPagamento: formaPagamento,

      tipoPix: formaPagamento === "PIX" ? tipoPix : "",
      pix: formaPagamento === "PIX" ? pix : "",

      chequeBanco: formaPagamento === "CHEQUE" ? chequeBanco : "",
      chequeAgencia: formaPagamento === "CHEQUE" ? chequeAgencia : "",
      chequeSerie: formaPagamento === "CHEQUE" ? chequeSerie : "",
      chequeNumero: formaPagamento === "CHEQUE" ? chequeNumero : "",
      chequeData: formaPagamento === "CHEQUE" ? chequeData : "",

      email: email,
      whatsapp: whatsapp,
      observacao: observacao
    });
  });

  return {
    trabalhadores: trabalhadores,
    erros: erros
  };
}

function executarGeracaoRecibo_(dados, btn){
  if(btn){
    btn.disabled = true;
    btn.innerText = "Preparando...";
  }

  var total = (dados.trabalhadores || []).length;

  _mostrarProgressoRecibo_(
    0,
    total,
    "Iniciando geração..."
  );

  var _polling = null;

  _polling = setInterval(function(){
    google.script.run
      .withSuccessHandler(function(prog){
        if(!prog) return;

        var msg = prog.status === "iniciando"
          ? "Iniciando geração do lote..."
          : prog.ultimo
            ? "Gerando recibo de " + prog.ultimo.split(" ")[0] + "..."
            : "Gerando documentos...";

        _mostrarProgressoRecibo_(
          prog.atual || 0,
          prog.total || total,
          msg
        );
      })
      .withFailureHandler(function(){})
      .obterProgressoGeracao(SISGEP_TOKEN_SESSAO);
  }, 1500);

  google.script.run
    .withSuccessHandler(function(res){
      clearInterval(_polling);

      if(res && res.precisaConfirmarDivergencia){
        _fecharProgressoRecibo_();

        if(btn){
          btn.disabled = false;
          btn.innerText = "✅ Emitir Recibos";
        }

        var seguir = confirm(
          (res.mensagem || "Foi encontrada diferença no demonstrativo.") +
          "\n\nDeseja continuar e gerar os recibos mesmo assim?"
        );

        if(!seguir){
          setReciboStatus(
            "Geração cancelada. Revise os valores antes de emitir.",
            "warn"
          );
          return;
        }

        dados.confirmarDivergencia = true;

        setReciboStatus(
          "Confirmação recebida. Gerando recibos...",
          "warn"
        );

        executarGeracaoRecibo_(dados, btn);
        return;
      }

      _fecharProgressoRecibo_();

      if(btn){
        btn.disabled = false;
        btn.innerText = "✅ Emitir Recibos";
      }

      if(res && res.erro){
        setReciboStatus(
          "Erro no servidor: " + (res.mensagem || ""),
          "err"
        );
        return;
      }

      if(!res || !res.arquivos || !res.arquivos.length){
        setReciboStatus(
          "Nenhum arquivo retornado.",
          "warn"
        );
        return;
      }

      var msg = res.totalGerado + " recibo(s) gerado(s) com sucesso.";

      if(res.totalErros > 0){
        msg += " " + res.totalErros + " com falha.";
      }

      if(res.divergenciaDemonstrativo){
        msg += " " + res.mensagemDivergencia;
      }

      setReciboStatus(msg, "ok");
      modoReciboPosGeracao(res);
    })
    .withFailureHandler(function(err){
      clearInterval(_polling);
      _fecharProgressoRecibo_();

      if(btn){
        btn.disabled = false;
        btn.innerText = "✅ Emitir Recibos";
      }

      setReciboStatus(
        "Falha crítica: " + ((err && err.message) || err),
        "err"
      );
    })
    .gerarReciboWeb(dados, SISGEP_TOKEN_SESSAO);
}
function _mostrarProgressoRecibo_(atual, total, msg){
  var modal = document.getElementById("modalProgressoGeracao");
  if(!modal) return;
  modal.style.display = "flex";
  var pct = total > 0 ? Math.round((atual / total) * 100) : 0;
  var barra = document.getElementById("progressoBarraRecibo");
  var texto = document.getElementById("progressoTextoRecibo");
  var cont  = document.getElementById("progressoContadorRecibo");
  if(barra) barra.style.width = pct + "%";
  if(texto) texto.textContent = msg || "Processando...";
  if(cont)  cont.textContent  = atual + " / " + total;
}

function _fecharProgressoRecibo_(){
  var modal = document.getElementById("modalProgressoGeracao");
  if(modal) modal.style.display = "none";
}

      chequeNumero: candidato.chequeNumero,
      chequeData: candidato.chequeData
    };

    if(!dados.processo){
      setReciboStatus("Selecione ou informe o processo antes da pré-visualização.", "warn");
      return;
    }

    if(!dados.empresa){
      setReciboStatus("Selecione ou informe a empresa antes da pré-visualização.", "warn");
      return;
    }

    var novaAba = window.open("", "_blank");

    if(!novaAba){
      alert("O navegador bloqueou a pré-visualização.");
      return;
    }

    loader(true);

    google.script.run
      .withSuccessHandler(function(html){
        loader(false);

        if(!html){
          try{ novaAba.close(); }catch(_){}
          setReciboStatus("Não foi possível gerar a pré-visualização.", "err");
          return;
        }

        novaAba.document.open();
        novaAba.document.write(html);
        novaAba.document.close();
      })
      .withFailureHandler(function(err){
        loader(false);

        try{ novaAba.close(); }catch(_){}

        setReciboStatus("Erro ao gerar pré-visualização: " + ((err && err.message) || err || ""), "err");
      })
      .previewReciboWeb(dados, SISGEP_TOKEN_SESSAO);
  },

    gerar: function(){
    limparReciboStatus();

    var emEl = document.getElementById("recEmail");
    if(emEl) emEl.style.borderColor = "";

    var btn = document.getElementById("btnGerarRecibo");
    if(btn && btn.disabled) return;

    var coleta = coletarBeneficiariosRecibo();

    var dados = {
      trabalhadores: coleta.trabalhadores,
      processo: document.getElementById("recProcesso") ? document.getElementById("recProcesso").value.trim() : "",
      empresa: document.getElementById("recEmpresa") ? document.getElementById("recEmpresa").value.trim() : "",
      valorTotal: document.getElementById("recValor") ? document.getElementById("recValor").value.trim() : "",
      recEmail: document.getElementById("recEmail") ? document.getElementById("recEmail").value.trim() : "",
      idProcesso: document.getElementById("recProcessoSelect") ? document.getElementById("recProcessoSelect").value.trim() : ""
    };

    if(coleta.erros.length){
      setReciboStatus("Dados inválidos: " + coleta.erros.join(" | "), "err");
      return;
    }

    if(!coleta.trabalhadores.length){
      setReciboStatus("Adicione pelo menos um beneficiário com dados válidos.", "warn");
      return;
    }

    if(!dados.processo){
      setReciboStatus("Informe o número do processo.", "warn");
      return;
    }

    if(!dados.empresa){
      setReciboStatus("Informe a empresa.", "warn");
      return;
    }

    if(dados.recEmail && !isEmailValido(dados.recEmail)){
      setReciboStatus("E-mail inválido.", "warn");

      if(emEl){
        emEl.style.borderColor = "#dc2626";
        emEl.focus();
      }

      return;
    }

    if(dados.valorTotal){
      setReciboStatus("Comunicando com o servidor e conferindo demonstrativo... Aguarde.", "warn");
    }else{
      setReciboStatus("Comunicando com o servidor... Aguarde.", "warn");
    }

    executarGeracaoRecibo_(dados, btn);
  }
};

    document.getElementById("novoRecProcesso").value = opt.dataset.processo || "";
    document.getElementById("novoRecEmpresa").value  = opt.dataset.empresa || "";
    document.getElementById("novoRecObservacoes").value = opt.dataset.obs || "";
    document.getElementById("novoRecValor").value = opt.dataset.valortotal || "";

    if(modal){
      modal.dataset.editando = opt.value;
    }

    this.abrirModalProcesso();
  },

  salvarNovoProcesso: function(){
    var modal = document.getElementById("modalNovoProcessoRecibo");

    var dados = {
      idProcesso: modal ? (modal.dataset.editando || "") : "",
      processo: document.getElementById("novoRecProcesso") ? document.getElementById("novoRecProcesso").value.trim() : "",
      empresa: document.getElementById("novoRecEmpresa") ? document.getElementById("novoRecEmpresa").value.trim() : "",

    };

    if(!dados.processo || !dados.empresa || !dados.valorTotal){
      alert("Preencha todos os campos obrigatórios.");
      return;
    }

    loader(true);

    var metodo = dados.idProcesso ? "editarProcessoRecibo" : "cadastrarNovoProcessoRecibo";

    google.script.run
      .withSuccessHandler(function(res){
        loader(false);

        if(res && res.erro){
          alert(res.mensagem || "Erro ao salvar processo.");
          return;
        }

        ReciboUI.fecharModalProcesso();

        alert(dados.idProcesso ? "✏️ Atualizado!" : "✅ Cadastrado!");

        ReciboUI.carregarProcessos();
      })
      .withFailureHandler(function(err){
        loader(false);
        alert((err && err.message) || err || "Erro ao salvar processo.");
      })[metodo](dados, SISGEP_TOKEN_SESSAO);
  },

  carregarProcessos: function(callback){
    google.script.run
      .withSuccessHandler(function(lista){
        var select = document.getElementById("recProcessoSelect");
        if(!select) return;

        (lista || []).forEach(function(p){
          var opt = document.createElement("option");

          opt.value = p.idProcesso;
          opt.textContent = p.processo + " — " + p.empresa;

          opt.dataset.processo = p.processo || "";
          opt.dataset.empresa = p.empresa || "";
          opt.dataset.obs = p.observacoes || "";
          opt.dataset.valortotal = p.valorTotal || "";

          select.appendChild(opt);
        });

        if(callback) callback();
      })
      .withFailureHandler(function(err){
        console.error("Erro ao carregar processos:", err);
      })

function carregarBeneficiariosImportadosDaPlanilhaNaTela(lista){
  var container = document.getElementById("listaTrabalhadoresRecibo");
  if(!container) return;

  if(!Array.isArray(lista) || !lista.length){
    setReciboStatus(
      "Nenhum beneficiário encontrado para este processo na aba IMPORTAR_RECIBOS.",
      "warn"
    );
    return;
  }

  container.innerHTML = "";

  lista.forEach(function(item){
    var linha = montarLinhaBeneficiarioRecibo(item || {});

    var nomeEl  = linha.querySelector(".rec-nome");
    var cpfEl   = linha.querySelector(".rec-cpf");
    var valorEl = linha.querySelector(".rec-valor");
    var pixEl   = linha.querySelector(".rec-pix");
    var emailEl = linha.querySelector(".rec-email");
    var whatsEl = linha.querySelector(".rec-whatsapp");
    var obsEl   = linha.querySelector(".rec-obs");

    if(nomeEl) nomeEl.value = String(item.nome || "").trim();

    if(cpfEl){
      cpfEl.value = String(item.cpf || "").trim();

      if(
        typeof Utils !== "undefined" &&
        typeof Utils.aplicarMascaraCPF === "function"
      ){
        Utils.aplicarMascaraCPF(cpfEl);
      }
    }

    if(valorEl) valorEl.value = String(item.valor || "").trim();
    if(pixEl) pixEl.value = String(item.pix || "").trim();

    if(emailEl){
      emailEl.value = String(item.email || "").trim();
      validarEmailInline(emailEl);
    }

    if(whatsEl){
      whatsEl.value = String(item.whatsapp || "").trim();

      if(whatsEl.value){
        aplicarMascaraTelefoneRecibo(whatsEl);
      }
    }

    if(obsEl){
      obsEl.value = String(item.observacao || item.observacoes || "").trim();
    }

    container.appendChild(linha);
  });

  atualizarContadorBeneficiariosRecibo_();
  atualizarConferenciaRecibo();

  setReciboStatus(
    "Beneficiários importados para edição. Revise, ajuste o que quiser e depois clique em Emitir Recibos.",
    "ok"
  );
}

function importarAlvaraPDFFrontend(){
  var input = document.getElementById("arquivoAlvaraPdf");

  if(!input || !input.files || !input.files.length){
    setStatusImportacaoAlvara("Selecione pelo menos um PDF.", "warn");
    return;
  }

  var arquivos = Array.prototype.slice.call(input.files || []);

  var pdfs = arquivos.filter(function(file){
    return (file.type || "").toLowerCase() === "application/pdf";
  });

  if(!pdfs.length){
    setStatusImportacaoAlvara("Somente PDFs são permitidos.", "warn");
    return;
  }

  limparStatusImportacaoAlvara();

  setStatusImportacaoAlvara(
    "Processando " + pdfs.length + " arquivo(s)...",
    "info"
  );

  loader(true);

  var convertidos = [];
  var lidos = 0;

  pdfs.forEach(function(file){
    var reader = new FileReader();

    reader.onload = function(e){
      try{
        var dataUrl = e && e.target && e.target.result
          ? e.target.result
          : "";

        var partes = String(dataUrl).split(",");

        if(partes.length < 2){
          throw new Error("Não foi possível converter " + file.name);
        }

        convertidos.push({
          nomeArquivo: file.name,
          mimeType: file.type,
          base64: partes[1]
        });
      }catch(err){
        console.error("Erro ao converter:", file.name, err);
      }finally{
        lidos++;

        if(lidos === pdfs.length){
          enviar();
        }
      }
    };

    reader.onerror = function(){
      console.error("Falha ao ler:", file.name);

      lidos++;

      if(lidos === pdfs.length){
        enviar();
      }
    };

    reader.readAsDataURL(file);
  });

  function enviar(){
    if(!convertidos.length){
      loader(false);
      setStatusImportacaoAlvara(
        "Nenhum PDF válido pôde ser preparado para envio.",
        "err"
      );
      return;
    }

    google.script.run
      .withSuccessHandler(function(res){
        loader(false);

        if(!res || res.erro){
          setStatusImportacaoAlvara(
            (res && res.mensagem) || "Erro ao processar os PDFs.",
            "err"
          );
          return;
        }

        window.__IMPORTACAO_ALVARA__ = res;

        preencherCamposProcessoImportado({
          numeroProcesso: res.processo || "",
          empresa: res.empresa || "",
          valorTotal: res.valorTotal || ""
        });

        renderizarResumoImportacaoAlvara({
          nomeArquivo: (convertidos || [])
            .map(function(a){ return a.nomeArquivo; })
            .join(" | "),

          processo: {
            numeroProcesso: res.processo || "",
            empresa: res.empresa || "",
            valorTotal: res.valorTotal || ""
          },

          quantidadeBeneficiarios: res.totalBeneficiarios || 0,
          beneficiarios: res.beneficiarios || []
        });

        renderizarBeneficiariosImportados(
          res.beneficiarios || []
        );

        setStatusImportacaoAlvara(
          "✅ Planilha gerada com sucesso! " +
          (res.totalBeneficiarios || 0) +
          " beneficiário(s) identificado(s).",
          "ok"
        );

        if(res.url){
          window.open(res.url, "_blank");
        }
      })
      .withFailureHandler(function(err){
        loader(false);

        setStatusImportacaoAlvara(
          "Erro ao processar PDFs: " +
          ((err && err.message) || err || ""),
          "err"
        );
      })
      .importarDocumentosEGerarPlanilha({
        arquivos: convertidos
      }, SISGEP_TOKEN_SESSAO);
  }
}

function tratarRetornoImportacaoAlvara(res){
  if(!res){
    setStatusImportacaoAlvara(
      "O servidor não retornou dados da importação.",
      "err"
    );
    return;
  }

  if(res.erro){
    setStatusImportacaoAlvara(
      res.mensagem || "Não foi possível importar o alvará.",
      "err"
    );
    return;
  }

  var qtd = Number(
    res.quantidadeBeneficiarios ||
    ((res.beneficiarios || []).length || 0)
  );

  if(qtd > 30){
    setStatusImportacaoAlvara(
      res.mensagem ||
      ("O PDF contém " + qtd + " beneficiários. Limite: 30 por lote."),
      "warn"
    );
    return;
  }

  if(res.ok === false){
    setStatusImportacaoAlvara(
      res.mensagem || "Não foi possível concluir a importação.",
      "warn"
    );
    return;
  }

  window.__IMPORTACAO_ALVARA__ = res;

  preencherCamposProcessoImportado(res.processo || {});
  renderizarResumoImportacaoAlvara(res);
  renderizarBeneficiariosImportados(res.beneficiarios || []);

  setStatusImportacaoAlvara(
    "Importação concluída com sucesso. " +
    qtd +
    " beneficiário(s) identificado(s).",
    "ok"
  );
}

function setStatusBuscarEmpresa(msg, tipo){
  var box = document.getElementById("statusBuscarEmpresa");
  if(!box) return;

  var bg = "#eef4ff";
  var borda = "#3b82f6";
  var cor = "#1d4ed8";

  if(tipo === "ok"){
    bg = "#e8f7ee";
    borda = "#2e7d32";
    cor = "#1b5e20";
  }

  if(tipo === "warn"){
    bg = "#fff3cd";
    borda = "#f59e0b";
    cor = "#7c4a03";
  }

  if(tipo === "err"){
    bg = "#f8d7da";
    borda = "#c62828";
    cor = "#7f1d1d";
  }

  box.style.display = "block";
  box.innerHTML =
    '<div style="padding:12px;border-radius:10px;background:'+
    bg+
    ';border:1px solid '+
    borda+
    ';color:'+
    cor+
    ';">'+
    msg+
    '</div>';
}

function limparStatusBuscarEmpresa(){
  var box = document.getElementById("statusBuscarEmpresa");
  if(!box) return;

  box.style.display = "none";
  box.innerHTML = "";
}

function buscarBeneficiariosPorEmpresaFrontend(){
  limparStatusBuscarEmpresa();

  var input = document.getElementById("inputBuscarEmpresa");
  var empresa = input ? String(input.value || "").trim() : "";

  if(!empresa){
    setStatusBuscarEmpresa("Informe o nome da empresa.", "warn");
    if(input) input.focus();
    return;
  }

  loader(true);
  setStatusBuscarEmpresa("Buscando beneficiários da empresa informada...", "info");

  google.script.run
    .withSuccessHandler(function(res){
      loader(false);

      if(!res || res.erro){
        setStatusBuscarEmpresa(
          (res && res.mensagem) || "Nenhum beneficiário encontrado.",
          "err"
        );
        return;
      }

      var recEmpresa = document.getElementById("recEmpresa");
      var recProcesso = document.getElementById("recProcesso");
      var modalEmpresa = document.getElementById("modalBuscarPorEmpresa");

      if(recEmpresa && res.empresa){
        recEmpresa.value = res.empresa;
      }

      if(recProcesso && res.processo){
        recProcesso.value = res.processo;
      }

      carregarBeneficiariosImportadosDaPlanilhaNaTela(
        res.beneficiarios || []
      );

      atualizarConferenciaRecibo();

      if(modalEmpresa){
        modalEmpresa.style.display = "none";
      }

      setReciboStatus(
        "✅ " +
        ((res.beneficiarios || []).length) +
        " beneficiário(s) carregado(s) por empresa.",
        "ok"
      );
    })
    .withFailureHandler(function(err){
      loader(false);

      setStatusBuscarEmpresa(
        "Erro ao buscar por empresa: " +
        ((err && err.message) || err),
        "err"
      );
    })
    .buscarBeneficiariosReciboPorEmpresa(empresa, SISGEP_TOKEN_SESSAO);
}

function carregarDadosDoProcessoReciboSelecionado(){
  var select = document.getElementById("recProcessoSelect");
  if(!select || select.dataset.boundBuscaProcessoRecibo) return;

  select.dataset.boundBuscaProcessoRecibo = "1";

  select.addEventListener("change", function(){
    var selected = select.options[select.selectedIndex];

    if(!selected || !selected.value){
      limparCamposProcessoRecibo();
      travarCamposProcessoRecibo_(false);

      var lista = document.getElementById("listaTrabalhadoresRecibo");
      if(lista){
        lista.innerHTML =
          '<div class="benef-empty" id="benefEmpty">' +
            '👤 Nenhum beneficiário adicionado ainda.<br>' +
            '<span style="font-size:12px;font-weight:400;">Clique em "+ Adicionar", importe um PDF ou use "Buscar por empresa".</span>' +
          '</div>';
      }

      atualizarContadorBeneficiariosRecibo_();
      atualizarConferenciaRecibo();

      if(typeof atualizarResumoFinanceiroProcesso === "function"){
        atualizarResumoFinanceiroProcesso();
      }

      if(typeof atualizarDashboardFinanceiroProcesso === "function"){
        atualizarDashboardFinanceiroProcesso();
      }

      return;
    }

    var recProcesso = document.getElementById("recProcesso");
    var recEmpresa  = document.getElementById("recEmpresa");
    var recValor    = document.getElementById("recValor");
    var recEmail    = document.getElementById("recEmail");

    if(recProcesso) recProcesso.value = selected.dataset.processo || "";
    if(recEmpresa)  recEmpresa.value  = selected.dataset.empresa || "";
    if(recValor){
      recValor.value            = selected.dataset.valortotal || "";
      recValor.readOnly         = false;
      recValor.style.background = "#fff";
    }
    if(recEmail) recEmail.value = "";

    travarCamposProcessoRecibo_(true);

    var lista = document.getElementById("listaTrabalhadoresRecibo");
    if(lista){
      lista.innerHTML =
        '<div class="benef-empty" id="benefEmpty">' +
          '👤 Nenhum beneficiário adicionado ainda.<br>' +
          '<span style="font-size:12px;font-weight:400;">Clique em "+ Adicionar", importe um PDF ou use "Buscar por empresa".</span>' +
        '</div>';
    }

    atualizarContadorBeneficiariosRecibo_();
    atualizarConferenciaRecibo();

    if(typeof atualizarResumoFinanceiroProcesso === "function"){
      atualizarResumoFinanceiroProcesso();
    }

    if(typeof atualizarDashboardFinanceiroProcesso === "function"){
      atualizarDashboardFinanceiroProcesso();
    }

    setTimeout(liberarCampoValorRecibo_, 50);
  });
}

      if(btn.id === "btnImportarAlvaraPdf"){
        e.preventDefault();
        e.stopPropagation();
        importarAlvaraPDFFrontend();
        return;
      }

      if(btn.id === "btnImportarPlanilhaRecibo"){
        e.preventDefault();
        e.stopPropagation();
        importarPlanilhaReciboFrontend();
        return;
      }

      if(btn.id === "btnLimparImportacaoAlvara"){
        e.preventDefault();
        e.stopPropagation();
        limparImportacaoAlvaraUI();
        return;
      }

      if(btn.id === "btnBuscarPorEmpresa"){
        e.preventDefault();
        e.stopPropagation();

        var modalEmpresa = document.getElementById("modalBuscarPorEmpresa");
        if(modalEmpresa){
          modalEmpresa.style.display = "flex";
        }

        limparStatusBuscarEmpresa();

        var inputEmpresa = document.getElementById("inputBuscarEmpresa");
        if(inputEmpresa){
          inputEmpresa.value = "";
          setTimeout(function(){
            inputEmpresa.focus();
          }, 100);
        }

        return;
      }

      if(btn.id === "btnConfirmarBuscarEmpresa"){
        e.preventDefault();
        e.stopPropagation();
        buscarBeneficiariosPorEmpresaFrontend();
        return;
      }

      if(
        btn.id === "btnCancelarBuscarEmpresa" ||
        btn.id === "btnFecharModalEmpresa"
      ){
        e.preventDefault();
        e.stopPropagation();

        var modalEmpresaFechar = document.getElementById("modalBuscarPorEmpresa");
        if(modalEmpresaFechar){
          modalEmpresaFechar.style.display = "none";
        }

        limparStatusBuscarEmpresa();
        return;
      }
    }, true);
  }

  window.RECIBO_INIT = window.RECIBO_INIT || false;

  if(!window.RECIBO_INIT){
    window.RECIBO_INIT = true;
  }

  abrirAbaRecibo();

  atualizarContadorBeneficiariosRecibo_();
  atualizarConferenciaRecibo();
}

function atualizarResumoFinanceiroProcesso(){
  var select = document.getElementById("recProcessoSelect");
  if(!select || !select.value) return;

  var id = select.value;

  google.script.run
    .withSuccessHandler(function(res){
      if(!res || res.erro) return;

      var pagoEl = document.getElementById("confRecPago");
      var saldoEl = document.getElementById("confRecSaldo");

      if(pagoEl){
        pagoEl.innerText = "R$ " + Number(res.pago || 0).toFixed(2);
      }

      if(saldoEl){
        saldoEl.innerText = "R$ " + Number(res.saldo || 0).toFixed(2);
      }
    })
    .withFailureHandler(function(err){
      console.error("Erro ao atualizar resumo financeiro:", err);
    })
    .obterResumoFinanceiroProcesso(id, SISGEP_TOKEN_SESSAO);
}
(function(){
  var _iniciado = false;

  function iniciarSeVisivel(){
    var sec = document.getElementById("docSubRecibos");
    if(!sec) return;

    if(sec.style.display !== "none" && !_iniciado){
      _iniciado = true;
      setTimeout(function(){
        initRecibos();
      }, 300);
    }
  }

  function configurarObserver(){
    var sec = document.getElementById("docSubRecibos");
    if(!sec) return;

    new MutationObserver(function(){
      if(!_iniciado){
        iniciarSeVisivel();
      }
    }).observe(sec, { attributes: true, attributeFilter: ["style"] });
  }

  if(document.readyState === "loading"){
    document.addEventListener("DOMContentLoaded", function(){
      iniciarSeVisivel();
      configurarObserver();
    });
  } else {
    iniciarSeVisivel();
    configurarObserver();
  }

  // Fallback direto no botão do menu
  document.addEventListener("click", function(e){
    var btn = e.target && e.target.closest
      ? e.target.closest("#btnRecibos")
      : null;

    if(!btn) return;

    setTimeout(function(){
      if(!_iniciado){
        _iniciado = true;
        initRecibos();
      } else {
        ReciboUI.carregarProcessos();
      }
    }, 350);
  }, true);

})();
/* =====================================================
   SISGEP · Seletor principal de Recibos
   ✅ Processo Individual
   ✅ Processo Lote
   ✅ Diverso Individual
   ✅ Diverso Lote
   ✅ Não altera backend
===================================================== */

function abrirModalTipoReciboSISGEP(){
  var modal = document.getElementById("modalTipoReciboSISGEP");
  if(modal){
    modal.style.display = "flex";
  }
}

function fecharModalTipoReciboSISGEP(){
  var modal = document.getElementById("modalTipoReciboSISGEP");
  if(modal){
    modal.style.display = "none";
  }
}
function definirModoReciboSISGEP_(modo){
  window.__MODO_RECIBO_SISGEP__ = modo;

  var btnTopo = document.getElementById("btnNovoReciboSISGEP");
  if(btnTopo){
    btnTopo.dataset.modoAtual = modo || "";
  }

  var mapa = {
    processo_individual: "🧾 Processo individual",
    processo_lote: "👥 Processo em lote",
    diverso_individual: "💰 Diverso individual",
    diverso_lote: "📦 Diversos em lote"
  };

  console.log("Modo Recibo SISGEP:", mapa[modo] || modo);
}

function obterModoReciboSISGEP_(){
  return window.__MODO_RECIBO_SISGEP__ || "processo_lote";
}

window.reciboMostrarHistorico = function(){
  var wrapProcesso  = document.getElementById("reciboProcessoWrap");
  var wrapDiverso   = document.getElementById("reciboDiversoWrap");
  var wrapHistorico = document.getElementById("reciboHistoricoWrap");

  if(wrapProcesso)  wrapProcesso.style.display  = "none";
  if(wrapDiverso)   wrapDiverso.style.display   = "none";
  if(wrapHistorico) wrapHistorico.style.display = "block";

  if(typeof initHistoricoRecibos === "function"){
    initHistoricoRecibos();
  }
};

window.reciboVoltarParaEmissao = function(){
  var wrapProcesso  = document.getElementById("reciboProcessoWrap");
  var wrapHistorico = document.getElementById("reciboHistoricoWrap");

  if(wrapHistorico) wrapHistorico.style.display = "none";
  if(wrapProcesso)  wrapProcesso.style.display  = "block";
};

function abrirFluxoReciboSISGEP(tipo){
  fecharModalTipoReciboSISGEP();
  definirModoReciboSISGEP_(tipo);

  var wrapProcesso = document.getElementById("reciboProcessoWrap");
  var wrapDiverso  = document.getElementById("reciboDiversoWrap");

  if(tipo === "diverso_individual" || tipo === "diverso_lote"){
    if(wrapProcesso) wrapProcesso.style.display = "none";
    if(wrapDiverso)  wrapDiverso.style.display  = "block";

    if(typeof initReciboDiversos === "function"){
      initReciboDiversos();
    }

    if(typeof limparReciboStatus === "function"){
      limparReciboStatus();
    }

    return;
  }

  if(wrapDiverso)  wrapDiverso.style.display  = "none";
  if(wrapProcesso) wrapProcesso.style.display = "block";

  if(tipo === "processo_individual" || tipo === "processo_lote"){
    if(typeof abrirAbaRecibo === "function"){
      abrirAbaRecibo();
    }

    if(typeof limparReciboStatus === "function"){
      limparReciboStatus();
    }

    var lista = document.getElementById("listaTrabalhadoresRecibo");

    if(tipo === "processo_individual"){
      if(lista && lista.querySelectorAll(".linha-trabalhador-recibo").length === 0){
        var btnAdd = document.getElementById("btnAddTrabalhadorRecibo");
        if(btnAdd) btnAdd.click();
      }

      if(typeof setReciboStatus === "function"){
        setReciboStatus(
          "🧾 Modo Processo Individual selecionado. Preencha o processo e os dados do beneficiário.",
          "info"
        );
      }
    }

    if(tipo === "processo_lote"){
      if(typeof setReciboStatus === "function"){
        setReciboStatus(
          "👥 Modo Processo em Lote selecionado. Informe o processo e adicione/importe os beneficiários.",
          "info"
        );
      }
    }

    if(typeof atualizarConferenciaRecibo === "function"){
      atualizarConferenciaRecibo();
    }
  }
}
(function inicializarSeletorReciboSISGEP(){
  function bind(){
    var btn = document.getElementById("btnNovoReciboSISGEP");
    var fechar = document.getElementById("btnFecharTipoReciboSISGEP");
    var modal = document.getElementById("modalTipoReciboSISGEP");

    if(btn && !btn.dataset.boundNovoReciboSISGEP){
      btn.dataset.boundNovoReciboSISGEP = "1";
      btn.addEventListener("click", function(e){
        e.preventDefault();
        e.stopPropagation();
        abrirModalTipoReciboSISGEP();
      });
    }

    if(fechar && !fechar.dataset.boundFecharTipoReciboSISGEP){
      fechar.dataset.boundFecharTipoReciboSISGEP = "1";
      fechar.addEventListener("click", function(e){
        e.preventDefault();
        e.stopPropagation();
        fecharModalTipoReciboSISGEP();
      });
    }

    if(modal && !modal.dataset.boundOverlayReciboSISGEP){
      modal.dataset.boundOverlayReciboSISGEP = "1";
      modal.addEventListener("click", function(e){
        if(e.target === modal){
          fecharModalTipoReciboSISGEP();
        }
      });
    }
  }

  if(document.readyState === "loading"){
    document.addEventListener("DOMContentLoaded", bind);
  }else{
    bind();
  }

  setTimeout(bind, 500);
})();
/* =====================================================
   SISGEP · Controle de Preview/Geração por modo
   ✅ Processo Individual
   ✅ Processo Lote
   ✅ Mantém Recibo.preview() e Recibo.gerar()
===================================================== */

var ReciboSISGEP = ReciboSISGEP || {};

ReciboSISGEP.preview = function(){
  var modo = typeof obterModoReciboSISGEP_ === "function"
    ? obterModoReciboSISGEP_()
    : "processo_lote";

  if(modo === "processo_individual"){
    var primeiraLinha = document.querySelector(".linha-trabalhador-recibo");

    if(!primeiraLinha){
      var btnAdd = document.getElementById("btnAddTrabalhadorRecibo");
      if(btnAdd) btnAdd.click();

      setReciboStatus(
        "🧾 Modo individual: preencha os dados do beneficiário antes de pré-visualizar.",
        "info"
      );

      return;
    }

    var btnPreview = primeiraLinha.querySelector(".btn-preview-individual");

    if(btnPreview){
      btnPreview.click();
      return;
    }
  }

  if(typeof Recibo !== "undefined" && typeof Recibo.preview === "function"){
    Recibo.preview();
  }
};

ReciboSISGEP.gerar = function(){
  var modo = typeof obterModoReciboSISGEP_ === "function"
    ? obterModoReciboSISGEP_()
    : "processo_lote";

  if(modo === "processo_individual"){
    var primeiraLinha = document.querySelector(".linha-trabalhador-recibo");

    if(!primeiraLinha){
      var btnAdd = document.getElementById("btnAddTrabalhadorRecibo");
      if(btnAdd) btnAdd.click();

      setReciboStatus(
        "🧾 Modo individual: preencha os dados do beneficiário antes de emitir.",
        "info"
      );

      return;
    }

    var btnEmitir = primeiraLinha.querySelector(".btn-emitir-individual");

    if(btnEmitir){
      btnEmitir.click();
      return;
    }
  }

  if(typeof Recibo !== "undefined" && typeof Recibo.gerar === "function"){
    Recibo.gerar();
  }
};
