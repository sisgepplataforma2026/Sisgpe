<!DOCTYPE html><html><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:Arial,sans-serif;background:#f4f6fa;margin:0;color:#172033}.top{background:#052f63;color:#fff;padding:18px}.wrap{padding:16px}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.card,.box{background:#fff;border:1px solid #dfe5ee;border-radius:12px;padding:12px}.n{font-size:24px;font-weight:800}.filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:8px;margin:14px 0}input,select,button,textarea{font:inherit;padding:9px;border:1px solid #ccd5e0;border-radius:8px}button{cursor:pointer;font-weight:700}.primary{background:#052f63;color:#fff}.danger{background:#b42318;color:#fff}.warn{background:#b7791f;color:#fff}.ok{background:#18794e;color:#fff}table{width:100%;border-collapse:collapse;background:#fff}th,td{padding:9px;border-bottom:1px solid #edf0f4;text-align:left;font-size:13px}th{background:#eef3f8}.pill{padding:3px 7px;border-radius:999px;background:#eef3f8;font-size:11px}.modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center}.modal .box{width:min(720px,92vw);max-height:85vh;overflow:auto}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}@media(max-width:850px){.grid{grid-template-columns:1fr 1fr}.filters{grid-template-columns:1fr}.row{grid-template-columns:1fr}}</style></head><body><div class="top"><h2 style="margin:0">Compasso 2026 — Central de Validação</h2><div id="user" style="opacity:.8;font-size:12px"></div></div><div class="wrap"><div class="grid"><div class="card">Total<div class="n" id="rTotal">0</div></div><div class="card">Não analisadas<div class="n" id="rNao">0</div></div><div class="card">Validadas<div class="n" id="rVal">0</div></div><div class="card">Pendentes<div class="n" id="rPen">0</div></div><div class="card">Reprovadas<div class="n" id="rRep">0</div></div></div><div class="filters"><input id="busca" placeholder="Nome, CPF, escola, cidade..."><select id="status"><option value="">Todos os status</option><option>RECEBIDA</option><option>PRE_VALIDADA</option><option>EM_ANALISE</option><option>PENDENTE</option><option value="VALIDADA_ADMINISTRATIVAMENTE">VALIDADA</option><option>REPROVADA</option></select><input id="escola" placeholder="Escola"><input id="cidade" placeholder="Cidade"><button class="primary" onclick="carregar()">Filtrar</button></div><div class="actions"><button onclick="duplicidades()">Ver possíveis duplicidades</button></div><div style="overflow:auto;margin-top:10px"><table><thead><tr><th>Nome</th><th>CPF</th><th>Escola</th><th>Cidade</th><th>Status</th><th>Analisado por</th><th></th></tr></thead><tbody id="tbody"></tbody></table></div></div><div class="modal" id="modal"><div class="box"><h3 id="mTitulo">Inscrição</h3><div class="row"><input id="mNome" placeholder="Nome"><input id="mCpf" placeholder="CPF"><input id="mEscola" placeholder="Escola"><input id="mCidade" placeholder="Cidade"><input id="mRegiao" placeholder="Região"><input id="mMatricula" placeholder="Matrícula"><input id="mWhats" placeholder="WhatsApp"><input id="mEmail" placeholder="E-mail"></div><div class="actions"><button onclick="salvarDados()">Salvar dados</button></div><hr><label>Status administrativo</label><select id="mNovoStatus" onchange="montarMotivos()"><option value="VALIDADA_ADMINISTRATIVAMENTE">Validada</option><option value="PENDENTE">Pendente</option><option value="REPROVADA">Reprovada</option></select><select id="mMotivo" style="width:100%;margin-top:8px"></select><textarea id="mObs" rows="3" placeholder="Observação / obrigatório quando motivo = Outro" style="width:100%;margin-top:8px"></textarea><div class="actions"><button class="ok" onclick="decidir()">Confirmar decisão</button><button onclick="fechar()">Fechar</button></div></div></div><script>var COMPASSO_TOKEN=(function(){try{var m=String(location.search||'').match(/[?&]sessao=([^&]*)/);return m?decodeURIComponent(m[1]):''}catch(e){return ''}})();var lista=[],sel=null,opcoes={};function api(fn,args,cb){var r=google.script.run.withSuccessHandler(cb).withFailureHandler(function(e){alert(e.message||e)});r[fn].apply(r,(args||[]).concat([COMPASSO_TOKEN]))}function carregar(){api('compasso_validacaoResumo',[],function(r){rTotal.textContent=r.total;rNao.textContent=r.naoAnalisadas;rVal.textContent=r.validadas;rPen.textContent=r.pendentes;rRep.textContent=r.reprovadas});api('compasso_validacaoListar',[{busca:busca.value,status:status.value,escola:escola.value,cidade:cidade.value}],function(r){lista=r||[];tbody.innerHTML=lista.map(function(x,i){return '<tr><td><b>'+esc(x.nome)+'</b></td><td>'+esc(x.cpf)+'</td><td>'+esc(x.escola)+'</td><td>'+esc(x.cidade)+'</td><td><span class="pill">'+esc(x.status)+'</span></td><td>'+esc(x.analisadoPor||'-')+'</td><td><button onclick="abrir('+i+')">Analisar</button></td></tr>'}).join('')||'<tr><td colspan="7">Nenhuma inscrição.</td></tr>'})}function esc(s){return String(s||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function abrir(i){sel=lista[i];mTitulo.textContent=sel.nome+' — '+sel.inscricaoId;mNome.value=sel.nome;mCpf.value=sel.cpf;mEscola.value=sel.escola;mCidade.value=sel.cidade;mRegiao.value=sel.regiao;mMatricula.value=sel.matricula;mWhats.value=sel.whatsapp;mEmail.value=sel.email;mNovoStatus.value=sel.status==='PENDENTE'?'PENDENTE':sel.status==='REPROVADA'?'REPROVADA':'VALIDADA_ADMINISTRATIVAMENTE';montarMotivos();mObs.value=sel.observacaoAnalise||'';modal.style.display='flex'}function fechar(){modal.style.display='none'}function montarMotivos(){var a=mNovoStatus.value==='REPROVADA'?opcoes.reprovacao:mNovoStatus.value==='PENDENTE'?opcoes.pendencia:[];mMotivo.innerHTML='<option value="">Selecione o motivo</option>'+a.map(function(x){return '<option value="'+x.codigo+'">'+esc(x.label)+'</option>'}).join('')}function salvarDados(){if(!sel)return;api('compasso_validacaoSalvarDados',[sel.inscricaoId,{nome:mNome.value,cpf:mCpf.value,escola:mEscola.value,cidade:mCidade.value,regiao:mRegiao.value,matricula:mMatricula.value,whatsapp:mWhats.value,email:mEmail.value},false],function(){alert('Dados salvos.');carregar()})}function decidir(){if(!sel)return;var s=mNovoStatus.value,m=mMotivo.value;if(s!=='VALIDADA_ADMINISTRATIVAMENTE'&&!m)return alert('Selecione o motivo.');api('compasso_validarDecisaoAdmin',[sel.inscricaoId,s,m,mObs.value],function(){fechar();carregar()})}function duplicidades(){api('compasso_validacaoDuplicidades',[],function(r){if(!r.length)return alert('Nenhuma possível duplicidade encontrada.');alert('Foram encontrados '+r.length+' grupo(s) de possível duplicidade. Revise a lista administrativa antes da emissão.')})}api('compasso_validacaoOpcoes',[],function(r){opcoes=r;user.textContent='Usuário: '+r.usuario;carregar()});</script></body></html>
