<!DOCTYPE html><html><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:Arial,sans-serif;background:#f4f6fa;margin:0;color:#172033}.top{background:#052f63;color:#fff;padding:18px}.wrap{padding:16px}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.card,.box{background:#fff;border:1px solid #dfe5ee;border-radius:12px;padding:12px}.n{font-size:24px;font-weight:800}.filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:8px;margin:14px 0}input,select,button,textarea{font:inherit;padding:9px;border:1px solid #ccd5e0;border-radius:8px}button{cursor:pointer;font-weight:700}.primary{background:#052f63;color:#fff}.danger{background:#b42318;color:#fff}.warn{background:#b7791f;color:#fff}.ok{background:#18794e;color:#fff}table{width:100%;border-collapse:collapse;background:#fff}th,td{padding:9px;border-bottom:1px solid #edf0f4;text-align:left;font-size:13px}th{background:#eef3f8}.pill{padding:3px 7px;border-radius:999px;background:#eef3f8;font-size:11px}.modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center}.modal .box{width:min(720px,92vw);max-height:85vh;overflow:auto}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}@media(max-width:850px){.grid{grid-template-columns:1fr 1fr}.filters{grid-template-columns:1fr}.row{grid-template-columns:1fr}}</style></head><body><div class="top"><h2 style="margin:0">Compasso 2026 — Central de Validação</h2><div id="user" style="opacity:.8;font-size:12px"></div></div><div class="wrap"><div class="grid"><div class="card">Total<div class="n" id="rTotal">0</div></div><div class="card">Não analisadas<div class="n" id="rNao">0</div></div><div class="card">Validadas<div class="n" id="rVal">0</div></div><div class="card">Pendentes<div class="n" id="rPen">0</div></div><div class="card">Reprovadas<div class="n" id="rRep">0</div></div></div><div class="filters"><input id="busca" placeholder="Nome, CPF, escola, cidade..."><select id="status"><option value="">Todos os status</option><option>RECEBIDA</option><option>PRE_VALIDADA</option><option>EM_ANALISE</option><option>PENDENTE</option><option value="VALIDADA_ADMINISTRATIVAMENTE">VALIDADA</option><option>REPROVADA</option></select><input id="escola" placeholder="Escola"><input id="cidade" placeholder="Cidade"><button class="primary" onclick="carregar()">Filtrar</button></div><div class="actions"><button onclick="duplicidades()">Ver possíveis duplicidades</button></div><div style="overflow:auto;margin-top:10px"><table><thead><tr><th>Nome</th><th>CPF</th><th>Escola</th><th>Cidade</th><th>Status</th><th>Analisado por</th><th></th></tr></thead><tbody id="tbody"></tbody></table></div></div><div class="modal" id="modal"><div class="box"><h3 id="mTitulo">Inscrição</h3><div class="row"><input id="mNome" placeholder="Nome"><input id="mCpf" placeholder="CPF"><input id="mEscola" placeholder="Escola"><input id="mCidade" placeholder="Cidade"><input id="mRegiao" placeholder="Região"><input id="mMatricula" placeholder="Matrícula"><input id="mWhats" placeholder="WhatsApp"><input id="mEmail" placeholder="E-mail"></div><div class="actions"><button onclick="salvarDados()">Salvar dados</button></div><div id="pgBloco" style="display:none;margin-top:12px;padding:12px;border:1px solid #d8e0ea;border-radius:10px;background:#f7fafd"><b style="display:block;margin-bottom:8px">&#128179; Pagamento &mdash; acompanhante</b><div id="pgSituacao" style="margin-bottom:10px"></div><div id="pgForm"><div class="row"><select id="pgForma"></select><input id="pgValor" placeholder="Valor"><input id="pgRef" placeholder="Refer&ecirc;ncia (n&ordm; da transa&ccedil;&atilde;o)"></div><div id="pgOrigemValor" style="font-size:12px;color:#6b7385;margin-top:4px"></div><div class="actions"><button class="ok" onclick="confirmarPagamento()">&#10003; Confirmar recebimento</button></div></div><div id="pgEstorno" style="display:none" class="actions"><button onclick="estornarPagamento()">Estornar</button></div></div><hr><label>Status administrativo</label><select id="mNovoStatus" onchange="montarMotivos()"><option value="VALIDADA_ADMINISTRATIVAMENTE">Validada</option><option value="PENDENTE">Pendente</option><option value="REPROVADA">Reprovada</option></select><select id="mMotivo" style="width:100%;margin-top:8px"></select><textarea id="mObs" rows="3" placeholder="Observação / obrigatório quando motivo = Outro" style="width:100%;margin-top:8px"></textarea><div class="actions"><button class="ok" onclick="decidir()">Confirmar decisão</button><button onclick="fechar()">Fechar</button></div></div></div><script>var COMPASSO_TOKEN=(function(){try{var m=String(location.search||'').match(/[?&]sessao=([^&]*)/);return m?decodeURIComponent(m[1]):''}catch(e){return ''}})();var lista=[],sel=null,opcoes={};function api(fn,args,cb){var r=google.script.run.withSuccessHandler(cb).withFailureHandler(function(e){alert(e.message||e)});r[fn].apply(r,(args||[]).concat([COMPASSO_TOKEN]))}var PG_OPCOES=null;
function pgEsc(t){return String(t==null?'':t).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function pgMoeda(v){var n=Number(v||0);return 'R$ '+n.toFixed(2).replace('.',',')}
function pgData(d){if(!d)return '';var x=new Date(d);return isNaN(x)?String(d):x.toLocaleString('pt-BR')}
/* O bloco so existe para acompanhante. Associado e convidado sao gratuitos:
   mostrar campo de pagamento neles e ruido que induz a lancar receita falsa. */
function montarPagamento(){
  var bloco=document.getElementById('pgBloco');
  if(!sel||String(sel.categoria||'')!=='acompanhante'){bloco.style.display='none';return}
  bloco.style.display='block';
  var p=(sel.pagamento||{}),st=String(p.status||'PENDENTE');
  var sit=document.getElementById('pgSituacao');
  var form=document.getElementById('pgForm');
  var est=document.getElementById('pgEstorno');
  if(st==='PAGO'){
    sit.innerHTML='<b style="color:#0f8a5f">&#9989; PAGO</b> &middot; '+pgEsc(p.forma)+' &middot; '+pgMoeda(p.valor)+
      '<div style="font-size:12px;color:#6b7385">'+pgEsc(pgData(p.em))+' &middot; '+pgEsc(p.por)+
      (p.referencia?' &middot; ref '+pgEsc(p.referencia):'')+'</div>'+
      (sel.ingressoId
        ? '<div style="font-size:12px;color:#6b7385">Ingresso '+pgEsc(sel.numeroIngresso||sel.ingressoId)+' j&aacute; emitido</div>'
        : '<div style="font-size:12px;color:#0f8a5f">&rarr; o ingresso j&aacute; pode ser emitido</div>');
    form.style.display='none'; est.style.display=sel.ingressoId?'none':'flex';
  } else if(st==='ESTORNADO'){
    sit.innerHTML='<b style="color:#d97706">&#8635; ESTORNADO</b>'+
      '<div style="font-size:12px;color:#6b7385">'+pgEsc(pgData(p.estornadoEm))+' &middot; '+pgEsc(p.estornoMotivo)+'</div>'+
      '<div style="font-size:12px;color:#6b7385">Pode confirmar de novo se o recebimento se resolver.</div>';
    form.style.display='block'; est.style.display='none';
  } else {
    sit.innerHTML='<b style="color:#d97706">&#8987; PENDENTE</b>'+
      '<div style="font-size:12px;color:#6b7385">A emiss&atilde;o do ingresso s&oacute; libera depois de confirmado.</div>';
    form.style.display='block'; est.style.display='none';
  }
  if(PG_OPCOES){
    var sf=document.getElementById('pgForma');
    if(!sf.options.length) sf.innerHTML=(PG_OPCOES.formas||[]).map(function(f){return '<option>'+pgEsc(f)+'</option>'}).join('');
    /* REGRA No 0.6: o valor nasce preenchido com o que o evento ja define, e
       a origem fica a vista para nao passar impressao de conferido. */
    var vi=document.getElementById('pgValor');
    if(!vi.value) vi.value=Number(PG_OPCOES.valorSugerido||0).toFixed(2).replace('.',',');
    document.getElementById('pgOrigemValor').textContent='Valor sugerido: '+(PG_OPCOES.origemValor||'')+' — edite se recebeu outro.';
  }
}
function confirmarPagamento(){
  if(!sel)return;
  api('compasso_confirmarPagamento',[sel.inscricaoId,{
    forma:document.getElementById('pgForma').value,
    valor:document.getElementById('pgValor').value,
    referencia:document.getElementById('pgRef').value
  }],function(r){
    if(!r||!r.ok){alert((r&&r.erro)||'Nao foi possivel confirmar.');return}
    sel.pagamento=r.pagamento; montarPagamento();
    /* O resultado do lancamento no Financeiro VOLTA e aparece. A V1 engolia
       isso num catch e a receita sumia sem ninguem saber. */
    var msg=r.aviso||'Pagamento confirmado.';
    msg += (r.receita&&r.receita.ok)
      ? '\n\nReceita lancada no Financeiro.'
      : '\n\nATENCAO: a receita NAO foi lancada no Financeiro.\nMotivo: '+
        ((r.receita&&r.receita.motivo)||'desconhecido')+'\nLance manualmente na Central Financeira.';
    alert(msg); carregar();
  })
}
function estornarPagamento(){
  if(!sel)return;
  var motivo=prompt('Motivo do estorno:');
  if(!motivo)return;
  api('compasso_estornarPagamento',[sel.inscricaoId,motivo],function(r){
    if(!r||!r.ok){alert((r&&r.erro)||'Nao foi possivel estornar.');return}
    sel.pagamento=r.pagamento; montarPagamento(); alert(r.aviso||'Estornado.'); carregar();
  })
}
function carregar(){api('compasso_validacaoResumo',[],function(r){rTotal.textContent=r.total;rNao.textContent=r.naoAnalisadas;rVal.textContent=r.validadas;rPen.textContent=r.pendentes;rRep.textContent=r.reprovadas});api('compasso_validacaoListar',[{busca:busca.value,status:status.value,escola:escola.value,cidade:cidade.value}],function(r){lista=r||[];tbody.innerHTML=lista.map(function(x,i){return '<tr><td><b>'+esc(x.nome)+'</b></td><td>'+esc(x.cpf)+'</td><td>'+esc(x.escola)+'</td><td>'+esc(x.cidade)+'</td><td><span class="pill">'+esc(x.status)+'</span></td><td>'+esc(x.analisadoPor||'-')+'</td><td><button onclick="abrir('+i+')">Analisar</button></td></tr>'}).join('')||'<tr><td colspan="7">Nenhuma inscrição.</td></tr>'})}function esc(s){return String(s||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function abrir(i){sel=lista[i];mTitulo.textContent=sel.nome+' — '+sel.inscricaoId;mNome.value=sel.nome;mCpf.value=sel.cpf;mEscola.value=sel.escola;mCidade.value=sel.cidade;mRegiao.value=sel.regiao;mMatricula.value=sel.matricula;mWhats.value=sel.whatsapp;mEmail.value=sel.email;mNovoStatus.value=sel.status==='PENDENTE'?'PENDENTE':sel.status==='REPROVADA'?'REPROVADA':'VALIDADA_ADMINISTRATIVAMENTE';montarMotivos();montarPagamento();mObs.value=sel.observacaoAnalise||'';modal.style.display='flex'}function fechar(){modal.style.display='none'}function montarMotivos(){var a=mNovoStatus.value==='REPROVADA'?opcoes.reprovacao:mNovoStatus.value==='PENDENTE'?opcoes.pendencia:[];mMotivo.innerHTML='<option value="">Selecione o motivo</option>'+a.map(function(x){return '<option value="'+x.codigo+'">'+esc(x.label)+'</option>'}).join('')}function salvarDados(){if(!sel)return;api('compasso_validacaoSalvarDados',[sel.inscricaoId,{nome:mNome.value,cpf:mCpf.value,escola:mEscola.value,cidade:mCidade.value,regiao:mRegiao.value,matricula:mMatricula.value,whatsapp:mWhats.value,email:mEmail.value},false],function(){alert('Dados salvos.');carregar()})}function decidir(){if(!sel)return;var s=mNovoStatus.value,m=mMotivo.value;if(s!=='VALIDADA_ADMINISTRATIVAMENTE'&&!m)return alert('Selecione o motivo.');api('compasso_validarDecisaoAdmin',[sel.inscricaoId,s,m,mObs.value],function(){fechar();carregar()})}function duplicidades(){api('compasso_validacaoDuplicidades',[],function(r){if(!r.length)return alert('Nenhuma possível duplicidade encontrada.');alert('Foram encontrados '+r.length+' grupo(s) de possível duplicidade. Revise a lista administrativa antes da emissão.')})}api('compasso_validacaoOpcoes',[],function(r){opcoes=r;user.textContent='Usuário: '+r.usuario;carregar()});api('compasso_pagamentoOpcoes',[],function(r){PG_OPCOES=r||null;if(sel)montarPagamento()});</script></body></html>
