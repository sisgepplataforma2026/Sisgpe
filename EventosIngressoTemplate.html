<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#111827;font-family:Arial,Helvetica,sans-serif;color:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:14px}
        /* UM MODELO SO, EM QUALQUER CENARIO — 14/09/2026.
       As caixas eram medidas pelo INGRESSO (%) e a fonte pela JANELA (vw).
       Numa janela larga o ingresso trava em 1200px e a fonte continua
       crescendo: o nome nao cabia mais na caixa, quebrava em quatro linhas
       e invadia a escola. Na impressao a proporcao voltava a bater por
       acidente — e era esse acidente que fazia o PDF parecer certo.
       Agora o proprio ingresso e a referencia: `cqw` mede a largura DELE,
       entao a proporcao aprovada vale em tela, no PDF e no celular.
       O `vw` fica como primeira declaracao, para navegador antigo que nao
       entende container query cair no comportamento de antes, e nao em
       tamanho nenhum. */
    .ticket{position:relative;width:min(1200px,100%);aspect-ratio:1634/962;overflow:hidden;box-shadow:0 16px 50px #0008;background:#071a38;container-type:inline-size}
    .art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
    .fallback{position:absolute;inset:0;background:linear-gradient(135deg,#071a38,#0b2f63 62%,#17233f)}
    .field{position:absolute;font-weight:800;text-transform:uppercase;line-height:1.12;text-shadow:0 1px 2px #0008;overflow:hidden}
    .main-name{left:67.35%;top:25.7%;width:10.2%;height:7.6%;font-size:1.05vw;font-size:1.05cqw}
    .main-school{left:67.35%;top:34.4%;width:10.4%;height:7.8%;font-size:1vw;font-size:1cqw}
    .main-category{left:67.35%;top:43.4%;width:10.3%;height:5.4%;font-size:1.05vw;font-size:1.05cqw}
    .main-number{left:65.3%;top:49.7%;width:12.8%;height:4.6%;display:flex;align-items:center;justify-content:center;color:#111827;text-shadow:none;font-size:1.2vw;font-size:1.2cqw;letter-spacing:.02em}
    .qrBox{position:absolute;left:65.4%;top:57.7%;width:12.4%;aspect-ratio:1/1;background:#fff;padding:.6%;display:flex;align-items:center;justify-content:center}
    .qrBox>div,.qrBox canvas,.qrBox img{width:100%!important;height:100%!important;display:block}
    .stub-number{left:83.3%;top:30.5%;width:14.4%;height:4.8%;display:flex;align-items:center;justify-content:center;color:#b90f3d;text-shadow:none;font-size:1.1vw;font-size:1.1cqw}
    .stub-name{left:84.7%;top:49.3%;width:13.1%;height:7.2%;color:#172033;text-shadow:none;font-size:1vw;font-size:1cqw}
    .stub-school{left:84.7%;top:60.9%;width:13.1%;height:6.8%;color:#172033;text-shadow:none;font-size:.95vw;font-size:.95cqw}
    .stub-category{left:84.7%;top:71.8%;width:13.1%;height:6.2%;color:#172033;text-shadow:none;font-size:1vw;font-size:1cqw}
    /* NOME E ESCOLA SAEM DA CAIXA ALTA — 15/09/2026, a pedido dele.
       Caixa alta nao e so questao de gosto: ocupa mais largura, porque toda
       maiuscula e larga e nao sobra letra baixa para o olho apoiar. Era isso
       que empurrava o nome para a terceira linha e o fazia encostar na caixa
       da escola. O texto ja chega pronto do servidor (compasso_nomeProprio_),
       num lugar so, para a tela e o PDF nao divergirem. */
    .main-name,.main-school,.stub-name,.stub-school{text-transform:none}
    .teste{position:absolute;left:35%;top:4%;padding:7px 14px;background:#dc2626;color:#fff;border-radius:8px;font-size:1.1vw;font-size:1.1cqw;font-weight:900;letter-spacing:.12em;box-shadow:0 4px 14px #0008}
    /* O CANHOTO ESTAVA ESCREVENDO POR CIMA DOS PROPRIOS ROTULOS — 15/09/2026.
       "Tem que ajustar os dados do Canhoto." Na frente do bilhete o valor cai
       ABAIXO do rotulo impresso na arte; no canhoto ele nascia na MESMA
       altura, e o nome passava por cima de "NOME:", a escola por cima de
       "ESCOLA:". Ficou escondido enquanto o nome saia em caixa alta e
       cortado — so depois de a arte carregar e o texto caber e que deu para
       ver o que estava embaixo.
       Os tres desceram para a faixa entre o rotulo e a linha pontilhada, e a
       altura encolheu junto para nao invadir a proxima. As mesmas medidas
       valem no PDF (EventosEntrega.gs) — o t167 compara campo a campo. */
    .semarte{position:absolute;left:4%;top:4%;right:4%;padding:10px 14px;background:#dc2626;
      color:#fff;font-weight:800;font-size:13px;border-radius:9px;line-height:1.35;z-index:4}
    .printbar{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:5}.printbar button{border:0;border-radius:9px;padding:10px 14px;font-weight:800;cursor:pointer}.primary{background:#fff;color:#0b2f63}
    @media print{body{background:#fff;padding:0}.ticket{width:100%;box-shadow:none}.printbar{display:none}}
    /* O bloco de celular MUDAVA O TAMANHO DA LETRA e, com isso, mudava o
       modelo: o mesmo ingresso saia diferente no telefone. Com `cqw` o texto
       ja acompanha o ingresso sozinho, entao aqui so sobra a largura. */
    @media(max-width:800px){body{padding:4px}.ticket{width:100%}}
  </style>
</head>
<body>
  <div class="ticket" id="ticket">
    <div class="fallback"></div>
    <!-- A ARTE SAI SEM ESCAPE DE CONTEXTO — 15/09/2026.
         (A sintaxe real de scriptlet nao vai escrita aqui: comentario HTML
          nao desliga scriptlet no Apps Script — REGRA No 0.)
         Ele abriu o ingresso pelo link e a arte nao apareceu: so o texto
         alternativo no canto e o fundo azul por baixo. Com a arte faltando,
         os campos, que sao posicionados em % SOBRE ela, ficam soltos no
         nada — foi exatamente isso que ele viu.
         O scriptlet de impressao PADRAO do Apps Script nao apenas escapa
         HTML: ele escapa por CONTEXTO. Dentro de um atributo de URL passa
         um filtro que recusa URI de dados embutido e troca o valor por um
         invalido. O elemento de imagem continua na pagina, com um endereco
         que nao carrega — o sintoma, exato.
         Por isso aqui se usa a forma de impressao FORCADA, que nao filtra.
         O PDF do e-mail nunca teve esse problema porque
         compasso_ingressoPdf_ monta o HTML por concatenacao, sem template:
         sem escape de contexto, sem filtro de URL. Era por isso que um saia
         certo e o outro nao.
         O onerror existe para o dia em que isso falhar por outro motivo:
         melhor uma faixa dizendo o que houve do que um ingresso bonito e
         vazio. -->
    <? if (dados.arteDataUri) { ?><img class="art" src="<?!= dados.arteDataUri ?>"
         alt="" onerror="document.getElementById('semArte').hidden=false"><? } ?>
    <div class="semarte" id="semArte" hidden>A arte oficial não carregou —
      este ingresso está incompleto. Avise a secretaria antes de usar.</div>
    <? if (dados.modoTeste) { ?><div class="teste">HOMOLOGAÇÃO</div><? } ?>

    <div class="field main-name"><?= dados.nome ?></div>
    <div class="field main-school"><?= dados.escola || '-' ?></div>
    <div class="field main-category"><?= dados.categoria ?></div>
    <div class="field main-number"><?= dados.numero ?></div>
    <div class="qrBox"><div id="qrcode"></div></div>

    <div class="field stub-number"><?= dados.numero ?></div>
    <div class="field stub-name"><?= dados.nome ?></div>
    <div class="field stub-school"><?= dados.escola || '-' ?></div>
    <div class="field stub-category"><?= dados.categoria ?></div>
  </div>

  <div class="printbar"><button class="primary" onclick="window.print()">Imprimir / Salvar PDF</button></div>

  <script>
    /* ══ O NOME QUE NAO CABE ═══════════════════════════════════════════════
       "Se for muito longo, diminui a fonte ou coloque em duas linhas."

       CSS nao mede texto. A caixa tem largura e altura fixas em % do ingresso,
       e `overflow:hidden` antes CORTAVA em silencio — pior que transbordar,
       porque some sem avisar e ninguem descobre ate a portaria.

       Aqui o texto e MEDIDO depois de desenhado: se a altura do conteudo passa
       da caixa, a fonte desce de 5% em 5% ate caber, com piso em 55% do
       tamanho original. Duas linhas acontecem sozinhas — a caixa tem largura e
       o texto quebra; o que se garante e que o que quebrou continua DENTRO.

       Roda de novo quando a janela muda porque a medida e em `cqw`: mudou a
       largura do ingresso, mudou o tamanho da letra, e o ajuste anterior
       deixou de valer. */
    (function(){
      /* OS NUMEROS ENTRARAM EM 15/09/2026, e a falta deles era o defeito.
         Eu tinha ensinado o ajuste a medir tambem a LARGURA — que e por onde
         o numero transborda, porque e caixa de uma linha so — e o numero nao
         estava nesta lista. A correcao existia e nao era aplicada a ninguem:
         "o numero do ingresso esta cortando tambem".
         Vale como aviso: quem acrescentar campo de texto ao bilhete precisa
         acrescentar aqui, senao ele nasce sem ajuste nenhum. */
      var CAMPOS = ['main-name','main-school','main-category','main-number',
                    'stub-name','stub-school','stub-category','stub-number'];

      function caber(el){
        var base = parseFloat(el.dataset.base || '0');
        if (!base) return;
        var k = 1;
        el.style.fontSize = base + 'cqw';
        /* 10 passos de 5% chegam a 60%; o piso de 0.55 para antes disso. */
        /* TAMBEM PELA LARGURA — 15/09/2026. O numero do ingresso saia
           cortado no fim ("FCV-2026-00000"): e uma caixa de uma linha so, em
           flex, entao o excesso nao vai para baixo, vai para o LADO, e
           comparar so a altura nunca ia enxergar. Cortar o fim de um numero
           de ingresso e pior do que letra pequena: na portaria confere-se
           digito a digito. */
        var passou = function(){ return el.scrollHeight > el.clientHeight + 1 ||
                                        el.scrollWidth  > el.clientWidth  + 1; };
        for (var i = 0; i < 10 && passou(); i++){
          k -= 0.05;
          if (k < 0.55) { k = 0.55; el.style.fontSize = (base*k) + 'cqw'; break; }
          el.style.fontSize = (base*k) + 'cqw';
        }
      }

      function ajustar(){
        CAMPOS.forEach(function(c){
          var el = document.querySelector('.' + c);
          if (!el) return;
          if (!el.dataset.base){
            /* O tamanho de partida vem do CSS, nao de numero repetido aqui:
               duas fontes de verdade para a mesma medida divergem no primeiro
               ajuste de layout que alguem fizer. */
            var cq = document.getElementById('ticket').clientWidth / 100;
            el.dataset.base = cq ? (parseFloat(getComputedStyle(el).fontSize) / cq).toFixed(3) : '1';
          }
          caber(el);
        });
      }

      ajustar();
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(ajustar);
      window.addEventListener('resize', ajustar);
      window.addEventListener('beforeprint', ajustar);
    })();

    (function(){
      var token = <?!= JSON.stringify(dados.qrToken) ?>;
      var alvo = document.getElementById('qrcode');
      if (typeof QRCode === 'undefined') {
        alvo.innerHTML = '<div style="color:#b91c1c;background:#fff;font:700 12px Arial;padding:8px;text-align:center">QR indisponível</div>';
        return;
      }
      new QRCode(alvo,{text:token,width:360,height:360,correctLevel:QRCode.CorrectLevel.M});
    })();
  </script>
</body>
</html>
