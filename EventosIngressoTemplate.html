<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    *{box-sizing:border-box}body{margin:0;background:#111827;font-family:Arial,Helvetica,sans-serif;color:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:14px}.ticket{position:relative;width:min(1100px,100%);aspect-ratio:2.05/1;border-radius:16px;overflow:hidden;box-shadow:0 16px 50px #0008;background:linear-gradient(135deg,#071a38,#0b2f63 62%,#17233f)}.art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.fallback{position:absolute;inset:0;background:radial-gradient(circle at 25% 20%,#1e3a8a55,transparent 32%),radial-gradient(circle at 70% 25%,#ec489955,transparent 28%),linear-gradient(135deg,#071a38,#092d5c 60%,#111827)}.overlay{position:absolute;inset:0}.data{position:absolute;left:4.1%;bottom:7.5%;width:51%;background:#06152dcc;border:1px solid #ffffff2a;border-radius:12px;padding:13px 16px;backdrop-filter:blur(3px)}.row{display:grid;grid-template-columns:1.55fr 1fr 1fr;gap:12px}.label{font-size:10px;letter-spacing:.8px;font-weight:700;opacity:.75;text-transform:uppercase}.value{font-size:15px;font-weight:800;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.qrBox{position:absolute;right:24.8%;bottom:8.1%;width:18.3%;aspect-ratio:1/1;background:#fff;border-radius:11px;padding:8px;box-shadow:0 4px 15px #0008}.qrBox img{width:100%;height:100%;display:block}.stub{position:absolute;right:0;top:0;width:22.2%;height:100%;background:#f4e9d5;color:#172033;border-left:2px dashed #6b7280;padding:8% 2.2% 5%;display:flex;flex-direction:column;justify-content:flex-end}.stub h3{font-size:20px;margin:0 0 12px;text-align:center}.stub .srow{margin:8px 0}.stub .slabel{font-size:10px;font-weight:700;text-transform:uppercase;color:#6b7280}.stub .svalue{font-size:13px;font-weight:800;border-bottom:1px solid #6b7280;padding-bottom:4px}.stub .info{font-size:10px;margin-top:14px;line-height:1.35;text-align:center}.badge{position:absolute;left:4%;top:4%;padding:6px 10px;border-radius:999px;background:#f59e0b;color:#111827;font-size:11px;font-weight:900}.teste{position:absolute;right:24.8%;top:5%;padding:5px 9px;background:#dc2626;color:#fff;border-radius:8px;font-size:11px;font-weight:900}.printbar{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:8px}.printbar button{border:0;border-radius:9px;padding:10px 14px;font-weight:800;cursor:pointer}.primary{background:#fff;color:#0b2f63}@media print{body{background:#fff;padding:0}.ticket{width:100%;box-shadow:none;border-radius:0}.printbar{display:none}}@media(max-width:760px){.ticket{aspect-ratio:auto;height:520px}.data{left:4%;bottom:5%;width:67%}.row{grid-template-columns:1fr}.qrBox{right:4%;bottom:5%;width:22%}.stub{display:none}.teste{right:4%}}
  </style>
</head>
<body>
  <div class="ticket">
    <div class="fallback"></div>
    <? if (dados.arteDataUri) { ?><img class="art" src="<?= dados.arteDataUri ?>" alt="Arte oficial Compasso 2026"><? } ?>
    <div class="overlay">
      <div class="badge"><?= dados.categoria ?></div>
      <? if (dados.modoTeste) { ?><div class="teste">HOMOLOGAÇÃO</div><? } ?>
      <div class="data">
        <div class="row">
          <div><div class="label">Nome do participante</div><div class="value"><?= dados.nome ?></div></div>
          <div><div class="label">Escola</div><div class="value"><?= dados.escola || '-' ?></div></div>
          <div><div class="label">Nº do ingresso</div><div class="value"><?= dados.numero ?></div></div>
        </div>
      </div>
      <div class="qrBox"><img src="<?= dados.qrDataUri ?>" alt="QR Code do ingresso"></div>
      <div class="stub">
        <h3>Canhoto para Sorteio</h3>
        <div class="srow"><div class="slabel">Nº do ingresso</div><div class="svalue"><?= dados.numero ?></div></div>
        <div class="srow"><div class="slabel">Nome</div><div class="svalue"><?= dados.nome ?></div></div>
        <div class="srow"><div class="slabel">Escola</div><div class="svalue"><?= dados.escola || '-' ?></div></div>
        <div class="srow"><div class="slabel">Categoria</div><div class="svalue"><?= dados.categoria ?></div></div>
        <div class="info">Ingresso individual e intransferível.<br>Apresente o QR Code na entrada.</div>
      </div>
    </div>
  </div>
  <div class="printbar"><button class="primary" onclick="window.print()">Imprimir / Salvar PDF</button></div>
</body>
</html>
