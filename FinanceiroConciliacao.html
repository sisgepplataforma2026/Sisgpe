<script>
/*
  Conciliação bancária — camada de tela.

  Antes: tudo vivia em localStorage("sisgep_conciliacao_bancaria_v1"). O
  trabalho de conciliar um mês sumia ao trocar de computador, ninguém mais via
  o que já tinha sido conferido, e "conciliado" não gravava nada na despesa.

  Agora: FinanceiroConciliacao.gs persiste em planilha, entende OFX (o formato
  que os bancos brasileiros exportam) além de texto/CSV, deduplica por FITID e
  a baixa vai por marcarDespesaComoPaga — a função dona da regra em Despesas.gs.

  Os IDs de elemento e os nomes de função foram mantidos de propósito: a
  interface vive em DespesasAdmin.html e não precisou ser tocada.
*/
(function(){
"use strict";

var CONC_ITENS = [], CONC_DESPESAS = [], CONC_OCUPADO = false;

function g(id){ return document.getElementById(id); }
function tokenSessao(){ return typeof SISGEP_TOKEN_SESSAO !== "undefined" ? SISGEP_TOKEN_SESSAO : ""; }
function money(v){ return Number(v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"}); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"})[c];}); }
function setText(id,v){ var el=g(id); if(el) el.textContent=v; }

function aviso(msg, tipo){
  var el = g("finConcAviso");
  if (!el) { if (msg && typeof window.toast==="function") window.toast(msg, tipo||"info"); return; }
  el.textContent = msg || "";
  el.style.display = msg ? "block" : "none";
  if (msg) {
    var erro = (tipo === "erro");
    el.style.background   = erro ? "#fee2e2" : "#fff7ed";
    el.style.borderColor  = erro ? "#fca5a5" : "#fed7aa";
    el.style.color        = erro ? "#991b1b" : "#9a3412";
  }
}

function dataBR(iso){
  var m = String(iso||"").match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m ? (m[3]+"/"+m[2]+"/"+m[1]) : (iso || "—");
}

/* ─────────── CARGA ─────────── */
window.finConciliacaoRender = function(){
  var tb = g("finConcTabela");
  var r = { total:0, entradas:0, saidas:0, prontos:0 };

  CONC_ITENS.forEach(function(m){
    r.total++;
    if (m.valor >= 0) r.entradas += m.valor; else r.saidas += Math.abs(m.valor);
    if (m.status === "PENDENTE" && m.confianca >= 70) r.prontos++;
  });

  setText("finConcTotal", String(r.total));
  setText("finConcEntradas", money(r.entradas));
  setText("finConcSaidas", money(r.saidas));
  setText("finConcMatch", String(r.prontos));

  if (!tb) return;
  if (!CONC_ITENS.length) {
    tb.innerHTML = '<tr><td colspan="6" style="padding:28px;text-align:center;color:#94a3b8;">Nenhum movimento importado. Envie o OFX do banco ou cole o extrato acima.</td></tr>';
    return;
  }

  tb.innerHTML = CONC_ITENS.map(function(m){
    var cor = m.valor >= 0 ? "#059669" : "#dc2626";
    var badge, acoes;

    if (m.status === "CONCILIADO") {
      badge = "background:#dcfce7;color:#166534";
      acoes = '<button class="btn btn-outline btn-sm" onclick="finConciliacaoDesfazer(\'' + esc(m.id) + '\')">Desfazer</button>';
    } else if (m.status === "IGNORADO") {
      badge = "background:#f1f5f9;color:#64748b";
      acoes = '<button class="btn btn-outline btn-sm" onclick="finConciliacaoDesfazer(\'' + esc(m.id) + '\')">Reabrir</button>';
    } else {
      badge = "background:#fef3c7;color:#92400e";
      acoes =
        '<button class="btn btn-navy btn-sm" onclick="finConciliacaoAbrirVinculo(\'' + esc(m.id) + '\')">Conciliar</button> ' +
        '<button class="btn btn-outline btn-sm" onclick="finConciliacaoIgnorar(\'' + esc(m.id) + '\')">Ignorar</button>';
    }

    var vinculo = m.idDespesa
      ? '<div style="font-size:10px;color:#1565C0;margin-top:2px;">vinculado a ' + esc(m.idDespesa) + '</div>' : '';

    return '<tr style="border-bottom:1px solid #f1f5f9;">' +
      '<td style="padding:11px 12px;font-size:12px;">' + esc(dataBR(m.data)) + '</td>' +
      '<td style="padding:11px 12px;font-size:12px;"><strong>' + esc(m.descricao) + '</strong>' +
        '<div style="margin-top:4px;display:inline-flex;border-radius:999px;padding:2px 8px;font-size:10px;font-weight:800;' + badge + '">' + esc(m.status) + '</div>' +
        (m.origem === "OFX" ? '<span style="margin-left:6px;font-size:9.5px;color:#94a3b8;">OFX</span>' : '') + vinculo + '</td>' +
      '<td style="padding:11px 12px;font-size:12px;">' + esc(m.tipo) + '</td>' +
      '<td style="padding:11px 12px;font-size:12px;font-weight:900;color:' + cor + ';">' + money(m.valor) + '</td>' +
      '<td style="padding:11px 12px;font-size:12px;">' + esc(m.sugestao || "—") +
        '<div style="font-size:10px;color:#94a3b8;margin-top:2px;">confiança ' + (m.confianca||0) + '%</div></td>' +
      '<td style="padding:11px 12px;white-space:nowrap;">' + acoes + '</td>' +
    '</tr>';
  }).join("");
};

window.finConciliacaoCarregar = function(){
  google.script.run
    .withSuccessHandler(function(r){
      CONC_ITENS = (r && r.itens) || [];
      finConciliacaoRender();
    })
    .withFailureHandler(function(err){
      CONC_ITENS = [];
      finConciliacaoRender();
      aviso("Não foi possível carregar a conciliação: " + ((err&&err.message)||err) + ". Se sua sessão expirou, entre novamente.", "erro");
    })
    .conc_listar(tokenSessao());

  google.script.run
    .withSuccessHandler(function(l){ CONC_DESPESAS = Array.isArray(l) ? l : []; })
    .withFailureHandler(function(){ CONC_DESPESAS = []; })
    .conc_despesasEmAberto(tokenSessao());
};

/* ─────────── IMPORTAÇÃO ─────────── */
function importar(conteudo){
  if (CONC_OCUPADO) return;
  if (!String(conteudo||"").trim()) { aviso("Cole o extrato ou selecione um arquivo OFX antes de analisar."); return; }
  CONC_OCUPADO = true;
  aviso("Lendo o extrato...");

  google.script.run
    .withSuccessHandler(function(r){
      CONC_OCUPADO = false;
      if (!r || !r.ok) { aviso((r && r.mensagem) || "Não foi possível importar.", "erro"); return; }
      aviso(r.mensagem + (r.formato === "OFX" ? "" : " · Extrato lido como texto: se o banco oferecer OFX, prefira — a leitura é bem mais confiável."));
      if (g("finConcTexto")) g("finConcTexto").value = "";
      finConciliacaoCarregar();
    })
    .withFailureHandler(function(err){
      CONC_OCUPADO = false;
      aviso("Erro ao importar: " + ((err&&err.message)||err), "erro");
    })
    .conc_importarExtrato({ conteudo: conteudo }, tokenSessao());
}

window.finConciliacaoProcessar = function(){
  importar((g("finConcTexto")||{}).value || "");
};

window.finConciliacaoLimpar = function(){
  if (g("finConcTexto")) g("finConcTexto").value = "";
  aviso("");
};

window.finConciliacaoExemplo = function(){
  if (g("finConcTexto")) {
    g("finConcTexto").value =
      "01/07/2026 PIX RECEBIDO ESCOLA ACALANTO KIDS 1.250,00\n" +
      "01/07/2026 TARIFA MANUTENCAO CONTA -69,90\n" +
      "02/07/2026 PAGAMENTO ENERGIA EDP -485,30\n" +
      "03/07/2026 PIX ENVIADO CONTABILIDADE SILVA -1.200,00";
  }
  aviso("Exemplo carregado. Clique em \"Analisar extrato\" para importar.");
};

/* ─────────── AÇÕES ─────────── */
window.finConciliacaoAbrirVinculo = function(id){
  var m = CONC_ITENS.filter(function(x){ return x.id === id; })[0];
  if (!m) return;

  /* Sugestão com confiança alta: confirma direto, sem obrigar a escolher na
     lista. Abaixo disso, o operador precisa dizer a qual despesa pertence. */
  if (m.idDespesa && m.confianca >= 70) {
    if (!window.confirm("Conciliar este movimento com a despesa sugerida?\n\n" + m.sugestao +
        "\n\nMarcar a despesa como PAGA também?\n\nOK = concilia e dá baixa · Cancelar = só concilia")) {
      return finConciliacaoConfirmar(id, m.idDespesa, false);
    }
    return finConciliacaoConfirmar(id, m.idDespesa, true);
  }

  var candidatas = CONC_DESPESAS.filter(function(d){
    return Math.abs(Math.abs(d.valor) - Math.abs(m.valor)) < 0.02;
  });
  var lista = (candidatas.length ? candidatas : CONC_DESPESAS).slice(0, 30);

  if (!lista.length) {
    if (window.confirm("Não há despesa em aberto para vincular.\n\nMarcar este movimento como conciliado mesmo assim, sem vínculo?"))
      finConciliacaoConfirmar(id, "", false);
    return;
  }

  var texto = "A qual despesa este movimento corresponde?\n\n" +
    lista.map(function(d,i){ return (i+1) + ") " + d.nome + " — " + money(d.valor) + (d.vencimento ? " — venc " + d.vencimento : ""); }).join("\n") +
    "\n\nDigite o número (ou deixe vazio para conciliar sem vínculo):";

  var escolha = window.prompt(texto, "");
  if (escolha === null) return;
  escolha = String(escolha).trim();

  if (!escolha) return finConciliacaoConfirmar(id, "", false);
  var idx = parseInt(escolha, 10) - 1;
  if (isNaN(idx) || idx < 0 || idx >= lista.length) { aviso("Número inválido.", "erro"); return; }

  var d = lista[idx];
  var baixa = window.confirm("Marcar \"" + d.nome + "\" como PAGA?\n\nOK = concilia e dá baixa · Cancelar = só concilia");
  finConciliacaoConfirmar(id, d.idDespesa, baixa);
};

window.finConciliacaoConfirmar = function(id, idDespesa, darBaixa){
  if (CONC_OCUPADO) return;
  CONC_OCUPADO = true;
  google.script.run
    .withSuccessHandler(function(r){
      CONC_OCUPADO = false;
      aviso((r && r.mensagem) || "Concluído.", (r && r.ok) ? "info" : "erro");
      if (r && r.ok) {
        finConciliacaoCarregar();
        /* A baixa muda a lista de despesas: recarrega para o painel não ficar
           mostrando como em aberto algo que acabou de ser pago. */
        if (darBaixa && typeof window.carregarLista === "function") window.carregarLista();
      }
    })
    .withFailureHandler(function(err){
      CONC_OCUPADO = false;
      aviso("Erro ao conciliar: " + ((err&&err.message)||err), "erro");
    })
    .conc_conciliar({ id:id, idDespesa:idDespesa||"", darBaixa:!!darBaixa }, tokenSessao());
};

window.finConciliacaoIgnorar = function(id){
  var obs = window.prompt("Ignorar este movimento. Motivo (opcional):", "");
  if (obs === null) return;
  google.script.run
    .withSuccessHandler(function(r){ aviso((r&&r.mensagem)||"", (r&&r.ok)?"info":"erro"); if(r&&r.ok) finConciliacaoCarregar(); })
    .withFailureHandler(function(err){ aviso("Erro: " + ((err&&err.message)||err), "erro"); })
    .conc_ignorar({ id:id, observacao:obs }, tokenSessao());
};

window.finConciliacaoDesfazer = function(id){
  if (!window.confirm("Desfazer a conciliação deste movimento?")) return;
  google.script.run
    .withSuccessHandler(function(r){ aviso((r&&r.mensagem)||"", (r&&r.ok)?"info":"erro"); if(r&&r.ok) finConciliacaoCarregar(); })
    .withFailureHandler(function(err){ aviso("Erro: " + ((err&&err.message)||err), "erro"); })
    .conc_desfazer({ id:id }, tokenSessao());
};

/* Conciliação em lote das sugestões de alta confiança. Nunca dá baixa
   automática: marcar despesa como paga é decisão que exige uma pessoa. */
window.finConciliacaoConciliarAuto = function(){
  var alvos = CONC_ITENS.filter(function(m){ return m.status === "PENDENTE" && m.confianca >= 70 && m.idDespesa; });
  if (!alvos.length) { aviso("Nenhuma sugestão com confiança suficiente para conciliar em lote."); return; }
  if (!window.confirm("Conciliar " + alvos.length + " movimento(s) com sugestão de alta confiança?\n\nA baixa das despesas NÃO será feita automaticamente — só o vínculo.")) return;

  var fila = alvos.slice(), ok = 0;
  (function prox(){
    if (!fila.length) { aviso(ok + " movimento(s) conciliado(s)."); finConciliacaoCarregar(); return; }
    var m = fila.shift();
    google.script.run
      .withSuccessHandler(function(r){ if (r && r.ok) ok++; prox(); })
      .withFailureHandler(function(){ prox(); })
      .conc_conciliar({ id:m.id, idDespesa:m.idDespesa, darBaixa:false }, tokenSessao());
  })();
};

window.finConciliacaoExportar = function(){
  if (!CONC_ITENS.length) { aviso("Nada para exportar."); return; }
  var cab = ["Data","Descricao","Tipo","Valor","Sugestao","Confianca","Status","IdDespesa","ConciliadoPor","DataConciliacao","Origem","FITID"];
  var linhas = [cab].concat(CONC_ITENS.map(function(m){
    return [dataBR(m.data), m.descricao, m.tipo, Number(m.valor||0).toFixed(2),
            m.sugestao, m.confianca, m.status, m.idDespesa, m.conciliadoPor, m.dataConciliacao, m.origem, m.fitid];
  }));
  var csv = linhas.map(function(l){
    return l.map(function(c){ return '"' + String(c==null?"":c).replace(/"/g,'""') + '"'; }).join(";");
  }).join("\n");
  var a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["﻿"+csv], {type:"text/csv;charset=utf-8"}));
  a.download = "sisgep-conciliacao-bancaria.csv";
  a.click();
  URL.revokeObjectURL(a.href);
};

/* ─────────── INIT ─────────── */
window.finConciliacaoInit = function(){
  finConciliacaoCarregar();
  var file = g("finConcArquivo");
  if (file && !file.dataset.conciliacaoBound) {
    file.dataset.conciliacaoBound = "1";
    file.addEventListener("change", function(){
      var f = file.files && file.files[0];
      if (!f) return;
      if (/\.pdf$/i.test(f.name)) {
        aviso("PDF não é lido diretamente. No internet banking, exporte o extrato em OFX — é o formato que o sistema entende melhor e que evita lançamento duplicado.", "erro");
        file.value = "";
        return;
      }
      var r = new FileReader();
      r.onload = function(){ importar(String(r.result||"")); file.value = ""; };
      r.onerror = function(){ aviso("Não foi possível ler o arquivo.", "erro"); };
      r.readAsText(f, "utf-8");
    });
  }
};

if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", function(){ setTimeout(finConciliacaoInit,150); });
else setTimeout(finConciliacaoInit, 150);

})();
</script>
