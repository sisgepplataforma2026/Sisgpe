<div id="radioPage" style="max-width:920px;margin:0 auto;padding:24px 24px 40px;">
  <style>
    #radioPage *{box-sizing:border-box;}
    #radioPage .rp-hero{
      width:100%;
      max-height:280px;
      object-fit:cover;
      object-position:center 35%;
      border-radius:16px;
      display:block;
      box-shadow:var(--sh-md,0 8px 24px rgba(0,20,60,.12));
    }

    #radioPage .rp-card{
      background:#fff;
      border:1px solid var(--g200,#e2e8f0);
      border-radius:14px;
      box-shadow:var(--sh-sm,0 2px 10px rgba(0,20,60,.06));
      padding:22px 24px;
      margin-top:-40px;
      position:relative;
      display:flex;
      align-items:center;
      gap:20px;
      flex-wrap:wrap;
    }

    #radioPage .rp-id{flex:1;min-width:220px;}
    #radioPage .rp-id strong{display:block;font-size:17px;font-weight:900;color:var(--navy,#001f4d);}
    #radioPage .rp-id span{display:block;font-size:12.5px;color:var(--g500,#64748b);margin-top:2px;}
    #radioPage .rp-status{display:flex;align-items:center;gap:7px;margin-top:10px;font-size:12.5px;font-weight:700;color:var(--g500,#64748b);}
    #radioPage .spRadioDot{width:9px;height:9px;}

    #radioPage .rp-wave{display:flex;align-items:center;justify-content:center;gap:3px;height:34px;margin:10px 0 0;}
    #radioPage .rp-bar{width:3px;background:linear-gradient(180deg,var(--gold,#C9A84C),var(--blue,#1565C0));border-radius:2px;transform:scaleY(.35);opacity:.4;transition:transform .2s,opacity .2s;}
    #radioPage .spRadioWave.tocando .rp-bar{animation:rpWave 1.2s ease-in-out infinite;}
    #radioPage .rp-bar:nth-child(1){animation-delay:0s;} #radioPage .rp-bar:nth-child(2){animation-delay:.1s;}
    #radioPage .rp-bar:nth-child(3){animation-delay:.2s;} #radioPage .rp-bar:nth-child(4){animation-delay:.3s;}
    #radioPage .rp-bar:nth-child(5){animation-delay:.4s;} #radioPage .rp-bar:nth-child(6){animation-delay:.5s;}
    #radioPage .rp-bar:nth-child(7){animation-delay:.6s;} #radioPage .rp-bar:nth-child(8){animation-delay:.7s;}
    #radioPage .rp-bar:nth-child(9){animation-delay:.8s;} #radioPage .rp-bar:nth-child(10){animation-delay:.9s;}
    #radioPage .rp-bar:nth-child(11){animation-delay:1s;} #radioPage .rp-bar:nth-child(12){animation-delay:1.1s;}
    @keyframes rpWave{0%,100%{transform:scaleY(.5);opacity:.55;}50%{transform:scaleY(1);opacity:1;}}

    #radioPage .rp-ctrls{display:flex;align-items:center;gap:10px;flex-shrink:0;}
    #radioPage .rp-playbtn{
      width:60px;height:60px;border-radius:50%;
      background:linear-gradient(135deg,var(--navy,#001f4d),var(--blue,#1565C0));
      border:none;color:#fff;cursor:pointer;
      display:flex;align-items:center;justify-content:center;font-size:22px;
      box-shadow:0 8px 18px rgba(21,101,192,.35);
      transition:transform .15s;
    }
    #radioPage .rp-playbtn:hover{transform:scale(1.05);}
    #radioPage .rp-mutebtn{
      width:40px;height:40px;border-radius:50%;border:1px solid var(--g200,#e2e8f0);
      background:#f8fafc;color:var(--g500,#64748b);cursor:pointer;font-size:15px;
      display:flex;align-items:center;justify-content:center;
    }
    #radioPage .rp-mutebtn:hover{color:var(--navy,#001f4d);}
    #radioPage .rp-mutebtn.muted{color:#dc2626;border-color:#fca5a5;background:#fef2f2;}

    #radioPage .rp-pillars{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:22px;}
    #radioPage .rp-pillar{background:#fff;border:1px solid var(--g200,#e2e8f0);border-radius:14px;padding:16px 14px;text-align:center;box-shadow:var(--sh-sm,0 2px 10px rgba(0,20,60,.06));}
    #radioPage .rp-pillar i{font-size:19px;color:var(--blue,#1565C0);}
    #radioPage .rp-pillar div{font-size:12px;font-weight:800;color:var(--navy,#001f4d);margin-top:8px;line-height:1.3;}
    @media(max-width:760px){#radioPage .rp-pillars{grid-template-columns:repeat(2,1fr);}}

    #radioPage .rp-foot{margin-top:20px;font-size:12px;color:var(--g500,#64748b);text-align:center;}
    #radioPage .rp-foot a{color:var(--blue,#1565C0);font-weight:700;text-decoration:none;}
    #radioPage .rp-foot a:hover{text-decoration:underline;}
  </style>

  <img class="rp-hero" src="https://lh3.googleusercontent.com/d/1T2AzStGL_Fv8zrmQ9gFJnD87teNuvbkQ" alt="Rádio SindEducação — Escute agora a Rádio Online">

  <div class="rp-card">
    <div class="rp-id">
      <strong>Rádio SindEducação</strong>
      <span>Somos Todos Educadores</span>
      <div class="rp-status">
        <span class="spRadioDot"></span>
        <span class="spRadioStatusTxt">Parado</span>
      </div>
      <div class="rp-wave spRadioWave">
        <div class="rp-bar" style="height:14px"></div><div class="rp-bar" style="height:24px"></div>
        <div class="rp-bar" style="height:18px"></div><div class="rp-bar" style="height:30px"></div>
        <div class="rp-bar" style="height:20px"></div><div class="rp-bar" style="height:32px"></div>
        <div class="rp-bar" style="height:18px"></div><div class="rp-bar" style="height:24px"></div>
        <div class="rp-bar" style="height:14px"></div><div class="rp-bar" style="height:20px"></div>
        <div class="rp-bar" style="height:28px"></div><div class="rp-bar" style="height:18px"></div>
      </div>
    </div>
    <div class="rp-ctrls">
      <button type="button" class="rp-playbtn" onclick="spRadioToggle()" title="Tocar/pausar Rádio SindEducação">
        <i class="fas fa-play spRadioPlayIcon"></i>
      </button>
      <button type="button" class="rp-mutebtn spRadioMuteBtn" onclick="spRadioMute()" title="Mudo">
        <i class="fas fa-volume-up spRadioVolIcon"></i>
      </button>
    </div>
  </div>

  <div class="rp-pillars">
    <div class="rp-pillar"><i class="fas fa-microphone-alt"></i><div>Informação com qualidade</div></div>
    <div class="rp-pillar"><i class="fas fa-headphones-alt"></i><div>Conteúdos educativos</div></div>
    <div class="rp-pillar"><i class="fas fa-music"></i><div>Música e cultura</div></div>
    <div class="rp-pillar"><i class="fas fa-users"></i><div>Valorização dos educadores</div></div>
  </div>

  <div class="rp-foot">
    Transmissão ao vivo do SindEducação-ES. Prefere ouvir pelo site oficial?
    <a href="https://sindeducacao.com.br/radioonline/" target="_blank" rel="noopener">sindeducacao.com.br/radioonline</a>
  </div>
</div>
