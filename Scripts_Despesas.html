<script>
// Scripts_Despesas.html — SISGEP · Módulo Despesas v3
(function(){
  "use strict";

  var todasDespesas = [];
  var despesasFiltradas = [];
  var paginaAtual = 1;
  var itensPorPagina = 15;
  var despesasLote = [];
  var _idModalAtivo = "";
  var _fornecedores = [];
  var _fornSelecionado = null;
  var _uploadArquivos = [];
  var _acItemFocado = -1;
  var _bannerDismissed = false;

  /* ═══ HELPERS ═══ */
  function g(id){ return document.getElementById(id); }
  function escHtml(s){ return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
  function normText(v){ return String(v||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim(); }
  function val(id){ var el=g(id); return el?el.value.trim():""; }
  function setText(id,v){ var el=g(id); if(el) el.textContent=v||"0"; }

  function mascaraValor(el){
    var v=String(el.value||"").replace(/\D/g,"");
    if(!v){ el.value=""; return; }
    v=(parseInt(v,10)/100).toFixed(2).replace(".",",").replace(/\B(?=(\d{3})+(?!\d))/g,".");
    el.value="R$ "+v;
  }

  function showToast(msg, tipo){
    var container = g("toast-inline");
    if(!container){
      container = document.createElement("div");
      container.id = "toast-inline";
      container.style.cssText = "margin:0 0 8px;";
      var tabLista = g("tab-lista");
      if(tabLista) tabLista.insertBefore(container, tabLista.firstChild);
      else { var main = document.querySelector(".desp-main"); if(main) main.insertBefore(container, main.firstChild); }
    }
    var cfg = {
      success: { bg:"#d1fae5", border:"#6ee7b7", color:"#065f46", ico:"✅" },
      error:   { bg:"#fee2e2", border:"#fca5a5", color:"#9f1239", ico:"❌" },
      "":      { bg:"#eff6ff", border:"#93c5fd", color:"#1d4ed8", ico:"ℹ️" }
    };
    var c = cfg[tipo||""] || cfg[""];
    container.innerHTML =
      '<div style="background:'+c.bg+';border:1px solid '+c.border+';color:'+c.color+';border-radius:10px;padding:12px 16px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:8px;">' +
      c.ico+' '+escHtml(msg)+
      '<button onclick="this.parentElement.parentElement.innerHTML=\'\'" style="margin-left:auto;background:none;border:none;cursor:pointer;font-size:16px;opacity:.5;color:inherit;">✕</button>' +
      '</div>';
    container.scrollIntoView({behavior:"smooth", block:"nearest"});
    setTimeout(function(){ if(container) container.innerHTML=""; }, 6000);
  }

  function definirDataHoje(id){
    var hoje=new Date(); var pad=function(n){return n<10?"0"+n:n;};
    var el=g(id); if(el) el.value=hoje.getFullYear()+"-"+pad(hoje.getMonth()+1)+"-"+pad(hoje.getDate());
  }

  function formatarTelefone(v){
    var f=String(v||"").replace(/\D/g,"");
    if(!f) return "";
    if(f.length===11) return "("+f.slice(0,2)+") "+f.slice(2,7)+"-"+f.slice(7);
    if(f.length===10) return "("+f.slice(0,2)+") "+f.slice(2,6)+"-"+f.slice(6);
    return v;
  }

  /* ═══ TABS ═══ */
  function mudarTab(nome){
    document.querySelectorAll(".tab-btn").forEach(function(b){ b.classList.remove("active"); });
    document.querySelectorAll(".tab-panel").forEach(function(p){ p.classList.remove("active"); });
    var painel=g("tab-"+nome); if(painel) painel.classList.add("active");
    document.querySelectorAll(".tab-btn[data-tab='"+nome+"']").forEach(function(b){ b.classList.add("active"); });
    if(nome==="lista" && !todasDespesas.length) carregarLista();
    if(nome==="lote") carregarLote();
    if(nome==="dashboard"){
      _bannerDismissed = false;
      if(g("dashboard-content") && g("dashboard-content").style.display==="none") carregarDashboard();
    }
    if(nome==="nova") carregarFornecedoresCache();
    if(nome==="conciliacao" && typeof window.finConciliacaoInit==="function") window.finConciliacaoInit();
  }

  /* ═══ DASHBOARD ═══ */
  function carregarDashboard(){
    var loader=g("dashboard-loader"); var content=g("dashboard-content");
    if(loader) loader.style.display="flex";
    if(content) content.style.display="none";
    google.script.run
      .withSuccessHandler(onDashboard)
      .withFailureHandler(function(e){ if(loader) loader.style.display="none"; showToast("Erro: "+e.message,"error"); })
      .obterResumoDespesas();
  }

  function onDashboard(resp){
    var loader=g("dashboard-loader"); if(loader) loader.style.display="none";
    if(!resp||!resp.ok){ showToast("Erro ao carregar resumo.","error"); return; }
    var r=resp.resumo;
    setText("s-total",r.total); setText("s-valor-total",r.valorTotalFmt);
    setText("s-vencidas",r.totalVencidas); setText("s-urgentes",r.totalUrgentes);
    setText("s-doc",r.totalDocRecebido); setText("s-contab",r.totalEnviadosContab);
    setText("s-pagos",r.totalPagos); setText("s-valor-pago",r.valorPagoFmt);
    var totalPend=(r.totalPendentes||0)+(r.totalAguardandoDoc||0)+(r.totalDocRecebido||0);
    var bPend=g("badge-pendentes"); if(bPend){ bPend.textContent=totalPend; bPend.style.display=totalPend>0?"inline":"none"; }
    var bLote=g("badge-lote"); if(bLote){ bLote.textContent=r.totalDocRecebido; bLote.style.display=r.totalDocRecebido>0?"inline":"none"; }
    var tbody=g("tabela-categorias");
    if(tbody){
      tbody.innerHTML="";
      var fmt=function(v){ return "R$ "+Number(v||0).toFixed(2).replace(".",","); };
      var cats=r.porCategoria||{}; var keys=Object.keys(cats);
      if(!keys.length) tbody.innerHTML='<tr><td colspan="3" style="text-align:center;color:#94a3b8;padding:24px;">Sem dados</td></tr>';
      else keys.sort().forEach(function(cat){ var d=cats[cat]; tbody.innerHTML+='<tr><td style="font-weight:600;">'+escHtml(cat)+'</td><td>'+d.qtd+'</td><td>'+fmt(d.valor)+'</td></tr>'; });
    }
    var content=g("dashboard-content"); if(content) content.style.display="block";

    var banner=g("banner-alerta-vencidas");
    var cardVencidas=g("card-vencidas");
    var qtdV=r.totalVencidas||0;
    if(banner){
      if(qtdV>0 && !_bannerDismissed){
        banner.style.display="flex";
        var bTxt=g("banner-alerta-txt");
        if(bTxt) bTxt.textContent="Atenção: "+qtdV+" despesa(s) vencida(s) aguardando providência!";
        if(cardVencidas) cardVencidas.classList.add("alerta-vencido");
      } else {
        banner.style.display="none";
        if(cardVencidas) cardVencidas.classList.remove("alerta-vencido");
      }
    }

    var cardContab=g("card-contab");
    var subContab=g("s-contab-sub");
    if(cardContab&&subContab){
      var totalConfirm=r.totalConfirmadosContab||0;
      var totalContab=r.totalEnviadosContab||0;
      if(totalConfirm>0){
        subContab.innerHTML='<span class="badge-confirmado">✅ '+totalConfirm+' confirmada(s) pela contabilidade</span>';
        cardContab.style.borderColor="rgba(5,150,105,.3)";
      } else if(totalContab>0){
        subContab.innerHTML='<span class="badge-aguard-confirm">⏳ '+totalContab+' aguardando confirmação</span>';
        cardContab.style.borderColor="";
      } else {
        subContab.textContent="Aguardando confirmação";
        cardContab.style.borderColor="";
      }
    }
  }

  function dispensarBanner() {
    _bannerDismissed = true;
    var banner = g("banner-alerta-vencidas");
    if(banner) banner.style.display = "none";
  }

  /* ═══ LISTA ═══ */
  function carregarLista(){
    var loader=g("lista-loader"); var content=g("lista-content"); var vazia=g("lista-vazia");
    if(loader) loader.style.display="flex";
    if(content) content.style.display="none";
    if(vazia) vazia.style.display="none";
    google.script.run
      .withSuccessHandler(function(resp){
        if(loader) loader.style.display="none";
        if(!resp||!resp.ok){ showToast("Erro ao carregar.","error"); return; }
        todasDespesas = resp.lista||[];
        window.todasDespesas = todasDespesas;
        paginaAtual=1; aplicarFiltros();
      })
      .withFailureHandler(function(e){ if(loader) loader.style.display="none"; showToast("Erro: "+e.message,"error"); })
      .listarDespesas({});
  }

  function aplicarFiltros(){
    var sc=g("f-status-chip"), vc=g("f-venc-chip");
    var busca=normText(val("f-busca")),
        status=sc?sc.value:val("f-status"),
        categoria=val("f-categoria"),
        tipo=val("f-tipo"),
        venc=vc?vc.value:val("f-venc");
    var mesSel=val("f-mes"), anoSel=val("f-ano");
    despesasFiltradas=todasDespesas.filter(function(d){
      if(status && d.status!==status) return false;
      if(categoria && normText(d.categoria)!==normText(categoria)) return false;
      if(tipo && (d.tipoLancamento||"recorrente")!==tipo) return false;
      if(venc && d.statusVencimento!==venc) return false;
      if(mesSel||anoSel){
        var p=(d.dataVencimentoBR||"").split("/");
        if(p.length!==3) return false;
        if(mesSel && p[1]!==mesSel) return false;
        if(anoSel && p[2]!==anoSel) return false;
      }
      if(busca){ var txt=normText([d.prestadorNome,d.descricao,d.numeroDespesa,d.categoria].join(" ")); if(txt.indexOf(busca)===-1) return false; }
      return true;
    });

    var iniVal=val("f-data-ini");
    var fimVal=val("f-data-fim");
    if(iniVal||fimVal){
      var _parseBR=function(br){
        if(!br) return null;
        var p=br.split("/");
        if(p.length===3) return new Date(parseInt(p[2]),parseInt(p[1])-1,parseInt(p[0]));
        return null;
      };
      var _parseISO=function(s){
        if(!s) return null;
        var p=s.split("-");
        return new Date(parseInt(p[0]),parseInt(p[1])-1,parseInt(p[2]));
      };
      var dtIni=_parseISO(iniVal);
      var dtFim=_parseISO(fimVal);
      if(dtFim) dtFim.setHours(23,59,59,999);
      despesasFiltradas=despesasFiltradas.filter(function(d){
        var dv=_parseBR(d.dataVencimentoBR);
        if(!dv) return false;
        if(dtIni&&dv<dtIni) return false;
        if(dtFim&&dv>dtFim) return false;
        return true;
      });
    }

    paginaAtual=1; renderLista();
    atualizarSummaryBar();
  }

  function limparFiltros(){
    ["f-busca","f-status","f-categoria","f-tipo","f-venc","f-status-chip","f-venc-chip","f-data-ini","f-data-fim","f-mes","f-ano"].forEach(function(id){ var el=g(id); if(el) el.value=""; });
    document.querySelectorAll("#chips-status .chip").forEach(function(c,i){ c.className="chip"+(i===0?" ativo":""); });
    document.querySelectorAll("#chips-venc .chip").forEach(function(c,i){ c.className="chip"+(i===0?" ativo":""); });
    document.querySelectorAll(".chip-periodo").forEach(function(c,i){ c.classList.toggle("ativo",i===0); });
    var bl=g("btn-limpar-filtros"); if(bl) bl.style.display="none";
    aplicarFiltros();
  }

  function renderLista(){
    var tbody=g("tbody-lista"); if(!tbody) return;
    if(!despesasFiltradas.length){
      var c=g("lista-content"),v=g("lista-vazia"),p=g("paginacao");
      if(c) c.style.display="none"; if(v) v.style.display="flex"; if(p) p.style.display="none"; return;
    }
    var vazia=g("lista-vazia"),content=g("lista-content");
    if(vazia) vazia.style.display="none"; if(content) content.style.display="block";
    var total=despesasFiltradas.length, totalPag=Math.ceil(total/itensPorPagina);
    if(paginaAtual>totalPag) paginaAtual=totalPag;
    var inicio=(paginaAtual-1)*itensPorPagina;
    var pagina=despesasFiltradas.slice(inicio,inicio+itensPorPagina);
    window._despPagina=pagina;

    tbody.innerHTML=pagina.map(function(d,idx){
      var badgeSt=badgeStatus(d.status);
      var badgeVe=badgeVenc(d.statusVencimento,d.status);
      var docLink=d.linkDocumento
        ? '<a href="'+escHtml(d.linkDocumento)+'" target="_blank" style="font-size:11px;color:#1565C0;font-weight:700;">📄 Ver</a>'
        : '<span style="font-size:11px;color:#94a3b8;">—</span>';
      var tipoTag=d.tipoLancamento==="avulso"
        ? '<span style="font-size:9.5px;background:#fef3c7;color:#92400e;border-radius:4px;padding:1px 5px;font-weight:700;margin-left:4px;">AVULSO</span>' : '';
      var historicoNF="";
      if(d.status==="AGUARDANDO_DOC" && d.dataAlertaD5){
        historicoNF='<div class="nome-hist">📨 Enviado '+escHtml(d.dataAlertaD5)+'</div>';
      }
      var badgeConfirm="";
      if(d.status==="ENVIADO_CONTABILIDADE"){
        if(d.dataConfirmacaoContab){
          badgeConfirm='<div style="margin-top:3px;"><span class="badge-confirmado" style="font-size:9.5px;">✅ Confirmado '+escHtml(d.dataConfirmacaoContab)+'</span></div>';
        } else {
          badgeConfirm='<div style="margin-top:3px;"><span class="badge-aguard-confirm" style="font-size:9.5px;">⏳ Aguard. confirmação</span></div>';
        }
      }
      var vencPct=0, vencCls="ok";
      if(d.statusVencimento==="VENCIDO"){ vencPct=100; vencCls="vencido"; }
      else if(d.statusVencimento==="URGENTE"){ vencPct=80; vencCls="urgente"; }
      else if(d.statusVencimento==="OK"){ vencPct=40; vencCls="ok"; }
      var rowCls="desp-row";
      if(d.status==="AGUARDANDO_DOC") rowCls+=" aguardando-nf";
      if(d.statusVencimento==="VENCIDO"&&d.status!=="PAGO"&&d.status!=="CANCELADO") rowCls+=" vencido";
      var acoes=montarAcoes(d,idx);
      return '<div class="'+rowCls+'">'+
        '<div><span class="num-pill">'+escHtml((d.numeroDespesa||"—").replace("/2026",""))+'</span></div>'+
        '<div>'+
          '<div class="nome-txt" title="'+escHtml(d.prestadorNome)+'">'+escHtml(d.prestadorNome)+tipoTag+'</div>'+
          '<div class="nome-cat">'+escHtml(d.categoria||"")+'</div>'+
          historicoNF+
          badgeConfirm+
        '</div>'+
        '<div>'+(d.valor&&d.valor!=="variável"?'<span class="valor-txt">'+escHtml(d.valor)+'</span>':'<span class="valor-var">variável</span>')+'</div>'+
        '<div class="venc-col">'+
          '<div class="venc-data">'+escHtml(d.dataVencimentoBR||"—")+'</div>'+
          '<div class="venc-bar"><div class="venc-fill '+vencCls+'" style="width:'+vencPct+'%"></div></div>'+
          (badgeVe?'<div style="margin-top:2px">'+badgeVe+'</div>':'')+
        '</div>'+
        '<div>'+badgeSt+'</div>'+
        '<div>'+docLink+'</div>'+
        '<div><div class="acoes-cell">'+acoes+'</div></div>'+
      '</div>';
    }).join("");

    bindAcoes();
    renderPaginacao(total,totalPag);
  }

  function montarAcoes(d,idx){
    var acoes="", st=d.status;
    if(st==="PENDENTE"){
      acoes+='<button class="ac-btn ac-primary" data-acao="solicitar-nf" data-idx="'+idx+'">📨 Solicitar NF</button>';
    } else if(st==="AGUARDANDO_DOC"){
      acoes+='<button class="ac-btn ac-reenviar" data-acao="solicitar-nf" data-idx="'+idx+'">🔁 Reenviar NF</button>';
    }
    if(st==="DOC_RECEBIDO"){
      acoes+='<button class="ac-btn ac-amber" data-acao="anexar" data-idx="'+idx+'">📎 Ver Doc</button>';
    } else if(st!=="PAGO"&&st!=="CANCELADO"&&st!=="ENVIADO_CONTABILIDADE"){
      acoes+='<button class="ac-btn ac-amber" data-acao="anexar" data-idx="'+idx+'">📎 Anexar</button>';
    }
    if(st!=="PAGO"&&st!=="CANCELADO"&&st!=="ENVIADO_CONTABILIDADE"){
      acoes+='<button class="ac-btn ac-edit" data-acao="editar" data-idx="'+idx+'">✏️</button>';
    }
    if(st!=="PAGO"&&st!=="CANCELADO"&&st!=="ESTORNADO"){
      if(d.aprovadoParaPagamento){
        acoes+='<button class="ac-btn ac-green" data-acao="pago" data-idx="'+idx+'">✅ Pago</button>';
      } else {
        acoes+='<button class="ac-btn" data-acao="aprovar" data-idx="'+idx+'" style="height:26px;padding:0 9px;border-radius:7px;border:1.5px solid #fde68a;background:#fffbeb;color:#92400e;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap;font-family:\'Plus Jakarta Sans\',sans-serif;" title="Aprovar para pagamento">🔓 Aprovar</button>';
      }
    }
    if(st==="PAGO"){
      acoes+='<button class="ac-btn" data-acao="estornar" data-idx="'+idx+'" style="height:26px;padding:0 9px;border-radius:7px;border:1.5px solid #c4b5fd;background:#f5f3ff;color:#5b21b6;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap;font-family:\'Plus Jakarta Sans\',sans-serif;" title="Estornar pagamento">↩ Estornar</button>';
    }
    if(st==="PENDENTE"||st==="AGUARDANDO_DOC"||st==="CANCELADO"){
      acoes+='<button class="ac-btn ac-red" data-acao="excluir" data-idx="'+idx+'">🗑️</button>';
    } else if(st!=="PAGO"&&st!=="ENVIADO_CONTABILIDADE"&&st!=="ESTORNADO"){
      acoes+='<button class="ac-btn ac-red" data-acao="cancelar" data-idx="'+idx+'">✕</button>';
    }
    if(st!=="CANCELADO"){
      acoes+='<button class="ac-btn" data-acao="duplicar" data-idx="'+idx+'" style="height:26px;padding:0 9px;border-radius:7px;border:1.5px solid #a5b4fc;background:#f0f4ff;color:#4338ca;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap;font-family:\'Plus Jakarta Sans\',sans-serif;transition:all .12s;display:inline-flex;align-items:center;gap:3px;" title="Duplicar despesa">⎘</button>';
    }
    acoes+='<button class="ac-btn ac-hist" data-acao="historico" data-idx="'+idx+'" title="Ver histórico de alterações">🕓</button>';
    return acoes||'<span style="font-size:11px;color:#94a3b8;">—</span>';
  }

  function bindAcoes(){
    var tbody=g("tbody-lista"); if(!tbody) return;
    tbody.querySelectorAll("[data-acao]").forEach(function(btn){
      btn.addEventListener("click",function(){
        var acao=this.dataset.acao, idx=parseInt(this.dataset.idx,10), d=window._despPagina[idx];
        if(!d) return;
        if(acao==="solicitar-nf") abrirModalSolicitarNF(d);
        if(acao==="anexar")       abrirModalUpload(d.idDespesa,d.prestadorNome,d.valor);
        if(acao==="pago")         abrirModalPago(d.idDespesa,d.prestadorNome,d.valor);
        if(acao==="aprovar")      aprovarDespesaUI(d.idDespesa,d.prestadorNome);
        if(acao==="estornar")     abrirModalEstornar(d.idDespesa,d.prestadorNome);
        if(acao==="cancelar")     abrirModalCancelar(d.idDespesa,d.prestadorNome);
        if(acao==="editar")       abrirModalEditar(d);
        if(acao==="excluir")      abrirModalExcluir(d.idDespesa,d.prestadorNome,d.status);
        if(acao==="duplicar")     abrirModalDuplicar(d);
        if(acao==="historico")    abrirHistorico(d.idDespesa, d.numeroDespesa+" — "+d.prestadorNome);
      });
    });
  }

  function renderPaginacao(total,totalPag){
    var pag=g("paginacao"),info=g("paginacao-info"),btns=g("paginacao-btns");
    if(!pag) return;
    if(totalPag<=1){ pag.style.display="none"; return; }
    pag.style.display="flex";
    var ini=(paginaAtual-1)*itensPorPagina+1, fim=Math.min(paginaAtual*itensPorPagina,total);
    if(info) info.textContent="Mostrando "+ini+"–"+fim+" de "+total;
    var html='<button class="page-btn"'+(paginaAtual===1?' disabled':'')+' onclick="irPagina('+(paginaAtual-1)+')">← Ant.</button>';
    var st=Math.max(1,paginaAtual-2), en=Math.min(totalPag,st+4);
    for(var i=st;i<=en;i++) html+='<button class="page-btn'+(i===paginaAtual?' active':'')+'" onclick="irPagina('+i+')">'+i+'</button>';
    html+='<button class="page-btn"'+(paginaAtual===totalPag?' disabled':'')+' onclick="irPagina('+(paginaAtual+1)+')">Próx. →</button>';
    if(btns) btns.innerHTML=html;
  }

  function irPagina(pg){
    var tp=Math.ceil(despesasFiltradas.length/itensPorPagina);
    if(pg<1||pg>tp) return; paginaAtual=pg; renderLista();
  }

  /* ═══ SUMMARY BAR ═══ */
  function atualizarSummaryBar(){
    var lista = todasDespesas || [];
    var pendentes=0,vencidos=0,urgentes=0,doc=0,valorPend=0;
    lista.forEach(function(d){
      if(d.status!=="PAGO"&&d.status!=="CANCELADO"){
        if(d.status==="PENDENTE"||d.status==="AGUARDANDO_DOC") pendentes++;
        if(d.statusVencimento==="VENCIDO") vencidos++;
        if(d.statusVencimento==="URGENTE") urgentes++;
        if(d.status==="DOC_RECEBIDO") doc++;
        if(d.status!=="ENVIADO_CONTABILIDADE"){
          var v=parseFloat(String(d.valor||"").replace(/[^\d,]/g,"").replace(",","."));
          if(!isNaN(v)) valorPend+=v;
        }
      }
    });
    var se=function(id,v){ var el=g(id); if(el) el.textContent=v; };
    se("sum-pendentes", pendentes);
    se("sum-vencidos",  vencidos);

  function onBuscaFornKeydown(e){
    var dd=g("autocomplete-dropdown"); if(!dd||!dd.classList.contains("aberto")) return;

    if(e.key==="ArrowDown"){ e.preventDefault(); _acItemFocado=Math.min(_acItemFocado+1,items.length-1); atualizarFoco(items); }

  function confirmarUploadManual(){

    var pm=g("upload-progress-msg"); if(pm) pm.style.display="";

    });

  function onRelatorioRecebido(resp) {
    var loader=g("rel-loader"); if(loader) loader.style.display="none";
    if(!resp||!resp.ok){ showToast("Erro ao carregar dados.","error"); return; }
    var mes=val("rel-mes"),ano=val("rel-ano"),status=val("rel-status"),categoria=val("rel-categoria"),prestador=normText(val("rel-prestador"));
    _relDados=(resp.lista||[]).filter(function(d){
      if(mes||ano){
        var partes=(d.dataVencimentoBR||"").split("/");
        if(partes.length===3){ if(mes&&partes[1]!==mes) return false; if(ano&&partes[2]!==ano) return false; }
        else { if(mes||ano) return false; }
      }
      if(status&&d.status!==status) return false;
      if(categoria&&normText(d.categoria)!==normText(categoria)) return false;
      if(prestador&&normText(d.prestadorNome).indexOf(prestador)===-1) return false;
      return true;
    });
    var content=g("rel-content"),vazio=g("rel-vazio");
    if(!_relDados.length){ if(vazio) vazio.style.display="flex"; return; }
    if(content) content.style.display="block";
    var totalValor=0,totalPago=0,totalPend=0;
    _relDados.forEach(function(d){ var v=parseFloat(String(d.valor||"").replace(/[^\d,]/g,"").replace(",","."))||0; totalValor+=v; if(d.status==="PAGO") totalPago+=v; else if(d.status!=="CANCELADO") totalPend+=v; });

    var statusLabels={"PENDENTE":"⏸ Pendente","AGUARDANDO_DOC":"📨 Aguard. Doc","DOC_RECEBIDO":"📋 Doc Recebido","ENVIADO_CONTABILIDADE":"📤 Contabilidade","PAGO":"✅ Pago","CANCELADO":"✕ Cancelado"};
    var tbody=g("rel-tbody");

      var bg=i%2===0?"#fff":"#f8fafc";

    var csv="\uFEFF"+linhas.join("\n");
    var blob=new Blob([csv],{type:"text/csv;charset=utf-8;"}),url=URL.createObjectURL(blob),a=document.createElement("a");

  /* ═══ PERÍODO RÁPIDO ═══ */
  function selecionarPeriodo(btn, periodo) {
    document.querySelectorAll(".chip-periodo").forEach(function(c){ c.classList.remove("ativo"); });
    if(btn) btn.classList.add("ativo");
    var hoje=new Date(); hoje.setHours(0,0,0,0);
    var pad=function(n){ return n<10?"0"+n:n; };
    var fmt=function(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); };
    var ini=g("f-data-ini"), fim=g("f-data-fim");
    if(!ini||!fim) return;
    if(periodo==="")                 { ini.value=""; fim.value=""; }
    else if(periodo==="hoje")        { ini.value=fmt(hoje); fim.value=fmt(hoje); }
    else if(periodo==="semana")      { var fs=new Date(hoje); fs.setDate(hoje.getDate()+(6-hoje.getDay())); ini.value=fmt(hoje); fim.value=fmt(fs); }
    else if(periodo==="mes")         { ini.value=fmt(new Date(hoje.getFullYear(),hoje.getMonth(),1)); fim.value=fmt(new Date(hoje.getFullYear(),hoje.getMonth()+1,0)); }
    else if(periodo==="proximo-mes") { ini.value=fmt(new Date(hoje.getFullYear(),hoje.getMonth()+1,1)); fim.value=fmt(new Date(hoje.getFullYear(),hoje.getMonth()+2,0)); }
    aplicarFiltros();
  }

  /* ═══ DUPLICAR ═══ */
  function abrirModalDuplicar(d){
    _idModalAtivo=d.idDespesa;
    var info=g("painel-duplicar-info");
    if(info) info.innerHTML='Duplicar <strong>'+escHtml(d.numeroDespesa||"")+'</strong> — '+escHtml(d.prestadorNome)+' ('+escHtml(d.valor)+')';
    var vencInput=g("painel-duplicar-vencimento");
    if(vencInput&&d.dataVencimentoBR){
      var partes=d.dataVencimentoBR.split("/");
      if(partes.length===3){
        var dia=parseInt(partes[0],10),mes=parseInt(partes[1],10),ano=parseInt(partes[2],10);
        mes++;
        if(mes>12){ mes=1; ano++; }
        var ultimoDia=new Date(ano,mes,0).getDate(); dia=Math.min(dia,ultimoDia);
        var pad=function(n){ return n<10?"0"+n:n; };
        vencInput.value=ano+"-"+pad(mes)+"-"+pad(dia);
      }
    }
    abrirModal("painel-duplicar");
  }

    var partes=vencInput.value.split("-");

      .withSuccessHandler(function(resp){
        if(resp&&resp.ok){ showToast("⎘ Duplicada: "+(resp.numeroDespesa||""),"success"); todasDespesas=[]; window.todasDespesas=[]; carregarLista(); carregarDashboard(); }

      })

      .duplicarDespesa({ idDespesa:_idModalAtivo, novoVencimento:vencBR }, SISGEP_TOKEN_SESSAO);
  }

  /* ═══ AJUSTE RECORRÊNCIA ═══ */

    google.script.run
      .withSuccessHandler(function(resp){
        if(resp&&resp.ok){ var msg=resp.atualizadas>0?"✅ Valor atualizado. "+resp.atualizadas+" despesa(s) pendente(s) atualizada(s).":"✅ Cadastro atualizado. Nenhuma despesa pendente encontrada."; showToast(msg,"success"); if(resp.atualizadas>0){ todasDespesas=[]; window.todasDespesas=[]; } }
        else showToast("Erro: "+((resp&&resp.mensagem)||"Falha."),"error");
      })
      .withFailureHandler(function(e){ showToast("Erro: "+e.message,"error"); })
      .ajustarRecorrencia({ rowIndex:rowIndex, novoValor:novoValor, aplicarPendentes:aplicar });
  }

  /* ═══ CHIP SELECIONARR ═══ */
  function selecionarChip(btn, hiddenId) {
    var grupo = btn.closest(".chips-row");
    if(grupo) grupo.querySelectorAll(".chip").forEach(function(c){ c.className="chip"; });
    btn.classList.add("ativo");
    var hidden = document.getElementById(hiddenId);
    if(hidden) hidden.value = btn.dataset.val || "";
    if(typeof aplicarFiltros === "function") aplicarFiltros();
    var btnLimpar = document.getElementById("btn-limpar-filtros");
    if(btnLimpar){
      var busca=document.getElementById("f-busca"),cat=document.getElementById("f-categoria"),
          tipo=document.getElementById("f-tipo"),sc=document.getElementById("f-status-chip"),
          vc=document.getElementById("f-venc-chip");
      var tem=(busca&&busca.value)||(cat&&cat.value)||(tipo&&tipo.value)||(sc&&sc.value)||(vc&&vc.value);
      btnLimpar.style.display = tem ? "inline-flex" : "none";
    }
  }

  /* ═══ INIT ═══ */
  function carregarCentrosCustoEProjetos(){
    google.script.run
      .withSuccessHandler(function(resp){
        if(!resp||!resp.ok) return;
        var montarOpcoes=function(lista){ return (lista||[]).map(function(o){ return '<option value="'+escHtml(o.id)+'">'+escHtml(o.nome)+'</option>'; }).join(""); };
        var optsCC=montarOpcoes(resp.centrosCusto), optsProj=montarOpcoes(resp.projetos);
        if(g("n-centro-custo"))  g("n-centro-custo").innerHTML  = '<option value="">Sem centro de custo</option>'+optsCC;
        if(g("pe-centro-custo")) g("pe-centro-custo").innerHTML = '<option value="">Sem centro de custo</option>'+optsCC;
        if(g("n-projeto"))  g("n-projeto").innerHTML  = '<option value="">Sem projeto</option>'+optsProj;
        if(g("pe-projeto")) g("pe-projeto").innerHTML = '<option value="">Sem projeto</option>'+optsProj;
      })
      .withFailureHandler(function(){})
      .finListarCentrosCustoEProjetos(SISGEP_TOKEN_SESSAO);
  }

  function initDespesasAdmin(){
    if(!document.getElementById("secDespesas")) return;
    definirDataHoje("n-vencimento"); definirDataHoje("painel-data-pago");
    carregarDashboard(); carregarFornecedoresCache(); carregarCentrosCustoEProjetos();
    ["r-recorrente","r-avulso"].forEach(function(id){ var el=g(id); if(el) el.addEventListener("change",atualizarTipoLanc); });
    atualizarTipoLanc();
    var fileInput=g("painel-upload-file");
    if(fileInput){ fileInput.addEventListener("change",function(){ Array.from(this.files||[]).forEach(function(f){ if(f.size>10*1024*1024){ showToast(f.name+": excede 10MB.","error"); return; } var dup=_uploadArquivos.some(function(e){ return e.name===f.name&&e.size===f.size; }); if(!dup) _uploadArquivos.push(f); }); renderUploadList(); this.value=""; }); }
    var dz=g("upload-drop-zone");
    if(dz){ dz.addEventListener("dragover",function(e){ e.preventDefault(); dz.style.borderColor="#1565C0"; }); dz.addEventListener("dragleave",function(){ dz.style.borderColor="#93c5fd"; }); dz.addEventListener("drop",function(e){ e.preventDefault(); dz.style.borderColor="#93c5fd"; Array.from(e.dataTransfer.files||[]).forEach(function(f){ if(f.size>10*1024*1024){ showToast(f.name+": excede 10MB.","error"); return; } var dup=_uploadArquivos.some(function(e2){ return e2.name===f.name&&e2.size===f.size; }); if(!dup) _uploadArquivos.push(f); }); renderUploadList(); }); }
    document.addEventListener("click",function(e){ var dd=g("autocomplete-dropdown"),inp=g("n-busca-forn"); if(dd&&inp&&!dd.contains(e.target)&&e.target!==inp) fecharDropdown(); });
    console.log("✅ Módulo Despesas v4 inicializado!");
  }
