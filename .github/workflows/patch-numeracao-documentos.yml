name: Patch numeracao atomica de oficios

on:
  push:
    branches: ["correcao/documentos-numeracao-atomica"]
    paths: [".github/workflows/patch-numeracao-documentos.yml"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: correcao/documentos-numeracao-atomica
          fetch-depth: 0
      - name: Aplicar correcao
        shell: bash
        env:
          REPLACEMENT_B64: ""
        run: |
          python - <<'PY'
          import base64, os
          from pathlib import Path
          p = Path("Oficios.js")
          s = p.read_text(encoding="utf-8")
          start_marker = "/* ================= NUMERAÇÃO ================= */"
          end_marker = "/* ================= LOG SISTEMA ================= */"
          start = s.index(start_marker)
          end = s.index(end_marker, start)
          replacement = base64.b64decode(os.environ["REPLACEMENT_B64"]).decode("utf-8")
          out = s[:start] + replacement + s[end:]
          assert out.count("function gerarProximoNumeroSeguro()") == 1
          assert "OFICIOS_SEQUENCIA_" in out
          p.write_text(out, encoding="utf-8")
          PY
      - name: Validar e commitar
        shell: bash
        run: |
          set -euo pipefail
          node --check Oficios.js
          git diff --check
          test "$(git diff --name-only)" = "Oficios.js"
          grep -q 'setProperty(oficiosChaveSequencia_(ano), String(proximoNumero))' Oficios.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Oficios.js
          git commit -m "fix(documentos): reservar numero de oficio atomicamente"
          git push origin HEAD:correcao/documentos-numeracao-atomica
