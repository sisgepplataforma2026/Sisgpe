name: Patch referencias CCT em emails de oficios

on:
  push:
    branches: ["correcao/documentos-numeracao-atomica"]
    paths: [".github/workflows/patch-cct-email-oficios.yml"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: correcao/documentos-numeracao-atomica
          fetch-depth: 0
      - name: Atualizar referencias da CCT
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("EmailOficios.js")
          s = p.read_text(encoding="utf-8")
          antigo = "CCT 2025/2026"
          ocorrencias = s.count(antigo)
          if ocorrencias != 5:
              raise SystemExit(f"Esperadas 5 referencias antigas; encontradas {ocorrencias}")
          s = s.replace(antigo, "CCT 2026/2027")
          p.write_text(s, encoding="utf-8")
          PY
      - name: Validar e commitar
        shell: bash
        run: |
          set -euo pipefail
          node --check EmailOficios.js
          git diff --check
          test "$(git diff --name-only)" = "EmailOficios.js"
          test "$(grep -o 'CCT 2025/2026' EmailOficios.js | wc -l)" -eq 0
          test "$(grep -o 'Cláusula 56ª da CCT 2026/2027' EmailOficios.js | wc -l)" -eq 4
          test "$(grep -o 'Cláusula 57ª da CCT 2026/2027' EmailOficios.js | wc -l)" -eq 1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add EmailOficios.js
          git commit -m "fix(documentos): atualizar referencias da CCT nos emails"
          git push origin HEAD:correcao/documentos-numeracao-atomica
