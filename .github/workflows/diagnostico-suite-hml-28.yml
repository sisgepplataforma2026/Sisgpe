name: Diagnostico suite HML 28

on:
  push:
    branches:
      - correcao/suite-hml-28
    paths:
      - '.github/workflows/diagnostico-suite-hml-28.yml'
      - 'tests/**'
      - '*.gs'
      - '*.js'
      - '*.html'
      - 'package*.json'

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    env:
      TZ: America/Sao_Paulo
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencias
        run: npm ci

      - name: Compatibilidade com testes legados
        shell: bash
        run: |
          sudo mkdir -p /home/user
          sudo ln -sfn "$GITHUB_WORKSPACE" /home/user/Sisgpe

      - name: Executar suite e mostrar somente falhas
        shell: bash
        run: |
          set +e
          failed=0
          total=0
          failures=""
          while IFS= read -r f; do
            total=$((total + 1))
            node "$f" > /tmp/sisgep-test.log 2>&1
            code=$?
            if [ "$code" -ne 0 ]; then
              echo ""
              echo "SISGEP_FAIL::$f::exit=$code"
              echo "--- ultimas linhas ---"
              tail -n 50 /tmp/sisgep-test.log
              echo "----------------------"
              failures="${failures}${f}\n"
              failed=1
            fi
          done < <(find tests/e2e -maxdepth 1 -type f -name 't*.js' | sort -V)

          echo ""
          echo "SISGEP_TOTAL::$total"
          if [ "$failed" -eq 0 ]; then
            echo "SISGEP_SUITE::VERDE"
            exit 0
          fi

          echo "SISGEP_SUITE::VERMELHA"
          printf 'SISGEP_FAILURES::\n%b' "$failures"
          exit 1

      - name: Comparar superficie t6 com retrato versionado
        if: always()
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const cp = require('child_process');
          const path = 'tests/e2e/exposicao-detalhe.json';
          const anterior = JSON.parse(cp.execSync('git show HEAD:' + path, {encoding:'utf8'}));
          const atual = JSON.parse(fs.readFileSync(path, 'utf8'));
          const chave = x => x.arquivo + '::' + x.nome;
          const antes = new Set((anterior.expostas || []).map(chave));
          const agora = new Set((atual.expostas || []).map(chave));
          const novas = [...agora].filter(x => !antes.has(x)).sort();
          const removidas = [...antes].filter(x => !agora.has(x)).sort();
          console.log('SISGEP_EXPOSICAO_ANTES::' + antes.size);
          console.log('SISGEP_EXPOSICAO_AGORA::' + agora.size);
          console.log('SISGEP_EXPOSICAO_NOVAS::' + JSON.stringify(novas));
          console.log('SISGEP_EXPOSICAO_REMOVIDAS::' + JSON.stringify(removidas));
          NODE
