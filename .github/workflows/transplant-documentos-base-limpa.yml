name: Transplantar correcoes Documentos para base limpa

on:
  push:
    branches: ["correcao/documentos-numeracao-atomica"]
    paths: [".github/workflows/transplant-documentos-base-limpa.yml"]

permissions:
  contents: write

jobs:
  transplant:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout completo
        uses: actions/checkout@v4
        with:
          ref: auditoria/producao-limpa
          fetch-depth: 0

      - name: Criar branch limpa e trazer somente arquivos revisados
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin correcao/documentos-numeracao-atomica auditoria/producao-limpa
          git checkout -B correcao/documentos-ajustes-seguros origin/auditoria/producao-limpa

          git checkout origin/correcao/documentos-numeracao-atomica -- \
            AcessoModulos.js \
            DashboardOficios.js \
            DocumentosSeguranca.js \
            EmailOficios.js \
            MonitoramentoOficios.js \
            OficioService.js \
            Oficios.js \
            RastreamentoOficios.js

      - name: Validar sintaxe e escopo
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            AcessoModulos.js DashboardOficios.js DocumentosSeguranca.js \
            EmailOficios.js MonitoramentoOficios.js OficioService.js \
            Oficios.js RastreamentoOficios.js; do
            node --check "$f"
          done
          git diff --check origin/auditoria/producao-limpa --
          test "$(git diff --name-only origin/auditoria/producao-limpa -- | wc -l)" -eq 8

      - name: Commitar branch segura
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AcessoModulos.js DashboardOficios.js DocumentosSeguranca.js EmailOficios.js MonitoramentoOficios.js OficioService.js Oficios.js RastreamentoOficios.js
          git commit -m "fix(documentos): reaplicar correcoes sobre snapshot limpo de producao"
          git push -f -u origin correcao/documentos-ajustes-seguros
