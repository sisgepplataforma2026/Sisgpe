name: Portar ajustes Documentos para HML

on:
  push:
    branches: ["teste/documentos-ajustes-hml"]
    paths: [".github/workflows/portar-documentos-ajustes-hml.yml"]

permissions:
  contents: write

jobs:
  portar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: teste/documentos-ajustes-hml
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Portar correcoes sem substituir a homologacao
        shell: python
        run: |
          from pathlib import Path
          import re

          def ler(nome):
              return Path(nome).read_text(encoding="utf-8")
          def gravar(nome, texto):
              Path(nome).write_text(texto, encoding="utf-8")
          def trocar_unico(texto, antigo, novo, nome):
              if antigo not in texto:
                  raise SystemExit(f"Trecho esperado nao encontrado em {nome}")
              return texto.replace(antigo, novo, 1)

          # 1) Catalogo: Documentos sensivel
          p = "AcessoModulos.gs"
          s = ler(p)
          s = trocar_unico(s,
              '{ chave: "documentos",       rotulo: "Documentos",            sensivel: false }',
              '{ chave: "documentos",       rotulo: "Documentos",            sensivel: true  }', p)
          gravar(p, s)

          # 2) Nova matriz de acesso e cintos de seguranca para testes HML
          Path("DocumentosSeguranca.gs").write_text(r'''// ============================================================================
// ARQUIVO: DocumentosSeguranca.gs
// Controle de acesso e diagnosticos seguros do modulo Documentos/Oficios
// ============================================================================

function exigirAcessoOficioPorTipo_(tokenSessao, tipo) {
  var sessao = exigirSessaoDocumentos_(tokenSessao, false);
  var tipoNorm = normalizarTipoOficio_(tipo);
  var podeDocumentos = (typeof sessaoPodeModulo_ === "function")
    ? sessaoPodeModulo_(sessao, "documentos") : false;
  var ehFluxoSindicalizacao = tipoNorm === "FILIACAO" || tipoNorm === "DESFILIACAO";

  if (podeDocumentos) return sessao;
  if (ehFluxoSindicalizacao) {
    var podeSindicalizacao = (typeof sessaoPodeModulo_ === "function")
      ? sessaoPodeModulo_(sessao, "sindicalizacao") : false;
    if (podeSindicalizacao) return sessao;
  }
  throw new Error(ehFluxoSindicalizacao
    ? "Acesso negado. Este ofício exige permissão em Documentos ou Sindicalização."
    : "Acesso negado. Este ofício exige permissão no módulo Documentos.");
}

function documentosDiagnosticarFuso_() {
  var scriptTz = Session.getScriptTimeZone();
  var idAtivo = (typeof getPlanilhaId === "function") ? getPlanilhaId() : PLANILHA_ID;
  var ss = SpreadsheetApp.openById(idAtivo);
  var planilhaTz = "";
  try { planilhaTz = ss.getSpreadsheetTimeZone(); }
  catch (e) { planilhaTz = "ERRO: " + e.message; }
  return {
    ambiente: (typeof getAmbienteAtual === "function") ? getAmbienteAtual(true) : "desconhecido",
    scriptTimeZone: scriptTz,
    spreadsheetTimeZone: planilhaTz,
    esperado: "America/Sao_Paulo",
    alinhado: scriptTz === "America/Sao_Paulo" && planilhaTz === "America/Sao_Paulo"
  };
}

function documentosExigirHomologacaoSegura_() {
  if (typeof getAmbienteAtual !== "function" || typeof getPlanilhaId !== "function") {
    throw new Error("Configuração de ambiente indisponível. Teste cancelado.");
  }
  var ambiente = String(getAmbienteAtual(true) || "").trim().toLowerCase();
  var idHomologacao = String(getPlanilhaId("homologacao") || "").trim();
  var idProducao = String(getPlanilhaId("producao") || "").trim();
  var idAtivo = String(getPlanilhaId() || "").trim();

  if (ambiente !== "homologacao") throw new Error("Teste recusado: SISGEP_AMBIENTE não está em homologacao.");
  if (!idHomologacao || idAtivo !== idHomologacao) throw new Error("Teste recusado: a planilha ativa não é a planilha de homologação.");
  if (idAtivo === idProducao) throw new Error("Teste recusado: a planilha ativa coincide com produção.");

  var ss = SpreadsheetApp.openById(idAtivo);
  if (String(ss.getId()) !== idHomologacao) throw new Error("Teste recusado: identidade da planilha de homologação não confirmada.");
  return { ambiente: ambiente, planilhaId: idHomologacao, planilhaNome: ss.getName() };
}

function documentosDiagnosticoHomologacao(tokenSessao) {
  exigirAdminOuSessao_(tokenSessao, "documentos", "Diagnóstico de homologação de Documentos", true);
  var alvo = documentosExigirHomologacaoSegura_();
  var fuso = documentosDiagnosticarFuso_();
  return {
    ok: true,
    ambiente: alvo.ambiente,
    planilhaNome: alvo.planilhaNome,
    planilhaIdFinal: "…" + alvo.planilhaId.slice(-6),
    fuso: fuso,
    prontoParaTeste: fuso.alinhado === true
  };
}

function documentosTesteReservarNumeroHomologacao(tokenSessao) {
  exigirAdminOuSessao_(tokenSessao, "documentos", "Teste de concorrência da numeração de ofícios", true);
  var alvo = documentosExigirHomologacaoSegura_();
  var numero = gerarProximoNumeroSeguro();
  return {
    ok: true,
    numero: numero,
    ambiente: alvo.ambiente,
    planilhaIdFinal: "…" + alvo.planilhaId.slice(-6),
    executadoEm: Utilities.formatDate(new Date(), Session.getScriptTimeZone(), "dd/MM/yyyy HH:mm:ss.SSS")
  };
}
''', encoding="utf-8")

          # 3) Numeracao atomica + acesso por tipo em Oficios.gs
          p = "Oficios.gs"
          s = ler(p)
          marcador = "/* ================= NUMERAÇÃO ================= */\n\n"
          if marcador not in s:
              raise SystemExit("Marcador de numeracao nao encontrado em Oficios.gs")
          helpers = r'''/*
 * Reserva anual atomica: um numero pode ficar sem uso se a emissao falhar,
 * mas nunca pode ser reutilizado por duas emissoes concorrentes.
 */
function oficiosChaveSequencia_(ano) {
  return "OFICIOS_SEQUENCIA_" + String(ano || "").trim();
}

function oficiosNumeroDoAno_(valor, ano) {
  var texto = String(valor || "").trim();
  var m = texto.match(/^(\d+)\s*\/\s*(\d{4})$/);
  if (!m || m[2] !== String(ano)) return 0;
  var n = parseInt(m[1], 10);
  return isNaN(n) ? 0 : n;
}

function oficiosMaiorNumeroConhecido_(ss, sheetControle, colNumero, ano) {
  var maior = PRIMEIRO_OFICIO_PLATAFORMA - 1;
  function considerar(valor) {
    var n = oficiosNumeroDoAno_(valor, ano);
    if (n > maior) maior = n;
  }
  if (sheetControle && colNumero && sheetControle.getLastRow() > 1) {
    sheetControle.getRange(2, colNumero, sheetControle.getLastRow() - 1, 1)
      .getValues().forEach(function(r) { considerar(r[0]); });
  }
  try {
    var shFila = ss.getSheetByName("FILA_ENVIO_OFICIOS");
    if (shFila && shFila.getLastRow() > 1) {
      var hmFila = getHeaderMap_(shFila);
      var colFila = hmFila["NUMERO_OFICIO"];
      if (colFila) shFila.getRange(2, colFila, shFila.getLastRow() - 1, 1)
        .getValues().forEach(function(r) { considerar(r[0]); });
    }
  } catch (eFila) { Logger.log("oficiosMaiorNumeroConhecido_.fila: " + eFila.message); }
  var props = PropertiesService.getScriptProperties();
  try { considerar(props.getProperty("TAXA_ASSISTENCIAL_NUMERO_OFICIO")); }
  catch (eTaxa) { Logger.log("oficiosMaiorNumeroConhecido_.taxa: " + eTaxa.message); }
  try {
    var reservado = parseInt(props.getProperty(oficiosChaveSequencia_(ano)) || "0", 10);
    if (!isNaN(reservado) && reservado > maior) maior = reservado;
  } catch (eSeq) { Logger.log("oficiosMaiorNumeroConhecido_.sequencia: " + eSeq.message); }
  return maior;
}

'''
          s = s.replace(marcador, marcador + helpers, 1)

          padrao_prever = re.compile(r'function preverProximoNumeroOficio\(\) \{.*?\n\}\n\nfunction gerarProximoNumeroSeguro\(\) \{.*?\n\}\n', re.S)
          novo_num = r'''function preverProximoNumeroOficio() {
  var ss = SpreadsheetApp.openById(PLANILHA_ID);
  var sheet = ss.getSheetByName(PLANILHA_REGISTRO);
  if (!sheet) throw new Error("Aba de registro não encontrada.");
  var headerMap = getHeaderMap_(sheet);
  var colNumero = headerMap["Número do Ofício"];
  if (!colNumero) throw new Error("Coluna 'Número do Ofício' não encontrada.");
  var ano = anoAtual_();
  var maiorNumero = oficiosMaiorNumeroConhecido_(ss, sheet, colNumero, ano);
  var proximo = String(maiorNumero + 1).padStart(3, "0") + "/" + ano;
  Logger.log("Prévia do próximo número: " + proximo);
  return proximo;
}

function gerarProximoNumeroSeguro() {
  var trava = travarSisgep_(15000);
  try {
    var ss = SpreadsheetApp.openById(PLANILHA_ID);
    var sheet = ss.getSheetByName(PLANILHA_REGISTRO);
    var ano = anoAtual_();
    if (!sheet) throw new Error("Aba de registro não encontrada.");
    var headerMap = getHeaderMap_(sheet);
    var colNumero = headerMap["Número do Ofício"];
    if (!colNumero) throw new Error("Coluna 'Número do Ofício' não encontrada.");
    var maiorNumero = oficiosMaiorNumeroConhecido_(ss, sheet, colNumero, ano);
    var proximoNumero = maiorNumero + 1;
    PropertiesService.getScriptProperties()
      .setProperty(oficiosChaveSequencia_(ano), String(proximoNumero));
    var proximo = String(proximoNumero).padStart(3, "0") + "/" + ano;
    Logger.log("gerarProximoNumeroSeguro [RESERVADO]: " + proximo);
    return proximo;
  } finally {
    trava.liberar();
  }
}
'''
          s2, n = padrao_prever.subn(novo_num, s, count=1)
          if n != 1:
              raise SystemExit(f"Nao foi possivel substituir bloco de numeracao: {n}")
          s = s2
          s = s.replace('var sessao = exigirSessaoDocumentos_(tokenSessao, false);\n  Logger.log("✅ previewOficioWeb',
                        'var sessao = exigirAcessoOficioPorTipo_(tokenSessao, dados && dados.tipo);\n  Logger.log("✅ previewOficioWeb', 1)
          # gerarOficioWeb: troca apenas a primeira declaracao dentro da funcao
          idx = s.find("function gerarOficioWeb(dados, tokenSessao)")
          if idx < 0: raise SystemExit("gerarOficioWeb nao encontrado")
          cauda = s[idx:]
          old = 'var sessaoDocumentos = exigirSessaoDocumentos_(tokenSessao, false);'
          if old not in cauda: raise SystemExit("trava antiga de gerarOficioWeb nao encontrada")
          cauda = cauda.replace(old, 'var sessaoDocumentos = exigirAcessoOficioPorTipo_(tokenSessao, dados && dados.tipo);', 1)
          s = s[:idx] + cauda
          gravar(p, s)

          # 4) OficioService: 50 e matriz de acesso
          p = "OficioService.gs"; s = ler(p)
          s = trocar_unico(s, 'var LIMITE_FICHAS_OFICIO = 25;', 'var LIMITE_FICHAS_OFICIO = 50;', p)
          s = trocar_unico(s,
              'var sessaoDocumentos = exigirModulo_(tokenSessao, "documentos", false);',
              'var sessaoDocumentos = exigirAcessoOficioPorTipo_(tokenSessao, dados && dados.tipo);', p)
          gravar(p, s)

          # 5) Dashboard: chamada principal protegida. A Home ja checa modulo antes de chamar.
          p = "DashboardOficios.gs"; s = ler(p)
          s = trocar_unico(s, 'exigirSessaoDocumentos_(tokenSessao, false);', 'exigirModulo_(tokenSessao, "documentos", false);', p)
          gravar(p, s)

          # 6) Confirmacao automatica: remover sinais fracos
          p = "MonitoramentoOficios.gs"; s = ler(p)
          antigo = '''            texto.indexOf("ciente") > -1 ||\n            texto.indexOf("ok") > -1 ||\n            texto.indexOf("acusamos") > -1 ||\n            texto.indexOf("obrigado") > -1 ||\n            texto.indexOf("obrigada") > -1'''
          novo = '''            texto.indexOf("ciente") > -1 ||\n            texto.indexOf("acusamos o recebimento") > -1 ||\n            texto.indexOf("acuso o recebimento") > -1'''
          s = trocar_unico(s, antigo, novo, p)
          gravar(p, s)

          # 7) Tracking: resposta valida do ContentService
          p = "RastreamentoOficios.gs"; s = ler(p)
          antigo = '''function pixelTransparente_() {\n  var bytes = Utilities.base64Decode(\n    "R0lGODlhAQABAPAAAP///wAAACH5BAAAAAAALAAAAAABAAEAAAICRAEAOw=="\n  );\n\n  return ContentService\n    .createTextOutput(bytes)\n    .setMimeType(ContentService.MimeType.GIF);\n}'''
          novo = '''function pixelTransparente_() {\n  return ContentService\n    .createTextOutput("")\n    .setMimeType(ContentService.MimeType.TEXT);\n}'''
          s = trocar_unico(s, antigo, novo, p)
          gravar(p, s)

          # 8) Reenvio: ofício + pacote original completo da fila
          p = "EmailOficios.gs"; s = ler(p)
          antigo = '''    var arqOficio = DriveApp.getFileById(idOficio);\n    var anexos    = [arqOficio.getBlob().setName(arqOficio.getName())];\n\n    if (linkFicha) {\n      var idFicha = extrairIdDrive_(linkFicha);\n      if (idFicha) {\n        try {\n          var arqFicha = DriveApp.getFileById(idFicha);\n          anexos.push(arqFicha.getBlob().setName(arqFicha.getName()));\n        } catch (eFicha) { Logger.log("⚠ Não foi possível anexar a ficha: " + eFicha.message); }\n      }\n    }'''
          novo = '''    var anexos = [];\n    var idsAnexados = {};\n\n    function adicionarArquivoDrive_(fileId, nomePreferido) {\n      fileId = String(fileId || "").trim();\n      if (!fileId || idsAnexados[fileId]) return false;\n      try {\n        var arq = DriveApp.getFileById(fileId);\n        var blob = arq.getBlob();\n        blob.setName(String(nomePreferido || arq.getName() || "anexo").trim());\n        anexos.push(blob);\n        idsAnexados[fileId] = true;\n        return true;\n      } catch (eAnexo) {\n        Logger.log("⚠ Reenvio — anexo indisponível " + fileId + ": " + eAnexo.message);\n        return false;\n      }\n    }\n\n    adicionarArquivoDrive_(idOficio, "");\n\n    try {\n      var shFila = ss.getSheetByName("FILA_ENVIO_OFICIOS");\n      if (shFila && shFila.getLastRow() >= 2) {\n        var hf = getHeaderMap_(shFila);\n        var cfNumero = hf["NUMERO_OFICIO"];\n        var cfAnexos = hf["ANEXOS_JSON"];\n        if (cfNumero && cfAnexos) {\n          var df = shFila.getRange(2, 1, shFila.getLastRow() - 1, shFila.getLastColumn()).getValues();\n          for (var q = df.length - 1; q >= 0; q--) {\n            if (String(df[q][cfNumero - 1] || "").trim() !== numero) continue;\n            var jsonFila = String(df[q][cfAnexos - 1] || "").trim();\n            if (!jsonFila) continue;\n            try {\n              var pacote = JSON.parse(jsonFila);\n              if (Array.isArray(pacote)) pacote.forEach(function(anexoInfo) {\n                if (anexoInfo && anexoInfo.fileId) adicionarArquivoDrive_(anexoInfo.fileId, anexoInfo.nome || "");\n              });\n            } catch (eJsonFila) {\n              Logger.log("⚠ Reenvio — ANEXOS_JSON inválido para " + numero + ": " + eJsonFila.message);\n            }\n            break;\n          }\n        }\n      }\n    } catch (eFilaAnexos) {\n      Logger.log("⚠ Reenvio — não foi possível recuperar o pacote da fila: " + eFilaAnexos.message);\n    }\n\n    if (linkFicha) {\n      var idFicha = extrairIdDrive_(linkFicha);\n      if (idFicha) adicionarArquivoDrive_(idFicha, "");\n    }\n\n    if (!anexos.length) {\n      return { erro: true, mensagem: "Nenhum arquivo do ofício pôde ser recuperado para o reenvio." };\n    }'''
          s = trocar_unico(s, antigo, novo, p)
          gravar(p, s)

          # 9) Monitoramento UI: retries + erro persistente
          p = "OficiosScripts.html"; s = ler(p)
          padrao = re.compile(r'function carregarMonitoramento\(filtros\) \{.*?\.listarStatusOficios\(filtros, SISGEP_TOKEN_SESSAO\);\n\}', re.S)
          novo = r'''function carregarMonitoramento(filtros, tentativa) {
  filtros = filtros || {};
  tentativa = tentativa || 1;
  var painel = $("painelMonitoramento");
  if (painel) painel.innerHTML = '<div style="text-align:center;padding:36px;color:var(--g400);font-size:13px;font-weight:500;">⏳ Carregando...</div>';
  google.script.run
    .withSuccessHandler(function(retorno) {
      if (retorno && retorno.erro) {
        renderErroMonitoramento(retorno.mensagem || "Falha ao consultar o monitoramento.", filtros);
        return;
      }
      renderMonitoramento(retorno || {itens:[],resumo:{}});
    })
    .withFailureHandler(function(err) {
      var msg = (err && err.message) || String(err);
      var n = String(msg || "").toLowerCase();
      var permanente = n.indexOf("sessão") > -1 || n.indexOf("sessao") > -1 ||
        n.indexOf("acesso") > -1 || n.indexOf("permiss") > -1;
      if (!permanente && tentativa < 3) {
        setTimeout(function() { carregarMonitoramento(filtros, tentativa + 1); }, 1800 * tentativa);
        return;
      }
      renderErroMonitoramento(msg, filtros);
    })
    .listarStatusOficios(filtros, SISGEP_TOKEN_SESSAO);
}

function renderErroMonitoramento(msg, filtros) {
  var painel = $("painelMonitoramento");
  if (!painel) return;
  painel.innerHTML = '<div style="text-align:center;padding:34px 18px;color:var(--g600);">'
    + '<div style="font-size:30px;margin-bottom:8px;">⚠️</div>'
    + '<div style="font-weight:800;color:var(--red,#dc2626);">Não foi possível carregar o Monitoramento</div>'
    + '<div style="font-size:12px;margin-top:8px;">' + escapeHtml(msg || "Erro desconhecido") + '</div>'
    + '<button type="button" id="btnMonTentarNovamente" class="btn btn-navy" style="margin-top:16px;">🔄 Tentar novamente</button>'
    + '</div>';
  var btn = $("btnMonTentarNovamente");
  if (btn) btn.onclick = function() { carregarMonitoramento(filtros || {}, 1); };
}'''
          s2, n = padrao.subn(novo, s, count=1)
          if n != 1: raise SystemExit(f"Bloco carregarMonitoramento nao encontrado: {n}")
          gravar(p, s2)

      - name: Validar sintaxe e invariantes do lote
        shell: bash
        run: |
          set -euo pipefail
          for f in AcessoModulos.gs DashboardOficios.gs DocumentosSeguranca.gs EmailOficios.gs MonitoramentoOficios.gs OficioService.gs Oficios.gs RastreamentoOficios.gs; do
            cp "$f" /tmp/validate.js
            node --check /tmp/validate.js
          done
          git diff --check
          grep -q 'OFICIOS_SEQUENCIA_' Oficios.gs
          grep -q 'setProperty(oficiosChaveSequencia_(ano), String(proximoNumero))' Oficios.gs
          grep -q 'exigirAcessoOficioPorTipo_' Oficios.gs
          grep -q 'LIMITE_FICHAS_OFICIO = 50' OficioService.gs
          grep -q 'ANEXOS_JSON' EmailOficios.gs
          grep -q 'pacote.forEach' EmailOficios.gs
          grep -q 'tentativa < 3' OficiosScripts.html
          grep -q 'renderErroMonitoramento' OficiosScripts.html
          ! grep -q 'texto.indexOf("ok")' MonitoramentoOficios.gs
          ! grep -q 'texto.indexOf("obrigado")' MonitoramentoOficios.gs
          ! grep -q 'MimeType.GIF' RastreamentoOficios.gs

      - name: Rodar suite existente da homologacao
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm test

      - name: Commitar somente se tudo passou
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AcessoModulos.gs DashboardOficios.gs DocumentosSeguranca.gs EmailOficios.gs MonitoramentoOficios.gs OficioService.gs Oficios.gs OficiosScripts.html RastreamentoOficios.gs
          git commit -m "fix(documentos): portar ajustes criticos para homologacao"
          git push origin HEAD:teste/documentos-ajustes-hml
