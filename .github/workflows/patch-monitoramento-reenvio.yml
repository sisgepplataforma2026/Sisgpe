name: Patch Monitoramento e Reenvio de Oficios

on:
  push:
    branches: ["correcao/documentos-ajustes-seguros"]
    paths: [".github/workflows/patch-monitoramento-reenvio.yml"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: correcao/documentos-ajustes-seguros
          fetch-depth: 0

      - name: Corrigir reenvio com todos os anexos e resiliencia do monitoramento
        shell: python
        run: |
          from pathlib import Path

          # ============================================================
          # 1. Reenvio: usar pacote original da fila (oficio + TODAS fichas)
          # ============================================================
          p = Path("EmailOficios.js")
          s = p.read_text(encoding="utf-8")

          old = '''    var arqOficio = DriveApp.getFileById(idOficio);\n    var anexos    = [arqOficio.getBlob().setName(arqOficio.getName())];\n\n    if (linkFicha) {\n      var idFicha = extrairIdDrive_(linkFicha);\n      if (idFicha) {\n        try {\n          var arqFicha = DriveApp.getFileById(idFicha);\n          anexos.push(arqFicha.getBlob().setName(arqFicha.getName()));\n        } catch (eFicha) { Logger.log("⚠ Não foi possível anexar a ficha: " + eFicha.message); }\n      }\n    }'''

          new = '''    /* REENVIO PRECISA REPETIR O PACOTE DOCUMENTAL ORIGINAL.\n     *\n     * A fila grava ANEXOS_JSON com o PDF do ofício + TODAS as fichas usadas\n     * na emissão. O reenvio antigo ignorava essa fonte e olhava apenas\n     * "Link Ficha" do Controle, que comporta um único arquivo e normalmente\n     * nem é preenchido pelo fluxo atual. Resultado: reenvio podia sair só\n     * com o ofício, sem as fichas.\n     *\n     * Regra agora: ofício primeiro; depois todos os anexos da linha mais\n     * recente da fila para esse número; por fim Link Ficha como fallback\n     * legado. IDs são deduplicados para o mesmo PDF não ir duas vezes. */\n    var anexos = [];\n    var idsAnexados = {};\n\n    function adicionarArquivoDrive_(fileId, nomePreferido) {\n      fileId = String(fileId || "").trim();\n      if (!fileId || idsAnexados[fileId]) return false;\n      try {\n        var arq = DriveApp.getFileById(fileId);\n        var blob = arq.getBlob();\n        blob.setName(String(nomePreferido || arq.getName() || "anexo").trim());\n        anexos.push(blob);\n        idsAnexados[fileId] = true;\n        return true;\n      } catch (eAnexo) {\n        Logger.log("⚠ Reenvio — anexo indisponível " + fileId + ": " + eAnexo.message);\n        return false;\n      }\n    }\n\n    // O PDF oficial sempre deve estar presente, mesmo para registros legados\n    // que não tenham ANEXOS_JSON na fila.\n    adicionarArquivoDrive_(idOficio, "");\n\n    try {\n      var shFila = ss.getSheetByName("FILA_ENVIO_OFICIOS");\n      if (shFila && shFila.getLastRow() >= 2) {\n        var hf = getHeaderMap_(shFila);\n        var cfNumero = hf["NUMERO_OFICIO"];\n        var cfAnexos = hf["ANEXOS_JSON"];\n\n        if (cfNumero && cfAnexos) {\n          var df = shFila.getRange(2, 1, shFila.getLastRow() - 1, shFila.getLastColumn()).getValues();\n\n          // De baixo para cima: usa a emissão mais recente daquele número.\n          for (var q = df.length - 1; q >= 0; q--) {\n            if (String(df[q][cfNumero - 1] || "").trim() !== numero) continue;\n\n            var jsonFila = String(df[q][cfAnexos - 1] || "").trim();\n            if (!jsonFila) continue;\n\n            try {\n              var pacote = JSON.parse(jsonFila);\n              if (Array.isArray(pacote)) {\n                pacote.forEach(function(anexoInfo) {\n                  if (!anexoInfo || !anexoInfo.fileId) return;\n                  adicionarArquivoDrive_(anexoInfo.fileId, anexoInfo.nome || "");\n                });\n              }\n            } catch (eJsonFila) {\n              Logger.log("⚠ Reenvio — ANEXOS_JSON inválido para " + numero + ": " + eJsonFila.message);\n            }\n            break;\n          }\n        }\n      }\n    } catch (eFilaAnexos) {\n      Logger.log("⚠ Reenvio — não foi possível recuperar o pacote da fila: " + eFilaAnexos.message);\n    }\n\n    // Compatibilidade com ofícios antigos, anteriores ao pacote ANEXOS_JSON.\n    if (linkFicha) {\n      var idFicha = extrairIdDrive_(linkFicha);\n      if (idFicha) adicionarArquivoDrive_(idFicha, "");\n    }\n\n    if (!anexos.length) {\n      return { erro: true, mensagem: "Nenhum arquivo do ofício pôde ser recuperado para o reenvio." };\n    }'''

          if old not in s:
              raise SystemExit("Bloco legado de anexos do reenvio não encontrado")
          s = s.replace(old, new, 1)
          p.write_text(s, encoding="utf-8")

          # ============================================================
          # 2. Monitoramento: distinguir erro permanente de falha transitória
          #    e fazer até 3 tentativas nas recusas momentâneas do Apps Script.
          # ============================================================
          p = Path("OficiosScripts.html")
          s = p.read_text(encoding="utf-8")

          old = '''      var msg = (err && err.message) || String(err);\n      // A chamada não chegou ao servidor. O portal dispara dezenas de chamadas\n      // ao abrir e o Apps Script recusa as excedentes — uma segunda tentativa,\n      // depois da avalanche, costuma passar.\n      if (tentativa < 2) {\n        setTimeout(function() { carregarMonitoramento(filtros, tentativa + 1); }, 3000);\n        return;\n      }\n      toast("Erro ao carregar monitoramento: " + msg, "err", 6000);\n      renderErroMonitoramento(msg, filtros);'''

          new = '''      var msg = (err && err.message) || String(err);\n      var msgNorm = String(msg || "").toLowerCase();\n      var erroPermanente =\n        msgNorm.indexOf("sessão") > -1 ||\n        msgNorm.indexOf("sessao") > -1 ||\n        msgNorm.indexOf("acesso") > -1 ||\n        msgNorm.indexOf("permiss") > -1 ||\n        msgNorm.indexOf("não tem acesso") > -1 ||\n        msgNorm.indexOf("nao tem acesso") > -1;\n\n      // Recusas momentâneas do Apps Script acontecem quando muitas chamadas\n      // concorrem na abertura do portal. Não fica preso em "Carregando":\n      // tenta até 3 vezes, com espera crescente. Erro de sessão/permissão\n      // aparece imediatamente porque repetir não resolveria.\n      if (!erroPermanente && tentativa < 3) {\n        setTimeout(function() { carregarMonitoramento(filtros, tentativa + 1); }, 1800 * tentativa);\n        return;\n      }\n      toast("Erro ao carregar monitoramento: " + msg, "err", 6000);\n      renderErroMonitoramento(msg, filtros);'''

          if old not in s:
              raise SystemExit("Bloco de retry do Monitoramento não encontrado")
          s = s.replace(old, new, 1)
          p.write_text(s, encoding="utf-8")

      - name: Validar sintaxe e invariantes
        shell: bash
        run: |
          set -euo pipefail
          node --check EmailOficios.js
          # HTML contém JavaScript dentro de <script>; validações textuais aqui.
          git diff --check
          grep -q 'FILA_ENVIO_OFICIOS' EmailOficios.js
          grep -q 'ANEXOS_JSON' EmailOficios.js
          grep -q 'pacote.forEach' EmailOficios.js
          grep -q 'tentativa < 3' OficiosScripts.html
          grep -q 'erroPermanente' OficiosScripts.html

      - name: Commitar correcoes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add EmailOficios.js OficiosScripts.html
          git commit -m "fix(documentos): reenviar oficio com todas as fichas e robustecer monitoramento"
          git push origin HEAD:correcao/documentos-ajustes-seguros
