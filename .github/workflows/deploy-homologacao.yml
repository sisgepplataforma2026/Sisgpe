# DEPLOY DA HOMOLOGAÇÃO
#
# Workflow oficial para enviar uma branch de trabalho ao projeto Apps Script de HOMOLOGAÇÃO.
# O destino vem exclusivamente dos segredos CLASP_JSON_HOMOLOG / CLASP_DEPLOYMENT_ID_HOMOLOG.
#
# Segredos necessários:
#   CLASPRC_JSON
#   CLASP_JSON_HOMOLOG
#   CLASP_DEPLOYMENT_ID_HOMOLOG (opcional para atualizar a publicação web)

name: Deploy Homologacao Apps Script

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    # Trava de segurança: apenas a branch atual do Compasso 2026 pode ser enviada.
    if: github.ref == 'refs/heads/feat/compasso-2026-hardening'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar clasp
        run: npm install -g @google/clasp

      - name: Verificar o codigo antes de publicar
        # Sintaxe dos .gs e do JS nos .html, nomes globais duplicados,
        # google.script.run sem funcao no servidor e segredos em texto claro.
        # Sem dependencias: roda so com o Node.
        # --max 22 e a divida herdada (docs/DEBITO-TECNICO.md). Baixe o numero
        # conforme os itens forem corrigidos; problema novo derruba o deploy.
        run: node tools/verificar.js --max 22

      - name: Configurar autenticacao e projeto de homologacao
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '${{ secrets.CLASPRC_JSON }}' > "$HOME/.clasprc.json"
          printf '%s' '${{ secrets.CLASP_JSON_HOMOLOG }}' > .clasp.json
          if [ ! -s "$HOME/.clasprc.json" ] || [ ! -s .clasp.json ]; then
            echo "::error::Faltam os segredos CLASPRC_JSON e/ou CLASP_JSON_HOMOLOG no repositorio."
            exit 1
          fi

      - name: Validar arquivos que serao enviados
        run: clasp status

      - name: Enviar codigo para Apps Script - Homologacao
        run: clasp push --force

      - name: Registrar versao de homologacao
        id: versao
        shell: bash
        run: |
          set -euo pipefail
          clasp version "homolog-${GITHUB_SHA::7}" | tee saida-versao.txt
          NUM=$(grep -oE '[0-9]+' saida-versao.txt | tail -1)
          echo "numero=$NUM" >> "$GITHUB_OUTPUT"
          echo "Versao criada: $NUM"

      - name: Publicar na URL de homologacao
        shell: bash
        env:
          DEPLOY_ID: ${{ secrets.CLASP_DEPLOYMENT_ID_HOMOLOG }}
          VERSAO: ${{ steps.versao.outputs.numero }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_ID}" ]; then
            echo "::warning::CLASP_DEPLOYMENT_ID_HOMOLOG nao configurado."
            echo "::warning::O codigo subiu e a versao ${VERSAO} foi criada, mas a URL de homologacao ainda serve a publicacao anterior."
            exit 0
          fi
          clasp deploy --deploymentId "${DEPLOY_ID}" --versionNumber "${VERSAO}" \
            --description "homolog-${GITHUB_SHA::7}"
          echo "Homologacao publicada na versao ${VERSAO}."
