# PUBLICAÇÃO DO LEITOR DA SECRETARIA — projeto Apps Script SEPARADO
#
# O leitor (leitor-secretaria/LeitorSecretaria.gs.txt) roda na conta
# sindeducacaosecretaria@gmail.com e é quem lê a caixa da Secretaria. Ele NÃO
# vai no push do SISGEP (.claspignore). Até 29/10/2026 se atualizava colando à
# mão; o usuário pediu: "Faça vc".
#
# COMO ISTO ALCANÇA O PROJETO: a conta da Secretaria compartilhou o projeto do
# leitor como EDITOR com a conta do Financeiro, e o push usa a mesma
# credencial do deploy do SISGEP (CLASPRC_JSON). O leitor continua RODANDO
# como a Secretaria — o gatilho leitorCiclo é dela —, então continua lendo a
# caixa certa. Troca aceita pelo usuário: a conta do Financeiro passa a poder
# alterar o código do leitor.
#
# TRÊS TRAVAS antes de escrever:
#   1. o Script ID informado não pode ser o da homologação nem o de produção
#      do SISGEP — um engano aqui apagaria o SISGEP inteiro (push --force);
#   2. o projeto remoto TEM que já ser o leitor (o cabeçalho do arquivo diz
#      "ARQUIVO: LeitorSecretaria.gs");
#   3. os testes do leitor (t206, t207, t212) passam.
#
# DEPOIS DE PUBLICAR, se o código pedir permissão nova (o manifesto mudou), o
# gatilho para até alguém da Secretaria abrir o editor, rodar uma função e
# autorizar. Parar é o erro seguro: sem autorização, nada é copiado.

name: Deploy Leitor da Secretaria

# DOIS GATILHOS. O manual (workflow_dispatch) só aparece no GitHub quando
# este arquivo estiver na main. Até lá, e depois também: todo push na branch
# de homologação que mexa no leitor PUBLICA sozinho, com o Script ID lido de
# leitor-secretaria/SCRIPT_ID.txt — as mesmas três travas valem.
on:
  push:
    branches: [integracao/sisgep-homologacao]
    paths:
      - 'leitor-secretaria/**'
      - '.github/workflows/deploy-leitor-secretaria.yml'
  workflow_dispatch:
    inputs:
      modo:
        description: 'conferir = so relatorio | publicar = envia o leitor'
        required: true
        default: conferir
        type: choice
        options: [conferir, publicar]
      script_id:
        description: 'ID do script do projeto "Leitor da Secretaria" (Configuracoes do projeto)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-leitor-secretaria
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/integracao/sisgep-homologacao'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar clasp e ferramental de teste
        run: |
          npm install -g @google/clasp@3.3.0
          npm ci || npm install

      - name: Validar o leitor (sintaxe e testes)
        run: |
          node -e "new Function(require('fs').readFileSync('leitor-secretaria/LeitorSecretaria.gs.txt','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('leitor-secretaria/appsscript.json.txt','utf8'))"
          node tests/e2e/t212-leitor-entende-email.js
          node tests/e2e/t206-voucher-pedidos-email.js
          node tests/e2e/t207-voucher-pedidos-email-tela.js

      - name: Credenciais e trava 1 (nao e o SISGEP)
        shell: bash
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          SCRIPT_ID: ${{ github.event.inputs.script_id }}
        run: |
          set -euo pipefail
          test -n "$CLASPRC_JSON"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          if [ -z "${SCRIPT_ID:-}" ] && [ -f leitor-secretaria/SCRIPT_ID.txt ]; then
            SCRIPT_ID="$(cat leitor-secretaria/SCRIPT_ID.txt)"
          fi
          SCRIPT_ID="$(printf '%s' "${SCRIPT_ID:-}" | tr -d '[:space:]')"
          if [ -z "$SCRIPT_ID" ]; then
            echo "Sem Script ID do leitor (leitor-secretaria/SCRIPT_ID.txt). Nada a publicar."
            echo "PULAR=1" >> "$GITHUB_ENV"; exit 0
          fi
          case "$SCRIPT_ID" in
            1S_LckCVMJy0dza6tlw5w9Vq7ZqJ9RzxsrYoPMR1zI65rKXC-JgvDUSVR)
              echo '::error::Bloqueado: este e o Script ID da HOMOLOGACAO do SISGEP.'; exit 1;;
            1BoKA6pOOT751zmxahnvSgT2CJDgMpUPMvZj-X0HjDx_tCHLnXOqxVVqa)
              echo '::error::Bloqueado: este e o Script ID de PRODUCAO do SISGEP.'; exit 1;;
          esac
          if ! printf '%s' "$SCRIPT_ID" | grep -Eq '^[A-Za-z0-9_-]{40,80}$'; then
            echo '::error::Script ID com formato inesperado.'; exit 1
          fi
          mkdir -p /tmp/leitor-remoto /tmp/leitor-novo
          printf '{"scriptId":"%s","fileExtension":"gs"}' "$SCRIPT_ID" > /tmp/leitor-remoto/.clasp.json
          printf '{"scriptId":"%s","fileExtension":"gs"}' "$SCRIPT_ID" > /tmp/leitor-novo/.clasp.json

      # A mesma renovação do deploy do SISGEP: o clasp 3.3.0 não renova sozinho.
      - name: Renovar o token de acesso
        if: env.PULAR != '1'
        shell: bash
        run: |
          set -euo pipefail
          node > /tmp/body <<'JS'
          const fs = require("fs");
          const rc = JSON.parse(fs.readFileSync(process.env.HOME + "/.clasprc.json", "utf8"));
          const k = rc.tokens ? (rc.tokens.default ? "default" : Object.keys(rc.tokens)[0]) : null;
          const t = k ? rc.tokens[k] : (rc.token || {});
          process.stdout.write("client_id=" + encodeURIComponent(t.client_id || "") +
            "&client_secret=" + encodeURIComponent(t.client_secret || "") +
            "&refresh_token=" + encodeURIComponent(t.refresh_token || "") + "&grant_type=refresh_token");
          JS
          curl -s -o /tmp/novo.json -w "renovacao: HTTP %{http_code}\n" -X POST -d @/tmp/body https://oauth2.googleapis.com/token
          node <<'JS'
          const fs = require("fs");
          const r = JSON.parse(fs.readFileSync("/tmp/novo.json", "utf8"));
          if (r.error) { console.error("::error::Falha ao renovar o token: " + r.error); process.exit(1); }
          const caminho = process.env.HOME + "/.clasprc.json";
          const rc = JSON.parse(fs.readFileSync(caminho, "utf8"));
          const k = rc.tokens ? (rc.tokens.default ? "default" : Object.keys(rc.tokens)[0]) : null;
          const alvo = k ? rc.tokens[k] : rc.token;
          alvo.access_token = r.access_token;
          alvo.expiry_date = Date.now() + (Number(r.expires_in) || 3600) * 1000;
          fs.writeFileSync(caminho, JSON.stringify(rc));
          JS
          rm -f /tmp/body /tmp/novo.json

      - name: Trava 2 — o projeto remoto ja e o leitor
        if: env.PULAR != '1'
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/leitor-remoto
          if ! clasp pull; then
            echo '::error::Nao consegui ler o projeto. A conta da Secretaria compartilhou o projeto "Leitor da Secretaria" como EDITOR com financeirosindecucacao@gmail.com?'
            exit 1
          fi
          # find e nao glob: sem .js, o glob sai literal e derruba o passo.
          find . -maxdepth 1 -name '*.js' | while read -r f; do mv -- "$f" "${f%.js}.gs"; done
          ls -la
          n=$(find . -maxdepth 1 \( -name '*.gs' -o -name '*.html' \) | wc -l)
          echo "o projeto remoto tem $n arquivo(s) de codigo"
          if [ "$n" -gt 3 ]; then
            echo '::error::Bloqueado: o projeto tem arquivos demais para ser o leitor — pode ser o SISGEP.'; exit 1
          fi
          if ! grep -l "ARQUIVO: LeitorSecretaria.gs" ./*.gs >/dev/null 2>&1; then
            echo '::error::Bloqueado: o projeto remoto nao tem o cabecalho do LeitorSecretaria. Nao e o leitor.'; exit 1
          fi
          echo "alvo confirmado: e o Leitor da Secretaria"

      - name: Comparar repositorio x projeto
        if: env.PULAR != '1'
        shell: bash
        # Só relatório: diferença NÃO é erro (diff sai com 1 quando difere).
        run: |
          set +e +o pipefail
          cp leitor-secretaria/LeitorSecretaria.gs.txt /tmp/leitor-novo/LeitorSecretaria.gs
          cp leitor-secretaria/appsscript.json.txt /tmp/leitor-novo/appsscript.json
          for f in /tmp/leitor-remoto/*.gs; do
            echo "── $(basename "$f") (remoto) x LeitorSecretaria.gs (repositorio)"
            diff -q "$f" /tmp/leitor-novo/LeitorSecretaria.gs && echo "igual" || diff "$f" /tmp/leitor-novo/LeitorSecretaria.gs | head -40
          done
          echo "── appsscript.json"
          diff /tmp/leitor-remoto/appsscript.json /tmp/leitor-novo/appsscript.json
          exit 0

      - name: Publicar o leitor
        # No push, publica; no manual, só se escolher "publicar".
        if: env.PULAR != '1' && (github.event_name == 'push' || github.event.inputs.modo == 'publicar')
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/leitor-novo
          clasp push --force
          echo "Leitor publicado. Se o manifesto ganhou permissao nova, a Secretaria precisa autorizar uma vez no editor."
