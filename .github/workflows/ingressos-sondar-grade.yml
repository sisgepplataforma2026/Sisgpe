# SONDA SÓ DE LEITURA DA GRADE DE LUGARES (27/11/2026): por que o robô não achou lugar livre.
# Abre um lugar livre, escolhe a categoria, preenche campos FICTÍCIOS e lê o que o pop-up guarda. NUNCA emite,
# salva, exclui nem envia. Dispara por push em tools/ingressos-robo/sondar-grade.js. Segredos: INGRESSOS_USUARIO/SENHA.
name: Ingressos — sondar a grade de lugares

on:
  push:
    branches: [integracao/sisgep-homologacao]
    paths:
      - 'tools/ingressos-robo/sondar-grade.js'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ingressos-sondar-grade
  cancel-in-progress: false

jobs:
  sondar:
    if: github.ref == 'refs/heads/integracao/sisgep-homologacao'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar o navegador do robô
        run: |
          mkdir -p /tmp/robo && cd /tmp/robo && npm init -y >/dev/null && npm i playwright >/dev/null 2>&1
          cd /tmp/robo && npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Sondar (só leitura, sem dado pessoal)
        env:
          INGRESSOS_USUARIO: ${{ secrets.INGRESSOS_USUARIO }}
          INGRESSOS_SENHA: ${{ secrets.INGRESSOS_SENHA }}
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          NODE_PATH: /tmp/robo/node_modules
        run: node tools/ingressos-robo/sondar-grade.js
