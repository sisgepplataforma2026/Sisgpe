name: Patch Documentos HML

on:
  push:
    branches: ["teste/documentos-ajustes-hml"]
    paths: [".github/workflows/patch-documentos-hml.yml"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: teste/documentos-ajustes-hml
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Aplicar patches pontuais
        shell: python
        run: |
          from pathlib import Path
          import re

          def rd(p): return Path(p).read_text(encoding="utf-8")
          def wr(p,s): Path(p).write_text(s, encoding="utf-8")
          def one(s, old, new, p):
              if old not in s:
                  raise SystemExit("Trecho esperado ausente em " + p + ": " + old[:80])
              return s.replace(old, new, 1)

          # AcessoModulos
          p="AcessoModulos.gs"; s=rd(p)
          s=one(s,'{ chave: "documentos",       rotulo: "Documentos",            sensivel: false }','{ chave: "documentos",       rotulo: "Documentos",            sensivel: true  }',p)
          wr(p,s)

          # OficioService
          p="OficioService.gs"; s=rd(p)
          s=one(s,'var LIMITE_FICHAS_OFICIO = 25;','var LIMITE_FICHAS_OFICIO = 50;',p)
          s=one(s,'var sessaoDocumentos = exigirModulo_(tokenSessao, "documentos", false);','var sessaoDocumentos = exigirAcessoOficioPorTipo_(tokenSessao, dados && dados.tipo);',p)
          wr(p,s)

          # Dashboard: a Home já verifica o módulo Documentos antes de chamar esta fonte.
          p="DashboardOficios.gs"; s=rd(p)
          s=one(s,'exigirSessaoDocumentos_(tokenSessao, false);','exigirModulo_(tokenSessao, "documentos", false);',p)
          wr(p,s)

          # Monitoramento backend: remove confirmações fracas.
          p="MonitoramentoOficios.gs"; s=rd(p)
          old='texto.indexOf("ciente") > -1 ||\n            texto.indexOf("ok") > -1 ||\n            texto.indexOf("acusamos") > -1 ||\n            texto.indexOf("obrigado") > -1 ||\n            texto.indexOf("obrigada") > -1'
          new='texto.indexOf("ciente") > -1 ||\n            texto.indexOf("acusamos o recebimento") > -1 ||\n            texto.indexOf("acuso o recebimento") > -1'
          s=one(s,old,new,p); wr(p,s)

          # Tracking: ContentService não entrega GIF binário por TextOutput.
          p="RastreamentoOficios.gs"; s=rd(p)
          pat=r'function pixelTransparente_\(\) \{.*?\n\}'
          repl='\n'.join([
            'function pixelTransparente_() {',
            '  return ContentService',
            '    .createTextOutput("")',
            '    .setMimeType(ContentService.MimeType.TEXT);',
            '}'
          ])
          s,n=re.subn(pat,repl,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('pixelTransparente_ não localizado')
          wr(p,s)

          # Reenvio: recupera o pacote original da fila (ofício + todas as fichas).
          p="EmailOficios.gs"; s=rd(p)
          pat=r'    var arqOficio = DriveApp\.getFileById\(idOficio\);\n    var anexos    = \[arqOficio\.getBlob\(\)\.setName\(arqOficio\.getName\(\)\)\];\n\n    if \(linkFicha\) \{.*?\n    \}'
          lines=[
            '    var anexos = [];',
            '    var idsAnexados = {};',
            '',
            '    function adicionarArquivoDrive_(fileId, nomePreferido) {',
            '      fileId = String(fileId || "").trim();',
            '      if (!fileId || idsAnexados[fileId]) return false;',
            '      try {',
            '        var arq = DriveApp.getFileById(fileId);',
            '        var blob = arq.getBlob();',
            '        blob.setName(String(nomePreferido || arq.getName() || "anexo").trim());',
            '        anexos.push(blob);',
            '        idsAnexados[fileId] = true;',
            '        return true;',
            '      } catch (eAnexo) {',
            '        Logger.log("⚠ Reenvio — anexo indisponível " + fileId + ": " + eAnexo.message);',
            '        return false;',
            '      }',
            '    }',
            '',
            '    adicionarArquivoDrive_(idOficio, "");',
            '',
            '    try {',
            '      var shFila = ss.getSheetByName("FILA_ENVIO_OFICIOS");',
            '      if (shFila && shFila.getLastRow() >= 2) {',
            '        var hf = getHeaderMap_(shFila);',
            '        var cfNumero = hf["NUMERO_OFICIO"];',
            '        var cfAnexos = hf["ANEXOS_JSON"];',
            '        if (cfNumero && cfAnexos) {',
            '          var df = shFila.getRange(2, 1, shFila.getLastRow() - 1, shFila.getLastColumn()).getValues();',
            '          for (var q = df.length - 1; q >= 0; q--) {',
            '            if (String(df[q][cfNumero - 1] || "").trim() !== numero) continue;',
            '            var jsonFila = String(df[q][cfAnexos - 1] || "").trim();',
            '            if (!jsonFila) continue;',
            '            try {',
            '              var pacote = JSON.parse(jsonFila);',
            '              if (Array.isArray(pacote)) pacote.forEach(function(anexoInfo) {',
            '                if (anexoInfo && anexoInfo.fileId) adicionarArquivoDrive_(anexoInfo.fileId, anexoInfo.nome || "");',
            '              });',
            '            } catch (eJsonFila) {',
            '              Logger.log("⚠ Reenvio — ANEXOS_JSON inválido para " + numero + ": " + eJsonFila.message);',
            '            }',
            '            break;',
            '          }',
            '        }',
            '      }',
            '    } catch (eFilaAnexos) {',
            '      Logger.log("⚠ Reenvio — não foi possível recuperar o pacote da fila: " + eFilaAnexos.message);',
            '    }',
            '',
            '    if (linkFicha) {',
            '      var idFicha = extrairIdDrive_(linkFicha);',
            '      if (idFicha) adicionarArquivoDrive_(idFicha, "");',
            '    }',
            '',
            '    if (!anexos.length) {',
            '      return { erro: true, mensagem: "Nenhum arquivo do ofício pôde ser recuperado para o reenvio." };',
            '    }'
          ]
          s,n=re.subn(pat,'\n'.join(lines),s,count=1,flags=re.S)
          if n!=1: raise SystemExit('Bloco antigo do reenvio não localizado')
          wr(p,s)

          # Numeração atômica.
          p="Oficios.gs"; s=rd(p)
          marker='/* ================= NUMERAÇÃO ================= */\n\n'
          if marker not in s: raise SystemExit('Marcador de numeração ausente')
          helper='\n'.join([
            'function oficiosChaveSequencia_(ano) {',
            '  return "OFICIOS_SEQUENCIA_" + String(ano || "").trim();',
            '}',
            '',
            'function oficiosNumeroDoAno_(valor, ano) {',
            '  var texto = String(valor || "").trim();',
            '  var m = texto.match(/^(\\d+)\\s*\\/\\s*(\\d{4})$/);',
            '  if (!m || m[2] !== String(ano)) return 0;',
            '  var n = parseInt(m[1], 10);',
            '  return isNaN(n) ? 0 : n;',
            '}',
            '',
            'function oficiosMaiorNumeroConhecido_(ss, sheetControle, colNumero, ano) {',
            '  var maior = PRIMEIRO_OFICIO_PLATAFORMA - 1;',
            '  function considerar(valor) {',
            '    var n = oficiosNumeroDoAno_(valor, ano);',
            '    if (n > maior) maior = n;',
            '  }',
            '  if (sheetControle && colNumero && sheetControle.getLastRow() > 1) {',
            '    sheetControle.getRange(2, colNumero, sheetControle.getLastRow() - 1, 1).getValues().forEach(function(r) { considerar(r[0]); });',
            '  }',
            '  try {',
            '    var shFila = ss.getSheetByName("FILA_ENVIO_OFICIOS");',
            '    if (shFila && shFila.getLastRow() > 1) {',
            '      var hmFila = getHeaderMap_(shFila);',
            '      var colFila = hmFila["NUMERO_OFICIO"];',
            '      if (colFila) shFila.getRange(2, colFila, shFila.getLastRow() - 1, 1).getValues().forEach(function(r) { considerar(r[0]); });',
            '    }',
            '  } catch (eFila) { Logger.log("oficiosMaiorNumeroConhecido_.fila: " + eFila.message); }',
            '  var props = PropertiesService.getScriptProperties();',
            '  try { considerar(props.getProperty("TAXA_ASSISTENCIAL_NUMERO_OFICIO")); }',
            '  catch (eTaxa) { Logger.log("oficiosMaiorNumeroConhecido_.taxa: " + eTaxa.message); }',
            '  try {',
            '    var reservado = parseInt(props.getProperty(oficiosChaveSequencia_(ano)) || "0", 10);',
            '    if (!isNaN(reservado) && reservado > maior) maior = reservado;',
            '  } catch (eSeq) { Logger.log("oficiosMaiorNumeroConhecido_.sequencia: " + eSeq.message); }',
            '  return maior;',
            '}',
            ''
          ])
          s=s.replace(marker,marker+helper+'\n',1)
          pat=r'function preverProximoNumeroOficio\(\) \{.*?\n\}\n\nfunction gerarProximoNumeroSeguro\(\) \{.*?\n\}\n'
          num='\n'.join([
            'function preverProximoNumeroOficio() {',
            '  var ss = SpreadsheetApp.openById(PLANILHA_ID);',
            '  var sheet = ss.getSheetByName(PLANILHA_REGISTRO);',
            '  if (!sheet) throw new Error("Aba de registro não encontrada.");',
            '  var headerMap = getHeaderMap_(sheet);',
            '  var colNumero = headerMap["Número do Ofício"];',
            '  if (!colNumero) throw new Error("Coluna \'Número do Ofício\' não encontrada.");',
            '  var ano = anoAtual_();',
            '  var maiorNumero = oficiosMaiorNumeroConhecido_(ss, sheet, colNumero, ano);',
            '  var proximo = String(maiorNumero + 1).padStart(3, "0") + "/" + ano;',
            '  Logger.log("Prévia do próximo número: " + proximo);',
            '  return proximo;',
            '}',
            '',
            'function gerarProximoNumeroSeguro() {',
            '  var trava = travarSisgep_(15000);',
            '  try {',
            '    var ss = SpreadsheetApp.openById(PLANILHA_ID);',
            '    var sheet = ss.getSheetByName(PLANILHA_REGISTRO);',
            '    var ano = anoAtual_();',
            '    if (!sheet) throw new Error("Aba de registro não encontrada.");',
            '    var headerMap = getHeaderMap_(sheet);',
            '    var colNumero = headerMap["Número do Ofício"];',
            '    if (!colNumero) throw new Error("Coluna \'Número do Ofício\' não encontrada.");',
            '    var maiorNumero = oficiosMaiorNumeroConhecido_(ss, sheet, colNumero, ano);',
            '    var proximoNumero = maiorNumero + 1;',
            '    PropertiesService.getScriptProperties().setProperty(oficiosChaveSequencia_(ano), String(proximoNumero));',
            '    var proximo = String(proximoNumero).padStart(3, "0") + "/" + ano;',
            '    Logger.log("gerarProximoNumeroSeguro [RESERVADO]: " + proximo);',
            '    return proximo;',
            '  } finally {',
            '    trava.liberar();',
            '  }',
            '}',
            ''
          ])
          s,n=re.subn(pat,num,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('Bloco de numeração antigo não localizado')
          s=one(s,'var sessao = exigirSessaoDocumentos_(tokenSessao, false);\n  Logger.log("✅ previewOficioWeb','var sessao = exigirAcessoOficioPorTipo_(tokenSessao, dados && dados.tipo);\n  Logger.log("✅ previewOficioWeb',p)
          pos=s.find('function gerarOficioWeb(dados, tokenSessao)')
          if pos<0: raise SystemExit('gerarOficioWeb ausente')
          head,tail=s[:pos],s[pos:]
          tail=one(tail,'var sessaoDocumentos = exigirSessaoDocumentos_(tokenSessao, false);','var sessaoDocumentos = exigirAcessoOficioPorTipo_(tokenSessao, dados && dados.tipo);',p)
          wr(p,head+tail)

          # Monitoramento frontend: retries e estado de erro persistente.
          p="OficiosScripts.html"; s=rd(p)
          pat=r'function carregarMonitoramento\(filtros\) \{.*?\.listarStatusOficios\(filtros, SISGEP_TOKEN_SESSAO\);\n\}'
          lines=[
            'function carregarMonitoramento(filtros, tentativa) {',
            '  filtros = filtros || {};',
            '  tentativa = tentativa || 1;',
            '  var painel = $("painelMonitoramento");',
            '  if (painel) painel.innerHTML = \'<div style="text-align:center;padding:36px;color:var(--g400);font-size:13px;font-weight:500;">⏳ Carregando...</div>\';',
            '  google.script.run',
            '    .withSuccessHandler(function(retorno) {',
            '      if (retorno && retorno.erro) { renderErroMonitoramento(retorno.mensagem || "Falha ao consultar o monitoramento.", filtros); return; }',
            '      renderMonitoramento(retorno || {itens:[],resumo:{}});',
            '    })',
            '    .withFailureHandler(function(err) {',
            '      var msg = (err && err.message) || String(err);',
            '      var n = String(msg || "").toLowerCase();',
            '      var permanente = n.indexOf("sessão") > -1 || n.indexOf("sessao") > -1 || n.indexOf("acesso") > -1 || n.indexOf("permiss") > -1;',
            '      if (!permanente && tentativa < 3) {',
            '        setTimeout(function() { carregarMonitoramento(filtros, tentativa + 1); }, 1800 * tentativa);',
            '        return;',
            '      }',
            '      renderErroMonitoramento(msg, filtros);',
            '    })',
            '    .listarStatusOficios(filtros, SISGEP_TOKEN_SESSAO);',
            '}',
            '',
            'function renderErroMonitoramento(msg, filtros) {',
            '  var painel = $("painelMonitoramento");',
            '  if (!painel) return;',
            '  painel.innerHTML = \'<div style="text-align:center;padding:34px 18px;color:var(--g600);">\'',
            '    + \'<div style="font-size:30px;margin-bottom:8px;">⚠️</div>\'',
            '    + \'<div style="font-weight:800;color:var(--red,#dc2626);">Não foi possível carregar o Monitoramento</div>\'',
            '    + \'<div style="font-size:12px;margin-top:8px;">\' + escapeHtml(msg || "Erro desconhecido") + \'</div>\'',
            '    + \'<button type="button" id="btnMonTentarNovamente" class="btn btn-navy" style="margin-top:16px;">🔄 Tentar novamente</button>\'',
            '    + \'</div>\';',
            '  var btn = $("btnMonTentarNovamente");',
            '  if (btn) btn.onclick = function() { carregarMonitoramento(filtros || {}, 1); };',
            '}'
          ]
          s,n=re.subn(pat,'\n'.join(lines),s,count=1,flags=re.S)
          if n!=1: raise SystemExit('carregarMonitoramento antigo não localizado')
          wr(p,s)

      - name: Validar sintaxe e invariantes
        shell: bash
        run: |
          set -euo pipefail
          for f in AcessoModulos.gs DashboardOficios.gs DocumentosSeguranca.gs EmailOficios.gs MonitoramentoOficios.gs OficioService.gs Oficios.gs RastreamentoOficios.gs; do
            cp "$f" /tmp/validate.js
            node --check /tmp/validate.js
          done
          git diff --check
          grep -q 'OFICIOS_SEQUENCIA_' Oficios.gs
          grep -q 'setProperty(oficiosChaveSequencia_(ano), String(proximoNumero))' Oficios.gs
          grep -q 'LIMITE_FICHAS_OFICIO = 50' OficioService.gs
          grep -q 'ANEXOS_JSON' EmailOficios.gs
          grep -q 'pacote.forEach' EmailOficios.gs
          grep -q 'tentativa < 3' OficiosScripts.html
          grep -q 'renderErroMonitoramento' OficiosScripts.html
          ! grep -q 'texto.indexOf("ok")' MonitoramentoOficios.gs
          ! grep -q 'texto.indexOf("obrigado")' MonitoramentoOficios.gs
          ! grep -q 'MimeType.GIF' RastreamentoOficios.gs

      - name: Rodar testes da homologacao
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm test

      - name: Commitar patches aprovados
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AcessoModulos.gs DashboardOficios.gs EmailOficios.gs MonitoramentoOficios.gs OficioService.gs Oficios.gs OficiosScripts.html RastreamentoOficios.gs
          git commit -m "fix(documentos): portar ajustes criticos para HML"
          git push origin HEAD:teste/documentos-ajustes-hml
