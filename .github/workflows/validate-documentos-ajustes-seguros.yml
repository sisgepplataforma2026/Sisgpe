name: Validar lote seguro de Documentos

on:
  push:
    branches: ["correcao/documentos-ajustes-seguros"]
    paths: [".github/workflows/validate-documentos-ajustes-seguros.yml"]

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: correcao/documentos-ajustes-seguros
          fetch-depth: 0

      - name: Validar JavaScript alterado
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            AcessoModulos.js \
            DashboardOficios.js \
            DocumentosSeguranca.js \
            MonitoramentoOficios.js \
            OficioService.js \
            Oficios.js \
            RastreamentoOficios.js; do
            node --check "$f"
          done
          git diff --check origin/auditoria/producao-limpa --

      - name: Confirmar escopo funcional exato
        shell: python
        run: |
          import subprocess

          esperado = {
            "AcessoModulos.js",
            "DashboardOficios.js",
            "DocumentosSeguranca.js",
            "MonitoramentoOficios.js",
            "OficioService.js",
            "Oficios.js",
            "RastreamentoOficios.js",
          }
          out = subprocess.check_output([
            "git", "diff", "--name-only", "origin/auditoria/producao-limpa", "--"
          ], text=True)
          funcionais = {x.strip() for x in out.splitlines() if x.strip() and not x.startswith(".github/")}
          if funcionais != esperado:
            raise SystemExit(f"Escopo inesperado: {sorted(funcionais)}")

      - name: Confirmar invariantes de seguranca
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'OFICIOS_SEQUENCIA_' Oficios.js
          grep -q 'setProperty(oficiosChaveSequencia_(ano), String(proximoNumero))' Oficios.js
          grep -q 'exigirAcessoOficioPorTipo_' Oficios.js
          grep -q 'exigirModulo_(tokenSessao, "documentos", false)' DashboardOficios.js
          grep -q 'documentosExigirHomologacaoSegura_' DocumentosSeguranca.js
          grep -q 'ambiente !== "homologacao"' DocumentosSeguranca.js
          grep -q 'idAtivo === idProducao' DocumentosSeguranca.js
          ! grep -q 'texto.indexOf("ok")' MonitoramentoOficios.js
          ! grep -q 'texto.indexOf("obrigado")' MonitoramentoOficios.js
          python - <<'PY'
          import json
          with open('appsscript.json', encoding='utf-8') as f:
              manifest = json.load(f)
          assert manifest.get('timeZone') == 'America/Sao_Paulo', manifest.get('timeZone')
          PY
