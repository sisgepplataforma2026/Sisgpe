name: Hotfix seletivo Fila Oficios - HML

on:
  push:
    branches:
      - integracao/sisgep-homologacao
    paths:
      - scripts/hotfix-fila-envio-agora.js
      - tests/e2e/t57-envio-fila-id-unico.js
      - .github/workflows/hotfix-fila-homologacao.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hotfix-fila-hml
  cancel-in-progress: false

jobs:
  hotfix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout da branch de homologacao
        uses: actions/checkout@v4
        with:
          ref: integracao/sisgep-homologacao
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Aplicar hotfix no backend e na tela
        run: node scripts/hotfix-fila-envio-agora.js

      - name: Validar alteracao esperada
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'function enviarOficioDaFilaAgora(numero, tokenSessao, filaId)' FilaOficios.gs
          grep -q 'var filaIdBuscado = String(filaId || "").trim();' FilaOficios.gs
          grep -q 'var colId.*headerMap\["ID"\]' FilaOficios.gs
          grep -q 'lockEnvioAgora.tryLock(15000)' FilaOficios.gs
          grep -q 'var filaId = dadosGerados.filaId || "";' OficiosScripts.html
          grep -q 'function enviarEmailOficioAgora(numero, filaId)' OficiosScripts.html
          grep -q 'enviarOficioDaFilaAgora(numero, SISGEP_TOKEN_SESSAO, filaId || "")' OficiosScripts.html
          git --no-pager diff --check -- FilaOficios.gs OficiosScripts.html
          git --no-pager diff -- FilaOficios.gs OficiosScripts.html

      - name: Instalar dependencias de teste
        run: npm ci || npm install

      - name: Preparar caminho legado dos testes
        shell: bash
        run: |
          sudo mkdir -p /home/user
          sudo rm -rf /home/user/Sisgpe
          sudo ln -s "$GITHUB_WORKSPACE" /home/user/Sisgpe

      - name: Testar anexos e envio existente
        run: node tests/e2e/t56-envio-anexa-ficha.js

      - name: Testar numero duplicado com filaId
        run: node tests/e2e/t57-envio-fila-id-unico.js

      - name: Registrar hotfix na branch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- FilaOficios.gs OficiosScripts.html; then
            echo 'Arquivos ja estavam ajustados.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add FilaOficios.gs OficiosScripts.html
          git commit -m 'fix: enviar oficio pelo id unico da fila'
          git push origin HEAD:integracao/sisgep-homologacao

      - name: Instalar clasp
        run: npm install -g @google/clasp

      - name: Validar credenciais e alvo de homologacao
        shell: bash
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          CLASP_JSON_HOMOLOG: ${{ secrets.CLASP_JSON_HOMOLOG }}
          DEPLOY_ID: ${{ secrets.CLASP_DEPLOYMENT_ID_HOMOLOG }}
        run: |
          set -euo pipefail
          test -n "$CLASPRC_JSON"
          test -n "$CLASP_JSON_HOMOLOG"
          test -n "$DEPLOY_ID"
          mkdir -p "$HOME"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          mkdir -p /tmp/sisgep-hml
          printf '%s' "$CLASP_JSON_HOMOLOG" > /tmp/sisgep-hml/.clasp.json
          node -e 'const fs=require("fs"); const j=JSON.parse(fs.readFileSync("/tmp/sisgep-hml/.clasp.json","utf8")); if(j.scriptId!=="1S_LckCVMJy0dza6tlw5w9Vq7ZqJ9RzxsrYoPMR1zl65rKXC-JgvDUSVR") { console.error("Alvo bloqueado: Script ID nao e o da Homologacao."); process.exit(1); }'
          if [ "$DEPLOY_ID" != 'AKfycbzOfoQ4y2yc7oM9hiz2ATvB6YztGEMDjgO1FiezQ0schgqcOJnJgROzCC3sEeV6h4n0ZA' ]; then
            echo 'Alvo bloqueado: Deployment ID nao e o da Homologacao.' >&2
            exit 1
          fi

      - name: Puxar estado atual da Homologacao
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/sisgep-hml
          clasp pull
          cp FilaOficios.gs FilaOficios.gs.antes-hotfix
          cp OficiosScripts.html OficiosScripts.html.antes-hotfix

      - name: Substituir somente os dois arquivos do hotfix
        shell: bash
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/FilaOficios.gs" /tmp/sisgep-hml/FilaOficios.gs
          cp "$GITHUB_WORKSPACE/OficiosScripts.html" /tmp/sisgep-hml/OficiosScripts.html
          grep -q 'function enviarOficioDaFilaAgora(numero, tokenSessao, filaId)' /tmp/sisgep-hml/FilaOficios.gs
          grep -q 'var filaIdBuscado = String(filaId || "").trim();' /tmp/sisgep-hml/FilaOficios.gs
          grep -q 'function enviarEmailOficioAgora(numero, filaId)' /tmp/sisgep-hml/OficiosScripts.html
          grep -q 'enviarOficioDaFilaAgora(numero, SISGEP_TOKEN_SESSAO, filaId || "")' /tmp/sisgep-hml/OficiosScripts.html
          echo '--- diff FilaOficios.gs ---'
          diff -u /tmp/sisgep-hml/FilaOficios.gs.antes-hotfix /tmp/sisgep-hml/FilaOficios.gs || true
          echo '--- diff OficiosScripts.html ---'
          diff -u /tmp/sisgep-hml/OficiosScripts.html.antes-hotfix /tmp/sisgep-hml/OficiosScripts.html || true
          rm /tmp/sisgep-hml/*.antes-hotfix

      - name: Enviar estado preservado para Apps Script - HML
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/sisgep-hml
          clasp push --force

      - name: Criar versao e publicar Web App de HML
        id: versao
        shell: bash
        env:
          DEPLOY_ID: ${{ secrets.CLASP_DEPLOYMENT_ID_HOMOLOG }}
        run: |
          set -euo pipefail
          cd /tmp/sisgep-hml
          clasp version "hml-fila-id-${GITHUB_SHA::7}" | tee /tmp/saida-versao.txt
          NUM=$(grep -oE '[0-9]+' /tmp/saida-versao.txt | tail -1)
          test -n "$NUM"
          clasp deploy --deploymentId "$DEPLOY_ID" --versionNumber "$NUM" --description "hml-fila-id-${GITHUB_SHA::7}"
          echo "numero=$NUM" >> "$GITHUB_OUTPUT"
          echo "Homologacao publicada na versao $NUM."
