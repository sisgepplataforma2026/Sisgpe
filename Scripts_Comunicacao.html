        return {
          id: c.id || c.ID || c.Id || "",
          nome: c.nome || c.Nome || "",
          telefone: c.telefone || c.Telefone || "",

          cidade: c.cidade || c.Cidade || "",
          escola: c.escola || c.Escola || "",
          status: c.status || c.Status || "ATIVO",
          __idx: i
        };
      });

      window.__CONTATOS_SISGEP__ = listaNormalizada;

      renderizarContatos(listaNormalizada);
      AcaoEscola.carregarEscolas(listaNormalizada);

      carregarBaseEscolasComunicacao();

    })

function copiarTextoSeguro(texto,mensagemSucesso){
  var valor=String(texto||"").trim();
  if(!valor){alert("Nenhum conteúdo disponível para copiar.");return Promise.resolve(false);}
  if(navigator.clipboard&&navigator.clipboard.writeText){ return navigator.clipboard.writeText(valor).then(function(){if(mensagemSucesso) alert(mensagemSucesso);return true;}).catch(function(){return copiarTextoFallback(valor,mensagemSucesso);}); }
  return copiarTextoFallback(valor,mensagemSucesso);
}

function copiarTextoFallback(texto,mensagemSucesso){
  return new Promise(function(resolve){ try{ var textarea=document.createElement("textarea"); textarea.value=texto; textarea.setAttribute("readonly","readonly"); textarea.style.cssText="position:fixed;opacity:0;pointer-events:none;"; document.body.appendChild(textarea); textarea.select(); textarea.setSelectionRange(0,textarea.value.length); var ok=document.execCommand("copy"); document.body.removeChild(textarea); if(ok){if(mensagemSucesso) alert(mensagemSucesso);resolve(true);}else{alert("Não foi possível copiar automaticamente.");resolve(false);} }catch(e){alert("Não foi possível copiar automaticamente.");resolve(false);} });
}

    var unicas=Array.from(new Set(lista.map(function(c){return String(c.escola||"").trim();}).filter(Boolean))).sort(function(a,b){return a.localeCompare(b,"pt-BR",{sensitivity:"base"});});
    select.innerHTML='<option value="">Selecione uma escola...</option>';
    unicas.forEach(function(escola){var opt=document.createElement("option");opt.value=escola;opt.textContent=escola;select.appendChild(opt);});
  },
  atualizarEscolaSelecionada: function(){
    var select=document.getElementById("acaoEscolaSelect"),qtdEl=document.getElementById("acaoEscolaQtd"),contatosEl=document.getElementById("acaoEscolaContatos"); if(!select) return;
    var escola=String(select.value||"").trim(),base=window.__CONTATOS_SISGEP__||[];
    if(!escola){if(qtdEl) qtdEl.value="";if(contatosEl) contatosEl.value="";return;}
    var contatos=base.filter(function(c){return String(c.escola||"").trim()===escola;});
    if(qtdEl) qtdEl.value=contatos.length+" contato(s)";
    if(contatosEl) contatosEl.value=contatos.length?contatos.map(function(c){return String(c.nome||"").trim()+" — "+(formatarTelefoneExibicao(c.telefoneLimpo||c.telefone||"")||String(c.telefone||""));}).join("\n"):"Nenhum contato encontrado para esta escola.";
  },
  selecionarArquivo: function(event){ var arquivo=event&&event.target&&event.target.files?event.target.files[0]:null; window.__ACAO_ESCOLA_ARQUIVO__=arquivo||null; var nomeEl=document.getElementById("acaoEscolaNomeArquivo"); if(!nomeEl) return; if(!arquivo){nomeEl.innerText="Nenhum arquivo selecionado";nomeEl.style.color="#475569";return;} nomeEl.innerText="Arquivo: "+arquivo.name;nomeEl.style.color="#0f766e"; },
  obterContatosDaEscola: function(){ var select=document.getElementById("acaoEscolaSelect"); if(!select) return []; var escola=String(select.value||"").trim(); return (window.__CONTATOS_SISGEP__||[]).filter(function(c){return String(c.escola||"").trim()===escola;}); },
  copiarNumeros: function(){ var contatos=AcaoEscola.obterContatosDaEscola(); if(!contatos.length){alert("Selecione uma escola com contatos.");return;} var numeros=contatos.map(function(c){return String(c.telefoneLimpo||normalizarTelefoneFrontend(c.telefone||"")||"").trim();}).filter(Boolean).join(","); if(!numeros){alert("Nenhum número encontrado.");return;} copiarTextoSeguro(numeros,"✅ Números da escola copiados com sucesso!"); },
  abrirWhatsApp: function(){
    var select=document.getElementById("acaoEscolaSelect"),msgEl=document.getElementById("acaoEscolaMensagem"),contatos=AcaoEscola.obterContatosDaEscola(),escola=select?String(select.value||"").trim():"",mensagem=msgEl?String(msgEl.value||"").trim():"",arquivo=window.__ACAO_ESCOLA_ARQUIVO__;
    if(!escola) return alert("Selecione uma escola."); if(!contatos.length) return alert("Nenhum contato encontrado."); if(!mensagem){alert("Digite a mensagem.");if(msgEl) msgEl.focus();return;}
    var numeros=contatos.map(function(c){return String(c.telefoneLimpo||normalizarTelefoneFrontend(c.telefone||"")||"").trim();}).filter(Boolean).join(",");
    if(numeros) copiarTextoSeguro(numeros,"");
    window.open("https://wa.me/?text="+encodeURIComponent(mensagem),"_blank");
    var aviso="Escola: "+escola+"\nQuantidade de contatos: "+contatos.length+"\n\n✅ Mensagem preparada no WhatsApp.\n✅ Números copiados.\n\nAgora cole os números no WhatsApp.";
    if(arquivo) aviso+="\n📎 Anexe manualmente o arquivo: "+arquivo.name;
    alert(aviso);
  },
  limpar: function(){ ["acaoEscolaSelect","acaoEscolaQtd","acaoEscolaContatos","acaoEscolaMensagem","acaoEscolaArquivo"].forEach(function(id){var el=document.getElementById(id);if(el) el.value="";}); var nomeArqEl=document.getElementById("acaoEscolaNomeArquivo"); if(nomeArqEl){nomeArqEl.innerText="Nenhum arquivo selecionado";nomeArqEl.style.color="#475569";} window.__ACAO_ESCOLA_ARQUIVO__=null; }
};

function abrirMissaoComunicacao(missao){
  var blocos={contatos:document.getElementById("blocoMissaoContatos"),escola:document.getElementById("blocoMissaoEscola"),listas:document.getElementById("blocoMissaoListas"),ferramentas:document.getElementById("blocoMissaoFerramentas")};
  var missaoValida=blocos[missao]?missao:"contatos";
  Object.keys(blocos).forEach(function(key){if(blocos[key]) blocos[key].style.display=(key===missaoValida)?"block":"none";});
  document.querySelectorAll(".btn-missao-comunicacao").forEach(function(btn){btn.classList.remove("active");});
  var botaoMap={contatos:"btnMissaoContatos",escola:"btnMissaoEscola",listas:"btnMissaoListas",ferramentas:"btnMissaoFerramentas"};
  var btnAtivo=document.getElementById(botaoMap[missaoValida]); if(btnAtivo) btnAtivo.classList.add("active");
  localStorage.setItem("sisgep_missao_comunicacao",missaoValida);
}

function initMissoesComunicacao(){
  var mapa=[{id:"btnMissaoContatos",missao:"contatos"},{id:"btnMissaoEscola",missao:"escola"},{id:"btnMissaoListas",missao:"listas"},{id:"btnMissaoFerramentas",missao:"ferramentas"}];
  mapa.forEach(function(item){ var btn=document.getElementById(item.id); if(btn&&!btn.dataset.boundMission){btn.dataset.boundMission="1";btn.addEventListener("click",function(){abrirMissaoComunicacao(item.missao);});} });
  abrirMissaoComunicacao(localStorage.getItem("sisgep_missao_comunicacao")||"contatos");
}

function disparoRapido(){ var mensagem=prompt("Digite o comunicado:"); if(!mensagem) return; window.open("https://wa.me/?text="+encodeURIComponent(mensagem),"_blank"); }

function carregarBaseEscolasComunicacao(){

  google.script.run
    .withSuccessHandler(function(escolas){

      var listaEscolas = (escolas || []).map(function(e, i){
        return {
          escola: e.escola || e.NomeEscola || e.nomeEscola || e.nome || "",
          fantasia: e.fantasia || e.Fantasia || "",
          cnpj: e.cnpj || e.CNPJ || "",
          email: e.email || e.Email || e.emailsTodos || e.EmailsTodos || "",
          cidade: e.cidade || e.Municipio || e.municipio || "",
          uf: e.uf || e.UF || "",
          situacao: e.situacao || e.Situacao || "ATIVA",
          __idx: i
        };
      }).filter(function(e){
        return String(e.escola || "").trim();
      });

      window.__ESCOLAS_SISGEP__ = listaEscolas;

      atualizarDashboardComunicacao();
      atualizarDashboardEscolas();

    })
    .withFailureHandler(function(err){

      console.log("Erro ao carregar base de escolas:", err);

      window.__ESCOLAS_SISGEP__ = [];

      atualizarDashboardComunicacao();
      atualizarDashboardEscolas();

    })
    .listarEscolas();
}

function atualizarDashboardComunicacao(){

  var contatos = window.__CONTATOS_SISGEP__ || [];
  var escolasBase = window.__ESCOLAS_SISGEP__ || [];

  var escolasVinculadas = new Set();
  var emails = 0;
  var whats = 0;

  contatos.forEach(function(c){

    var escola = String(c.escola || c.cidade || "").trim();
    var email = String(c.email || "").trim();
    var telefone = String(c.telefoneLimpo || c.telefone || "").trim();

    if(escola){
      escolasVinculadas.add(escola);
    }

    if(email){
      emails++;
    }

    if(telefone){
      whats++;
    }

  });

  setTextoPorIds(["statTotal", "statContatos", "totalContatos", "cardTotalContatos"], contatos.length);
  setTextoPorIds(["statAtivos", "statWhats", "cardWhats"], whats);
  setTextoPorIds(["statEscolas", "cardEscolas"], escolasBase.length || escolasVinculadas.size);
  setTextoPorIds(["statRecentes", "statEmails", "cardEmails"], emails);
}

function atualizarDashboardEscolas(){

  var contatos = window.__CONTATOS_SISGEP__ || [];
  var escolasBase = window.__ESCOLAS_SISGEP__ || [];

  var escolasComContatos = new Set();
  var emails = 0;
  var whats = 0;

  contatos.forEach(function(c){

    var escola = String(c.escola || c.cidade || "").trim();
    var email = String(c.email || "").trim();
    var telefone = String(c.telefoneLimpo || c.telefone || "").trim();

    if(escola){
      escolasComContatos.add(escola);
    }

    if(email){
      emails++;
    }

    if(telefone){
      whats++;
    }

  });

  atualizarTextoSeExistir("miniMetricEscolas", escolasBase.length || escolasComContatos.size);
  atualizarTextoSeExistir("miniMetricContatos", contatos.length);
  atualizarTextoSeExistir("miniMetricWhats", whats);
  atualizarTextoSeExistir("miniMetricEmail", emails);
}
function atualizarTextoSeExistir(id, valor){
  var el = document.getElementById(id);
  if(el){
    el.innerText = valor;
  }
}

function setTextoPorIds(ids, valor){
  ids.forEach(function(id){
    var el = document.getElementById(id);
    if(el){
      el.innerText = valor;
    }
  });
}

    if (typeof carregarContatos === "function") {
