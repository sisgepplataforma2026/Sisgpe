<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    *{box-sizing:border-box}body{margin:0;background:#071629;color:#fff;font-family:Arial,sans-serif;min-height:100vh;overflow:hidden}.top{height:18vh;padding:24px 38px;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(135deg,#001f4d,#0d6b46)}.brand{font-size:2.2vw;font-weight:900}.round{text-align:right}.round b{font-size:2vw}.round span{display:block;font-size:1.1vw;opacity:.8;margin-top:5px}.main{height:82vh;display:grid;grid-template-columns:42% 58%;gap:0}.current{display:flex;flex-direction:column;align-items:center;justify-content:center;border-right:1px solid rgba(255,255,255,.12)}.current small{font-size:1.4vw;text-transform:uppercase;letter-spacing:.15em;opacity:.65}.ball{width:18vw;height:18vw;max-width:300px;max-height:300px;border-radius:50%;background:#fff;color:#001f4d;display:flex;align-items:center;justify-content:center;margin:20px;box-shadow:0 0 50px rgba(255,255,255,.12)}.ball strong{font-size:7vw}.ball em{font-size:2.5vw;font-style:normal;margin-right:7px;color:#0d6b46}.status{font-size:1.4vw;font-weight:800;text-align:center;max-width:80%}.board{padding:24px 30px;display:flex;flex-direction:column}.headers,.nums{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.headers div{text-align:center;font-size:2vw;font-weight:900;padding:8px;border-radius:9px;background:#0d6b46}.nums{margin-top:8px;grid-auto-rows:1fr;flex:1}.n{display:flex;align-items:center;justify-content:center;border-radius:9px;background:rgba(255,255,255,.08);font-size:1.45vw;font-weight:800}.n.hit{background:#fff;color:#001f4d}.alert{position:fixed;inset:0;background:rgba(5,55,30,.96);display:none;align-items:center;justify-content:center;flex-direction:column;z-index:10;text-align:center}.alert.show{display:flex}.alert h1{font-size:7vw;margin:0}.alert p{font-size:2vw;margin:15px}.winner{font-size:3vw;font-weight:900}.recent{position:absolute;bottom:18px;left:25px;right:25px;display:flex;gap:8px;justify-content:center}.recent span{background:rgba(255,255,255,.14);padding:8px 12px;border-radius:999px;font-size:1vw;font-weight:800}
  </style>
</head>
<body>
<div class="top"><div class="brand">SINDEDUCAÇÃO · BINGO ONLINE</div><div class="round"><b id="rodada">Rodada</b><span id="premio">Aguardando configuração</span></div></div>
<div class="main"><div class="current"><small>Último número</small><div class="ball"><em id="letra">—</em><strong id="numero">—</strong></div><div id="status" class="status">Aguardando início</div></div><div class="board"><div class="headers"><div>B</div><div>I</div><div>N</div><div>G</div><div>O</div></div><div id="nums" class="nums"></div></div></div>
<div id="alert" class="alert"><h1>🎉 BINGO!</h1><p>O sorteio foi pausado para conferência.</p><div id="winner" class="winner"></div></div>
<div id="recent" class="recent"></div>
<script>
var q=new URLSearchParams(location.search),TOKEN=q.get('sessao')||'',EVENTO=q.get('evento')||'',RODADA=q.get('rodada')||'';
function montar(){var h='';for(var c=0;c<5;c++){var ini=c*15+1;for(var i=ini;i<ini+15;i++)h+='<div id="n'+i+'" class="n">'+i+'</div>'}document.getElementById('nums').innerHTML=h}
function sync(){if(!TOKEN||!EVENTO||!RODADA)return;google.script.run.withSuccessHandler(function(s){var r=s.rodada||{},ss=s.sorteios||[],ds=s.deteccoes||[];document.getElementById('rodada').textContent=r.nome||'Rodada';document.getElementById('premio').textContent=r.premioDescricao||'SindEducação';document.getElementById('status').textContent=String(r.status||'').replace(/_/g,' ');document.querySelectorAll('.n').forEach(function(x){x.classList.remove('hit')});ss.forEach(function(x){var el=document.getElementById('n'+x.numero);if(el)el.classList.add('hit')});var u=ss.length?ss[ss.length-1]:null;document.getElementById('letra').textContent=u?u.letra:'—';document.getElementById('numero').textContent=u?u.numero:'—';document.getElementById('recent').innerHTML=ss.slice(-8).reverse().map(function(x){return '<span>'+x.letra+'-'+x.numero+'</span>'}).join('');var pend=ds.filter(function(d){return d.status==='AGUARDANDO_MANIFESTACAO'});var conf=ds.filter(function(d){return d.status==='CONFIRMADO'});var a=document.getElementById('alert');if(pend.length||conf.length){a.classList.add('show');document.getElementById('winner').textContent=conf.length?'BINGO CONFIRMADO':'AGUARDANDO MANIFESTAÇÃO'}else a.classList.remove('show')}).bingo_estadoAdmin(EVENTO,RODADA,TOKEN)}
montar();sync();setInterval(sync,2000);
</script>
</body>
</html>
