<script>
/* =====================================================
  SISGEP - Scripts_China.html
  RESERVA PARQUE DO CHINA
===================================================== */

function moedaBR(v){ return Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }
function mostrarMsgChina(tipo,texto){ var el=document.getElementById('chinaMensagem'); if(!el) return; el.className='china-msg '+(tipo==='ok'?'ok':'erro'); el.innerHTML=texto||''; }
function limparMsgChina(){ var el=document.getElementById('chinaMensagem'); if(!el) return; el.className='china-msg'; el.innerHTML=''; }
function normalizarCPFChina(cpf){ return String(cpf||'').replace(/\D/g,''); }

function validarCPFChina(cpf){
  cpf=normalizarCPFChina(cpf);
  if(cpf.length!==11) return false;
  if(/^(\d)\1+$/.test(cpf)) return false;
  var soma=0,resto,i;
  for(i=1;i<=9;i++) soma+=parseInt(cpf.substring(i-1,i),10)*(11-i);
  resto=(soma*10)%11; if(resto===10||resto===11) resto=0;
  if(resto!==parseInt(cpf.substring(9,10),10)) return false;
  soma=0;
  for(i=1;i<=10;i++) soma+=parseInt(cpf.substring(i-1,i),10)*(12-i);
  resto=(soma*10)%11; if(resto===10||resto===11) resto=0;
  return resto===parseInt(cpf.substring(10,11),10);
}

function atualizarValorExtraChina(){
  var qtdEl=document.getElementById('chinaQuantidadePessoas'), extraEl=document.getElementById('chinaColchaoExtra'), valorEl=document.getElementById('chinaValorExtra');
  if(!qtdEl||!extraEl||!valorEl) return;
  var qtd=Number(qtdEl.value||0), extra=extraEl.value;
  valorEl.value=moedaBR((qtd===5&&extra==='SIM')?80:0);
}

function aplicarMascaraCPFChina(valor){ var v=String(valor||'').replace(/\D/g,'').substring(0,11); v=v.replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d{1,2})$/,'$1-$2'); return v; }

function aplicarMascaraTelefoneChina(valor){ var v=String(valor||'').replace(/\D/g,'').substring(0,11); if(v.length<=10){v=v.replace(/(\d{2})(\d)/,'($1) $2').replace(/(\d{4})(\d)/,'$1-$2');}else{v=v.replace(/(\d{2})(\d)/,'($1) $2').replace(/(\d{5})(\d)/,'$1-$2');} return v; }

function coletarDadosChina(){
  return {
    nomeSolicitante:document.getElementById('chinaNomeSolicitante')?document.getElementById('chinaNomeSolicitante').value.trim():"",
    cpf:document.getElementById('chinaCPF')?document.getElementById('chinaCPF').value.trim():"",
    telefone:document.getElementById('chinaTelefone')?document.getElementById('chinaTelefone').value.trim():"",
    email:document.getElementById('chinaEmail')?document.getElementById('chinaEmail').value.trim():"",
    escola:document.getElementById('chinaEscola')?document.getElementById('chinaEscola').value.trim():"",
    chaleSolicitado:document.getElementById('chinaChaleSolicitado')?document.getElementById('chinaChaleSolicitado').value:"",
    dataEntrada:document.getElementById('chinaDataEntrada')?document.getElementById('chinaDataEntrada').value:"",
    dataSaida:document.getElementById('chinaDataSaida')?document.getElementById('chinaDataSaida').value:"",
    quantidadePessoas:document.getElementById('chinaQuantidadePessoas')?document.getElementById('chinaQuantidadePessoas').value:"",
    solicitouColchaoExtra:document.getElementById('chinaColchaoExtra')?document.getElementById('chinaColchaoExtra').value:"",
    observacaoSolicitante:document.getElementById('chinaObservacao')?document.getElementById('chinaObservacao').value.trim():""
  };
}

function validarFormularioChina(dados){
  var erros=[];
  if(!dados.nomeSolicitante) erros.push('Informe o nome do solicitante.');
  if(!dados.cpf) erros.push('Informe o CPF.');
  if(!validarCPFChina(dados.cpf)) erros.push('Informe um CPF válido.');
  if(!dados.telefone) erros.push('Informe o telefone / WhatsApp.');
  if(!dados.dataEntrada) erros.push('Informe a data de entrada.');
  if(!dados.dataSaida) erros.push('Informe a data de saída.');
  if(!dados.quantidadePessoas) erros.push('Informe a quantidade de pessoas.');
  var qtd=Number(dados.quantidadePessoas||0);
  if(qtd<1||qtd>5) erros.push('A quantidade de pessoas deve estar entre 1 e 5.');
  if(qtd===5&&dados.solicitouColchaoExtra!=='SIM') erros.push('Para 5 pessoas, é necessário solicitar colchão extra.');
  if(qtd<=4&&dados.solicitouColchaoExtra==='SIM') erros.push('O colchão extra só deve ser solicitado quando houver 5ª pessoa.');
  if(dados.dataEntrada&&dados.dataSaida){
    var entrada=new Date(dados.dataEntrada+'T00:00:00'),saida=new Date(dados.dataSaida+'T00:00:00'),hoje=new Date();
    hoje.setHours(0,0,0,0);
    if(entrada<hoje) erros.push('A data de entrada não pode ser anterior à data atual.');
    if(saida<=entrada) erros.push('A data de saída deve ser posterior à data de entrada.');
    var diffDias=Math.floor((entrada-hoje)/(1000*60*60*24));
    if(diffDias>30) erros.push('As reservas devem ser solicitadas com até 30 dias de antecedência.');
  }
  return erros;
}

function limparFormularioChina(){
  ['chinaNomeSolicitante','chinaCPF','chinaTelefone','chinaEmail','chinaEscola','chinaDataEntrada','chinaDataSaida','chinaQuantidadePessoas','chinaObservacao'].forEach(function(id){ var el=document.getElementById(id); if(el) el.value=''; });
  var chaleEl=document.getElementById('chinaChaleSolicitado'); if(chaleEl) chaleEl.value='QUALQUER_DISPONIVEL';
  var colchaoEl=document.getElementById('chinaColchaoExtra'); if(colchaoEl) colchaoEl.value='NAO';
  atualizarValorExtraChina();
}

function enviarSolicitacaoChina(){
  limparMsgChina();
  var dados=coletarDadosChina();
  var erros=validarFormularioChina(dados);
  if(erros.length){mostrarMsgChina('erro','Corrija os itens abaixo:<br>• '+erros.join('<br>• '));return;}
  mostrarMsgChina('ok','Enviando solicitação...');
  google.script.run
    .withSuccessHandler(function(resp){
      if(resp&&resp.ok){mostrarMsgChina('ok','Solicitação registrada com sucesso.<br>ID: <strong>'+resp.idReserva+'</strong><br>Status: <strong>'+resp.status+'</strong>');limparFormularioChina();carregarDashboardChina();}
      else{var errosResp=(resp&&resp.erros&&resp.erros.length)?'<br>• '+resp.erros.join('<br>• '):'';mostrarMsgChina('erro',(resp&&resp.mensagem?resp.mensagem:'Falha ao registrar a solicitação.')+errosResp);}
    })
    .withFailureHandler(function(err){mostrarMsgChina('erro','Erro ao enviar solicitação: '+(err&&err.message?err.message:err));})
    .solicitarReservaParqueChina(dados);
}

function carregarDashboardChina(){
  google.script.run
    .withSuccessHandler(function(d){
      d=d||{};
      var ids={chinaTotalReservas:'totalReservas',chinaPendentes:'pendentes',chinaAprovadas:'aprovadas',chinaDisponiveis:'chalesDisponiveisHoje'};
      Object.keys(ids).forEach(function(id){ var el=document.getElementById(id); if(el) el.textContent=d[ids[id]]??'0'; });
    })
    .withFailureHandler(function(){
      ['chinaTotalReservas','chinaPendentes','chinaAprovadas','chinaDisponiveis'].forEach(function(id){ var el=document.getElementById(id); if(el) el.textContent='0'; });
    })
    .dashboardReservaParqueChina();
}

/* Init China — com try/catch para não quebrar quando a seção não está visível */
document.addEventListener("DOMContentLoaded", function(){
  try{
    var chinaCPF=document.getElementById('chinaCPF');
    if(chinaCPF && !chinaCPF.dataset.boundChina){
      chinaCPF.dataset.boundChina="1";
      chinaCPF.addEventListener('input',function(){ this.value=aplicarMascaraCPFChina(this.value); });
    }
    var chinaTelefone=document.getElementById('chinaTelefone');
    if(chinaTelefone && !chinaTelefone.dataset.boundChina){
      chinaTelefone.dataset.boundChina="1";
      chinaTelefone.addEventListener('input',function(){ this.value=aplicarMascaraTelefoneChina(this.value); });
    }
    var chinaQtd=document.getElementById('chinaQuantidadePessoas');
    if(chinaQtd && !chinaQtd.dataset.boundChina){ chinaQtd.dataset.boundChina="1"; chinaQtd.addEventListener('change',atualizarValorExtraChina); }
    var chinaColchao=document.getElementById('chinaColchaoExtra');
    if(chinaColchao && !chinaColchao.dataset.boundChina){ chinaColchao.dataset.boundChina="1"; chinaColchao.addEventListener('change',atualizarValorExtraChina); }
    carregarDashboardChina();
    atualizarValorExtraChina();
  } catch(e){ console.warn('Init China:', e.message); }
});
</script>
